name: Gallery Pages

on:
  workflow_run:
    workflows: [Check]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gallery-pages
  cancel-in-progress: false

jobs:
  build:
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install pinned Python rendering and image-test dependencies
        run: |
          python -m pip install --only-binary=:all: -r requirements-ci.txt
      - name: Install CJK fonts for report verification
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y fonts-noto-cjk
      - name: Verify public collection
        run: python scripts/check.py
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          MPLBACKEND: Agg
      - uses: actions/configure-pages@v5
      - name: Build static gallery
        run: python scripts/build_gallery_site.py
        env:
          MUSEDRAW_SOURCE_COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: output/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy checked gallery
        id: deployment
        uses: actions/deploy-pages@v4
