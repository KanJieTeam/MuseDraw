<script>
'use strict';
const devices = [
 {id:'B',name:'冷冻库 B',temperature:'−11',range:'−25 至 −18°C',last:'13:59',online:true,status:'alert',label:'温度越界',needsAttention:true,explanation:'当前温度 −11°C，高于允许上限 −18°C 达 7°C。确认知晓后，温度越界仍需处理。'},
 {id:'C',name:'冷藏库 C',temperature:null,previous:'5.1°C',range:'2 至 8°C',last:'13:42',online:false,status:'offline',label:'设备离线',needsAttention:true,explanation:'截至演示时间 14:00，已 18 分钟未通信。上次读数 5.1°C 不能说明当前温度，请核实设备通信与实际温度。'},
 {id:'A',name:'冷藏库 A',temperature:'4.2',range:'2 至 8°C',last:'14:00',online:true,status:'normal',label:'温度正常',needsAttention:false,explanation:'14:00 在线，当前温度 4.2°C，处于允许范围 2 至 8°C 内。'},
 {id:'D',name:'集货区 D',temperature:'9.0',range:'8 至 15°C',last:'14:00',online:true,status:'normal',label:'温度正常',needsAttention:false,explanation:'14:00 在线，当前温度 9.0°C，处于允许范围 8 至 15°C 内。'}
];
let selected='B';let filter='all';const acknowledged=new Set();
const list=document.getElementById('device-list');
const detailBody=document.getElementById('detail-body');
function announce(message){document.getElementById('announcement').textContent=message;}
function renderList(){
 list.innerHTML=devices.filter(d=>filter==='all'||d.needsAttention).map(d=>`<li><button class="device-row" data-select="${d.id}" aria-pressed="${selected===d.id}" aria-label="${d.name}，${d.label}，${d.temperature===null?'当前温度未知':'当前温度 '+d.temperature+' 摄氏度'}，查看详情"><span><span class="device-name">${d.name}</span><span class="device-sub">${d.online?'在线':'最后通信'} · ${d.last}</span></span><span><span class="reading ${d.temperature===null?'unknown':d.status==='alert'?'alert':''}">${d.temperature===null?'—':d.temperature}<small>${d.temperature===null?'未知':'°C'}</small></span>${d.temperature===null?'<span class="device-sub">上次 5.1°C · 13:42</span>':''}</span><span class="range">${d.range}<small>允许范围</small></span><span><span class="badge ${d.status}">${d.label}</span><span class="device-meta">${d.needsAttention?(acknowledged.has(d.id)?'已知晓 · 仍需处理':'待处理'):'无需处理'}</span></span><span class="chevron" aria-hidden="true">›</span></button></li>`).join('');
}
function renderDetail(){
 const d=devices.find(d=>d.id===selected);const acked=acknowledged.has(d.id);
 detailBody.innerHTML=`<div class="detail-top"><h2 id="detail-title" tabindex="-1">${d.name}</h2><span class="badge ${d.status}">${d.label}</span></div><div class="detail-reading ${d.status}"><span>当前温度</span><strong>${d.temperature===null?'温度未知':d.temperature+'<small>°C</small>'}</strong></div><dl class="detail-dl"><div><dt>允许温度范围</dt><dd>${d.range}</dd></div><div><dt>通信状态</dt><dd>${d.online?'在线':'离线'}</dd></div><div><dt>最后通信</dt><dd>2026-10-19 ${d.last}</dd></div>${d.previous?'<div><dt>上次温度 · 13:42</dt><dd>'+d.previous+'<span class="sr-only">，历史读数</span></dd></div>':''}</dl><p class="explanation ${d.status}">${d.explanation}</p>${d.needsAttention?'<button class="ack" id="acknowledge" '+(acked?'disabled':'')+'>'+(acked?'✓ 已知晓 · 仍需处理':'确认已知晓')+'</button><p class="ack-note">'+(acked?'已在本次演示中确认。设备状态和待处理数量保持不变。':'仅记录本次演示中的知晓状态，不会改变设备状态或清除异常。')+'</p>':'<p class="ack-note">当前无需确认告警。此处展示预设读数，不代表实时连接。</p>'}`;
 const button=document.getElementById('acknowledge');if(button)button.addEventListener('click',()=>{acknowledged.add(d.id);renderList();renderDetail();announce(d.name+'已确认知晓，'+d.label+'，仍需处理。');document.getElementById('detail-title').focus({preventScroll:true});});
}
function selectDevice(id){const restoreListFocus=list.contains(document.activeElement);selected=id;renderList();renderDetail();announce('已选择'+devices.find(d=>d.id===id).name+'，设备详情已更新。');if(window.matchMedia('(max-width:600px)').matches){document.getElementById('detail').scrollIntoView({behavior:window.matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth',block:'start'});document.getElementById('detail-title').focus({preventScroll:true});}else if(restoreListFocus){list.querySelector('[data-select="'+id+'"]').focus({preventScroll:true});}}
document.addEventListener('click',event=>{const row=event.target.closest('[data-select]');if(row)selectDevice(row.dataset.select);});
function setFilter(value){filter=value;if(filter==='attention'&&!devices.find(d=>d.id===selected).needsAttention)selected='B';document.getElementById('filter-all').setAttribute('aria-pressed',filter==='all');document.getElementById('filter-attention').setAttribute('aria-pressed',filter==='attention');renderList();renderDetail();announce(filter==='all'?'显示全部4台设备。':'显示2台需处理设备：冷冻库B、冷藏库C。');}
document.getElementById('filter-all').addEventListener('click',()=>setFilter('all'));
document.getElementById('filter-attention').addEventListener('click',()=>setFilter('attention'));
document.getElementById('reset').addEventListener('click',()=>{acknowledged.clear();selected='B';setFilter('all');announce('演示已重置。全部4台设备，2台需处理，冷冻库B详情已打开。');});
renderList();renderDetail();
</script>
</body>
</html>
