<style>

e{display:block;font-size:10px;color:var(--muted);margin-top:14px}.bottom{position:absolute;left:48px;right:48px;bottom:46px;height:176px;z-index:3;display:grid;grid-template-columns:1fr 1.5fr 1fr;gap:38px;border-top:1px solid var(--line);padding-top:18px;background:linear-gradient(0deg,var(--bg) 85%,transparent)}.bottom h2{font-size:15px;font-weight:500;margin-bottom:5px}.bottom .sub{font-size:10px;color:var(--muted)}.bottom svg{height:113px;width:100%;margin-top:5px;overflow:visible}.summary-list{margin:12px 0 0;padding:0;list-style:none}.summary-list li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;font-size:12px;border-bottom:1px solid var(--line)}.summary-list b{font-weight:400;color:var(--accent);font-variant-numeric:tabular-nums}.summary-list li:first-child b{color:var(--alert)}.summary-reading{font:34px/1 'Bahnschrift',sans-serif;margin-top:14px}.summary-reading small{font:12px 'Microsoft YaHei',sans-serif;color:var(--muted);margin-left:8px}.small-copy{font-size:12px;color:var(--muted);line-height:1.9;margin-top:13px}.footer{position:absolute;bottom:0;left:48px;right:48px;height:34px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;font-size:10px;color:var(--muted)}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}.failure{display:none;position:absolute;inset:10%;border:1px solid var(--line);padding:30px;background:var(--surface);z-index:4}.failure.show{display:block}.scene-tag{display:none;position:absolute;left:325px;bottom:236px;z-index:2;color:var(--muted);font-size:11px;letter-spacing:1px}.light .detail{background:linear-gradient(90deg,transparent,var(--bg) 16%)}@media(min-width:1650px){.detail{width:328px}.stats{width:240px}.scene-host{left:230px;right:380px}.metric dd{font-size:49px}}@media(max-width:1300px){.dashboard{min-height:1000px}.body{min-height:890px}.stats{left:28px;width:184px}.detail{right:28px;width:280px;padding-left:20px}.masthead{padding:0 28px}.scene-host{left:230px;right:315px;bottom:170px}.metric dd{font-size:36px}.metric dd small{font-size:11px}.bottom{left:28px;right:28px;gap:22px}.footer{left:28px;right:28px}.scene-tag{left:220px}}@media(max-width:800px){.dashboard{height:auto;min-height:100vh;overflow:visible}.masthead{height:auto;min-height:95px;padding:20px;gap:15px}.brand{gap:12px}.mark,.separator{display:none}h1{font-size:24px}.page-title{font-size:15px;letter-spacing:1px}.clock{font-size:12px}.clock small{font-size:9px}.body{display:flex;flex-direction:column;min-height:0}.stats{position:relative;top:auto;left:auto;width:auto;margin:22px 20px 0}.stats .metric-group{display:flex;gap:24px}.metric{border:0;padding:18px 0;flex:1}.metric dd{font-size:30px}.metric dd span{font-size:16px}.metric dt{font-size:11px}.metric p{font-size:9px}.metric dd small{font-size:10px;margin-left:3px}.scene-host{position:relative;inset:auto;height:290px;margin:0;order:2}.scene-tag{display:none}.detail{position:relative;inset:auto;width:auto;margin:15px 20px 25px;padding:20px 0 0;border-left:0;border-top:1px solid var(--line);background:none!important;order:3}.stats{order:1}.bottom{position:relative;inset:auto;display:block;height:auto;padding-top:20px;margin:0 20px;order:4}.bottom>section{margin-bottom:25px}.bottom svg{height:140px}.footer{position:relative;inset:auto;height:auto;padding:14px 0;display:block;margin:0 20px;order:5;font-size:9px}.footer span{display:block;margin:3px 0}.scene-pin{font-size:11px;padding:6px 7px}.scene-control{left:20px;bottom:2px}.detail-cells dd{font-size:22px}.selected-heading h3{font-size:28px}.attention-note{font-size:13px}.summary-list li{font-size:13px}.big-figure .value{font-size:42px}}@media(max-width:800px){.masthead{align-items:flex-start}.brand{display:block;min-width:0}h1{white-space:nowrap;font-size:23px;letter-spacing:1px}.page-title{display:block;margin-top:4px;white-space:nowrap;font-size:12px}.clock{flex:0 0 105px;padding-top:2px}.clock small{letter-spacing:0}}@media( </style></head><body><main class="dashboard">
<header class="masthead"><div class="brand"><span class="mark" aria-hidden="true"><i></i></span><h1 id="brand-name"></h1><span class="separator"></span><span class="page-title" id="page-title"></span></div><div class="clock"><span id="snapshot"></span><small>演示数据 · 非实时</small></div></header>
<div class="body"><section class="stats"><p class="eyebrow" id="eyebrow"></p><h2 id="summary-title"></h2><div class="metric-group" id="metrics"></div></section>
<div class="scene-host" id="scene-host"><div class="scene-labels" id="scene-labels"></div><div class="scene-control"><span>设施关系示意</span><button id="top-view" type="button" aria-pressed="false">俯视</button><button id="reset-view" type="button" aria-pressed="true">斜俯</button></div><div class="failure" id="failure"><h2>当前浏览器未能开启三维视图</h2><p>设施读数和选择仍可查看。请使用支持 WebGL 的浏览器打开。</p></div></div><p class="scene-tag">设施关系示意 / 非地理测绘数据</p>
<aside class="detail"><p class="eyebrow">IN FOCUS</p><h2>当前关注对象</h2><div class="selector" id="selector"></div><div class="selected-heading"><h3 id="object-name"></h3><span class="badge" id="status"></span></div><p class="selected-sub" id="object-sub"></p><div class="big-figure"><span class="label" id="figure-label"></span><span class="value" id="figure-value"></span></div><div class="track" id="track"><div class="fill" id="fill"></div></div><p id="progress-text" class="selected-sub"></p><dl class="detail-cells" id="facts"></dl><div class="attention-note" id="attention-note"><h3 id="attention-title"></h3><p id="attention-copy"></p></div><small class="footnote" id="detail-footnote"></small></aside>
<div class="bottom"><section><h2 id="chart-title"></h2><p class="sub" id="chart-sub"></p><svg id="mini-chart" role="img" viewBox="0 0 480 120"></svg></section><section><h2 id="schedule-title"></h2><ul class="summary-list" id="schedule-list"></ul></section><section><h2 id="handoff-title"></h2><p class="summary-reading" id="handoff-reading"></p><p class="small-copy" id="handoff-copy"></p></section></div>
<footer class="footer"><span>本地演示数据 · 非实时</span><span id="footer-context"></span></footer><p class="sr" id="announcement" role="status" aria-live="polite"></p></div></main>
<script type="module" src="./app.mjs"></script></body></html>
