    </style></head><body><main class="product"><div class="app-top"><strong class="brand">minute<b>·</b></strong><span class="note">本地会议样例 / 讨论与决定</span></div><div class="app"><aside class="sidebar"><strong>工作空间</strong><p>最近讨论</p><p class="selected">文献工作台改版</p><p>归档与标签</p><p>原文权限说明</p><hr style="border:0;border-top:1px solid var(--line);margin:34px 0"><p class="note">保留讨论来源，<br>再写下下一步。</p></aside><section class="workspace"><p class="eyebrow">DESIGN REVIEW / 07</p><h1>文献工作台 · 改版讨论</h1><div class="subline"><span>2026.10.29</span><span>3 位参与者</span><span>演示转录，非实际录音</span></div><label for="search" class="note">搜索讨论内容</label><input id="search" class="search" placeholder="试试：权限、归档、保留……"><div class="columns"><section class="paper"><h2>原始讨论</h2><div id="transcript"></div><p id="empty" class="muted" hidden>没有匹配片段，请更换关键词。</p></section><aside class="paper"><h2>已经确认的决定</h2><div id="decisions" class="decision-list"></div><button id="copy" class="copy">复制决定与行动项</button><p id="copy-status" class="selection" aria-live="polite"></p></aside></div></section></div><footer>原创虚构示例 · MuseDraw / product · 本地演示，未连接业务后台。</footer></main><script id="study-data" type="application/json">{"transcript": [{"time": "00:12", "person": "李青", "text": "先别增加首页模块。我找原文时最不确定的，是这个文件到底有没有访问权限。"}, {"time": "01:46", "person": "周宁", "text": "权限说明需要跟着原文入口出现；未授权时保留条目，但不要显示成可打开的文件。"}, {"time": "03:05", "person": "陈朔", "text": "归档这件事也一样。先让人看见归档原因，再决定是否恢复，别直接把记录藏起来。"}, {"time": "04:18", "person": "李青", "text": "那这次先改原文权限提示。归档原因保留在详情里，下周拿实际任务再试。"}], "decisions": [{"title": "权限说明跟随原文入口", "source": "01:46 · 周宁", "owner": "李青", "action": "补齐未授权状态的文字和下一步，不伪装成可打开的文件。"}, {"title": "归档记录保留原因", "source": "03:05 · 陈朔", "owner": "周宁", "action": "详情展示归档原因；恢复操作保留原条目身份。"}]}</script><script>const data=JSON.parse(document.getElementById('study-data').textContent);const $=q=>document.querySelector(q);const $$=q=>[...document.querySelectorAll(q)];const text=(q,v)=>$(q).textContent=v;const element=(tag,value,cls)=>{const e=document.createElement(tag);e.textContent=value;if(cls)e.className=cls;return e;};
    function render(){const q=$('#search').value.trim().toLowerCase();const rows=data.transcript.filter(r=>(r.person+r.text).toLowerCase().includes(q));$('#transcript').replaceChildren();for(const r of rows){const div=element('div','','utterance');div.append(element('span',r.time,'time'));const body=document.createElement('div');body.append(element('strong',r.person),element('p',r.text));div.append(body);$('#transcript').append(div);}$('#empty').hidden=rows.length>0;}
