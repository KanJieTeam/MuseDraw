<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>续签议事简报</title><style>:root{--bg:#FFFFFF;--ink:#0E1B2E;--muted:#5B6B80;--navy:#0B2A4A;--blue:#1F5FA8;--pale:#EEF3F9;--line:#C9D5E3;--accent:#E8A33D;--amberPale:#FDF4E6;--red:#C2412D;--green:#2F8F5B;--display:Noto Sans SC, Microsoft YaHei, Inter, sans-serif;--body:Noto Sans SC, Microsoft YaHei, Inter, sans-serif;--mono:Noto Sans SC, Microsoft YaHei, Inter, sans-serif;--display:Noto Sans SC, Microsoft YaHei, Inter, sans-serif;--body:Noto Sans SC, Microsoft YaHei, Inter, sans-serif;--mono:Noto Sans SC, Microsoft YaHei, Inter, sans-serif}*{box-sizing:border-box}body{margin:0;font:18px/1.6 var(--body);background:var(--bg);color:var(--ink)}h1,h2,h3,p{margin:0}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:5px}button:disabled{cursor:default;opacity:.5}button{color:inherit}a{color:inherit}button,input,select{border-radius:0}small,.muted{color:var(--muted)}.mono{font-family:var(--mono)}.eyebrow{font:14px var(--mono);letter-spacing:2px;text-transform:uppercase}footer{font-size:13px;color:var(--muted);margin-top:34px;padding-top:18px;border-top:1px solid currentColor}main{max-width:1440px;margin:auto;padding:40px 60px;min-height:1000px}header{display:flex;align-items:center;justify-content:space-between;gap:24px;margin-bottom:48px;font-size:15px}h1{font-family:var(--display);letter-spacing:-2px;line-height:1.12}.note{font-size:14px;color:var(--muted)}.status{min-height:1.6em}button{background:transparent;border:1px solid currentColor;padding:10px 20px}button[aria-pressed=true]{background:var(--ink);color:var(--bg)}[hidden]{display:none!important}input{border:1px solid currentColor;background:transparent;color:inherit;padding:12px} @media(max-width:760px){main{padding:25px 22px;min-height:100vh}header{margin-bottom:30px;flex-wrap:wrap}h1{letter-spacing:-1px}footer{font-size:12px}button{padding:9px 12px}} @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
    header{color:var(--navy);border-bottom:3px solid var(--navy);padding-bottom:20px}.intro{display:grid;grid-template-columns:1fr 380px;gap:55px}.intro h1{font-size:62px;font-weight:700;max-width:780px}.intro .lead{margin-top:25px;color:var(--muted);max-width:740px;font-size:20px}.decision{background:var(--navy);color:white;padding:30px 34px}.decision .number{font:90px/1.05 var(--display);font-weight:600;color:var(--accent);margin:10px 0}.decision p{font-size:18px}.decision small{color:#C9D5E3}.toolbar{display:flex;justify-content:space-between;align-items:center;margin:50px 0 18px}.toolbar h2{font-size:26px}.toolbar button{border-color:var(--line);font-size:15px}table{border-collapse:collapse;width:100%;table-layout:fixed}th{text-align:left;font:14px var(--body);color:var(--muted);padding:18px 12px;background:var(--pale)}td{padding:24px 12px;border-bottom:1px solid var(--line);font-size:18px}td:nth-child(1){font-weight:600}td:nth-child(2){font:24px var(--display)}th:first-child,td:first-child{width:23%}th:last-child,td:last-child{width:31%}.risk{display:inline-block;width:8px;height:8px;background:var(--accent);margin-right:8px;border-radius:50%}.risk.low{background:var(--green)}.closing{display:flex;justify-content:space-between;gap:25px;margin-top:30px;color:var(--muted);font-size:15px}@media(max-width:760px){.intro{grid-template-columns:1fr;gap:25px}.intro h1{font-size:40px}.decision{padding:24px}.decision .number{font-size:70px}.toolbar{flex-wrap:wrap;gap:18px;margin-top:35px}.table-wrap{overflow:auto}table{min-width:730px}.closing{display:block}.closing p{margin-bottom:12px}}
    @media(max-width:760px){.table-wrap{overflow:visible}table{min-width:0}thead{display:none}tbody{display:block}tbody tr{display:grid;grid-template-columns:1fr auto;padding:20px 12px;border-bottom:1px solid var(--line);gap:7px 14px}td{display:block;border:0;padding:0;font-size:16px}td:first-child{width:auto;font-size:19px}td:nth-child(2){text-align:right;font-size:26px}td:nth-child(2):after{content:' 天';font-size:14px;color:var(--muted)}td:nth-child(n+3){grid-column:1/-1;width:auto}td:nth-child(3):before{content:'负责人 / ';color:var(--muted)}td:nth-child(4):before{content:'未决项 / ';color:var(--muted)}td:nth-child(5):before{content:'下一步 / ';color:var(--muted)}}</style></head><body><main class="enterprise"><header><strong>北岸 / 商务议事</strong><span class="mono">ACCOUNT REVIEW · 2026.10.29</span></header><section class="intro"><div><p class="eyebrow">THIS WEEK'S DECISION</p><h1>续签之前，<br>先把风险谈清楚。</h1><p class="lead">按剩余天数看紧迫程度，按未决事项决定下一次谈话。金额之外，先确认谁负责把问题带回客户现场。</p></div><aside class="decision"><p>30 天内到期且有未决事项</p><div class="number"><span id="urgent">—</span><span style="font-size:30px"> 笔</span></div><p id="owners"></p><small>由下方原始记录计算</small></aside></section><section><div class="toolbar"><h2>本周需要推进的谈话</h2><button id="risk-filter" aria-pressed="false">只看 30 天内未决</button></div><div class="table-wrap"><table><thead><tr><th>项目 / 客户</th><th>距到期 / 天</th><th>负责人</th><th>未决事项</th><th>下一步</th></tr></thead><tbody id="accounts"></tbody></table></div><div class="closing"><p id="row-count" aria-live="polite"></p><p>到期天数为给定状态日的演示值；未决事项不等于违约。</p></div></section><footer>原创虚构示例 · MuseDraw / enterprise · 本地演示，未连接业务后台。</footer></main><script id="study-data" type="application/json">{"accounts": [{"name": "松林 / 文献平台", "days": 12, "owner": "李青", "issue": "原文访问权限", "next": "确认权限清单并约定演示"}, {"name": "原野 / 数据工作台", "days": 18, "owner": "周宁", "issue": "归档字段缺失", "next": "带着缺失字段逐项核对"}, {"name": "海湾 / 协同空间", "days": 27, "owner": "陈朔", "issue": "迁移责任未定", "next": "双方确认迁移负责人"}, {"name": "岩岸 / 审阅系统", "days": 44, "owner": "李青", "issue": "", "next": "按既定窗口回访"}, {"name": "南街 / 教学门户", "days": 56, "owner": "周宁", "issue": "", "next": "收集下一学期的实际需求"}]}</script><script>const data=JSON.parse(document.getElementById('study-data').textContent);const $=q=>document.querySelector(q);const $$=q=>[...document.querySelectorAll(q)];const text=(q,v)=>$(q).textContent=v;const element=(tag,value,cls)=>{const e=document.createElement(tag);e.textContent=value;if(cls)e.className=cls;return e;};
    let riskOnly=false;const urgent=data.accounts.filter(r=>r.days<=30&&r.issue);text('#urgent',urgent.length);text('#owners',[...new Set(urgent.map(r=>r.owner))].join(' / '));
    function render(){const rows=data.accounts.filter(r=>!riskOnly||(r.days<=30&&r.issue));$('#accounts').replaceChildren();for(const row of rows){const tr=document.createElement('tr');for(const value of [row.name,row.days,row.owner,row.issue||'无未决项',row.next])tr.append(element('td',String(value)));$('#accounts').append(tr);}text('#row-count',`当前 ${rows.length} 笔 / 全部 ${data.accounts.length} 笔`);}
    $('#risk-filter').onclick=()=>{riskOnly=!riskOnly;$('#risk-filter').setAttribute('aria-pressed',String(riskOnly));render();};render();
    </script></body></html>
