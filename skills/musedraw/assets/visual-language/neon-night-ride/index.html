<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>夜骑 · 把城市骑成一条线</title><style>:root{--bg:#07060D;--card:#0E0B19;--ink:#F2F0FF;--muted:#8D87B0;--cyan:#00E5FF;--magenta:#FF2BD6;--yellow:#F5F749;--accent:#FF2BD6;--display:Space Grotesk, Noto Sans SC, Microsoft YaHei, sans-serif;--body:Space Grotesk, Noto Sans SC, Microsoft YaHei, sans-serif;--mono:Space Mono, Noto Sans SC, Microsoft YaHei, monospace;--display:Space Grotesk, Noto Sans SC, Microsoft YaHei, sans-serif;--body:Space Grotesk, Noto Sans SC, Microsoft YaHei, sans-serif;--mono:Space Mono, Noto Sans SC, Microsoft YaHei, monospace}*{box-sizing:border-box}body{margin:0;font:18px/1.6 var(--body);background:var(--bg);color:var(--ink)}h1,h2,h3,p{margin:0}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:5px}button:disabled{cursor:default;opacity:.5}button{color:inherit}a{color:inherit}button,input,select{border-radius:0}small,.muted{color:var(--muted)}.mono{font-family:var(--mono)}.eyebrow{font:14px var(--mono);letter-spacing:2px;text-transform:uppercase}footer{font-size:13px;color:var(--muted);margin-top:34px;padding-top:18px;border-top:1px solid currentColor}main{max-width:1440px;margin:auto;padding:40px 60px;min-height:1000px}header{display:flex;align-items:center;justify-content:space-between;gap:24px;margin-bottom:48px;font-size:15px}h1{font-family:var(--display);letter-spacing:-2px;line-height:1.12}.note{font-size:14px;color:var(--muted)}.status{min-height:1.6em}button{background:transparent;border:1px solid currentColor;padding:10px 20px}button[aria-pressed=true]{background:var(--ink);color:var(--bg)}[hidden]{display:none!important}input{border:1px solid currentColor;background:transparent;color:inherit;padding:12px} @media(max-width:760px){main{padding:25px 22px;min-height:100vh}header{margin-bottom:30px;flex-wrap:wrap}h1{letter-spacing:-1px}footer{font-size:12px}button{padding:9px 12px}} @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
    main{background:linear-gradient(115deg,transparent 60%,#ff2bd609);max-width:1600px}header{font:14px var(--mono);padding-bottom:20px;border-bottom:1px solid #38304e}header strong{color:var(--cyan);letter-spacing:3px}.ride-title{display:grid;grid-template-columns:1.15fr 1fr;align-items:center;gap:35px}h1{font:bold 128px/.85 Impact,'Arial Narrow',sans-serif;letter-spacing:-3px}.outline{color:transparent;-webkit-text-stroke:1.3px var(--cyan);margin-top:8px}.ride-intro{font-size:33px;max-width:430px;line-height:1.45}.ride-intro p{font-size:16px;margin-top:24px;color:var(--muted)}.route{display:grid;grid-template-columns:1.3fr .7fr;gap:40px;align-items:center;margin-top:35px}.map{position:relative;height:385px;border-top:1px solid #38304e;border-bottom:1px solid #38304e;background:repeating-linear-gradient(0deg,transparent 0 47px,#ffffff05 48px 49px),repeating-linear-gradient(90deg,transparent 0 47px,#ffffff05 48px 49px)}.map canvas{width:100%;height:100%}.map small{position:absolute;left:20px;bottom:15px;font:12px var(--mono)}.route-picker{display:flex;gap:12px}.route-picker button{color:var(--cyan);border-color:var(--cyan);font:17px var(--mono)}.route-picker button[aria-pressed=true]{background:var(--cyan);color:var(--bg)}.route-info h2{font:50px var(--display);margin:25px 0 8px;color:var(--yellow)}.checkpoint{display:flex;gap:15px;padding:12px 0;border-bottom:1px solid #38304e;font-size:17px}.checkpoint span{font:14px var(--mono);color:var(--magenta);padding-top:3px}.ride-bottom{display:flex;gap:40px;align-items:center;margin-top:30px}.ride-bottom strong{font:28px var(--mono);color:var(--cyan)}.ride-bottom p{font-size:15px;color:var(--muted)}@media(max-width:760px){.ride-title,.route{grid-template-columns:1fr;gap:25px}h1{font-size:93px}.ride-intro{font-size:26px}.ride-intro p{margin-top:12px}.map{height:300px}.ride-bottom{align-items:start;gap:20px;flex-wrap:wrap}.route-info h2{font-size:38px}}
    @media(max-width:760px){.map{height:auto;aspect-ratio:1000/470}.map canvas{position:absolute;inset:0}.map small{font-size:10px;bottom:5px}}</style></head><body><main class="neon"><header><strong>AFTER DARK / CITY RIDE</strong><span>虚构活动 · 非导航地图</span></header><section class="ride-title"><div><h1>NIGHT</h1><h1 class="outline">RIDE.</h1></div><div class="ride-intro">把城市，<br>骑成一条线。<p>从旧车站出发，经过夜里的河岸，再回到灯亮着的地方。选择一条路，先看清集合与补给。</p></div></section><section class="route"><div class="map"><canvas id="route-map" width="1000" height="470" aria-label="虚构夜骑路线示意，共享起终点与补给点"></canvas><small>SCHEMATIC ONLY / 路径几何不代表真实距离</small></div><aside class="route-info"><div class="route-picker" role="group" aria-label="选择夜骑线路"><button aria-pressed="true" data-route="short">12 KM</button><button aria-pressed="false" data-route="long">24 KM</button></div><h2 id="route-name"></h2><div id="checkpoints"></div><p id="route-status" class="note" style="margin-top:17px" aria-live="polite"></p></aside></section><section class="ride-bottom"><strong>20:00 / 集合</strong><p>北岸旧车站广场 · 11 月 14 日<br>虚构线路与活动，不提供道路安全、用时或难度保证。</p></section><footer>原创虚构示例 · MuseDraw / neon · 本地演示，未连接业务后台。</footer></main><script id="study-data" type="application/json">{"routes": {"short": {"name": "河岸短线", "stops": ["旧车站 / 集合与出发", "河岸桥头 / 补给", "旧车站 / 返回"], "note": "标称 12 km；完整往返。示意线路无 GPS 坐标。", "points": [[100, 370], [320, 370], [520, 170], [650, 120], [820, 180], [730, 320], [440, 320], [100, 370]]}, "long": {"name": "穿城长线", "stops": ["旧车站 / 集合与出发", "旧厂街区 / 途经", "河岸桥头 / 补给", "旧车站 / 返回"], "note": "标称 24 km；增加旧厂街区。示意线路无 GPS 坐标。", "points": [[100, 370], [280, 370], [280, 200], [430, 70], [650, 120], [880, 120], [880, 330], [600, 390], [390, 320], [100, 370]]}}}</script><script>const data=JSON.parse(document.getElementById('study-data').textContent);const $=q=>document.querySelector(q);const $$=q=>[...document.querySelectorAll(q)];const text=(q,v)=>$(q).textContent=v;const element=(tag,value,cls)=>{const e=document.createElement(tag);e.textContent=value;if(cls)e.className=cls;return e;};
    function render(key){const route=data.routes[key];text('#route-name',route.name);$('#checkpoints').replaceChildren();route.stops.forEach((s,i)=>{const row=element('div','','checkpoint');row.append(element('span',String(i+1).padStart(2,'0')),element('p',s));$('#checkpoints').append(row);});text('#route-status',route.note);const canvas=$('#route-map'),c=canvas.getContext('2d');c.clearRect(0,0,1000,470);const points=route.points;c.beginPath();points.forEach(([x,y],i)=>i?c.lineTo(x,y):c.moveTo(x,y));c.strokeStyle='#FF2BD6';c.lineWidth=8;c.lineJoin='round';c.stroke();const markers=key==='short'?[{i:0,label:'START / FINISH',dx:-25,dy:40},{i:3,label:'SUPPLY',dx:-35,dy:-35}]:[{i:0,label:'START / FINISH',dx:-25,dy:40},{i:3,label:'OLD FACTORY',dx:-65,dy:-25},{i:4,label:'SUPPLY',dx:-35,dy:-35}];for(const m of markers){const [x,y]=points[m.i];c.beginPath();c.arc(x,y,12,0,2*Math.PI);c.fillStyle='#07060D';c.fill();c.strokeStyle='#00E5FF';c.lineWidth=4;c.stroke();c.fillStyle='#F2F0FF';c.font=(canvas.clientWidth<600?'34':'18')+'px Consolas';c.fillText(m.label,x+m.dx,y+m.dy);}}
    $$('.route-picker button').forEach(b=>b.onclick=()=>{$$('.route-picker button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));render(b.dataset.route);});render('short');
    </script></body></html>
