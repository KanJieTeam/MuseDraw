<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Luma · 一层光里的声音</title><style>:root{--bg:#090A18;--ink:#F3F2FF;--muted:#A3A6C9;--violet:#A78BFA;--cyan:#22D3EE;--pink:#F472B6;--accent:#A78BFA;--glass:#FFFFFF0F;--edge:#FFFFFF33;--display:Space Grotesk, Noto Sans SC, Microsoft YaHei, sans-serif;--body:Inter, Noto Sans SC, Microsoft YaHei, sans-serif;--mono:JetBrains Mono, Consolas, Noto Sans SC, Microsoft YaHei, monospace;--display:Space Grotesk, Noto Sans SC, Microsoft YaHei, sans-serif;--body:Inter, Noto Sans SC, Microsoft YaHei, sans-serif;--mono:JetBrains Mono, Consolas, Noto Sans SC, Microsoft YaHei, monospace}*{box-sizing:border-box}body{margin:0;font:18px/1.6 var(--body);background:var(--bg);color:var(--ink)}h1,h2,h3,p{margin:0}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:5px}button:disabled{cursor:default;opacity:.5}button{color:inherit}a{color:inherit}button,input,select{border-radius:0}small,.muted{color:var(--muted)}.mono{font-family:var(--mono)}.eyebrow{font:14px var(--mono);letter-spacing:2px;text-transform:uppercase}footer{font-size:13px;color:var(--muted);margin-top:34px;padding-top:18px;border-top:1px solid currentColor}main{max-width:1440px;margin:auto;padding:40px 60px;min-height:1000px}header{display:flex;align-items:center;justify-content:space-between;gap:24px;margin-bottom:48px;font-size:15px}h1{font-family:var(--display);letter-spacing:-2px;line-height:1.12}.note{font-size:14px;color:var(--muted)}.status{min-height:1.6em}button{background:transparent;border:1px solid currentColor;padding:10px 20px}button[aria-pressed=true]{background:var(--ink);color:var(--bg)}[hidden]{display:none!important}input{border:1px solid currentColor;background:transparent;color:inherit;padding:12px} @media(max-width:760px){main{padding:25px 22px;min-height:100vh}header{margin-bottom:30px;flex-wrap:wrap}h1{letter-spacing:-1px}footer{font-size:12px}button{padding:9px 12px}} @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
    main{background:radial-gradient(ellipse at 75% 20%,#2e245eaa,transparent 48%),radial-gradient(ellipse at 20% 60%,#10364488,transparent 45%);max-width:1600px}header{margin-bottom:50px}.brand{font-size:27px;letter-spacing:5px;font-weight:500}h1{font-size:67px;font-weight:500}.intro{max-width:630px}.intro p{font-size:19px;color:var(--muted);margin-top:25px}.instrument{display:grid;grid-template-columns:1fr 1fr;gap:65px;align-items:center;margin-top:35px}.orb{position:relative;border:1px solid var(--edge);background:linear-gradient(145deg,#ffffff0e,#ffffff02);aspect-ratio:1;border-radius:50%;max-width:460px;display:grid;place-items:center;box-shadow:inset 0 0 75px #a78bfa18,0 0 100px #22d3ee0c}.orb:before,.orb:after{content:'';position:absolute;inset:25px;border:1px solid #a78bfa36;border-radius:50%;transform:rotateX(56deg) rotate(-25deg)}.orb:after{inset:58px;transform:rotateY(52deg) rotate(35deg);border-color:#22d3ee44}.note-face{text-align:center;z-index:1}.note-face strong{display:block;font-size:112px;font-weight:300;letter-spacing:-6px}.note-face p{font:15px var(--mono);color:var(--cyan)}.synth h2{font:15px var(--mono);color:var(--muted);margin-bottom:20px}.keys{display:flex;gap:9px}.keys button{height:180px;flex:1;background:#f3f2ff;min-width:0;color:#141223;border:0;border-radius:7px;padding:0;box-shadow:inset 0 -10px #d7d5e8;display:flex;flex-direction:column;justify-content:end;align-items:center;padding-bottom:20px;gap:28px}.keys button.active{background:var(--cyan);box-shadow:inset 0 -10px #10a6bf}.keys small{font:13px var(--mono);color:#5b5873}.envelope{margin-top:30px;font-size:16px;display:grid;grid-template-columns:1fr 1fr;gap:24px}.envelope label{display:block;color:var(--muted);font-size:14px}.envelope input{width:100%;accent-color:var(--violet);padding:0}.wave{width:100%;height:110px;margin-top:25px;border-top:1px solid var(--edge);border-bottom:1px solid var(--edge)}.sound-status{color:var(--cyan);font:14px var(--mono);min-height:24px;margin-top:20px}.sound-note{font-size:13px;color:var(--muted);margin-top:12px}@media(max-width:760px){h1{font-size:43px}.instrument{grid-template-columns:1fr;gap:25px}.orb{max-width:280px;margin:auto;width:100%}.note-face strong{font-size:85px}.keys button{height:145px}.envelope{gap:15px}.intro p{font-size:17px}}
    </style></head><body><main class="aurora"><header><strong class="brand">LUMA</strong><span class="eyebrow">A SMALL SOUND LAB</span></header><section class="intro"><h1>把声音，<br>留在一层光里。</h1><p>从一个正弦音开始。按下琴键，听见音高；调整起音与释音，让同一声音以不同方式出现。</p></section><section class="instrument"><div class="orb"><div class="note-face"><strong id="note-name">C4</strong><p id="frequency">261.63 Hz</p></div></div><div class="synth"><h2>01 / OSCILLATOR · SINE</h2><div class="keys" role="group" aria-label="正弦音琴键"></div><div class="envelope"><div><label for="attack">起音 / <span id="attack-value">40</span> ms</label><input id="attack" type="range" min="10" max="800" value="40"></div><div><label for="release">释音 / <span id="release-value">300</span> ms</label><input id="release" type="range" min="50" max="1200" value="300"></div></div><canvas id="wave" class="wave" width="900" height="130" aria-label="所选音符的示意正弦波，不是实时麦克风信号"></canvas><p id="sound-status" class="sound-status" aria-live="polite">按键后才发声 · 键盘 A S D F G H</p><p class="sound-note">本地 Web Audio 合成；不录音、不请求麦克风。图形为所选音高的示意波形。</p></div></section><footer>原创虚构示例 · MuseDraw / aurora · 本地演示，未连接业务后台。</footer></main><script id="study-data" type="application/json">{"notes": [{"name": "C4", "midi": 60}, {"name": "D4", "midi": 62}, {"name": "E4", "midi": 64}, {"name": "G4", "midi": 67}, {"name": "A4", "midi": 69}, {"name": "C5", "midi": 72}]}</script><script>const data=JSON.parse(document.getElementById('study-data').textContent);const $=q=>document.querySelector(q);const $$=q=>[...document.querySelectorAll(q)];const text=(q,v)=>$(q).textContent=v;const element=(tag,value,cls)=>{const e=document.createElement(tag);e.textContent=value;if(cls)e.className=cls;return e;};
    let context;let active=null;const c=$('#wave').getContext('2d');const keys=['a','s','d','f','g','h'];
    function waveform(freq){c.clearRect(0,0,900,130);c.beginPath();for(let x=0;x<=900;x++){const y=65+Math.sin(x/900*Math.PI*2*freq/65.406)*30;x?c.lineTo(x,y):c.moveTo(x,y);}c.strokeStyle='#22D3EE';c.lineWidth=2;c.stroke();}
    function play(index){const note=data.notes[index];const frequency=440*2**((note.midi-69)/12);text('#note-name',note.name);text('#frequency',frequency.toFixed(2)+' Hz');waveform(frequency);$$('.keys button').forEach((b,i)=>b.classList.toggle('active',i===index));clearTimeout(active);active=setTimeout(()=>$$('.keys button').forEach(b=>b.classList.remove('active')),450);
    try{const AudioContext=window.AudioContext||window.webkitAudioContext;if(!AudioContext)throw Error('unavailable');context??=new AudioContext();context.resume();const attack=+$('#attack').value/1000,release=+$('#release').value/1000;const start=context.currentTime,osc=context.createOscillator(),gain=context.createGain();osc.frequency.value=frequency;osc.type='sine';gain.gain.setValueAtTime(0,start);gain.gain.linearRampToValueAtTime(.12,start+attack);gain.gain.setValueAtTime(.12,start+attack+.15);gain.gain.linearRampToValueAtTime(0,start+attack+.15+release);osc.connect(gain);gain.connect(context.destination);osc.start(start);osc.stop(start+attack+.2+release);osc.onended=()=>{osc.disconnect();gain.disconnect();};text('#sound-status',note.name+' / 正弦音 · 本地合成');}catch{text('#sound-status','当前浏览器无法合成声音；音高与波形仍可查看。');}}
    data.notes.forEach((n,i)=>{const b=document.createElement('button');b.setAttribute('aria-label','播放 '+n.name);b.append(element('span',n.name),element('small',keys[i].toUpperCase()));b.onclick=()=>play(i);$('.keys').append(b);});for(const id of ['attack','release'])$('#'+id).oninput=()=>text('#'+id+'-value',$('#'+id).value);document.addEventListener('keydown',e=>{if(e.target.matches('input,button')||e.repeat)return;const i=keys.indexOf(e.key.toLowerCase());if(i>=0)play(i);});waveform(261.625565);
    </script></body></html>
