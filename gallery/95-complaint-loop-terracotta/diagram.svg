<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 936" width="1700" height="936" role="img" aria-labelledby="md-title md-desc" data-theme="terracotta"><title id="md-title">客诉处理闭环与时限</title><desc id="md-desc">五步，每一步都有时限。处理环节最长也最容易超时；最后一步“复盘”才是闭环：同一类问题不再出现，才算真的处理完。数据为示例。</desc><defs><filter id="tex-grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" seed="7" stitchTiles="stitch"/><feColorMatrix type="matrix" values="0 0 0 0 0.45  0 0 0 0 0.3  0 0 0 0 0.2  0 0 0 0.5 0"/></filter></defs><g id="background"><rect id="canvas" width="1700" height="936" fill="#F3E8DA"/><rect width="1700" height="936" filter="url(#tex-grain)" opacity="0.18"/></g><g id="zones"><g id="bar-1" data-md="bar"><rect x="360" y="302" width="90" height="34" rx="4" fill="#C9B79A"/><text x="368" y="323.68" font-family="Inter, Noto Sans SC, sans-serif" font-size="13" font-weight="600" fill="#3A2A20" text-anchor="start"><tspan x="368" >2 小时内</tspan></text></g><g id="bar-2" data-md="bar"><rect x="450" y="386" width="90" height="34" rx="4" fill="#C9B79A"/><text x="458" y="407.68" font-family="Inter, Noto Sans SC, sans-serif" font-size="13" font-weight="600" fill="#3A2A20" text-anchor="start"><tspan x="458" >4 小时内</tspan></text></g><g id="bar-3" data-md="bar"><rect x="540" y="470" width="540" height="34" rx="4" fill="#B5523B"/><text x="548" y="491.68" font-family="Inter, Noto Sans SC, sans-serif" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="start"><tspan x="548" >A 级 24 小时、B 级 3 天</tspan></text></g><g id="bar-4" data-md="bar"><rect x="1080" y="554" width="180" height="34" rx="4" fill="#C9B79A"/><text x="1088" y="575.68" font-family="Inter, Noto Sans SC, sans-serif" font-size="13" font-weight="600" fill="#3A2A20" text-anchor="start"><tspan x="1088" >结案后 1 天</tspan></text></g><g id="bar-5" data-md="bar"><rect x="1260" y="638" width="360" height="34" rx="4" fill="#C9B79A"/><text x="1268" y="659.68" font-family="Inter, Noto Sans SC, sans-serif" font-size="13" font-weight="600" fill="#3A2A20" text-anchor="start"><tspan x="1268" >每月第一周</tspan></text></g><path id="line-1" d="M360 276 L360 696" fill="none" stroke="#E3D5BF" stroke-width="1" stroke-linecap="round"/><path id="line-2" d="M540 276 L540 696" fill="none" stroke="#E3D5BF" stroke-width="1" stroke-linecap="round"/><path id="line-3" d="M720 276 L720 696" fill="none" stroke="#E3D5BF" stroke-width="1" stroke-linecap="round"/><path id="line-4" d="M900 276 L900 696" fill="none" stroke="#E3D5BF" stroke-width="1" stroke-linecap="round"/><path id="line-5" d="M1080 276 L1080 696" fill="none" stroke="#E3D5BF" stroke-width="1" stroke-linecap="round"/><path id="line-6" d="M1260 276 L1260 696" fill="none" stroke="#E3D5BF" stroke-width="1" stroke-linecap="round"/><path id="line-7" d="M1440 276 L1440 696" fill="none" stroke="#E3D5BF" stroke-width="1" stroke-linecap="round"/><path id="line-8" d="M1620 276 L1620 696" fill="none" stroke="#E3D5BF" stroke-width="1" stroke-linecap="round"/><path id="line-9" d="M64 746 L1620 746" fill="none" stroke="#3A2A20" stroke-width="1.5" stroke-linecap="round"/></g><g id="edges"></g><g id="nodes"></g><g id="edge-labels"></g><g id="notes"></g><g id="legend"></g><g id="texts"><text x="360" y="266" font-family="Inter, Noto Sans SC, sans-serif" font-size="12.5" font-weight="400" fill="#7D6A5B" text-anchor="middle"><tspan x="360" >0</tspan></text><text x="540" y="266" font-family="Inter, Noto Sans SC, sans-serif" font-size="12.5" font-weight="400" fill="#7D6A5B" text-anchor="middle"><tspan x="540" >第 1 天</tspan></text><text x="720" y="266" font-family="Inter, Noto Sans SC, sans-serif" font-size="12.5" font-weight="400" fill="#7D6A5B" text-anchor="middle"><tspan x="720" >第 2 天</tspan></text><text x="900" y="266" font-family="Inter, Noto Sans SC, sans-serif" font-size="12.5" font-weight="400" fill="#7D6A5B" text-anchor="middle"><tspan x="900" >第 3 天</tspan></text><text x="1080" y="266" font-family="Inter, Noto Sans SC, sans-serif" font-size="12.5" font-weight="400" fill="#7D6A5B" text-anchor="middle"><tspan x="1080" >第 4 天</tspan></text><text x="1260" y="266" font-family="Inter, Noto Sans SC, sans-serif" font-size="12.5" font-weight="400" fill="#7D6A5B" text-anchor="middle"><tspan x="1260" >第 5 天</tspan></text><text x="1440" y="266" font-family="Inter, Noto Sans SC, sans-serif" font-size="12.5" font-weight="400" fill="#7D6A5B" text-anchor="middle"><tspan x="1440" >第 6 天</tspan></text><text x="1620" y="266" font-family="Inter, Noto Sans SC, sans-serif" font-size="12.5" font-weight="400" fill="#7D6A5B" text-anchor="middle"><tspan x="1620" >第 7 天</tspan></text><text x="64" y="316" font-family="Fraunces, Noto Serif SC, serif" font-size="19" font-weight="700" fill="#3A2A20" text-anchor="start"><tspan x="64" >1  受理</tspan></text><text x="96" y="340" font-family="Inter, Noto Sans SC, sans-serif" font-size="13.5" font-weight="400" fill="#7D6A5B" text-anchor="start"><tspan x="96" >客服当场登记，生成工单</tspan></text><text x="64" y="400" font-family="Fraunces, Noto Serif SC, serif" font-size="19" font-weight="700" fill="#3A2A20" text-anchor="start"><tspan x="64" >2  分级</tspan></text><text x="96" y="424" font-family="Inter, Noto Sans SC, sans-serif" font-size="13.5" font-weight="400" fill="#7D6A5B" text-anchor="start"><tspan x="96" >按影响范围分 A / B / C 级</tspan></text><text x="64" y="484" font-family="Fraunces, Noto Serif SC, serif" font-size="19" font-weight="700" fill="#3A2A20" text-anchor="start"><tspan x="64" >3  处理</tspan></text><text x="96" y="508" font-family="Inter, Noto Sans SC, sans-serif" font-size="13.5" font-weight="400" fill="#7D6A5B" text-anchor="start"><tspan x="96" >责任部门给出方案并联系客户</tspan></text><text x="64" y="568" font-family="Fraunces, Noto Serif SC, serif" font-size="19" font-weight="700" fill="#3A2A20" text-anchor="start"><tspan x="64" >4  回访</tspan></text><text x="96" y="592" font-family="Inter, Noto Sans SC, sans-serif" font-size="13.5" font-weight="400" fill="#7D6A5B" text-anchor="start"><tspan x="96" >客服电话确认是否满意</tspan></text><text x="64" y="652" font-family="Fraunces, Noto Serif SC, serif" font-size="19" font-weight="700" fill="#3A2A20" text-anchor="start"><tspan x="64" >5  复盘</tspan></text><text x="96" y="676" font-family="Inter, Noto Sans SC, sans-serif" font-size="13.5" font-weight="400" fill="#7D6A5B" text-anchor="start"><tspan x="96" >同类问题月度汇总，改流程</tspan></text><text x="64" y="816" font-family="Fraunces, Noto Serif SC, serif" font-size="44" font-weight="700" fill="#3A2A20" text-anchor="start"><tspan x="64" >312</tspan></text><text x="64" y="848" font-family="Inter, Noto Sans SC, sans-serif" font-size="14" font-weight="400" fill="#7D6A5B" text-anchor="start"><tspan x="64" >上季度客诉</tspan></text><text x="464" y="816" font-family="Fraunces, Noto Serif SC, serif" font-size="44" font-weight="700" fill="#3A2A20" text-anchor="start"><tspan x="464" >91%</tspan></text><text x="464" y="848" font-family="Inter, Noto Sans SC, sans-serif" font-size="14" font-weight="400" fill="#7D6A5B" text-anchor="start"><tspan x="464" >按时结案</tspan></text><text x="864" y="816" font-family="Fraunces, Noto Serif SC, serif" font-size="44" font-weight="700" fill="#3A2A20" text-anchor="start"><tspan x="864" >4.6 / 5</tspan></text><text x="864" y="848" font-family="Inter, Noto Sans SC, sans-serif" font-size="14" font-weight="400" fill="#7D6A5B" text-anchor="start"><tspan x="864" >回访满意度</tspan></text><text x="1264" y="816" font-family="Fraunces, Noto Serif SC, serif" font-size="44" font-weight="700" fill="#3A2A20" text-anchor="start"><tspan x="1264" >7 项</tspan></text><text x="1264" y="848" font-family="Inter, Noto Sans SC, sans-serif" font-size="14" font-weight="400" fill="#7D6A5B" text-anchor="start"><tspan x="1264" >因复盘修改的流程</tspan></text></g><g id="header"><text x="64" y="76" font-family="IBM Plex Mono, Noto Sans SC, monospace" font-size="12" font-weight="600" fill="#C0583A" text-anchor="start" letter-spacing="2"><tspan x="64" >客户服务 · 客诉闭环</tspan></text><text x="64" y="138.72" font-family="Fraunces, Noto Serif SC, serif" font-size="52" font-weight="600" fill="#3A2A20" text-anchor="start" letter-spacing="-1"><tspan x="64" >客诉处理闭环与时限</tspan></text><text x="64" y="178.4" font-family="Inter, Noto Sans SC, sans-serif" font-size="18.4" font-weight="400" fill="#7D6A5B" text-anchor="start"><tspan x="64" >五步，每一步都有时限。处理环节最长也最容易超时；最后一步“复盘”才是闭环：同一类问题不再出现，才算真的处理完。数据为示例。</tspan></text></g><g id="footer"><text x="1636" y="900.8" font-family="IBM Plex Mono, Noto Sans SC, monospace" font-size="10.5" font-weight="400" fill="#7D6A5B" text-anchor="end" letter-spacing="1.5"><tspan x="1636" >MuseDraw · Terracotta</tspan></text></g></svg>
