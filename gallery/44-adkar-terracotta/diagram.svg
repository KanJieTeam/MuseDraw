  Awareness</tspan></text></g><g data-md-free-text="free-text-9"><text x="136" y="741" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#7D6A5B" text-anchor="start" font-style="italic"><tspan x="136" >Why change?</tspan></text></g><g data-md-free-text="free-text-10"><text x="136" y="771" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13.5" font-weight="400" fill="#3A2A20" text-anchor="start"><tspan x="136" >Town hall on the cost of the old tool;</tspan><tspan x="136" dy="19.58">done in week 1</tspan></text></g><g data-md-free-text="free-text-11"><text x="546" y="525.8" font-family="Georgia, SimSun, serif" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan x="546" >2.6</tspan></text></g><g data-md-free-text="free-text-12"><text x="436" y="717" font-family="Georgia, SimSun, serif" font-size="19" font-weight="700" fill="#3A2A20" text-anchor="start"><tspan x="436" >2  Desire</tspan></text></g><g data-md-free-text="free-text-13"><text x="436" y="741" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#7D6A5B" text-anchor="start" font-style="italic"><tspan x="436" >Why me?</tspan></text></g><g data-md-free-text="free-text-14"><text x="436" y="771" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13.5" font-weight="400" fill="#3A2A20" text-anchor="start"><tspan x="436" >Each team lead explains their own</tspan><tspan x="436" dy="19.58">reason; pilot volunteers first</tspan></text></g><g data-md-free-text="free-text-15"><text x="846" y="388.2" font-family="Georgia, SimSun, serif" font-size="24" font-weight="700" fill="#3A2A20" text-anchor="middle"><tspan x="846" >3.9</tspan></text></g><g data-md-free-text="free-text-16"><text x="736" y="717" font-family="Georgia, SimSun, serif" font-size="19" font-weight="700" fill="#3A2A20" text-anchor="start"><tspan x="736" >3  Knowledge</tspan></text></g><g data-md-free-text="free-text-17"><text x="736" y="741" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#7D6A5B" text-anchor="start" font-style="italic"><tspan x="736" >How?</tspan></text></g><g data-md-free-text="free-text-18"><text x="736" y="771" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13.5" font-weight="400" fill="#3A2A20" text-anchor="start"><tspan x="736" >Two-hour training, recorded;</tspan><tspan x="736" dy="19.58">quick-reference card</tspan></text></g><g data-md-free-text="free-text-19"><text x="1146" y="445.8" font-family="Georgia, SimSun, serif" font-size="24" font-weight="700" fill="#3A2A20" text-anchor="middle"><tspan x="1146" >3.1</tspan></text></g><g data-md-free-text="free-text-20"><text x="1036" y="717" font-family="Georgia, SimSun, serif" font-size="19" font-weight="700" fill="#3A2A20" text-anchor="start"><tspan x="1036" >4  Ability</tspan></text></g><g data-md-free-text="free-text-21"><text x="1036" y="741" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#7D6A5B" text-anchor="start" font-style="italic"><tspan x="1036" >Can I do it?</tspan></text></g><g data-md-free-text="free-text-22"><text x="1036" y="771" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13.5" font-weight="400" fill="#3A2A20" text-anchor="start"><tspan x="1036" >Coaches sit with teams for two</tspan><tspan x="1036" dy="19.58">weeks after go-live</tspan></text></g><g data-md-free-text="free-text-23"><text x="1446" y="663" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#7D6A5B" text-anchor="middle"><tspan x="1446" >measured on day 60</tspan></text></g><g data-md-free-text="free-text-24"><text x="1336" y="717" font-family="Georgia, SimSun, serif" font-size="19" font-weight="700" fill="#3A2A20" text-anchor="start"><tspan x="1336" >5  Reinforcement</tspan></text></g><g data-md-free-text="free-text-25"><text x="1336" y="741" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#7D6A5B" text-anchor="start" font-style="italic"><tspan x="1336" >Will it stick?</tspan></text></g><g data-md-free-text="free-text-26"><text x="1336" y="771" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13.5" font-weight="400" fill="#3A2A20" text-anchor="start"><tspan x="1336" >Retire the old tool on day 60; share</tspan><tspan x="1336" dy="19.58">early wins</tspan></text></g><g data-md-free-text="free-text-27"><text x="96" y="293" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#7D6A5B" text-anchor="start"><tspan x="96" >Average score from 142 staff, 1 = not at all, 5 = fully</tspan></text></g></g><g id="header"><text x="64" y="76" font-family="Consolas, Microsoft YaHei, monospace" font-size="12" font-weight="600" fill="#C0583A" text-anchor="start" letter-spacing="2"><tspan x="64" >CHANGE MANAGEMENT · NEW TICKETING SYSTEM</tspan></text><text x="64" y="138.72" font-family="Georgia, SimSun, serif" font-size="52" font-weight="600" fill="#3A2A20" text-anchor="start" letter-spacing="-1"><tspan x="64" >ADKAR readiness survey</tspan></text><text x="64" y="178.4" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="18.4" font-weight="400" fill="#7D6A5B" text-anchor="start"><tspan x="64" >Score each step and fix the first one below 3. Desire is the barrier here, so more training (Knowledge) would be wasted until people want the</tspan><tspan x="64" dy="26.68">change. Figures are illustrative.</tspan></text></g><g id="footer"><text x="1636" y="839.8" font-family="Consolas, Microsoft YaHei, monospace" font-size="10.5" font-weight="400" fill="#7D6A5B" text-anchor="end" letter-spacing="1.5"><tspan x="1636" >MuseDraw · Terracotta</tspan></text></g></svg>
