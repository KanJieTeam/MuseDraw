an></text><text class="md-sub" x="1116" y="615.38" font-family="Noto Sans SC, Inter, sans-serif" font-size="14" font-weight="400" fill="#D44C47" text-anchor="start"><tspan x="1116" >附说明后重新提交</tspan></text></g></g><g id="edge-labels"><g id="edge-amt-lead-label" data-md="edge-label"><rect x="478.75" y="292.56" width="27.5" height="22.88" rx="3" fill="#FFFFFF"/><text x="485.75" y="308.39" font-family="Noto Sans SC, Inter, sans-serif" font-size="13.5" font-weight="400" fill="#787774" text-anchor="start"><tspan x="485.75" >是</tspan></text></g><g id="edge-amt-head-label" data-md="edge-label"><rect x="478.75" y="516.56" width="27.5" height="22.88" rx="3" fill="#FFFFFF"/><text x="485.75" y="532.39" font-family="Noto Sans SC, Inter, sans-serif" font-size="13.5" font-weight="400" fill="#787774" text-anchor="start"><tspan x="485.75" >否</tspan></text></g><g id="edge-ok-pay-label" data-md="edge-label"><rect x="1316.25" y="404.56" width="27.5" height="22.88" rx="3" fill="#FFFFFF"/><text x="1323.25" y="420.39" font-family="Noto Sans SC, Inter, sans-serif" font-size="13.5" font-weight="400" fill="#787774" text-anchor="start"><tspan x="1323.25" >是</tspan></text></g><g id="edge-ok-back-label" data-md="edge-label"><rect x="1196.25" y="506.56" width="27.5" height="22.88" rx="3" fill="#FFFFFF"/><text x="1203.25" y="522.39" font-family="Noto Sans SC, Inter, sans-serif" font-size="13.5" font-weight="400" fill="#787774" text-anchor="start"><tspan x="1203.25" >否</tspan></text></g><g id="edge-back-start-label" data-md="edge-label"><rect x="602.27" y="668.56" width="175.46" height="22.88" rx="3" fill="#FFFFFF"/><text x="609.27" y="684.39" font-family="Noto Sans SC, Inter, sans-serif" font-size="13.5" font-weight="400" fill="#787774" text-anchor="start"><tspan x="609.27" >重新提交，平均多花 3.4 天</tspan></text></g></g><g id="notes"></g><g id="legend"></g><g id="texts"><text x="60" y="764" font-family="Noto Sans SC, Inter, sans-serif" font-size="15" font-weight="700" fill="#37352F" text-anchor="start"><tspan x="60" >上季度退回 214 单，原因构成</tspan></text><text x="60" y="803" font-family="Noto Sans SC, Inter, sans-serif" font-size="14" font-weight="400" fill="#37352F" text-anchor="start"><tspan x="60" >发票抬头写成简称</tspan></text><text x="60" y="837" font-family="Noto Sans SC, Inter, sans-serif" font-size="14" font-weight="400" fill="#37352F" text-anchor="start"><tspan x="60" >缺少税号</tspan></text><text x="60" y="871" font-family="Noto Sans SC, Inter, sans-serif" font-size="14" font-weight="400" fill="#37352F" text-anchor="start"><tspan x="60" >连号发票未附明细</tspan></text><text x="60" y="905" font-family="Noto Sans SC, Inter, sans-serif" font-size="14" font-weight="400" fill="#37352F" text-anchor="start"><tspan x="60" >超标准未附说明</tspan></text><text x="60" y="939" font-family="Noto Sans SC, Inter, sans-serif" font-size="14" font-weight="400" fill="#37352F" text-anchor="start"><tspan x="60" >其他</tspan></text><text x="960" y="803" font-family="Noto Sans SC, Inter, sans-serif" font-size="14.5" font-weight="400" fill="#37352F" text-anchor="start"><tspan x="960" >前三项合计 177 单，占 83%，都能在提交前自查。</tspan></text><text x="960" y="837" font-family="Noto Sans SC, Inter, sans-serif" font-size="14.5" font-weight="400" fill="#787774" text-anchor="start"><tspan x="960" >下一步：OA 提交页增加抬头与税号校验。</tspan></text></g><g id="header"><text x="72" y="86" font-family="Noto Sans SC, Inter, sans-serif" font-size="14" font-weight="400" fill="#787774" text-anchor="start" letter-spacing="0.5"><tspan x="72" >行政流程，费用报销</tspan></text><text x="72" y="140.12" font-family="Noto Sans SC, Inter, sans-serif" font-size="42" font-weight="700" fill="#37352F" text-anchor="start"><tspan x="72" >费用报销审批流程</tspan></text><text x="72" y="177.3" font-family="Noto Sans SC, Inter, sans-serif" font-size="17.3" font-weight="400" fill="#787774" text-anchor="start"><tspan x="72" >金额决定谁审批，票据决定能不能付款。大部分退回发生在财务审核这一步，且原因高度集中。数据为示例。</tspan></text></g><g id="footer"><text x="1568" y="974.4" font-family="Noto Sans SC, Inter, sans-serif" font-size="12" font-