-risk" data-md="edge"><path d="M593 608 L629.8 608" fill="none" stroke="#171614" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M637 608 L628 612.95 L628 603.05 Z" fill="#171614"/></g><g id="edge-risk-neg" data-md="edge"><path d="M893 608 L949.8 608" fill="none" stroke="#171614" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M957 608 L948 612.95 L948 603.05 Z" fill="#171614"/></g><g id="edge-self-sign" data-md="edge"><path d="M1223 378 L1254 378 Q1260 378 1260 384 L1260 453.2 Q1260 459.2 1266 459.2 L1288 459.2" fill="none" stroke="#C93C14" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M1297 459.2 L1285.75 465.39 L1285.75 453.01 Z" fill="#C93C14"/></g><g id="edge-neg-sign" data-md="edge"><path d="M1223 608 L1254 608 Q1260 608 1260 602 L1260 522.8 Q1260 516.8 1266 516.8 L1289.8 516.8" fill="none" stroke="#171614" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M1297 516.8 L1288 521.75 L1288 511.85 Z" fill="#171614"/></g></g><g id="nodes"><g id="req" data-md="node" data-box="64,330,230,96" data-shape="box" data-label="inside"><rect x="64" y="330" width="230" height="96" rx="0" fill="#FBF8F1" stroke="#171614" stroke-width="1.2"/><text class="md-tag" x="80" y="360.06" font-family="JetBrains Mono, Noto Sans SC, monospace" font-size="10.8" font-weight="600" fill="#C93C14" text-anchor="start" letter-spacing="1.6"><tspan x="80" >SALES OR PROCUREMENT</tspan></text><text class="md-label" x="80" y="383.09" font-family="Inter, Noto Sans SC, sans-serif" font-size="18.4" font-weight="600" fill="#171614" text-anchor="start"><tspan x="80" >Request</tspan></text><text class="md-sub" x="80" y="402.57" font-family="JetBrains Mono, Noto Sans SC, monospace" font-size="12.4" font-weight="400" fill="#6E685D" text-anchor="start"><tspan x="80" >intake form, 6 fields</tspan></text><circle cx="64" cy="330" r="12" fill="#C93C14"/><text x="64" y="334.87" font-family="JetBrains Mono, 