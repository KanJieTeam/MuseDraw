ght="400" fill="#6E685D" text-anchor="start"><tspan x="656" >CISO sign-off</tspan></text><circle cx="640" cy="560" r="12" fill="#C93C14"/><text x="640" y="564.87" font-family="JetBrains Mono, Noto Sans SC, monospace" font-size="13.919999999999998" font-weight="700" fill="#FBF8F1" text-anchor="middle" class="md-step">4</text></g><g id="neg" data-md="node" data-box="960,560,260,96" data-shape="box" data-label="inside"><rect x="960" y="560" width="260" height="96" rx="0" fill="#FBF8F1" stroke="#171614" stroke-width="1.2"/><text class="md-tag" x="976" y="590.06" font-family="JetBrains Mono, Noto Sans SC, monospace" font-size="10.8" font-weight="600" fill="#C93C14" text-anchor="start" letter-spacing="1.6"><tspan x="976" >REDLINES</tspan></text><text class="md-label" x="976" y="613.09" font-family="Inter, Noto Sans SC, sans-serif" font-size="18.4" font-weight="600" fill="#171614" text-anchor="start"><tspan x="976" >Negotiate</tspan></text><text class="md-sub" x="976" y="632.57" font-family="JetBrains Mono, Noto Sans SC, monospace" font-size="12.4" font-weight="400" fill="#6E685D" text-anchor="start"><tspan x="976" >max 2 rounds before escalation</tspan></text></g><g id="sign" data-md="node" data-box="1300,440,250,96" data-shape="box" data-label="inside"><rect x="1300" y="440" width="250" height="96" rx="0" fill="#FBF8F1" stroke="#171614" stroke-width="1.2"/><text class="md-tag" x="1316" y="470.06" font-family="JetBrains Mono, Noto Sans SC, monospace" font-size="10.8" font-weight="600" fill="#C93C14" text-anchor="start" letter-spacing="1.6"><tspan x="1316" >REPOSITORY</tspan></text><text class="md-label" x="1316" y="493.09" font-family="Inter, Noto Sans SC, sans-serif" font-size="18.4" font-weight="600" fill="#171614" text-anchor="start"><tspan x="1316" >Sign &amp; store</tspan></text><text class="md-sub" x="1316" y="512.57" font-family="JetBrains Mono, Noto Sans SC, monospace" font-size="12.4" font-weight="400" fill="#6E685D" text-anchor="start"><tspan x="1316" >renewal date tracked</tspan></text><circle cx="1300" cy="440" r="12" fill="#C93C14"/><text x="1300" y="444.87" font-family="JetBrains Mono, Noto Sans SC, monospace" font-size="13.919999999999998" font-weight="700" fill="#FBF8F1" text-anchor="middle" class="md-step">5</text></g></g><g id="edge-labels"><g id="edge-q1-q2-label" data-md="edge-label"><text x="593" y="367.47" font-family="Fraunces, Noto Serif SC, serif" font-size="15.1" font-weight="400" fill="#3A362F" text-anchor="start" font-style="italic"><tspan x="593" >yes</tspan></text></g><g id="edge-q1-review-label" data-md="edge-label"><text x="468" y="503.91" font-family="Fraunces, Noto Serif SC, serif" font-size="15.1" font-weight="400" fill="#3A362F" text-anchor="start" font-style="italic"><tspan x="468" >no</tspan></text></g><g id="edge-q2-self-label" data-md="edge-label"><text x="917" y="367.47" font-family="Fraunces, Noto Serif SC, serif" font-size="15.1" font-weight="400" fill="#3A362F" text-anchor="start" font-style="italic"><tspan x="917" >no</tspan></text></g><g id="edge-q2-risk-label" data-md="edge-label"><text x="773" y="503.91" font-family="Fraunces, Noto Serif SC, serif" font-size="15.1" font-weight="400" fill="#3A362F" text-anchor="start" font-style="italic"><tspan x="773" >yes</tspan></text></g></g><g id="notes"><g id="note-1" data-md="note" data-box="64,760,700,47.43"><g><text x="64" y="775.03" font-family="Fraunces, Noto Serif SC, serif" font-size="18.37" font-weight="700" fill="#C93C14">↳</text><text x="90" y="775.03" font-family="Fraunces, Noto Serif SC, serif" font-size="16.7" font-weight="400" fill="#36322C" text-anchor="start" font-style="italic"><tspan x="90" >Median cycle time fell from 19 days to 3 for standard deals once the template path</tspan><tspan x="90" dy="23.71">stopped queueing behind redlines.</tspan></text></g></g></g><g id="legend"></g><g id="texts"></g><g id="header"><text x="64" y="76" font-family="JetBrains Mono, Noto Sans SC, monospace" font-size="12" font-weight="600" fill="#C93