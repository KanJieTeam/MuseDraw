fill="#121212">1</text><text x="1376" y="313.14" font-family="Inter, Noto Sans SC, sans-serif" font-size="14.6" font-weight="400" fill="#121212" text-anchor="start"><tspan x="1376" >Node size is the number of trials</tspan><tspan x="1376" dy="21.17">that include the treatment; line</tspan><tspan x="1376" dy="21.17">width is the number of</tspan><tspan x="1376" dy="21.17">head-to-head trials.</tspan></text></g></g><g id="note-2" data-md="note" data-box="1350,450,260,105.85"><g><text x="1350" y="463.14" font-family="Instrument Serif, Noto Serif SC, serif" font-size="16.060000000000002" font-weight="700" fill="#121212">2</text><text x="1376" y="463.14" font-family="Inter, Noto Sans SC, sans-serif" font-size="14.6" font-weight="400" fill="#121212" text-anchor="start"><tspan x="1376" >Acupuncture and Zolpidem were</tspan><tspan x="1376" dy="21.17">never compared directly. Their</tspan><tspan x="1376" dy="21.17">contrast rests entirely on</tspan><tspan x="1376" dy="21.17">indirect evidence through</tspan><tspan x="1376" dy="21.17">Placebo, CBT-I and Exercise.</tspan></text></g></g><g id="note-3" data-md="note" data-box="1350,640,260,84.68"><g><text x="1350" y="653.14" font-family="Instrument Serif, Noto Serif SC, serif" font-size="16.060000000000002" font-weight="700" fill="#121212">3</text><text x="1376" y="653.14" font-family="Inter, Noto Sans SC, sans-serif" font-size="14.6" font-weight="400" fill="#121212" text-anchor="start"><tspan x="1376" >Check consistency where closed</tspan><tspan x="1376" dy="21.17">loops exist</tspan><tspan x="1376" dy="21.17">(Placebo–Exercise–CBT-I)</tspan><tspan x="1376" dy="21.17">before ranking treatments.</tspan></text></g></g></g><g id="legend"></g><g id="texts"><text x="684" y="524" font-family="IBM Plex Mono, Noto Sans SC, monospace" font-size="14" font-weight="700" fill="#121212" text-anchor="start"><tspan x="684" >8</tspan></text><text x="944" y="516" font-family="IBM Plex Mono, Noto Sans SC, monospace" font-size="14" font-weight="700" fill="#121212" text-anchor="start"><tspan x="944" >6</tspan></text><text x="634" y="694" font-family="IBM Plex Mono, Noto Sans SC, monospace" font-size="14" font-weight="700" fill="#121212" text-anchor="start"><tspan x="634" >5</tspan></text><text x="1034" y="694" font-family="IBM Plex Mono, Noto Sans SC, monospace" font-size="14" font-weight="700" fill="#121212" text-anchor="start"><tspan x="1034" >4</tspan></text><text x="834" y="414" font-family="IBM Plex Mono, Noto Sans SC, monospace" font-size="14" font-weight="700" fill="#121212" text-anchor="start"><tspan x="834" >2</tspan></text><text x="1184" y="584" font-family="IBM Plex Mono, Noto Sans SC, monospace" font-size="14" font-weight="700" fill="#121212" text-anchor="start"><tspan x="1184" >2</tspan></text><text x="684" y="369" font-family="IBM Plex Mono, Noto Sans SC, monospace" font-size="14" font-weight="700" fill="#121212" text-anchor="start"><tspan x="684" >2</tspan></text><text x="834" y="479" font-family="IBM Plex Mono, Noto Sans SC, monospace" font-size="14" font-weight="700" fill="#121212" text-anchor="start"><tspan x="834" >3</tspan></text><text x="834" y="754" font-family="IBM Plex Mono, Noto Sans SC, monospace" font-size="14" font-weight="700" fill="#121212" text-anchor="start"><tspan x="834" >1</tspan></text></g><g id="header"><text x="64" y="76" font-family="IBM Plex Mono, Noto Sans SC, monospace" font-size="12" font-weight="600" fill="#121212" text-anchor="start" letter-spacing="2"><tspan x="64" >SYSTEMATIC REVIEW · NETWORK META-ANALYSIS</tspan></text><text x="64" y="149.04" font-family="Instrument Serif, Noto Serif SC, serif" font-size="64" font-weight="400" fill="#121212" text-anchor="start" letter-spacing="-0.5"><tspan x="64" >Network of evidence for chronic insomnia treatments</tspan></text><text x="64" y="189.3" font-family="Inter, Noto Sans SC, sans-serif" font-size="17.3" font-weight="400" fill="#555249" text-anchor="start"><tspan x="64" >33 randomised trials, six treatments. Every line