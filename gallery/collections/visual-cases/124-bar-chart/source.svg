<g id="layer6" inkscape:groupmode="layer" inkscape:label="图注">
<text x="60" y="860" font-family="'Noto Serif CJK SC', serif" font-size="16" fill="#111111"><tspan x="60" dy="0">图 1｜同一组数据的两种表示。a，先用“正”字记录，每个“正”字表示 5 人，再数出人数。b，条形统计图：横轴是活动，纵轴是人数，条形的高度表示人数，1 格表示 2 人，奇数人数的条形停在格子中间。c，</tspan><tspan x="60" dy="26.4">几个可以直接从图中回答的问题。</tspan></text>
