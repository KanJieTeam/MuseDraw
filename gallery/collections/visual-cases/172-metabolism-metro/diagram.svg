<g id="layer6" inkscape:groupmode="layer" inkscape:label="标题与账本">
<text x="50" y="82" font-family="'Noto Sans CJK SC', sans-serif" font-size="36" font-weight="800" fill="#1A1A1A">能量代谢线路图</text>
<text x="52" y="112" font-family="'Noto Sans CJK SC', sans-serif" font-size="15" fill="#777777">一个葡萄糖分子的主要去向；大站是关键枢纽</text>
<rect x="50" y="692" width="40" height="10" fill="#D7282F" rx="5"/>
<text x="100" y="702" font-family="'Noto Sans CJK SC', sans-serif" font-size="13" fill="#1A1A1A">糖酵解与丙酮酸氧化</text>
<rect x="50" y="722" width="40" height="10" fill="#1E9E5A" rx="5"/>
<text x="100" y="732" font-family="'Noto Sans CJK SC', sans-serif" font-size="13" fill="#1A1A1A">三羧酸循环（环线）</text>
<rect x="50" y="752" width="40" height="10" fill="#8E44AD" rx="5"/>
<text x="100" y="762" font-family="'Noto Sans CJK SC', sans-serif" font-size="13" fill="#1A1A1A">磷酸戊糖途径</text>
<rect x="50" y="782" width="40" height="10" fill="#F29400" rx="5"/>
<text x="100" y="792" font-family="'Noto Sans CJK SC', sans-serif" font-size="13" fill="#1A1A1A">乳酸支线</text>
<rect x="50" y="812" width="40" height="10" fill="#E6B800" rx="5"/>
<text x="100" y="822" font-family="'Noto Sans CJK SC', sans-serif" font-size="13" fill="#1A1A1A">脂肪酸 β-氧化</text>
<rect x="50" y="842" width="40" height="10" fill="#1D6FB8" rx="5"/>
<text x="100" y="852" font-family="'Noto Sans CJK SC', sans-serif" font-size="13" fill="#1A1A1A">谷氨酰胺回补</text>
<rect x="50" y="872" width="40" height="10" fill="#5A5A5A" rx="5"/>
<text x="100" y="882" font-family="'Noto Sans CJK SC', sans-serif" font-size="13" fill="#1A1A1A">电子传递链</text>
<rect x="330" y="680" width="210" height="270" rx="10" fill="#FFFFFF" stroke="#D5D0C5"/>
<text x="346" y="706" font-family="'Noto Sans CJK SC', sans-serif" font-size="13" font-weight="700" fill="#1A1A1A">1 个葡萄糖的 ATP 账本</text>
<text x="346" y="734" font-family="'Noto Sans CJK SC', sans-serif" font-size="12" fill="#1A1A1A">糖酵解　2 ATP + 2 NADH</text>
<text x="346" y="764" font-family="'Noto Sans CJK SC', sans-serif" font-size="12" fill="#1A1A1A">丙酮酸氧化　2 NADH</text>
<text x="346" y="794" font-family="'Noto Sans CJK SC', sans-serif" font-size="12" fill="#1A1A1A">三羧酸循环　6 NADH</text>
<text x="346" y="824" font-family="'Noto Sans CJK SC', sans-serif" font-size="12" fill="#1A1A1A">　　+ 2 FADH₂ + 2 GTP</text>
<text x="346" y="854" font-family="'Noto Sans CJK SC', sans-serif" font-size="12" fill="#1A1A1A">NADH ≈ 2.5，FADH₂ ≈ 1.5 ATP</text>
<text x="346" y="884" font-family="'Noto Sans CJK SC', sans-serif" font-size="12" font-weight="700" fill="#D7282F">合计约 32（苹果酸穿梭）</text>
<text x="346" y="914" font-family="'Noto Sans CJK SC', sans-serif" font-size="12" font-weight="700" fill="#D7282F">或约 30（甘油磷酸穿梭）</text>
</g>
</svg>