<g id="layer4" inkscape:groupmode="layer" inkscape:label="公式">
<text x="1180" y="300" font-family="'Noto Sans CJK SC', sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">巴斯扩散模型</text>
<text x="1180" y="350" font-family="'Noto Sans CJK SC', sans-serif" font-size="20" font-weight="700" fill="url(#g1)">n(t) = [p + q·N(t)/m]·[m − N(t)]</text>
<text x="1180" y="400" font-family="'Noto Sans CJK SC', sans-serif" font-size="17" fill="#8E8E93"><tspan x="1180" dy="0">p = 0.03　创新系数（自己主动用）</tspan><tspan x="1180" dy="28.9">q = 0.38　模仿系数（看同事在用）</tspan><tspan x="1180" dy="28.9">m = 2,400　潜在用户数</tspan></text>
<text x="1180" y="540" font-family="'Noto Sans CJK SC', sans-serif" font-size="16" fill="#FFFFFF">q 远大于 p：推广的主要动力是同事带动，</text>
<text x="1180" y="568" font-family="'Noto Sans CJK SC', sans-serif" font-size="16" fill="#FFFFFF">所以先在每个团队找一位早期用户。</text>
</g>
