<path d="M1300.0,550.0 L1290.9,554.1 L1290.9,545.9 Z" fill="#7FD3FF"/>
<path d="M1400.0,482.0 L1400.0,482.0 L1400.0,428.0 L1406.0,428.0" fill="none" stroke="#3FE3A8" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M1398.0,428.0 L1407.1,423.9 L1407.1,432.1 Z" fill="#3FE3A8"/>
</g>
<g id="layer6" inkscape:groupmode="layer" inkscape:label="规则">
<rect x="200" y="912" width="1340" height="70" rx="14" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.25"/>
<text x="222" y="942" font-family="'Noto Sans CJK SC', sans-serif" font-size="15" fill="#F2F6FF">审批：&lt; ¥5,000 部门负责人；¥5,000–50,000 加财务总监；≥ ¥50,000 再加总经理。本单走：部门负责人 → 财务总监。</text>
<text x="222" y="968" font-family="'Noto Sans CJK SC', sans-serif" font-size="15" fill="#F2F6FF">三单匹配：订单 ¥36,800，收货 40 × ¥920 = ¥36,800，发票 ¥37,300。账期 30 天，到期日 12 月 05 日为星期六，顺延到 12 月 07 日星期一。</text>
<text x="1530" y="140" font-family="'Noto Sans CJK SC', sans-serif" font-size="13" fill="#3FE3A8" text-anchor="end">绿色描边：本单经过的关键控制点</text>
</g>
</svg>