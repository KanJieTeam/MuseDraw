<text x="1000" y="742" font-family="'Noto Sans CJK SC', sans-serif" font-size="13" fill="#7FD3FF">货物送达</text>
<path d="M1250.0,830.0 L1400.0,830.0 L1400.0,586.0" fill="none" stroke="#7FD3FF" stroke-width="1.6" stroke-dasharray="5 4" stroke-linejoin="round" stroke-linecap="round"/>
