<svg data-theme="aurora" xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="1600" height="1000" viewBox="0 0 1600 1000">
<title>采购到付款流程</title>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071423" stop-opacity="1"/><stop offset="1" stop-color="#17112F" stop-opacity="1"/></linearGradient><filter id="blur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="70"/></filter></defs>
<g id="layer1" inkscape:groupmode="layer" inkscape:label="背景">
<rect x="0" y="0" width="1600" height="1000" fill="#081521"/>
</g>
<g id="layer2" inkscape:groupmode="layer" inkscape:label="极光">
<rect x="0" y="0" width="1600" height="1000" fill="url(#bg)"/>
<ellipse cx="300" cy="90" rx="420" ry="100" fill="#2FE3A0" opacity="0.3" filter="url(#blur)"/>
<ellipse cx="1000" cy="60" rx="520" ry="110" fill="#7B61FF" opacity="0.35" filter="url(#blur)"/>
<ellipse cx="1450" cy="160" rx="300" ry="120" fill="#27B5F2" opacity="0.28" filter="url(#blur)"/>
</g>
<g id="layer3" inkscape:groupmode="layer" inkscape:label="标题">
<text x="70" y="84" font-family="'Noto Sans CJK SC', sans-serif" font-size="40" font-weight="600" fill="#F2F6FF">采购到付款流程</text>
<text x="72" y="120" font-family="'Noto Sans CJK SC', sans-serif" font-size="17" fill="#A9BAD6">以一笔 ¥36,800 的办公设备采购为例：40 台显示器 × ¥920（示例）</text>
</g>
<g id="layer4" inkscape:groupmode="layer" inkscape:label="泳道">
<rect x="60" y="160" width="1480" height="140" rx="16" fill="#FFFFFF" fill-opacity="0.07" stroke="#FFFFFF" stroke-opacity="0.15"/>
<text x="84" y="237" font-family="'Noto Sans CJK SC', sans-serif" font-size="18" font-weight="700" fill="#7FD3FF">申请人</text>
<rect x="60" y="310" width="1480" height="140" rx="16" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.15"/>
<text x="84" y="387" font-family="'Noto Sans CJK SC', sans-serif" font-size="18" font-weight="700" fill="#7FD3FF">部门负责人</text>
<rect x="60" y="460" width="1480" height="140" rx="16" fill="#FFFFFF" fill-opacity="0.07" stroke="#FFFFFF" stroke-opacity="0.15"/>
<text x="84" y="537" font-family="'Noto Sans CJK SC', sans-serif" font-size="18" font-weight="700" fill="#7FD3FF">财务部</text>
<rect x="60" y="610" width="1480" height="140" rx="16" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.15"/>
<text x="84" y="687" font-family="'Noto Sans CJK SC', sans-serif" font-size="18" font-weight="700" fill="#7FD3FF">采购部</text>
<rect x="60" y="760" width="1480" height="140" rx="16" fill="#FFFFFF" fill-opacity="0.07" stroke="#FFFFFF" stroke-opacity="0.15"/>
<text x="84" y="837" font-family="'Noto Sans CJK SC', sans-serif" font-size="18" font-weight="700" fill="#7FD3FF">供应商</text>
</g>
<g id="layer5" inkscape:groupmode="layer" inkscape:label="步骤">
<rect x="200" y="182" width="170" height="96" rx="14" fill="#FFFFFF" fill-opacity="0.12" stroke="#3FE3A8" stroke-opacity="0.9" stroke-width="2"/>
<text x="214" y="214" font-family="'Noto Sans CJK SC', sans-serif" font-size="16" font-weight="700" fill="#F2F6FF"><tspan x="214" dy="0">提交采购申请</tspan></text>
<text x="214" y="254" font-family="'Noto Sans CJK SC', sans-serif" font-size="12" fill="#A9BAD6"><tspan x="214" dy="0">¥36,800，附用途说明</tspan></text>
<rect x="420" y="332" width="170" height="96" rx="14" fill="#FFFFFF" fill-opacity="0.12" stroke="#3FE3A8" stroke-opacity="0.9" stroke-width="2"/>
<text x="434" y="364" font-family="'Noto Sans CJK SC', sans-serif" font-size="16" font-weight="700" fill="#F2F6FF"><tspan x="434" dy="0">部门负责人审批</tspan></text>
<text x="434" y="404" font-family="'Noto Sans CJK SC', sans-serif" font-size="12" fill="#A9BAD6"><tspan x="434" dy="0">所有金额都需要</tspan></text>
<rect x="640" y="482" width="170" height="96" rx="14" fill="#FFFFFF" fill-opacity="0.12" stroke="#3FE3A8" stroke-opacity="0.9" stroke-width="2"/>
<text x="654" y="514" font-family="'Noto Sans CJK SC', sans-serif" font-size="16" font-weight="700" fill="#F2F6FF"><tspan x="654" dy="0">财务总监审批</tspan></text>
<text x="654" y="554" font-family="'Noto Sans CJK SC', sans-serif" font-size="12" fill="#A9BAD6"><tspan x="654" dy="0">¥5,000–50,000 加签</tspan></text>
<rect x="860" y="632" width="170" height="96" rx="14" fill="#FFFFFF" fill-opacity="0.12" stroke="#3FE3A8" stroke-opacity="0.9" stroke-width="2"/>
<text x="874" y="664" font-family="'Noto Sans CJK SC', sans-serif" font-size="16" font-weight="700" fill="#F2F6FF"><tspan x="874" dy="0">询价比价</tspan></text>
<text x="874" y="704" font-family="'Noto Sans CJK SC', sans-serif" font-size="12" fill="#A9BAD6"><tspan x="874" dy="0">超过 ¥20,000 需 3 家报价</tspan></text>
<rect x="1080" y="632" width="170" height="96" rx="14" fill="#FFFFFF" fill-opacity="0.07" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1.2"/>
<text x="1094" y="664" font-family="'Noto Sans CJK SC', sans-serif" font-size="16" font-weight="700" fill="#F2F6FF"><tspan x="1094" dy="0">下达采购订单</tspan></text>
<text x="1094" y="704" font-family="'Noto Sans CJK SC', sans-serif" font-size="12" fill="#A9BAD6"><tspan x="1094" dy="0">订单号、数量、单价</tspan></text>
<rect x="1080" y="782" width="170" height="96" rx="14" fill="#FFFFFF" fill-opacity="0.07" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1.2"/>
<text x="1094" y="814" font-family="'Noto Sans CJK SC', sans-serif" font-size="16" font-weight="700" fill="#F2F6FF"><tspan x="1094" dy="0">发货并开票</tspan></text>
<text x="1094" y="854" font-family="'Noto Sans CJK SC', sans-serif" font-size="12" fill="#A9BAD6"><tspan x="1094" dy="0">发票 ¥37,300</tspan></text>
<rect x="860" y="182" width="170" height="96" rx="14" fill="#FFFFFF" fill-opacity="0.07" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1.2"/>
<text x="874" y="214" font-family="'Noto Sans CJK SC', sans-serif" font-size="16" font-weight="700" fill="#F2F6FF"><tspan x="874" dy="0">收货确认</tspan></text>
<text x="874" y="254" font-family="'Noto Sans CJK SC', sans-serif" font-size="12" fill="#A9BAD6"><tspan x="874" dy="0">实收 40 台</tspan></text>
<rect x="1300" y="482" width="200" height="96" rx="14" fill="#FFFFFF" fill-opacity="0.12" stroke="#3FE3A8" stroke-opacity="0.9" stroke-width="2"/>
<text x="1314" y="514" font-family="'Noto Sans CJK SC', sans-serif" font-size="16" font-weight="700" fill="#F2F6FF"><tspan x="1314" dy="0">三单匹配</tspan></text>
<text x="1314" y="554" font-family="'Noto Sans CJK SC', sans-serif" font-size="12" fill="#A9BAD6"><tspan x="1314" dy="0">差异 +1.36%，容差 ±2%</tspan></text>
<rect x="1300" y="332" width="200" height="96" rx="14" fill="#FFFFFF" fill-opacity="0.07" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1.2"/>
<text x="1314" y="364" font-family="'Noto Sans CJK SC', sans-serif" font-size="16" font-weight="700" fill="#F2F6FF"><tspan x="1314" dy="0">安排付款</tspan></text>
<text x="1314" y="404" font-family="'Noto Sans CJK SC', sans-serif" font-size="12" fill="#A9BAD6"><tspan x="1314" dy="0">12 月 07 日付款</tspan></text>
