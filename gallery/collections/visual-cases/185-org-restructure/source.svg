<text x="800" y="100" font-family="'Noto Serif CJK SC', serif" font-size="66" font-weight="900" fill="#141414" text-anchor="middle" letter-spacing="12">内部通讯</text>
<line x1="60" y1="122" x2="1540" y2="122" stroke="#141414" stroke-width="3"/>
<line x1="60" y1="129" x2="1540" y2="129" stroke="#141414" stroke-width="1"/>
<text x="60" y="154" font-family="'Noto Serif CJK SC', serif" font-size="17" fill="#141414">2026 年 10 月 26 日　星期一</text>
<text x="800" y="154" font-family="'Noto Serif CJK SC', serif" font-size="17" font-weight="700" fill="#141414" text-anchor="middle">组织架构调整专刊</text>
<text x="1540" y="154" font-family="'Noto Serif CJK SC', serif" font-size="17" fill="#141414" text-anchor="end">2026 年 11 月 2 日（星期一）起生效</text>
<line x1="60" y1="168" x2="1540" y2="168" stroke="#141414" stroke-width="1"/>
</g>
<g id="layer3" inkscape:groupmode="layer" inkscape:label="头条">
<text x="800" y="238" font-family="'Noto Serif CJK SC', serif" font-size="48" font-weight="900" fill="#141414" text-anchor="middle">八个部门合并为五个：管理岗减少 19 个，总人数不变</text>
<text x="800" y="280" font-family="'Noto Serif CJK SC', serif" font-size="20" fill="#555555" text-anchor="middle">平均管理幅度从 3.3 人升至 4.2 人；产品与研发合并为一个部门，从需求到上线由同一负责人推进</text>
<line x1="60" y1="306" x2="1540" y2="306" stroke="#141414" stroke-width="1.5"/>
<line x1="800" y1="326" x2="800" y2="960" stroke="#141414" stroke-width="0.8"/>
</g>
