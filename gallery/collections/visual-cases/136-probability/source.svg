<g id="layer6" inkscape:groupmode="layer" inkscape:label="计分板">
<text x="1060" y="330" font-family="'Noto Sans CJK SC', sans-serif" font-size="26" font-weight="900" fill="#FF4D6D">红球</text>
<rect x="1140" y="304" width="276" height="32" fill="#FF4D6D" filter="url(#glow)"/>
<line x1="1440" y1="290" x2="1440" y2="348" stroke="#E9E4FF" stroke-width="2" stroke-dasharray="4 4"/>
<text x="1454" y="330" font-family="'Noto Sans CJK SC', sans-serif" font-size="24" font-weight="800" fill="#E9E4FF">46 次</text>
<text x="1140" y="374" font-family="'Noto Sans CJK SC', sans-serif" font-size="15" fill="#E9E4FF" opacity="0.7">虚线：按 5/10 估计约 50 次</text>
<text x="1060" y="450" font-family="'Noto Sans CJK SC', sans-serif" font-size="26" font-weight="900" fill="#4DA6FF">蓝球</text>
<rect x="1140" y="424" width="204" height="32" fill="#4DA6FF" filter="url(#glow)"/>
<line x1="1320" y1="410" x2="1320" y2="468" stroke="#E9E4FF" stroke-width="2" stroke-dasharray="4 4"/>
<text x="1358" y="450" font-family="'Noto Sans CJK SC', sans-serif" font-size="24" font-weight="800" fill="#E9E4FF">34 次</text>
<text x="1140" y="494" font-family="'Noto Sans CJK SC', sans-serif" font-size="15" fill="#E9E4FF" opacity="0.7">虚线：按 3/10 估计约 30 次</text>
<text x="1060" y="570" font-family="'Noto Sans CJK SC', sans-serif" font-size="26" font-weight="900" fill="#FFD84D">黄球</text>
<rect x="1140" y="544" width="120" height="32" fill="#FFD84D" filter="url(#glow)"/>
<line x1="1260" y1="530" x2="1260" y2="588" stroke="#E9E4FF" stroke-width="2" stroke-dasharray="4 4"/>
<text x="1274" y="570" font-family="'Noto Sans CJK SC', sans-serif" font-size="24" font-weight="800" fill="#E9E4FF">20 次</text>
<text x="1140" y="614" font-family="'Noto Sans CJK SC', sans-serif" font-size="15" fill="#E9E4FF" opacity="0.7">虚线：按 2/10 估计约 20 次</text>
</g>
<g id="layer7" inkscape:groupmode="layer" inkscape:label="结论">
<text x="640" y="720" font-family="'Noto Sans CJK SC', sans-serif" font-size="24" font-weight="800" fill="#2DE2E6">红球最多，摸到红球的可能性最大；黄球最少，可能性最小。</text>
<text x="640" y="766" font-family="'Noto Sans CJK SC', sans-serif" font-size="24" font-weight="800" fill="#FF3EA5">袋子里没有绿球，摸到绿球是不可能的。</text>
<text x="640" y="812" font-family="'Noto Sans CJK SC', sans-serif" font-size="20" fill="#E9E4FF">每次摸到什么不确定，次数多了，结果才接近估计。</text>
</g>
