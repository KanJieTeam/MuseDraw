<text x="84" y="178" font-family="'Noto Sans CJK SC', sans-serif" font-size="20" fill="#E9E4FF">袋子里有 5 个红球、3 个蓝球、2 个黄球，摸一个再放回去，一共摸 100 次（程序模拟）</text>
</g>
