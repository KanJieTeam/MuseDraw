<svg data-theme="terminal" xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="1600" height="1000" viewBox="0 0 1600 1000">
<title>24 时计时法</title>
<g id="layer1" inkscape:groupmode="layer" inkscape:label="背景">
<rect x="0" y="0" width="1600" height="1000" fill="#0F1417"/>
</g>
<g id="layer2" inkscape:groupmode="layer" inkscape:label="窗口">
<rect x="0" y="0" width="1600" height="44" fill="#182024"/>
<circle cx="26" cy="22" r="6" fill="#C0675F"/>
<circle cx="48" cy="22" r="6" fill="#C9A65A"/>
<circle cx="70" cy="22" r="6" fill="#7FA36B"/>
<text x="800" y="28" font-family="'DejaVu Sans Mono', 'Noto Sans CJK SC', monospace" font-size="15" fill="#6F7D78" text-anchor="middle">24 时计时法 — clock</text>
</g>
<g id="layer3" inkscape:groupmode="layer" inkscape:label="命令">
<text x="40" y="110" font-family="'DejaVu Sans Mono', 'Noto Sans CJK SC', monospace" font-size="18" fill="#7E9488"># 下午和晚上：普通计时法的时数 + 12</text>
<text x="40" y="156" font-family="'DejaVu Sans Mono', 'Noto Sans CJK SC', monospace" font-size="19" font-weight="700" fill="#7FD18B">$</text>
<text x="66" y="156" font-family="'DejaVu Sans Mono', 'Noto Sans CJK SC', monospace" font-size="19" fill="#D3DAD5">clock --24h &quot;下午 3:00&quot;</text>
<text x="66" y="188" font-family="'DejaVu Sans Mono', 'Noto Sans CJK SC', monospace" font-size="22" font-weight="700" fill="#E6B450">15:00</text>
<text x="40" y="236" font-family="'DejaVu Sans Mono', 'Noto Sans CJK SC', monospace" font-size="19" font-weight="700" fill="#7FD18B">$</text>
<text x="66" y="236" font-family="'DejaVu Sans Mono', 'Noto Sans CJK SC', monospace" font-size="19" fill="#D3DAD5">clock --24h &quot;晚上 9:30&quot;</text>
<text x="66" y="268" font-family="'DejaVu Sans Mono', 'Noto Sans CJK SC', monospace" font-size="22" font-weight="700" fill="#E6B450">21:30</text>
<text x="40" y="316" font-family="'DejaVu Sans Mono', 'Noto Sans CJK SC', monospace" font-size="19" font-weight="700" fill="#7FD18B">$</text>
<text x="66" y="316" font-family="'DejaVu Sans Mono', 'Noto Sans CJK SC', monospace" font-size="19" fill="#D3DAD5">clock --12h 7:05</text>
<text x="66" y="348" font-family="'DejaVu Sans Mono', 'Noto Sans CJK SC', monospace" font-size="22" font-weight="700" fill="#6CB6FF">上午 7:05（上午的时刻不用变）</text>
<text x="40" y="410" font-family="'DejaVu Sans Mono', 'Noto Sans CJK SC', monospace" font-size="18" fill="#7E9488"># 夜里 12 时 = 0:00 = 24:00：既是前一天的结束，也是后一天的开始</text>
<text x="40" y="470" font-family="'DejaVu Sans Mono', 'Noto Sans CJK SC', monospace" font-size="18" fill="#7E9488"># 经过时间 = 结束时刻 − 开始时刻</text>
<text x="40" y="516" font-family="'DejaVu Sans Mono', 'Noto Sans CJK SC', monospace" font-size="19" font-weight="700" fill="#7FD18B">$</text>
<text x="66" y="516" font-family="'DejaVu Sans Mono', 'Noto Sans CJK SC', monospace" font-size="19" fill="#D3DAD5">elapsed 08:30 15:10</text>
<text x="66" y="548" font-family="'DejaVu Sans Mono', 'Noto Sans CJK SC', monospace" font-size="22" font-weight="700" fill="#7FD18B">6 小时 40 分</text>
<text x="40" y="596" font-family="'DejaVu Sans Mono', 'Noto Sans CJK SC', monospace" font-size="19" font-weight="700" fill="#7FD18B">$</text>
<text x="66" y="596" font-family="'DejaVu Sans Mono', 'Noto Sans CJK SC', monospace" font-size="19" fill="#D3DAD5">elapsed 21:30 06:45   # 跨过 0:00</text>
<text x="66" y="628" font-family="'DejaVu Sans Mono', 'Noto Sans CJK SC', monospace" font-size="22" font-weight="700" fill="#7FD18B">9 小时 15 分</text>
<rect x="66" y="672" width="12" height="22" fill="#D3DAD5"/>
</g>
