<svg data-theme="bauhaus" xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="1600" height="1000" viewBox="0 0 1600 1000">
<title>3-2-1 备份规则</title>
<g id="layer1" inkscape:groupmode="layer" inkscape:label="背景">
<rect x="0" y="0" width="1600" height="1000" fill="#ECE6DA"/>
</g>
<g id="layer2" inkscape:groupmode="layer" inkscape:label="标题">
<text x="70" y="116" font-family="'Noto Sans CJK SC', sans-serif" font-size="58" font-weight="900" fill="#141414">3-2-1 备份规则</text>
<rect x="70" y="146" width="1460" height="12" fill="#141414"/>
</g>
<g id="layer3" inkscape:groupmode="layer" inkscape:label="数字">
<text x="60" y="520" font-family="'Noto Sans CJK SC', sans-serif" font-size="380" font-weight="900" fill="#141414">3</text>
<text x="575" y="520" font-family="'Noto Sans CJK SC', sans-serif" font-size="380" font-weight="900" fill="#141414">2</text>
<text x="1090" y="520" font-family="'Noto Sans CJK SC', sans-serif" font-size="380" font-weight="900" fill="#141414">1</text>
</g>
<g id="layer4" inkscape:groupmode="layer" inkscape:label="几何">
<circle cx="330" cy="300" r="62" fill="#D52B1E"/>
<circle cx="430" cy="400" r="62" fill="#D52B1E"/>
<circle cx="330" cy="500" r="62" fill="#D52B1E"/>
<rect x="800" y="230" width="140" height="140" fill="#1D4E9E"/>
<rect x="880" y="360" width="140" height="140" fill="#1D4E9E" opacity="0.92"/>
<path d="M1400.0,210.0 L1530.0,500.0 L1270.0,500.0 Z" fill="#F2C230"/>
</g>
<g id="layer5" inkscape:groupmode="layer" inkscape:label="说明">
<text x="70" y="610" font-family="'Noto Sans CJK SC', sans-serif" font-size="32" font-weight="800" fill="#141414">3 份数据副本</text>
<text x="70" y="650" font-family="'Noto Sans CJK SC', sans-serif" font-size="20" fill="#141414"><tspan x="70" dy="0">生产数据 1 份，再加 2 份备份。</tspan></text>
<text x="585" y="610" font-family="'Noto Sans CJK SC', sans-serif" font-size="32" font-weight="800" fill="#141414">2 种存储介质</text>
<text x="585" y="650" font-family="'Noto Sans CJK SC', sans-serif" font-size="20" fill="#141414"><tspan x="585" dy="0">本地磁盘阵列加对象存储，一种介质出问题时</tspan><tspan x="585" dy="31">另一种还在。</tspan></text>
<text x="1100" y="610" font-family="'Noto Sans CJK SC', sans-serif" font-size="32" font-weight="800" fill="#141414">1 份放在异地</text>
<text x="1100" y="650" font-family="'Noto Sans CJK SC', sans-serif" font-size="20" fill="#141414"><tspan x="1100" dy="0">另一个地域的对象存储，开启版本保留和防删</tspan><tspan x="1100" dy="31">除锁。</tspan></text>
</g>
<g id="layer6" inkscape:groupmode="layer" inkscape:label="底部色带">
<rect x="0" y="760" width="1600" height="240" fill="#141414"/>
<circle cx="1600" cy="880" r="120" fill="#D52B1E"/>
<text x="70" y="840" font-family="'Noto Sans CJK SC', sans-serif" font-size="22" font-weight="500" fill="#ECE6DA">恢复点 RPO</text>
<text x="70" y="900" font-family="'Noto Sans CJK SC', sans-serif" font-size="52" font-weight="900" fill="#F2C230">≤ 1 小时</text>
<text x="70" y="944" font-family="'Noto Sans CJK SC', sans-serif" font-size="18" fill="#ECE6DA">每天 01:00 全量，每小时增量；最坏丢失最近 1 小时的数据</text>
<text x="780" y="840" font-family="'Noto Sans CJK SC', sans-serif" font-size="22" font-weight="500" fill="#ECE6DA">恢复时间 RTO</text>
<text x="780" y="900" font-family="'Noto Sans CJK SC', sans-serif" font-size="52" font-weight="900" fill="#F2C230">约 1 小时 23 分</text>
<text x="780" y="944" font-family="'Noto Sans CJK SC', sans-serif" font-size="18" fill="#ECE6DA">从对象存储恢复 2 TB，按 400 MB/s 计，只算数据传输</text>
</g>
</svg>