<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="1600" height="1000" viewBox="0 0 1600 1000">
<title>认识方向</title>
<g id="layer1" inkscape:groupmode="layer" inkscape:label="背景">
<rect x="0" y="0" width="1600" height="1000" fill="#FFFFFF"/>
</g>
<g id="layer2" inkscape:groupmode="layer" inkscape:label="线路">
<path d="M440.0,520.0 L800.0,520.0 L1160.0,520.0" fill="none" stroke="#D7282F" stroke-width="14" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M800.0,260.0 L800.0,520.0 L800.0,800.0" fill="none" stroke="#1D6FB8" stroke-width="14" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M800.0,260.0 L1160.0,260.0 L1160.0,520.0" fill="none" stroke="#1E9E5A" stroke-width="14" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M440.0,520.0 L440.0,800.0 L800.0,800.0" fill="none" stroke="#F29400" stroke-width="14" stroke-linejoin="round" stroke-linecap="round"/>
</g>
<g id="layer3" inkscape:groupmode="layer" inkscape:label="车站">
<circle cx="800" cy="520" r="20" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="5"/>
<text x="826" y="564" font-family="'Noto Sans CJK SC', sans-serif" font-size="24" font-weight="800" fill="#1A1A1A" text-anchor="start">学校</text>
<circle cx="800" cy="260" r="14" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="5"/>
<text x="800" y="230" font-family="'Noto Sans CJK SC', sans-serif" font-size="21" font-weight="700" fill="#1A1A1A" text-anchor="middle">公园</text>
<circle cx="800" cy="800" r="14" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="5"/>
<text x="800" y="854" font-family="'Noto Sans CJK SC', sans-serif" font-size="21" font-weight="700" fill="#1A1A1A" text-anchor="middle">少年宫</text>
<circle cx="440" cy="520" r="14" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="5"/>
<text x="414" y="496" font-family="'Noto Sans CJK SC', sans-serif" font-size="21" font-weight="700" fill="#1A1A1A" text-anchor="end">医院</text>
<circle cx="1160" cy="520" r="14" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="5"/>
<text x="1186" y="564" font-family="'Noto Sans CJK SC', sans-serif" font-size="21" font-weight="700" fill="#1A1A1A" text-anchor="start">图书馆</text>
<circle cx="1160" cy="260" r="11" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="4"/>
<text x="1160" y="230" font-family="'Noto Sans CJK SC', sans-serif" font-size="21" font-weight="700" fill="#1A1A1A" text-anchor="middle">超市</text>
<circle cx="440" cy="800" r="11" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="4"/>
<text x="440" y="854" font-family="'Noto Sans CJK SC', sans-serif" font-size="21" font-weight="700" fill="#1A1A1A" text-anchor="middle">体育馆</text>
</g>
<g id="layer4" inkscape:groupmode="layer" inkscape:label="指南针">
<circle cx="1420" cy="200" r="70" fill="none" stroke="#1A1A1A" stroke-width="2"/>
<path d="M1420.0,134.0 L1432.0,200.0 L1408.0,200.0 Z" fill="#D7282F"/>
<path d="M1420.0,266.0 L1432.0,200.0 L1408.0,200.0 Z" fill="#1A1A1A"/>
<text x="1420" y="118" font-family="'Noto Sans CJK SC', sans-serif" font-size="22" font-weight="800" fill="#1A1A1A" text-anchor="middle">北</text>
<text x="1420" y="300" font-family="'Noto Sans CJK SC', sans-serif" font-size="22" font-weight="800" fill="#1A1A1A" text-anchor="middle">南</text>
<text x="1324" y="208" font-family="'Noto Sans CJK SC', sans-serif" font-size="22" font-weight="800" fill="#1A1A1A" text-anchor="middle">西</text>
<text x="1516" y="208" font-family="'Noto Sans CJK SC', sans-serif" font-size="22" font-weight="800" fill="#1A1A1A" text-anchor="middle">东</text>
</g>
<g id="layer5" inkscape:groupmode="layer" inkscape:label="标题与说明">
<text x="70" y="100" font-family="'Noto Sans CJK SC', sans-serif" font-size="46" font-weight="800" fill="#1A1A1A">认识方向</text>
<text x="72" y="140" font-family="'Noto Sans CJK SC', sans-serif" font-size="20" fill="#777777">地图通常按上北、下南、左西、右东绘制</text>
<text x="1300" y="380" font-family="'Noto Sans CJK SC', sans-serif" font-size="22" font-weight="800" fill="#1A1A1A">从学校看</text>
<text x="1300" y="420" font-family="'Noto Sans CJK SC', sans-serif" font-size="20" fill="#1A1A1A">公园在北面</text>
<text x="1300" y="456" font-family="'Noto Sans CJK SC', sans-serif" font-size="20" fill="#1A1A1A">超市在东北面</text>
<text x="1300" y="492" font-family="'Noto Sans CJK SC', sans-serif" font-size="20" fill="#1A1A1A">图书馆在东面</text>
<text x="1300" y="528" font-family="'Noto Sans CJK SC', sans-serif" font-size="20" fill="#1A1A1A">少年宫在南面</text>
<text x="1300" y="564" font-family="'Noto Sans CJK SC', sans-serif" font-size="20" fill="#1A1A1A">体育馆在西南面</text>
<text x="1300" y="600" font-family="'Noto Sans CJK SC', sans-serif" font-size="20" fill="#1A1A1A">医院在西面</text>
<text x="1300" y="680" font-family="'Noto Sans CJK SC', sans-serif" font-size="22" font-weight="800" fill="#1A1A1A">小明的路线</text>
<text x="1300" y="716" font-family="'Noto Sans CJK SC', sans-serif" font-size="19" fill="#1A1A1A"><tspan x="1300" dy="0">从学校坐 1 路向东到图书馆，</tspan><tspan x="1300" dy="30.4">换 3 路向北到超市。</tspan></text>
<rect x="70" y="920" width="50" height="12" fill="#D7282F" rx="6"/>
<text x="130" y="932" font-family="'Noto Sans CJK SC', sans-serif" font-size="18" font-weight="700" fill="#1A1A1A">1 路</text>
<rect x="230" y="920" width="50" height="12" fill="#1D6FB8" rx="6"/>
<text x="290" y="932" font-family="'Noto Sans CJK SC', sans-serif" font-size="18" font-weight="700" fill="#1A1A1A">2 路</text>
<rect x="390" y="920" width="50" height="12" fill="#1E9E5A" rx="6"/>
<text x="450" y="932" font-family="'Noto Sans CJK SC', sans-serif" font-size="18" font-weight="700" fill="#1A1A1A">3 路</text>
<rect x="550" y="920" width="50" height="12" fill="#F29400" rx="6"/>
<text x="610" y="932" font-family="'Noto Sans CJK SC', sans-serif" font-size="18" font-weight="700" fill="#1A1A1A">4 路</text>
</g>
</svg>