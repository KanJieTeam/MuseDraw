<text x="918" y="746" font-family="'Noto Sans CJK SC', sans-serif" font-size="16" fill="#3B3A36"><tspan x="918" dy="0">发现 OutOfSync：开启自动修复时，</tspan><tspan x="918" dy="24">Argo CD 会把集群改回 Git 里的版本，</tspan><tspan x="918" dy="24">手动改动被覆盖。</tspan></text>
