<text x="1302" y="274" font-family="'Noto Sans CJK SC', sans-serif" font-size="22" font-weight="800" fill="#3B3A36">推和拉</text>
<text x="1302" y="310" font-family="'Noto Sans CJK SC', sans-serif" font-size="16" fill="#3B3A36"><tspan x="1302" dy="0">推：CI 拿着集群凭证，从外</tspan><tspan x="1302" dy="24.8">面把变更推进去。</tspan><tspan x="1302" dy="24.8">拉：凭证只留在集群里，</tspan><tspan x="1302" dy="24.8">Argo CD 主动去取。</tspan></text>
</g>
<g transform="rotate(-2 1405.0 580.0)">
<rect x="1280" y="505" width="250" height="160" fill="#000000" opacity="0.05" rx="4"/>
<rect x="1280" y="500" width="250" height="160" fill="#C9D8F5" rx="4"/>
<text x="1302" y="544" font-family="'Noto Sans CJK SC', sans-serif" font-size="22" font-weight="800" fill="#3B3A36">回滚</text>
<text x="1302" y="580" font-family="'Noto Sans CJK SC', sans-serif" font-size="16" fill="#3B3A36"><tspan x="1302" dy="0">回滚就是 git revert，集群</tspan><tspan x="1302" dy="24.8">跟着 Git 走。</tspan></text>
</g>
<g transform="rotate(1.5 1405.0 790.0)">
<rect x="1280" y="715" width="250" height="160" fill="#000000" opacity="0.05" rx="4"/>
<rect x="1280" y="710" width="250" height="160" fill="#BFE6D0" rx="4"/>
