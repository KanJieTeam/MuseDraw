<text x="1302" y="790" font-family="'Noto Sans CJK SC', sans-serif" font-size="16" fill="#3B3A36"><tspan x="1302" dy="0">谁、什么时候、改了什么，</tspan><tspan x="1302" dy="24.8">都在 Git 历史里。</tspan></text>
</g>
<text x="90" y="920" font-family="'Noto Sans CJK SC', sans-serif" font-size="17" fill="#6B675F">实线：正常发布　虚线：漂移与修复</text>
</g>
</svg>