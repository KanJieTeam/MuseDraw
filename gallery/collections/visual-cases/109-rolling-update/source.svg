<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="1600" height="1000" viewBox="0 0 1600 1000">
<title>滚动更新</title>
<g id="layer1" inkscape:groupmode="layer" inkscape:label="背景">
<rect x="0" y="0" width="1600" height="1000" fill="#0F1417"/>
</g>
<g id="layer2" inkscape:groupmode="layer" inkscape:label="窗口">
<rect x="0" y="0" width="1600" height="44" fill="#182024"/>
<circle cx="26" cy="22" r="6" fill="#C0675F"/>
<circle cx="48" cy="22" r="6" fill="#C9A65A"/>
<circle cx="70" cy="22" r="6" fill="#7FA36B"/>
<text x="800" y="28" font-family="'DejaVu Sans Mono', 'Noto Sans CJK SC', monospace" font-size="15" fill="#6F7D78" text-anchor="middle">web-rollout — kubectl</text>
</g>
<g id="layer3" inkscape:groupmode="layer" inkscape:label="命令">
<text x="40" y="96" font-family="'DejaVu Sans Mono', 'Noto Sans CJK SC', monospace" font-size="18" font-weight="700" fill="#7FD18B">$</text>
<text x="64" y="96" font-family="'DejaVu Sans Mono', 'Noto Sans CJK SC', monospace" font-size="18" fill="#D3DAD5">kubectl get deploy web -o jsonpath='{.spec.strategy}'</text>
<text x="40" y="126" font-family="'DejaVu Sans Mono', 'Noto Sans CJK SC', monospace" font-size="18" fill="#6F7D78">{&quot;rollingUpdate&quot;:{&quot;maxSurge&quot;:&quot;25%&quot;,&quot;maxUnavailable&quot;:&quot;25%&quot;},&quot;type&quot;:&quot;RollingUpdate&quot;}</text>
<text x="40" y="166" font-family="'DejaVu Sans Mono', 'Noto Sans CJK SC', monospace" font-size="18" font-weight="700" fill="#7FD18B">$</text>
<text x="64" y="166" font-family="'DejaVu Sans Mono', 'Noto Sans CJK SC', monospace" font-size="18" fill="#D3DAD5">kubectl set image deploy/web app=registry.local/web:v2</text>
<text x="40" y="196" font-family="'DejaVu Sans Mono', 'Noto Sans CJK SC', monospace" font-size="18" fill="#6F7D78">deployment.apps/web image updated</text>
<text x="40" y="236" font-family="'DejaVu Sans Mono', 'Noto Sans CJK SC', monospace" font-size="18" fill="#7E9488"># 8 个副本：maxSurge 25% × 8 = 2（向上取整），maxUnavailable 25% × 8 = 2（向下取整）</text>
<text x="40" y="266" font-family="'DejaVu Sans Mono', 'Noto Sans CJK SC', monospace" font-size="18" fill="#7E9488"># 所以 Pod 总数最多 8 + 2 = 10，可用 Pod 最少 8 − 2 = 6</text>
</g>
