<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="1600" height="1000" viewBox="0 0 1600 1000">
<title>服务网格中的一次请求</title>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071423" stop-opacity="1"/><stop offset="1" stop-color="#17112F" stop-opacity="1"/></linearGradient><filter id="blur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="70"/></filter></defs>
<g id="layer1" inkscape:groupmode="layer" inkscape:label="背景">
<rect x="0" y="0" width="1600" height="1000" fill="#081521"/>
</g>
<g id="layer2" inkscape:groupmode="layer" inkscape:label="极光">
<rect x="0" y="0" width="1600" height="1000" fill="url(#bg)"/>
<ellipse cx="330" cy="150" rx="430" ry="120" fill="#2FE3A0" opacity="0.42" filter="url(#blur)"/>
<ellipse cx="920" cy="70" rx="540" ry="120" fill="#7B61FF" opacity="0.45" filter="url(#blur)"/>
<ellipse cx="1380" cy="210" rx="380" ry="140" fill="#27B5F2" opacity="0.35" filter="url(#blur)"/>
<ellipse cx="760" cy="940" rx="560" ry="110" fill="#2FE3A0" opacity="0.16" filter="url(#blur)"/>
</g>
<g id="layer3" inkscape:groupmode="layer" inkscape:label="标题">
<text x="80" y="100" font-family="'Noto Sans CJK SC', sans-serif" font-size="44" font-weight="600" fill="#F2F6FF">服务网格中的一次请求</text>
<text x="82" y="140" font-family="'Noto Sans CJK SC', sans-serif" font-size="18" fill="#A9BAD6">订单服务调用库存服务，Istio 边车模式</text>
</g>
<g id="layer4" inkscape:groupmode="layer" inkscape:label="卡片">
<rect x="620" y="180" width="360" height="112" rx="20" fill="#FFFFFF" fill-opacity="0.11" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="1.2"/>
<line x1="640" y1="181" x2="960" y2="181" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="1"/>
<text x="800" y="222" font-family="'Noto Sans CJK SC', sans-serif" font-size="28" font-weight="700" fill="#F2F6FF" text-anchor="middle">istiod</text>
<text x="800" y="256" font-family="'Noto Sans CJK SC', sans-serif" font-size="15" fill="#A9BAD6" text-anchor="middle">控制平面：下发路由配置和工作负载证书</text>
<rect x="100" y="370" width="560" height="410" rx="20" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="1.2"/>
<line x1="120" y1="371" x2="640" y2="371" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="1"/>
<text x="128" y="408" font-family="'Noto Sans CJK SC', sans-serif" font-size="18" font-weight="600" fill="#A9BAD6">Pod：订单服务</text>
<rect x="140" y="434" width="480" height="112" rx="14" fill="#FFFFFF" fill-opacity="0.11" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="1.2"/>
<line x1="154" y1="435" x2="606" y2="435" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="1"/>
<text x="170" y="482" font-family="'Noto Sans CJK SC', sans-serif" font-size="26" font-weight="700" fill="#F2F6FF">订单服务</text>
<text x="170" y="516" font-family="'Noto Sans CJK SC', sans-serif" font-size="15" fill="#A9BAD6">应用容器，请求 inventory:8080</text>
<rect x="140" y="616" width="480" height="124" rx="14" fill="#FFFFFF" fill-opacity="0.11" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="1.2"/>
<line x1="154" y1="617" x2="606" y2="617" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="1"/>
<text x="170" y="664" font-family="'Noto Sans CJK SC', sans-serif" font-size="26" font-weight="700" fill="#F2F6FF">Envoy 边车</text>
<text x="170" y="698" font-family="'Noto Sans CJK SC', sans-serif" font-size="15" fill="#A9BAD6">出站监听 15001：选实例、重试、发起 mTLS</text>
<rect x="940" y="370" width="560" height="410" rx="20" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="1.2"/>
<line x1="960" y1="371" x2="1480" y2="371" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="1"/>
<text x="968" y="408" font-family="'Noto Sans CJK SC', sans-serif" font-size="18" font-weight="600" fill="#A9BAD6">Pod：库存服务</text>
<rect x="980" y="434" width="480" height="112" rx="14" fill="#FFFFFF" fill-opacity="0.11" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="1.2"/>
<line x1="994" y1="435" x2="1446" y2="435" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="1"/>
<text x="1010" y="482" font-family="'Noto Sans CJK SC', sans-serif" font-size="26" font-weight="700" fill="#F2F6FF">库存服务</text>
<text x="1010" y="516" font-family="'Noto Sans CJK SC', sans-serif" font-size="15" fill="#A9BAD6">应用容器，处理库存查询</text>
<rect x="980" y="616" width="480" height="124" rx="14" fill="#FFFFFF" fill-opacity="0.11" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="1.2"/>
<line x1="994" y1="617" x2="1446" y2="617" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="1"/>
<text x="1010" y="664" font-family="'Noto Sans CJK SC', sans-serif" font-size="26" font-weight="700" fill="#F2F6FF">Envoy 边车</text>
<text x="1010" y="698" font-family="'Noto Sans CJK SC', sans-serif" font-size="15" fill="#A9BAD6">入站监听 15006：校验身份与授权策略</text>
</g>
<g id="layer5" inkscape:groupmode="layer" inkscape:label="流量">
<line x1="380" y1="548" x2="380" y2="600.8" stroke="#3FE3A8" stroke-width="3" stroke-linecap="round"/>
<path d="M380.0,612.0 L374.3,599.2 L385.7,599.2 Z" fill="#3FE3A8"/>
<circle cx="410" cy="580" r="15" fill="#3FE3A8"/>
<text x="410" y="586" font-family="'Noto Sans CJK SC', sans-serif" font-size="17" font-weight="800" fill="#062018" text-anchor="middle">1</text>
<line x1="622" y1="690" x2="965.2" y2="690" stroke="#3FE3A8" stroke-width="4" stroke-linecap="round"/>
<path d="M978.0,690.0 L963.4,696.5 L963.4,683.5 Z" fill="#3FE3A8"/>
<circle cx="800" cy="690" r="15" fill="#3FE3A8"/>
<text x="800" y="696" font-family="'Noto Sans CJK SC', sans-serif" font-size="17" font-weight="800" fill="#062018" text-anchor="middle">2</text>
<text x="800" y="668" font-family="'Noto Sans CJK SC', sans-serif" font-size="17" font-weight="600" fill="#F2F6FF" text-anchor="middle">mTLS 加密</text>
<text x="800" y="726" font-family="'Noto Sans CJK SC', sans-serif" font-size="14" fill="#A9BAD6" text-anchor="middle">证书由 istiod 签发并轮换</text>
<circle cx="1000" cy="600" r="15" fill="#3FE3A8"/>
<text x="1000" y="606" font-family="'Noto Sans CJK SC', sans-serif" font-size="17" font-weight="800" fill="#062018" text-anchor="middle">3</text>
<line x1="1220" y1="614" x2="1220" y2="561.2" stroke="#3FE3A8" stroke-width="3" stroke-linecap="round"/>
<path d="M1220.0,550.0 L1225.7,562.8 L1214.3,562.8 Z" fill="#3FE3A8"/>
<circle cx="1250" cy="580" r="15" fill="#3FE3A8"/>
<text x="1250" y="586" font-family="'Noto Sans CJK SC', sans-serif" font-size="17" font-weight="800" fill="#062018" text-anchor="middle">4</text>
<path d="M720.0,292.0 L720.0,650.0 L620.0,650.0" fill="none" stroke="#B9A7FF" stroke-width="1.6" stroke-dasharray="5 5" stroke-opacity="0.85"/>
<path d="M880.0,292.0 L880.0,650.0 L980.0,650.0" fill="none" stroke="#B9A7FF" stroke-width="1.6" stroke-dasharray="5 5" stroke-opacity="0.85"/>
<text x="800" y="330" font-family="'Noto Sans CJK SC', sans-serif" font-size="15" fill="#CFC4FF" text-anchor="middle">配置（xDS）</text>
<text x="800" y="352" font-family="'Noto Sans CJK SC', sans-serif" font-size="15" fill="#CFC4FF" text-anchor="middle">与证书（SDS）</text>
</g>
<g id="layer6" inkscape:groupmode="layer" inkscape:label="步骤">
<rect x="100" y="820" width="1400" height="140" rx="20" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="1.2"/>
<line x1="120" y1="821" x2="1480" y2="821" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="1"/>
<circle cx="144" cy="856" r="15" fill="#3FE3A8"/>
<text x="144" y="862" font-family="'Noto Sans CJK SC', sans-serif" font-size="17" font-weight="800" fill="#062018" text-anchor="middle">1</text>
<text x="170" y="862" font-family="'Noto Sans CJK SC', sans-serif" font-size="15" fill="#F2F6FF"><tspan x="170" dy="0">订单服务照常发请求，iptables 把出站流</tspan><tspan x="170" dy="23.2">量转给本 Pod 的 Envoy（15001 端口）。</tspan></text>
<circle cx="489" cy="856" r="15" fill="#3FE3A8"/>
<text x="489" y="862" font-family="'Noto Sans CJK SC', sans-serif" font-size="17" font-weight="800" fill="#062018" text-anchor="middle">2</text>
<text x="515" y="862" font-family="'Noto Sans CJK SC', sans-serif" font-size="15" fill="#F2F6FF"><tspan x="515" dy="0">Envoy 按路由规则挑一个库存实例，用双</tspan><tspan x="515" dy="23.2">向 TLS 建立加密连接。</tspan></text>
<circle cx="834" cy="856" r="15" fill="#3FE3A8"/>
<text x="834" y="862" font-family="'Noto Sans CJK SC', sans-serif" font-size="17" font-weight="800" fill="#062018" text-anchor="middle">3</text>
<text x="860" y="862" font-family="'Noto Sans CJK SC', sans-serif" font-size="15" fill="#F2F6FF"><tspan x="860" dy="0">对端 iptables 把入站流量交给库存 Pod 的</tspan><tspan x="860" dy="23.2">Envoy（15006 端口），校验对方身份和授</tspan><tspan x="860" dy="23.2">权策略。</tspan></text>
<circle cx="1179" cy="856" r="15" fill="#3FE3A8"/>
<text x="1179" y="862" font-family="'Noto Sans CJK SC', sans-serif" font-size="17" font-weight="800" fill="#062018" text-anchor="middle">4</text>
<text x="1205" y="862" font-family="'Noto Sans CJK SC', sans-serif" font-size="15" fill="#F2F6FF"><tspan x="1205" dy="0">校验通过后，Envoy 把请求转给同一 Pod</tspan><tspan x="1205" dy="23.2">里的库存服务。</tspan></text>
</g>
</svg>