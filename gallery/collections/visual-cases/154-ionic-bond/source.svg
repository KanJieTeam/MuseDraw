<g id="layer6" inkscape:groupmode="layer" inkscape:label="说明">
<text x="1200" y="260" font-family="'Noto Sans CJK SC', sans-serif" font-size="18" fill="#F2F6FF"><tspan x="1200" dy="0">钠：最外层 1 个电子，</tspan><tspan x="1200" dy="28.8">容易失去，</tspan><tspan x="1200" dy="28.8">成为带 1 个单位正电荷的 Na⁺。</tspan><tspan x="1200" dy="28.8"></tspan><tspan x="1200" dy="28.8">氯：最外层 7 个电子，</tspan><tspan x="1200" dy="28.8">容易得到 1 个，</tspan><tspan x="1200" dy="28.8">成为带 1 个单位负电荷的 Cl⁻。</tspan></text>
<text x="1200" y="640" font-family="'Noto Sans CJK SC', sans-serif" font-size="20" font-weight="700" fill="#F2F6FF"><tspan x="1200" dy="0">阴、阳离子之间的</tspan><tspan x="1200" dy="32">静电作用叫离子键，</tspan><tspan x="1200" dy="32">由离子键构成的化合物</tspan><tspan x="1200" dy="32">叫离子化合物。</tspan></text>
<text x="1200" y="830" font-family="'Noto Sans CJK SC', sans-serif" font-size="16" fill="#A9BAD6">失电子后，两种离子的最外层</text>
<text x="1200" y="856" font-family="'Noto Sans CJK SC', sans-serif" font-size="16" fill="#A9BAD6">都达到 8 个电子的稳定结构。</text>
</g>
</svg>