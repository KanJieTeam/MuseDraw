<ellipse cx="300" cy="120" rx="420" ry="110" fill="#2FE3A0" opacity="0.35" filter="url(#blur)"/>
<ellipse cx="900" cy="60" rx="520" ry="120" fill="#7B61FF" opacity="0.4" filter="url(#blur)"/>
