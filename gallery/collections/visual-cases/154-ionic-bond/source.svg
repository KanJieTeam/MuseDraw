<g id="layer3" inkscape:groupmode="layer" inkscape:label="标题">
<text x="80" y="100" font-family="'Noto Sans CJK SC', sans-serif" font-size="44" font-weight="600" fill="#F2F6FF">离子键的形成</text>
<text x="82" y="140" font-family="'Noto Sans CJK SC', sans-serif" font-size="18" fill="#A9BAD6">以氯化钠为例：钠原子失去 1 个电子，氯原子得到 1 个电子</text>
</g>
