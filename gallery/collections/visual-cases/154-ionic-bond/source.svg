<text x="880" y="886" font-family="'Noto Sans CJK SC', sans-serif" font-size="22" font-weight="700" fill="#F2F6FF" text-anchor="middle">氯离子 Cl⁻</text>
<text x="880" y="912" font-family="'Noto Sans CJK SC', sans-serif" font-size="15" fill="#A9BAD6" text-anchor="middle">电子排布 2 8 8</text>
