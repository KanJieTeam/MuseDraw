<svg data-theme="swiss" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1400" width="1400" height="1400">
<title>带薪年休假</title>
<g data-md-layer="海报">
<rect width="1400" height="1400" fill="#FFFFFF"/>
<rect x="0" y="0" width="1400" height="300" fill="#E30613"/>
<text id="title" x="80" y="150" font-family="'Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="96" fill="#FFFFFF" font-weight="900">带薪年休假</text>
<text x="84" y="220" font-family="'Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="32" fill="#FFFFFF" font-weight="500">按累计工作年限，每年可以休几天</text>
<rect x="82" y="880" width="37.33" height="20" fill="#E8E8E8"/>
<rect x="123.33" y="840" width="368" height="60" fill="#111111"/>
<text x="131.33" y="810" font-family="'TeX Gyre Heros','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="200" fill="#111111" font-weight="700">5</text>
<text x="131.33" y="950" font-family="'Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="24" fill="#111111" font-weight="700">满 1 年　不满 10 年</text>
<rect x="495.33" y="780" width="409.33" height="120" fill="#E30613"/>
<text x="503.33" y="750" font-family="'TeX Gyre Heros','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="260" fill="#E30613" font-weight="700">10</text>
<text x="503.33" y="950" font-family="'Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="24" fill="#111111" font-weight="700">满 10 年　不满 20 年</text>
<rect x="908.67" y="720" width="409.33" height="180" fill="#111111"/>
<text x="916.67" y="690" font-family="'TeX Gyre Heros','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="260" fill="#111111" font-weight="700">15</text>
<text x="916.67" y="950" font-family="'Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="24" fill="#111111" font-weight="700">满 20 年及以上</text>
<line x1="121.33" y1="900" x2="121.33" y2="914" stroke="#111111" stroke-width="2"/>
<text x="121.33" y="996" font-family="'TeX Gyre Heros','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="18" fill="#555555" text-anchor="middle">1 年</text>
<line x1="493.33" y1="900" x2="493.33" y2="914" stroke="#111111" stroke-width="2"/>
<text x="493.33" y="996" font-family="'TeX Gyre Heros','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="18" fill="#555555" text-anchor="middle">10 年</text>
<line x1="906.67" y1="900" x2="906.67" y2="914" stroke="#111111" stroke-width="2"/>
<text x="906.67" y="996" font-family="'TeX Gyre Heros','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="18" fill="#555555" text-anchor="middle">20 年</text>
<line x1="1320" y1="900" x2="1320" y2="914" stroke="#111111" stroke-width="2"/>
<text x="1320" y="996" font-family="'TeX Gyre Heros','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="18" fill="#555555" text-anchor="middle">…</text>
<line x1="80" y1="900" x2="1320" y2="900" stroke="#111111" stroke-width="3"/>
<text x="1320" y="360" font-family="'Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="22" fill="#111111" font-weight="500" text-anchor="end">单位：天</text>
<text x="80" y="1060" font-family="'Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="26" fill="#111111" font-weight="500">连续工作满 1 年才享受年休假；累计工作时间，包括在不同单位工作的时间。</text>
<text x="80" y="1108" font-family="'Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="26" fill="#111111" font-weight="500">国家法定休假日、休息日不计入年休假。</text>
<rect x="80" y="1200" width="1240" height="4" fill="#111111"/>
<text x="80" y="1260" font-family="'Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="22" fill="#555555">依据：《职工带薪年休假条例》《企业职工带薪年休假实施办法》</text>
</g>
</svg>