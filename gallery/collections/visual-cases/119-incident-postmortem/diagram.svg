<text x="800" y="108" font-family="'Noto Serif CJK SC', serif" font-size="76" font-weight="900" fill="#141414" text-anchor="middle" letter-spacing="12">运维日报</text>
<line x1="60" y1="130" x2="1540" y2="130" stroke="#141414" stroke-width="3"/>
<line x1="60" y1="137" x2="1540" y2="137" stroke="#141414" stroke-width="1"/>
<text x="60" y="162" font-family="'Noto Serif CJK SC', serif" font-size="17" fill="#141414">2026 年 10 月 19 日　星期一</text>
<text x="800" y="162" font-family="'Noto Serif CJK SC', serif" font-size="17" font-weight="700" fill="#141414" text-anchor="middle">故障复盘专刊</text>
<text x="1540" y="162" font-family="'Noto Serif CJK SC', serif" font-size="17" fill="#141414" text-anchor="end">第 113 期</text>
<line x1="60" y1="176" x2="1540" y2="176" stroke="#141414" stroke-width="1"/>
</g>
<g id="layer3" inkscape:groupmode="layer" inkscape:label="头条">
<text x="800" y="250" font-family="'Noto Serif CJK SC', serif" font-size="58" font-weight="900" fill="#141414" text-anchor="middle">缓存集中过期，订单服务降级 47 分钟</text>
<text x="800" y="296" font-family="'Noto Serif CJK SC', serif" font-size="21" fill="#555555" text-anchor="middle">一次配置发布把商品缓存的过期时间统一成 10 分钟；十分钟后缓存同时失效，数据库连接被打满。</text>
<line x1="60" y1="322" x2="1540" y2="322" stroke="#141414" stroke-width="1.5"/>
<line x1="450" y1="344" x2="450" y2="960" stroke="#2A2A2A" stroke-width="0.8"/>
<line x1="1070" y1="344" x2="1070" y2="960" stroke="#2A2A2A" stroke-width="0.8"/>
</g>
<g id="layer4" inkscape:groupmode="layer" inkscape:label="时间线">
<text x="60" y="372" font-family="'Noto Serif CJK SC', serif" font-size="24" font-weight="900" fill="#141414">经过</text>
<text x="60" y="412" font-family="'Noto Serif CJK SC', serif" font-size="20" font-weight="700" fill="#141414">14:02</text>
<text x="136" y="412" font-family="'Noto Serif CJK SC', serif" font-size="17" fill="#141414"><tspan x="136" dy="0">配置发布：商品缓存的过期时间统一改</tspan><tspan x="136" dy="24.6">为 10 分钟</tspan></text>
<text x="60" y="478" font-family="'Noto Serif CJK SC', serif" font-size="20" font-weight="700" fill="#141414">14:12</text>
<text x="136" y="478" font-family="'Noto Serif CJK SC', serif" font-size="17" fill="#141414"><tspan x="136" dy="0">缓存同时过期，数据库 QPS 从 3,000</tspan><tspan x="136" dy="24.6">升到 21,000</tspan></text>
<text x="60" y="544" font-family="'Noto Serif CJK SC', serif" font-size="20" font-weight="700" fill="#141414">14:15</text>
<text x="136" y="544" font-family="'Noto Serif CJK SC', serif" font-size="17" fill="#141414"><tspan x="136" dy="0">告警：下单成功率低于 99%</tspan></text>
<text x="60" y="585" font-family="'Noto Serif CJK SC', serif" font-size="20" font-weight="700" fill="#141414">14:19</text>
<text x="136" y="585" font-family="'Noto Serif CJK SC', serif" font-size="17" fill="#141414"><tspan x="136" dy="0">值班确认告警</tspan></text>
<text x="60" y="626" font-family="'Noto Serif CJK SC', serif" font-size="20" font-weight="700" fill="#141414">14:31</text>
<text x="136" y="626" font-family="'Noto Serif CJK SC', serif" font-size="17" fill="#141414"><tspan x="136" dy="0">定位到缓存集中过期</tspan></text>
<text x="60" y="667" font-family="'Noto Serif CJK SC', serif" font-size="20" font-weight="700" fill="#141414">14:46</text>
<text x="136" y="667" font-family="'Noto Serif CJK SC', serif" font-size="17" fill="#141414"><tspan x="136" dy="0">回滚配置，预热热点商品</tspan></text>
<text x="60" y="708" font-family="'Noto Serif CJK SC', serif" font-size="20" font-weight="700" fill="#141414">14:59</text>
<text x="136" y="708" font-family="'Noto Serif CJK SC', serif" font-size="17" fill="#141414"><tspan x="136" dy="0">下单成功率回到 99.9% 以上</tspan></text>
<line x1="60" y1="749" x2="430" y2="749" stroke="#141414" stroke-width="1"/>
<text x="60" y="805" font-family="'Noto Serif CJK SC', serif" font-size="44" font-weight="900" fill="#141414">3</text>
<text x="90.15" y="805" font-family="'Noto Serif CJK SC', serif" font-size="16" fill="#141414">分钟</text>
<text x="60" y="831" font-family="'Noto Serif CJK SC', serif" font-size="16" fill="#555555">发现</text>
<text x="185" y="805" font-family="'Noto Serif CJK SC', serif" font-size="44" font-weight="900" fill="#141414">4</text>
<text x="215.15" y="805" font-family="'Noto Serif CJK SC', serif" font-size="16" fill="#141414">分钟</text>
<text x="185" y="831" font-family="'Noto Serif CJK SC', serif" font-size="16" fill="#555555">确认</text>
<text x="310" y="805" font-family="'Noto Serif CJK SC', serif" font-size="44" font-weight="900" fill="#141414">47</text>
<text x="364.29" y="805" font-family="'Noto Serif CJK SC', serif" font-size="16" fill="#141414">分钟</text>
<text x="310" y="831" font-family="'Noto Serif CJK SC', serif" font-size="16" fill="#555555">恢复</text>
</g>
