<g id="layer6" inkscape:groupmode="layer" inkscape:label="根因与改进">
<text x="1090" y="372" font-family="'Noto Serif CJK SC', serif" font-size="24" font-weight="900" fill="#141414">根因</text>
<text x="1090" y="410" font-family="'Noto Serif CJK SC', serif" font-size="18" fill="#141414"><tspan x="1090" dy="0">过期时间被统一成固定的 10 分钟，没有随机抖动；同一</tspan><tspan x="1090" dy="29.7">批写入的热点键在同一秒失效，请求全部穿透到数据库。</tspan><tspan x="1090" dy="29.7">连接池上限 200，被打满后下单接口超时。</tspan></text>
<text x="1090" y="600" font-family="'Noto Serif CJK SC', serif" font-size="24" font-weight="900" fill="#141414">改进项</text>
<line x1="1090" y1="616" x2="1540" y2="616" stroke="#141414" stroke-width="1.5"/>
<text x="1090" y="652" font-family="'Noto Serif CJK SC', serif" font-size="18" font-weight="700" fill="#141414">过期时间加 ±20% 随机抖动</text>
<text x="1090" y="676" font-family="'Noto Serif CJK SC', serif" font-size="15" fill="#555555">负责：缓存组　截止：10 月 23 日</text>
<line x1="1090" y1="692" x2="1540" y2="692" stroke="#141414" stroke-width="0.6"/>
<text x="1090" y="716" font-family="'Noto Serif CJK SC', serif" font-size="18" font-weight="700" fill="#141414">配置发布接入灰度和自动回滚</text>
<text x="1090" y="740" font-family="'Noto Serif CJK SC', serif" font-size="15" fill="#555555">负责：平台组　截止：11 月 6 日</text>
<line x1="1090" y1="756" x2="1540" y2="756" stroke="#141414" stroke-width="0.6"/>
<text x="1090" y="780" font-family="'Noto Serif CJK SC', serif" font-size="18" font-weight="700" fill="#141414">连接池使用率超过 80% 告警</text>
<text x="1090" y="804" font-family="'Noto Serif CJK SC', serif" font-size="15" fill="#555555">负责：DBA　截止：10 月 21 日</text>
<line x1="1090" y1="820" x2="1540" y2="820" stroke="#141414" stroke-width="0.6"/>
<text x="1090" y="844" font-family="'Noto Serif CJK SC', serif" font-size="18" font-weight="700" fill="#141414">热点键提前续期</text>
<text x="1090" y="868" font-family="'Noto Serif CJK SC', serif" font-size="15" fill="#555555">负责：订单组　截止：10 月 30 日</text>
<line x1="1090" y1="884" x2="1540" y2="884" stroke="#141414" stroke-width="0.6"/>
</g>
