<text x="470" y="798" font-family="'Noto Serif CJK SC', serif" font-size="18" fill="#141414"><tspan x="470" dy="0">14:12 至 14:59 共 47 分钟，约 11,400 笔下单失败，占这段时间下单</tspan><tspan x="470" dy="29.7">量的 22%。支付和物流没有受到影响。</tspan></text>
