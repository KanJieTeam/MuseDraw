<svg data-theme="newsprint" xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="1600" height="1000" viewBox="0 0 1600 1000">
<title>年、月、日</title>
<defs><pattern id="ht" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><circle cx="3" cy="3" r="1.6" fill="#141414"/></pattern></defs>
<g id="layer1" inkscape:groupmode="layer" inkscape:label="背景">
<rect x="0" y="0" width="1600" height="1000" fill="#ECE9E2"/>
</g>
<g id="layer2" inkscape:groupmode="layer" inkscape:label="报头">
<text x="800" y="104" font-family="'Noto Serif CJK SC', serif" font-size="70" font-weight="900" fill="#141414" text-anchor="middle" letter-spacing="12">数学周报</text>
<line x1="60" y1="126" x2="1540" y2="126" stroke="#141414" stroke-width="3"/>
<line x1="60" y1="133" x2="1540" y2="133" stroke="#141414" stroke-width="1"/>
<text x="60" y="158" font-family="'Noto Serif CJK SC', serif" font-size="17" fill="#141414">2026 年 10 月 26 日　星期一</text>
<text x="800" y="158" font-family="'Noto Serif CJK SC', serif" font-size="17" font-weight="700" fill="#141414" text-anchor="middle">三年级　年、月、日</text>
<text x="1540" y="158" font-family="'Noto Serif CJK SC', serif" font-size="17" fill="#141414" text-anchor="end">今天是今年的第 299 天</text>
<line x1="60" y1="172" x2="1540" y2="172" stroke="#141414" stroke-width="1"/>
</g>
<g id="layer3" inkscape:groupmode="layer" inkscape:label="头条">
<text x="800" y="248" font-family="'Noto Serif CJK SC', serif" font-size="58" font-weight="900" fill="#141414" text-anchor="middle">平年 365 天，闰年 366 天</text>
<text x="800" y="292" font-family="'Noto Serif CJK SC', serif" font-size="21" fill="#555555" text-anchor="middle">差别全在二月：平年二月 28 天，闰年二月 29 天</text>
<line x1="60" y1="318" x2="1540" y2="318" stroke="#141414" stroke-width="1.5"/>
<line x1="760" y1="340" x2="760" y2="960" stroke="#141414" stroke-width="0.8"/>
<line x1="1160" y1="340" x2="1160" y2="960" stroke="#141414" stroke-width="0.8"/>
</g>
<g id="layer4" inkscape:groupmode="layer" inkscape:label="十二个月">
<text x="60" y="368" font-family="'Noto Serif CJK SC', serif" font-size="24" font-weight="900" fill="#141414">2026 年各月天数</text>
<text x="110" y="424" font-family="'Noto Serif CJK SC', serif" font-size="18" font-weight="700" fill="#141414" text-anchor="end">1 月</text>
<rect x="130" y="406" width="558" height="24" fill="#141414"/>
<text x="700" y="425" font-family="'Noto Serif CJK SC', serif" font-size="17" fill="#141414">31 天</text>
<text x="110" y="468" font-family="'Noto Serif CJK SC', serif" font-size="18" font-weight="700" fill="#141414" text-anchor="end">2 月</text>
<rect x="130" y="450" width="504" height="24" fill="url(#ht)"/>
<text x="646" y="469" font-family="'Noto Serif CJK SC', serif" font-size="17" fill="#141414">28 天</text>
<text x="110" y="512" font-family="'Noto Serif CJK SC', serif" font-size="18" font-weight="700" fill="#141414" text-anchor="end">3 月</text>
<rect x="130" y="494" width="558" height="24" fill="#141414"/>
<text x="700" y="513" font-family="'Noto Serif CJK SC', serif" font-size="17" fill="#141414">31 天</text>
<text x="110" y="556" font-family="'Noto Serif CJK SC', serif" font-size="18" font-weight="700" fill="#141414" text-anchor="end">4 月</text>
<rect x="130" y="538" width="540" height="24" fill="#8C8A84"/>
<text x="682" y="557" font-family="'Noto Serif CJK SC', serif" font-size="17" fill="#141414">30 天</text>
<text x="110" y="600" font-family="'Noto Serif CJK SC', serif" font-size="18" font-weight="700" fill="#141414" text-anchor="end">5 月</text>
<rect x="130" y="582" width="558" height="24" fill="#141414"/>
<text x="700" y="601" font-family="'Noto Serif CJK SC', serif" font-size="17" fill="#141414">31 天</text>
<text x="110" y="644" font-family="'Noto Serif CJK SC', serif" font-size="18" font-weight="700" fill="#141414" text-anchor="end">6 月</text>
<rect x="130" y="626" width="540" height="24" fill="#8C8A84"/>
<text x="682" y="645" font-family="'Noto Serif CJK SC', serif" font-size="17" fill="#141414">30 天</text>
<text x="110" y="688" font-family="'Noto Serif CJK SC', serif" font-size="18" font-weight="700" fill="#141414" text-anchor="end">7 月</text>
<rect x="130" y="670" width="558" height="24" fill="#141414"/>
<text x="700" y="689" font-family="'Noto Serif CJK SC', serif" font-size="17" fill="#141414">31 天</text>
<text x="110" y="732" font-family="'Noto Serif CJK SC', serif" font-size="18" font-weight="700" fill="#141414" text-anchor="end">8 月</text>
<rect x="130" y="714" width="558" height="24" fill="#141414"/>
<text x="700" y="733" font-family="'Noto Serif CJK SC', serif" font-size="17" fill="#141414">31 天</text>
<text x="110" y="776" font-family="'Noto Serif CJK SC', serif" font-size="18" font-weight="700" fill="#141414" text-anchor="end">9 月</text>
<rect x="130" y="758" width="540" height="24" fill="#8C8A84"/>
<text x="682" y="777" font-family="'Noto Serif CJK SC', serif" font-size="17" fill="#141414">30 天</text>
<text x="110" y="820" font-family="'Noto Serif CJK SC', serif" font-size="18" font-weight="700" fill="#141414" text-anchor="end">10 月</text>
<rect x="130" y="802" width="558" height="24" fill="#141414"/>
<text x="700" y="821" font-family="'Noto Serif CJK SC', serif" font-size="17" fill="#141414">31 天</text>
<text x="110" y="864" font-family="'Noto Serif CJK SC', serif" font-size="18" font-weight="700" fill="#141414" text-anchor="end">11 月</text>
<rect x="130" y="846" width="540" height="24" fill="#8C8A84"/>
<text x="682" y="865" font-family="'Noto Serif CJK SC', serif" font-size="17" fill="#141414">30 天</text>
<text x="110" y="908" font-family="'Noto Serif CJK SC', serif" font-size="18" font-weight="700" fill="#141414" text-anchor="end">12 月</text>
<rect x="130" y="890" width="558" height="24" fill="#141414"/>
<text x="700" y="909" font-family="'Noto Serif CJK SC', serif" font-size="17" fill="#141414">31 天</text>
</g>
<g id="layer5" inkscape:groupmode="layer" inkscape:label="大月小月">
<text x="790" y="368" font-family="'Noto Serif CJK SC', serif" font-size="24" font-weight="900" fill="#141414">大月和小月</text>
<text x="790" y="406" font-family="'Noto Serif CJK SC', serif" font-size="19" fill="#141414"><tspan x="790" dy="0">大月 31 天：1、3、5、7、8、10、12</tspan><tspan x="790" dy="30.4">月，共 7 个。</tspan></text>
<text x="790" y="486" font-family="'Noto Serif CJK SC', serif" font-size="19" fill="#141414"><tspan x="790" dy="0">小月 30 天：4、6、9、11 月，共 4 个。</tspan></text>
<text x="790" y="566" font-family="'Noto Serif CJK SC', serif" font-size="19" fill="#141414"><tspan x="790" dy="0">二月既不是大月也不是小月。</tspan></text>
<text x="790" y="650" font-family="'Noto Serif CJK SC', serif" font-size="24" font-weight="900" fill="#141414">一年有多少天</text>
<text x="790" y="690" font-family="'Noto Serif CJK SC', serif" font-size="22" font-weight="700" fill="#141414">31 × 7 + 30 × 4 + 28</text>
<text x="790" y="726" font-family="'Noto Serif CJK SC', serif" font-size="22" font-weight="700" fill="#141414">= 217 + 120 + 28 = 365（天）</text>
<text x="790" y="800" font-family="'Noto Serif CJK SC', serif" font-size="18" font-weight="700" fill="#141414">图例</text>
<rect x="790" y="818" width="26" height="18" fill="#141414"/>
<text x="824" y="833" font-family="'Noto Serif CJK SC', serif" font-size="16" fill="#141414">大月</text>
<rect x="910" y="818" width="26" height="18" fill="#8C8A84"/>
<text x="944" y="833" font-family="'Noto Serif CJK SC', serif" font-size="16" fill="#141414">小月</text>
<rect x="1030" y="818" width="26" height="18" fill="url(#ht)"/>
<text x="1064" y="833" font-family="'Noto Serif CJK SC', serif" font-size="16" fill="#141414">二月</text>
</g>
<g id="layer6" inkscape:groupmode="layer" inkscape:label="闰年">
<text x="1190" y="368" font-family="'Noto Serif CJK SC', serif" font-size="24" font-weight="900" fill="#141414">怎样判断闰年</text>
<text x="1190" y="410" font-family="'Noto Serif CJK SC', serif" font-size="26" font-weight="700" fill="#141414"><tspan x="1190" dy="0">四年一闰，</tspan><tspan x="1190" dy="39">百年不闰，</tspan><tspan x="1190" dy="39">四百年再闰。</tspan></text>
<text x="1190" y="540" font-family="'Noto Serif CJK SC', serif" font-size="17" fill="#555555"><tspan x="1190" dy="0">公历年份是 4 的倍数的，一般是闰年；整百</tspan><tspan x="1190" dy="27.2">年份必须是 400 的倍数才是闰年。</tspan></text>
<line x1="1190" y1="630" x2="1540" y2="630" stroke="#141414" stroke-width="1.5"/>
<text x="1190" y="666" font-family="'Noto Serif CJK SC', serif" font-size="20" font-weight="700" fill="#141414">1900 年</text>
<text x="1540" y="666" font-family="'Noto Serif CJK SC', serif" font-size="20" fill="#141414" text-anchor="end">平年</text>
<line x1="1190" y1="682" x2="1540" y2="682" stroke="#141414" stroke-width="0.6"/>
<text x="1190" y="718" font-family="'Noto Serif CJK SC', serif" font-size="20" font-weight="700" fill="#141414">2000 年</text>
<text x="1540" y="718" font-family="'Noto Serif CJK SC', serif" font-size="20" font-weight="900" fill="#141414" text-anchor="end">闰年</text>
<line x1="1190" y1="734" x2="1540" y2="734" stroke="#141414" stroke-width="0.6"/>
<text x="1190" y="770" font-family="'Noto Serif CJK SC', serif" font-size="20" font-weight="700" fill="#141414">2024 年</text>
<text x="1540" y="770" font-family="'Noto Serif CJK SC', serif" font-size="20" font-weight="900" fill="#141414" text-anchor="end">闰年</text>
<line x1="1190" y1="786" x2="1540" y2="786" stroke="#141414" stroke-width="0.6"/>
<text x="1190" y="822" font-family="'Noto Serif CJK SC', serif" font-size="20" font-weight="700" fill="#141414">2026 年</text>
<text x="1540" y="822" font-family="'Noto Serif CJK SC', serif" font-size="20" fill="#141414" text-anchor="end">平年</text>
<line x1="1190" y1="838" x2="1540" y2="838" stroke="#141414" stroke-width="0.6"/>
<text x="1190" y="874" font-family="'Noto Serif CJK SC', serif" font-size="20" font-weight="700" fill="#141414">2100 年</text>
<text x="1540" y="874" font-family="'Noto Serif CJK SC', serif" font-size="20" fill="#141414" text-anchor="end">平年</text>
<line x1="1190" y1="890" x2="1540" y2="890" stroke="#141414" stroke-width="0.6"/>
</g>
</svg>