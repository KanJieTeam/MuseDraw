<g id="layer6" inkscape:groupmode="layer" inkscape:label="发现">
<rect x="60" y="900" width="1480" height="72" fill="#FF48B0" style="mix-blend-mode:multiply" opacity="0.9"/>
<rect x="65" y="904" width="1480" height="72" fill="none" stroke="#0078BF" stroke-width="2.5" style="mix-blend-mode:multiply"/>
<text x="84" y="934" font-family="'Noto Sans CJK SC', sans-serif" font-size="18" font-weight="900" fill="#0078BF">问卷发现：64 位新员工中有 21 位（33%）报到当天系统权限没有全部开通，第一天和第 10 天的感受低谷都与此有关。</text>
<text x="84" y="960" font-family="'Noto Sans CJK SC', sans-serif" font-size="17" fill="#0078BF">改进：IT 在报到前 3 天完成开通并让导师代为验证；第 10 天前做一次权限清单核对。</text>
