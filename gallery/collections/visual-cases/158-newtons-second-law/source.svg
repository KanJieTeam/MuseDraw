<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="1600" height="1000" viewBox="0 0 1600 1000">
<title>牛顿第二定律</title>
<defs><linearGradient id="g1" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7CF7D4" stop-opacity="1"/><stop offset="1" stop-color="#9AA8FF" stop-opacity="1"/></linearGradient></defs>
<g id="layer1" inkscape:groupmode="layer" inkscape:label="背景">
<rect x="0" y="0" width="1600" height="1000" fill="#000000"/>
</g>
<g id="layer2" inkscape:groupmode="layer" inkscape:label="标题">
<text x="100" y="120" font-family="'Noto Sans CJK SC', sans-serif" font-size="56" font-weight="700" fill="#FFFFFF">牛顿第二定律</text>
<text x="100" y="164" font-family="'Noto Sans CJK SC', sans-serif" font-size="22" fill="#8E8E93">物体的加速度，与所受合力成正比，与质量成反比</text>
</g>
<g id="layer3" inkscape:groupmode="layer" inkscape:label="公式">
<text x="100" y="360" font-family="'Noto Sans CJK SC', sans-serif" font-size="170" font-weight="800" fill="url(#g1)">F = ma</text>
<text x="104" y="420" font-family="'Noto Sans CJK SC', sans-serif" font-size="22" fill="#8E8E93">F 合力（N）　m 质量（kg）　a 加速度（m/s²）</text>
</g>
<g id="layer4" inkscape:groupmode="layer" inkscape:label="例题">
<rect x="100" y="480" width="580" height="240" rx="20" fill="#1C1C1E"/>
<rect x="150" y="600" width="140" height="70" rx="10" fill="#3A3A3C"/>
<text x="220" y="644" font-family="'Noto Sans CJK SC', sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">2 kg</text>
<line x1="130" y1="670" x2="640" y2="670" stroke="#48484A" stroke-width="2"/>
<line x1="290" y1="635" x2="427.2" y2="635" stroke="#7CF7D4" stroke-width="4" stroke-linecap="round"/>
<path d="M440.0,635.0 L425.4,641.5 L425.4,628.5 Z" fill="#7CF7D4"/>
<text x="450" y="642" font-family="'Noto Sans CJK SC', sans-serif" font-size="18" fill="#FFFFFF">拉力 10 N</text>
<line x1="150" y1="660" x2="119.6" y2="660" stroke="#FF8A65" stroke-width="3" stroke-linecap="round"/>
<path d="M110.0,660.0 L121.0,655.1 L121.0,664.9 Z" fill="#FF8A65"/>
<text x="150" y="590" font-family="'Noto Sans CJK SC', sans-serif" font-size="16" fill="#FF8A65">摩擦力 2 N</text>
<text x="130" y="530" font-family="'Noto Sans CJK SC', sans-serif" font-size="22" font-weight="600" fill="#FFFFFF">合力 = 10 − 2 = 8 N</text>
<text x="130" y="566" font-family="'Noto Sans CJK SC', sans-serif" font-size="26" font-weight="800" fill="url(#g1)">a = 8 ÷ 2 = 4 m/s²</text>
</g>
<g id="layer5" inkscape:groupmode="layer" inkscape:label="图像">
<line x1="820" y1="720" x2="1480" y2="720" stroke="#1C1C1E" stroke-width="1"/>
<text x="806" y="726" font-family="'Noto Sans CJK SC', sans-serif" font-size="16" fill="#8E8E93" text-anchor="end">0</text>
<line x1="820" y1="600" x2="1480" y2="600" stroke="#1C1C1E" stroke-width="1"/>
<text x="806" y="606" font-family="'Noto Sans CJK SC', sans-serif" font-size="16" fill="#8E8E93" text-anchor="end">5</text>
<line x1="820" y1="480" x2="1480" y2="480" stroke="#1C1C1E" stroke-width="1"/>
<text x="806" y="486" font-family="'Noto Sans CJK SC', sans-serif" font-size="16" fill="#8E8E93" text-anchor="end">10</text>
<line x1="820" y1="360" x2="1480" y2="360" stroke="#1C1C1E" stroke-width="1"/>
<text x="806" y="366" font-family="'Noto Sans CJK SC', sans-serif" font-size="16" fill="#8E8E93" text-anchor="end">15</text>
<line x1="820" y1="240" x2="1480" y2="240" stroke="#1C1C1E" stroke-width="1"/>
<text x="806" y="246" font-family="'Noto Sans CJK SC', sans-serif" font-size="16" fill="#8E8E93" text-anchor="end">20</text>
<text x="820" y="750" font-family="'Noto Sans CJK SC', sans-serif" font-size="16" fill="#8E8E93" text-anchor="middle">0</text>
<text x="952" y="750" font-family="'Noto Sans CJK SC', sans-serif" font-size="16" fill="#8E8E93" text-anchor="middle">2</text>
<text x="1084" y="750" font-family="'Noto Sans CJK SC', sans-serif" font-size="16" fill="#8E8E93" text-anchor="middle">4</text>
<text x="1216" y="750" font-family="'Noto Sans CJK SC', sans-serif" font-size="16" fill="#8E8E93" text-anchor="middle">6</text>
<text x="1348" y="750" font-family="'Noto Sans CJK SC', sans-serif" font-size="16" fill="#8E8E93" text-anchor="middle">8</text>
<text x="1480" y="750" font-family="'Noto Sans CJK SC', sans-serif" font-size="16" fill="#8E8E93" text-anchor="middle">10</text>
<text x="1480" y="782" font-family="'Noto Sans CJK SC', sans-serif" font-size="16" fill="#8E8E93" text-anchor="end">合力 F / N</text>
<text x="820" y="216" font-family="'Noto Sans CJK SC', sans-serif" font-size="16" fill="#8E8E93">加速度 a / (m/s²)</text>
<line x1="820" y1="720" x2="1480" y2="240" stroke="#7CF7D4" stroke-width="4" stroke-linecap="round"/>
<text x="1490" y="246" font-family="'Noto Sans CJK SC', sans-serif" font-size="18" font-weight="700" fill="#7CF7D4">m = 0.5 kg</text>
<line x1="820" y1="720" x2="1480" y2="480" stroke="#9AA8FF" stroke-width="4" stroke-linecap="round"/>
<text x="1490" y="486" font-family="'Noto Sans CJK SC', sans-serif" font-size="18" font-weight="700" fill="#9AA8FF">m = 1 kg</text>
<line x1="820" y1="720" x2="1480" y2="600" stroke="#8E8E93" stroke-width="4" stroke-linecap="round"/>
<text x="1490" y="606" font-family="'Noto Sans CJK SC', sans-serif" font-size="18" font-weight="700" fill="#8E8E93">m = 2 kg</text>
</g>
<g id="layer6" inkscape:groupmode="layer" inkscape:label="参数">
<text x="100" y="880" font-family="'Noto Sans CJK SC', sans-serif" font-size="40" font-weight="600" fill="#FFFFFF">1 N</text>
<text x="100" y="920" font-family="'Noto Sans CJK SC', sans-serif" font-size="17" fill="#8E8E93"><tspan x="100" dy="0">使 1 kg 物体产生 1 m/s² 加速度的力</tspan></text>
<text x="460" y="880" font-family="'Noto Sans CJK SC', sans-serif" font-size="40" font-weight="600" fill="#FFFFFF">a ∝ F</text>
<text x="460" y="920" font-family="'Noto Sans CJK SC', sans-serif" font-size="17" fill="#8E8E93"><tspan x="460" dy="0">质量一定</tspan></text>
<text x="820" y="880" font-family="'Noto Sans CJK SC', sans-serif" font-size="40" font-weight="600" fill="#FFFFFF">a ∝ 1/m</text>
<text x="820" y="920" font-family="'Noto Sans CJK SC', sans-serif" font-size="17" fill="#8E8E93"><tspan x="820" dy="0">合力一定</tspan></text>
<text x="1180" y="880" font-family="'Noto Sans CJK SC', sans-serif" font-size="40" font-weight="600" fill="#FFFFFF">同向</text>
<text x="1180" y="920" font-family="'Noto Sans CJK SC', sans-serif" font-size="17" fill="#8E8E93"><tspan x="1180" dy="0">a 与合力方向相同</tspan></text>
</g>
</svg>