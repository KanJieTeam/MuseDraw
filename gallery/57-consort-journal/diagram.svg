ntion (n = 2)</tspan></text></g><g id="n1" data-md="node" data-box="180,810,500,70" data-shape="box" data-label="inside"><rect x="180" y="810" width="500" height="70" rx="4" fill="#E9F4EB" stroke="#3E9651" stroke-width="1"/><text class="md-label" x="192" y="840.73" font-family="Inter, Noto Sans SC, sans-serif" font-size="14" font-weight="500" fill="#1E4A28" text-anchor="start"><tspan x="192" >Analysed (n = 113)</tspan><tspan x="192" dy="17.5">· Excluded from analysis (n = 7; no outcome data)</tspan></text></g><g id="n2" data-md="node" data-box="780,810,500,70" data-shape="box" data-label="inside"><rect x="780" y="810" width="500" height="70" rx="4" fill="#E9F4EB" stroke="#3E9651" stroke-width="1"/><text class="md-label" x="792" y="840.73" font-family="Inter, Noto Sans SC, sans-serif" font-size="14" font-weight="500" fill="#1E4A28" text-anchor="start"><tspan x="792" >Analysed (n = 111)</tspan><tspan x="792" dy="17.5">· Excluded from analysis (n = 9; no outcome data)</tspan></text></g><g id="tEnrolment" data-md="node" data-box="24,192,112,30" data-shape="box" data-label="inside"><rect x="24" y="192" width="112" height="30" rx="15" fill="#2F6DB5" stroke="#2F6DB5" stroke-width="1"/><text class="md-label" x="80" y="211.16" font-family="Inter, Noto Sans SC, sans-serif" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle"><tspan x="80" >Enrolment</tspan></text></g><g id="tAllocation" data-md="node" data-box="24,512,112,30" data-shape="box" data-label="inside"><rect x="24" y="512" width="112" height="30" rx="15" fill="#2F6DB5" stroke="#2F6DB5" stroke-width="1"/><text class="md-label" x="80" y="531.16" font-family="Inter, Noto Sans SC, sans-serif" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle"><tspan x="80" >Allocation</tspan></text></g><g id="tFollow-up" data-md="node" data-box="24,672,112,30" data-shape="box" data-label="inside"><rect x="24" y="672" width="112" height="30" rx="15" fill="#2F6DB5" stroke="#2F6DB5" stroke-width="1"/><text