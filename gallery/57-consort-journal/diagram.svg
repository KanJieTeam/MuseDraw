 L1033.85 651 Z" fill="#4A4F57"/></g><g id="edge-f1-n1" data-md="edge"><path d="M430 746 L430 802.4" fill="none" stroke="#4A4F57" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M430 808 L426.15 801 L433.85 801 Z" fill="#4A4F57"/></g><g id="edge-f2-n2" data-md="edge"><path d="M1030 746 L1030 802.4" fill="none" stroke="#4A4F57" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M1030 808 L1026.15 801 L1033.85 801 Z" fill="#4A4F57"/></g></g><g id="nodes"><g id="elig" data-md="node" data-box="490,180,420,56" data-shape="box" data-label="inside"><rect x="490" y="180" width="420" height="56" rx="4" fill="#FFFFFF" stroke="#8A9099" stroke-width="1"/><text class="md-label" x="502" y="212.48" font-family="Inter, Noto Sans SC, sans-serif" font-size="14" font-weight="500" fill="#1B1B1B" text-anchor="start"><tspan x="502" >Assessed for eligibility (n = 412)</tspan></text></g><g id="exc" data-md="node" data-box="1000,240,400,116" data-shape="box" data-label="inside"><rect x="1000" y="240" width="400" height="116" rx="4" fill="#F2F3F5" stroke="#B6BBC2" stroke-width="1"/><text class="md-label" x="1012" y="276.23" font-family="Inter, Noto Sans SC, sans-serif" font-size="14" font-weight="500" fill="#1B1B1B" text-anchor="start"><tspan x="1012" >Excluded (n = 172)</tspan><tspan x="1012" dy="17.5">· Not meeting inclusion criteria (n = 118)</tspan><tspan x="1012" dy="17.5">· Declined to participate (n = 41)</tspan><tspan x="1012" dy="17.5">· Other reasons (n = 13)</tspan></text></g><g id="rand" data-md="node" data-box="490,380,420,56" data-shape="box" data-label="inside"><rect x="490" y="380" width="420" height="56" rx="4" fill="#E8F0FA" stroke="#2F6DB5" stroke-width="1"/><text class="md-label" x="502" y="412.48" font-family="Inter, Noto Sans SC, sans-serif" font-size="14" font-weight="500" fill="#173A63" text-anchor="start"><tspan x="502" >Randomised (n = 240)</tspan></text></g><g id="a1" data-md="node" data-box="180,500,500,100" dat