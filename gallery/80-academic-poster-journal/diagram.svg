<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 850" width="1680" height="850" role="img" aria-labelledby="md-title md-desc" data-theme="journal"><title id="md-title">分级夜间巡视降低老年住院患者跌倒率</title><desc id="md-desc">作者 A，作者 B，作者 C ｜ 某三甲医院神经内科 ｜ 2026 年全国护理学术年会。数据为示例。</desc><defs></defs><g id="background"><rect id="canvas" width="1680" height="850" fill="#FFFFFF"/></g><g id="zones"><g id="bar-1" data-md="bar"><rect x="920" y="320" width="100" height="270" rx="2" fill="#B9C3CF"/></g><g id="bar-2" data-md="bar"><rect x="1070" y="455" width="100" height="135" rx="2" fill="#2F6DB5"/></g><path id="line-1" d="M890 590 L1200 590" fill="none" stroke="#1B1B1B" stroke-width="1.5" stroke-linecap="round"/></g><g id="edges"></g><g id="nodes"><g id="h0" data-md="node" data-box="60,180,360,52" data-shape="box" data-label="inside"><rect x="60" y="180" width="360" height="52" rx="4" fill="#F2F3F5" stroke="#B6BBC2" stroke-width="1"/><text class="md-label" x="72" y="211.76" font-family="Inter, Noto Sans SC, sans-serif" font-size="18" font-weight="600" fill="#1B1B1B" text-anchor="start"><tspan x="72" >背景与问题</tspan></text></g><g id="h1" data-md="node" data-box="460,180,360,52" data-shape="box" data-label="inside"><rect x="460" y="180" width="360" height="52" rx="4" fill="#F2F3F5" stroke="#B6BBC2" stroke-width="1"/><text class="md-label" x="472" y="211.76" font-family="Inter, Noto Sans SC, sans-serif" font-size="18" font-weight="600" fill="#1B1B1B" text-anchor="start"><tspan x="472" >方法</tspan></text></g><g id="h2" data-md="node" data-box="860,180,360,52" data-shape="box" data-label="inside"><rect x="860" y="180" width="360" height="52" rx="4" fill="#1B1B1B" stroke="#1B1B1B" stroke-width="1"/><text class="md-label" x="872" y="211.76" font-family="Inter, Noto Sans SC, sans-serif" font-size="18" font-weight="600" fill="#FFFFFF" text-anchor="start"><tspan x="872" >结果</tspan></text></g><g id="h3" data-md="node" data-box="1260,180,360,52" data-shape="box" data-label="inside"><rect x="1260" y="180" width="360" height="52" rx="4" fill="#F2F3F5" stroke="#B6BBC2" stroke-width="1"/><text class="md-label" x="1272" y="211.76" font-family="Inter, Noto Sans SC, sans-serif" font-size="18" font-weight="600" fill="#1B1B1B" text-anchor="start"><tspan x="1272" >结论</tspan></text></g></g><g id="edge-labels"></g><g id="notes"></g><g id="legend"></g><g id="texts"><text x="64" y="280" font-family="Inter, Noto Sans SC, sans-serif" font-size="30" font-weight="700" fill="#2F6DB5" text-anchor="start"><tspan x="64" >1</tspan></text><text x="104" y="266" font-family="Inter, Noto Sans SC, sans-serif" font-size="16" font-weight="400" fill="#1B1B1B" text-anchor="start"><tspan x="104" >我国 60 岁以上住院患者跌倒发生率</tspan><tspan x="104" dy="23.2">0.5–1.8‰</tspan></text><text x="64" y="372" font-family="Inter, Noto Sans SC, sans-serif" font-size="30" font-weight="700" fill="#2F6DB5" text-anchor="start"><tspan x="64" >2</tspan></text><text x="104" y="358" font-family="Inter, Noto Sans SC, sans-serif" font-size="16" font-weight="400" fill="#1B1B1B" text-anchor="start"><tspan x="104" >夜间如厕跌倒占 60% 以上</tspan></text><text x="64" y="464" font-family="Inter, Noto Sans SC, sans-serif" font-size="30" font-weight="700" fill="#2F6DB5" text-anchor="start"><tspan x="64" >3</tspan></text><text x="104" y="450" font-family="Inter, Noto Sans SC, sans-serif" font-size="16" font-weight="400" fill="#1B1B1B" text-anchor="start"><tspan x="104" >现有巡视制度缺少分级</tspan></text><text x="464" y="280" font-family="Inter, Noto Sans SC, sans-serif" font-size="30" font-weight="700" fill="#2F6DB5" text-anchor="start"><tspan x="464" >1</tspan></text><text x="504" y="266" font-family="Inter, Noto Sans SC, sans-serif" font-size="16" font-weight="400" fill="#1B1B1B" text-anchor="start"><tspan x="504" >前后对照研究，2026 年 1–9 月</tspan></text><text x="464" y="372" font-family="Inter, Noto Sans SC, sans-serif" font-size="30" font-weight="700" fill="#2F6DB5" text-anchor="start"><tspan x="464" >2</tspan></text><text x="504" y="358" font-family="Inter, Noto Sans SC, sans-serif" font-size="16" font-weight="400" fill="#1B1B1B" text-anchor="start"><tspan x="504" >干预：Morse ≥ 45 分夜间每 2 小时巡视</tspan></text><text x="464" y="464" font-family="Inter, Noto Sans SC, sans-serif" font-size="30" font-weight="700" fill="#2F6DB5" text-anchor="start"><tspan x="464" >3</tspan></text><text x="504" y="450" font-family="Inter, Noto Sans SC, sans-serif" font-size="16" font-weight="400" fill="#1B1B1B" text-anchor="start"><tspan x="504" >主要结局：每千住院日跌倒次数</tspan></text><text x="1264" y="280" font-family="Inter, Noto Sans SC, sans-serif" font-size="30" font-weight="700" fill="#2F6DB5" text-anchor="start"><tspan x="1264" >1</tspan></text><text x="1304" y="266" font-family="Inter, Noto Sans SC, sans-serif" font-size="16" font-weight="400" fill="#1B1B1B" text-anchor="start"><tspan x="1304" >分级巡视可将夜间跌倒减半</tspan></text><text x="1264" y="372" font-family="Inter, Noto Sans SC, sans-serif" font-size="30" font-weight="700" fill="#2F6DB5" text-anchor="start"><tspan x="1264" >2</tspan></text><text x="1304" y="358" font-family="Inter, Noto Sans SC, sans-serif" font-size="16" font-weight="400" fill="#1B1B1B" text-anchor="start"><tspan x="1304" >护理工时增加 6%，可接受</tspan></text><text x="1264" y="464" font-family="Inter, Noto Sans SC, sans-serif" font-size="30" font-weight="700" fill="#2F6DB5" text-anchor="start"><tspan x="1264" >3</tspan></text><text x="1304" y="450" font-family="Inter, Noto Sans SC, sans-serif" font-size="16" font-weight="400" fill="#1B1B1B" text-anchor="start"><tspan x="1304" >建议纳入科室标准</tspan></text><text x="970" y="310" font-family="Inter, Noto Sans SC, sans-serif" font-size="22" font-weight="700" fill="#1B1B1B" text-anchor="middle"><tspan x="970" >1.8‰</tspan></text><text x="970" y="618" font-family="Inter, Noto Sans SC, sans-serif" font-size="15" font-weight="400" fill="#5F6368" text-anchor="middle"><tspan x="970" >干预前</tspan></text><text x="1120" y="445" font-family="Inter, Noto Sans SC, sans-serif" font-size="22" font-weight="700" fill="#1B1B1B" text-anchor="middle"><tspan x="1120" >0.9‰</tspan></text><text x="1120" y="618" font-family="Inter, Noto Sans SC, sans-serif" font-size="15" font-weight="400" fill="#5F6368" text-anchor="middle"><tspan x="1120" >干预后</tspan></text><text x="860" y="270" font-family="Inter, Noto Sans SC, sans-serif" font-size="14" font-weight="400" fill="#5F6368" text-anchor="start"><tspan x="860" >每千住院日跌倒次数</tspan></text><text x="860" y="660" font-family="Inter, Noto Sans SC, sans-serif" font-size="14" font-weight="400" fill="#1B1B1B" text-anchor="start"><tspan x="860" >P = 0.004，率比 0.50（95% CI 0.31–0.81）</tspan></text><text x="60" y="770" font-family="Inter, Noto Sans SC, sans-serif" font-size="14" font-weight="400" fill="#5F6368" text-anchor="start"><tspan x="60" >一张学术海报只讲一个结论：四栏从左到右读，结果栏用深色标题突出，其余文字不超过三条。</tspan></text><text x="60" y="600" font-family="Inter, Noto Sans SC, sans-serif" font-size="64" font-weight="700" fill="#1B1B1B" text-anchor="start"><tspan x="60" >23 起</tspan></text><text x="60" y="636" font-family="Inter, Noto Sans SC, sans-serif" font-size="14" font-weight="400" fill="#5F6368" text-anchor="start"><tspan x="60" >干预前半年的跌倒事件</tspan></text><text x="460" y="600" font-family="Inter, Noto Sans SC, sans-serif" font-size="64" font-weight="700" fill="#1B1B1B" text-anchor="start"><tspan x="460" >412 例</tspan></text><text x="460" y="636" font-family="Inter, Noto Sans SC, sans-serif" font-size="14" font-weight="400" fill="#5F6368" text-anchor="start"><tspan x="460" >纳入分析的高危患者</tspan></text><text x="1260" y="600" font-family="Inter, Noto Sans SC, sans-serif" font-size="64" font-weight="700" fill="#1B1B1B" text-anchor="start"><tspan x="1260" >−50%</tspan></text><text x="1260" y="636" font-family="Inter, Noto Sans SC, sans-serif" font-size="14" font-weight="400" fill="#5F6368" text-anchor="start"><tspan x="1260" >夜间跌倒率下降</tspan></text></g><g id="header"><text x="56" y="74.92" font-family="Inter, Noto Sans SC, sans-serif" font-size="22" font-weight="700" fill="#1B1B1B" text-anchor="start"><tspan x="56" >分级夜间巡视降低老年住院患者跌倒率</tspan></text><text x="56" y="107.1" font-family="Inter, Noto Sans SC, sans-serif" font-size="15.1" font-weight="400" fill="#5F6368" text-anchor="start"><tspan x="56" >作者 A，作者 B，作者 C ｜ 某三甲医院神经内科 ｜ 2026 年全国护理学术年会。数据为示例。</tspan></text></g><g id="footer"><text x="1624" y="819.2" font-family="Inter, Noto Sans SC, sans-serif" font-size="10.5" font-weight="400" fill="#A0A4AA" text-anchor="end" letter-spacing="0.5"><tspan x="1624" >MuseDraw · Journal Figure</tspan></text></g></svg>
