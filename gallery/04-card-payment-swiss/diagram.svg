<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1640 1070" width="1640" height="1070" role="img" aria-labelledby="md-title md-desc" data-theme="swiss"><title id="md-title">How a card payment
is authorized</title><desc id="md-desc">From tap to “Paid”, only messages travel. Funds settle between banks later, in a nightly batch.</desc><defs></defs><g id="background"><rect id="canvas" width="1640" height="1070" fill="#F2F1EC"/></g><g id="zones"><g id="rule-auth" data-md="zone"><path d="M64 330H1576" stroke="#E3001B" stroke-width="3"/><text x="64" y="357" font-family="Space Mono, Noto Sans SC, monospace" font-size="13" font-weight="700" fill="#E3001B" text-anchor="start" letter-spacing="1"><tspan x="64" >AUTHORIZATION · REAL TIME</tspan></text></g><g id="rule-steps" data-md="zone"><path d="M64 700H1576" stroke="#0B0B0B" stroke-width="3"/><text x="64" y="727" font-family="Space Mono, Noto Sans SC, monospace" font-size="13" font-weight="700" fill="#0B0B0B" text-anchor="start" letter-spacing="1"><tspan x="64" >WHAT HAPPENS AT EACH STEP</tspan></text></g></g><g id="edges"><g id="edge-holder-merchant" data-md="edge"><path d="M264 437 L303.75 437" fill="none" stroke="#E3001B" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M323 437 L298.94 450.23 L298.94 423.77 Z" fill="#E3001B"/></g><g id="edge-merchant-gateway" data-md="edge"><path d="M527 437 L566.75 437" fill="none" stroke="#E3001B" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M586 437 L561.94 450.23 L561.94 423.77 Z" fill="#E3001B"/></g><g id="edge-gateway-acquirer" data-md="edge"><path d="M790 437 L829.75 437" fill="none" stroke="#E3001B" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M849 437 L824.94 450.23 L824.94 423.77 Z" fill="#E3001B"/></g><g id="edge-acquirer-network" data-md="edge"><path d="M1053 437 L1092.75 437" fill="none" stroke="#E3001B" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M1112 437 L1087.94 450.23 L1087.94 423.77 Z" fill="#E3001B"/></g><g id="edge-network-issuer" data-md="edge"><path d="M1316 437 L1356.75 437" fill="none" stroke="#E3001B" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M1376 437 L1351.94 450.23 L1351.94 423.77 Z" fill="#E3001B"/></g><g id="edge-issuer-network" data-md="edge"><path d="M1376 500 L1327 500" fill="none" stroke="#0B0B0B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1 6"/><path d="M1316 500 L1329.75 492.44 L1329.75 507.56 Z" fill="#0B0B0B"/></g><g id="edge-network-acquirer" data-md="edge"><path d="M1112 500 L1064 500" fill="none" stroke="#0B0B0B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1 6"/><path d="M1053 500 L1066.75 492.44 L1066.75 507.56 Z" fill="#0B0B0B"/></g><g id="edge-acquirer-gateway" data-md="edge"><path d="M849 500 L801 500" fill="none" stroke="#0B0B0B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1 6"/><path d="M790 500 L803.75 492.44 L803.75 507.56 Z" fill="#0B0B0B"/></g><g id="edge-gateway-merchant" data-md="edge"><path d="M586 500 L538 500" fill="none" stroke="#0B0B0B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1 6"/><path d="M527 500 L540.75 492.44 L540.75 507.56 Z" fill="#0B0B0B"/></g><g id="edge-merchant-holder" data-md="edge"><path d="M323 500 L275 500" fill="none" stroke="#0B0B0B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1 6"/><path d="M264 500 L277.75 492.44 L277.75 507.56 Z" fill="#0B0B0B"/></g><g id="edge-issuer-network-11" data-md="edge"><path d="M1478 546 L1478 610 L1272.8 610 L1272.8 554.8" fill="none" stroke="#5E5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5"/><path d="M1272.8 546 L1278.85 557 L1266.75 557 Z" fill="#5E5E5A"/></g><g id="edge-network-acquirer-12" data-md="edge"><path d="M1155.2 546 L1155.2 610 L951 610 L951 554.8" fill="none" stroke="#5E5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5"/><path d="M951 546 L957.05 557 L944.95 557 Z" fill="#5E5E5A"/></g><g id="edge-acquirer-merchant" data-md="edge"><path d="M921.6 546 L921.6 640 L425 640 L425 554.8" fill="none" stroke="#5E5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5"/><path d="M425 546 L431.05 557 L418.95 557 Z" fill="#5E5E5A"/></g></g><g id="nodes"><g id="holder" data-md="node" data-box="64,392,196,150" data-shape="box" data-label="inside"><rect x="64" y="392" width="196" height="150" rx="0" fill="#0B0B0B" stroke="none" stroke-width="0"/><g transform="translate(80 456) scale(0.9167)" fill="none" stroke="#FFFFFF" stroke-width="1.745" stroke-linecap="round" stroke-linejoin="round"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8z"/><path d="M4.5 20.5c1.2-3.6 4-5.5 7.5-5.5s6.3 1.9 7.5 5.5"/></g><text class="md-label" x="112" y="453.62" font-family="Archivo, Noto Sans SC, sans-serif" font-size="20.5" font-weight="800" fill="#FFFFFF" text-anchor="start"><tspan x="112" >Cardholder</tspan></text><text class="md-sub" x="112" y="475.29" font-family="Archivo, Noto Sans SC, sans-serif" font-size="14.6" font-weight="400" fill="#BDBDB8" text-anchor="start"><tspan x="112" >taps a card or</tspan><tspan x="112" dy="19.27">types the number</tspan></text></g><g id="merchant" data-md="node" data-box="327,392,196,150" data-shape="box" data-label="inside"><rect x="327" y="392" width="196" height="150" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0"/><rect x="327" y="392" width="196" height="5" fill="#0B0B0B"/><text class="md-label" x="343" y="442.35" font-family="Archivo, Noto Sans SC, sans-serif" font-size="20.5" font-weight="800" fill="#0B0B0B" text-anchor="start"><tspan x="343" >Merchant</tspan><tspan x="343" dy="22.55">checkout</tspan></text><text class="md-sub" x="343" y="486.56" font-family="Archivo, Noto Sans SC, sans-serif" font-size="14.6" font-weight="400" fill="#5E5E5A" text-anchor="start"><tspan x="343" >never stores the card</tspan><tspan x="343" dy="19.27">number</tspan></text></g><g id="gateway" data-md="node" data-box="590,392,196,150" data-shape="box" data-label="inside"><rect x="590" y="392" width="196" height="150" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0"/><rect x="590" y="392" width="196" height="5" fill="#0B0B0B"/><text class="md-label" x="606" y="442.35" font-family="Archivo, Noto Sans SC, sans-serif" font-size="20.5" font-weight="800" fill="#0B0B0B" text-anchor="start"><tspan x="606" >Payment</tspan><tspan x="606" dy="22.55">gateway</tspan></text><text class="md-sub" x="606" y="486.56" font-family="Archivo, Noto Sans SC, sans-serif" font-size="14.6" font-weight="400" fill="#5E5E5A" text-anchor="start"><tspan x="606" >tokenizes, adds 3-D</tspan><tspan x="606" dy="19.27">Secure</tspan></text></g><g id="acquirer" data-md="node" data-box="853,392,196,150" data-shape="box" data-label="inside"><rect x="853" y="392" width="196" height="150" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0"/><rect x="853" y="392" width="196" height="5" fill="#0B0B0B"/><text class="md-label" x="869" y="453.62" font-family="Archivo, Noto Sans SC, sans-serif" font-size="20.5" font-weight="800" fill="#0B0B0B" text-anchor="start"><tspan x="869" >Acquiring bank</tspan></text><text class="md-sub" x="869" y="475.29" font-family="Archivo, Noto Sans SC, sans-serif" font-size="14.6" font-weight="400" fill="#5E5E5A" text-anchor="start"><tspan x="869" >builds ISO 8583</tspan><tspan x="869" dy="19.27">message</tspan></text></g><g id="network" data-md="node" data-box="1116,392,196,150" data-shape="box" data-label="inside"><rect x="1116" y="392" width="196" height="150" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0"/><rect x="1116" y="392" width="196" height="5" fill="#0B0B0B"/><text class="md-label" x="1132" y="453.62" font-family="Archivo, Noto Sans SC, sans-serif" font-size="20.5" font-weight="800" fill="#0B0B0B" text-anchor="start"><tspan x="1132" >Card network</tspan></text><text class="md-sub" x="1132" y="475.29" font-family="Archivo, Noto Sans SC, sans-serif" font-size="14.6" font-weight="400" fill="#5E5E5A" text-anchor="start"><tspan x="1132" >routes by BIN, applies</tspan><tspan x="1132" dy="19.27">rules</tspan></text></g><g id="issuer" data-md="node" data-box="1380,392,196,150" data-shape="box" data-label="inside"><rect x="1380" y="392" width="196" height="150" rx="0" fill="#E3001B" stroke="none" stroke-width="0"/><text class="md-label" x="1396" y="453.62" font-family="Archivo, Noto Sans SC, sans-serif" font-size="20.5" font-weight="800" fill="#FFFFFF" text-anchor="start"><tspan x="1396" >Issuing bank</tspan></text><text class="md-sub" x="1396" y="475.29" font-family="Archivo, Noto Sans SC, sans-serif" font-size="14.6" font-weight="400" fill="#FFD9DD" text-anchor="start"><tspan x="1396" >decides: approve or</tspan><tspan x="1396" dy="19.27">decline</tspan></text><rect x="1563" y="379" width="26" height="26" fill="#0B0B0B"/><text x="1576" y="397.28" font-family="Archivo, Noto Sans SC, sans-serif" font-size="15.079999999999998" font-weight="800" fill="#FFFFFF" text-anchor="middle" class="md-step">5</text></g></g><g id="edge-labels"><g id="edge-holder-merchant-label" data-md="edge-label"><rect x="280" y="424" width="26" height="26" fill="#0B0B0B"/><text x="293" y="442.28" font-family="Archivo, Noto Sans SC, sans-serif" font-size="15.079999999999998" font-weight="800" fill="#FFFFFF" text-anchor="middle" class="md-step">1</text></g><g id="edge-merchant-gateway-label" data-md="edge-label"><rect x="543" y="424" width="26" height="26" fill="#0B0B0B"/><text x="556" y="442.28" font-family="Archivo, Noto Sans SC, sans-serif" font-size="15.079999999999998" font-weight="800" fill="#FFFFFF" text-anchor="middle" class="md-step">2</text></g><g id="edge-gateway-acquirer-label" data-md="edge-label"><rect x="806" y="424" width="26" height="26" fill="#0B0B0B"/><text x="819" y="442.28" font-family="Archivo, Noto Sans SC, sans-serif" font-size="15.079999999999998" font-weight="800" fill="#FFFFFF" text-anchor="middle" class="md-step">3</text></g><g id="edge-acquirer-network-label" data-md="edge-label"><rect x="1069" y="424" width="26" height="26" fill="#0B0B0B"/><text x="1082" y="442.28" font-family="Archivo, Noto Sans SC, sans-serif" font-size="15.079999999999998" font-weight="800" fill="#FFFFFF" text-anchor="middle" class="md-step">4</text></g><g id="edge-acquirer-gateway-label" data-md="edge-label"><rect x="806" y="487" width="26" height="26" fill="#0B0B0B"/><text x="819" y="505.28" font-family="Archivo, Noto Sans SC, sans-serif" font-size="15.079999999999998" font-weight="800" fill="#FFFFFF" text-anchor="middle" class="md-step">6</text></g><g id="edge-issuer-network-11-label" data-md="edge-label"><rect x="1315.44" y="609.25" width="93.11" height="21.5" rx="3" fill="#F2F1EC"/><rect x="1287.44" y="607" width="26" height="26" fill="#0B0B0B"/><text x="1300.44" y="625.28" font-family="Archivo, Noto Sans SC, sans-serif" font-size="15.079999999999998" font-weight="800" fill="#FFFFFF" text-anchor="middle" class="md-step">8</text><text x="1319.44" y="624.03" font-family="Space Mono, Noto Sans SC, monospace" font-size="12.4" font-weight="700" fill="#0B0B0B" text-anchor="start"><tspan x="1319.44" >FUNDS · T+1</tspan></text></g><g id="edge-acquirer-merchant-label" data-md="edge-label"><rect x="618.23" y="639.25" width="139.54" height="21.5" rx="3" fill="#F2F1EC"/><text x="622.23" y="654.03" font-family="Space Mono, Noto Sans SC, monospace" font-size="12.4" font-weight="700" fill="#0B0B0B" text-anchor="start"><tspan x="622.23" >PAYOUT, LESS FEES</tspan></text></g></g><g id="notes"></g><g id="legend"><path d="M64 973.5780000000001H98" stroke="#E3001B" stroke-width="3.5" stroke-linecap="round"/><path d="M102 973.58 L95 977.43 L95 969.73 Z" fill="#E3001B"/><text x="112" y="977.86" font-family="Space Mono, Noto Sans SC, monospace" font-size="11.9" font-weight="400" fill="#0B0B0B" text-anchor="start"><tspan x="112" >request</tspan></text><path d="M189.98000000000002 973.5780000000001H223.98000000000002" stroke="#0B0B0B" stroke-width="2" stroke-dasharray="1 6" stroke-linecap="round"/><path d="M227.98 973.58 L220.98 977.43 L220.98 969.73 Z" fill="#0B0B0B"/><text x="237.98" y="977.86" font-family="Space Mono, Noto Sans SC, monospace" font-size="11.9" font-weight="400" fill="#0B0B0B" text-anchor="start"><tspan x="237.98" >response</tspan></text><path d="M323.1 973.5780000000001H357.1" stroke="#5E5E5A" stroke-width="1.5" stroke-dasharray="6 5" stroke-linecap="round"/><path d="M361.1 973.58 L354.1 977.43 L354.1 969.73 Z" fill="#5E5E5A"/><text x="371.1" y="977.86" font-family="Space Mono, Noto Sans SC, monospace" font-size="11.9" font-weight="400" fill="#0B0B0B" text-anchor="start"><tspan x="371.1" >settlement, next day</tspan></text></g><g id="texts"><text x="64" y="790" font-family="Archivo, Noto Sans SC, sans-serif" font-size="56" font-weight="800" fill="#E3001B" text-anchor="start"><tspan x="64" >1</tspan></text><text x="120" y="760" font-family="Archivo, Noto Sans SC, sans-serif" font-size="18" font-weight="800" fill="#0B0B0B" text-anchor="start"><tspan x="120" >Card data</tspan></text><text x="120" y="784" font-family="Archivo, Noto Sans SC, sans-serif" font-size="14" font-weight="400" fill="#5E5E5A" text-anchor="start"><tspan x="120" >Chip, tap or typed number reaches</tspan><tspan x="120" dy="18.2">checkout, encrypted at the</tspan><tspan x="120" dy="18.2">terminal.</tspan></text><text x="448" y="790" font-family="Archivo, Noto Sans SC, sans-serif" font-size="56" font-weight="800" fill="#E3001B" text-anchor="start"><tspan x="448" >2</tspan></text><text x="504" y="760" font-family="Archivo, Noto Sans SC, sans-serif" font-size="18" font-weight="800" fill="#0B0B0B" text-anchor="start"><tspan x="504" >Tokenize</tspan></text><text x="504" y="784" font-family="Archivo, Noto Sans SC, sans-serif" font-size="14" font-weight="400" fill="#5E5E5A" text-anchor="start"><tspan x="504" >The gateway swaps the number for</tspan><tspan x="504" dy="18.2">a token and adds 3-D Secure data</tspan><tspan x="504" dy="18.2">when needed.</tspan></text><text x="832" y="790" font-family="Archivo, Noto Sans SC, sans-serif" font-size="56" font-weight="800" fill="#E3001B" text-anchor="start"><tspan x="832" >3</tspan></text><text x="888" y="760" font-family="Archivo, Noto Sans SC, sans-serif" font-size="18" font-weight="800" fill="#0B0B0B" text-anchor="start"><tspan x="888" >Authorize</tspan></text><text x="888" y="784" font-family="Archivo, Noto Sans SC, sans-serif" font-size="14" font-weight="400" fill="#5E5E5A" text-anchor="start"><tspan x="888" >The acquirer sends an ISO 8583</tspan><tspan x="888" dy="18.2">0100 request to the network.</tspan></text><text x="1216" y="790" font-family="Archivo, Noto Sans SC, sans-serif" font-size="56" font-weight="800" fill="#E3001B" text-anchor="start"><tspan x="1216" >4</tspan></text><text x="1272" y="760" font-family="Archivo, Noto Sans SC, sans-serif" font-size="18" font-weight="800" fill="#0B0B0B" text-anchor="start"><tspan x="1272" >Route</tspan></text><text x="1272" y="784" font-family="Archivo, Noto Sans SC, sans-serif" font-size="14" font-weight="400" fill="#5E5E5A" text-anchor="start"><tspan x="1272" >The network reads the BIN — the first</tspan><tspan x="1272" dy="18.2">6–8 digits — to find the issuer.</tspan></text><text x="64" y="904" font-family="Archivo, Noto Sans SC, sans-serif" font-size="56" font-weight="800" fill="#E3001B" text-anchor="start"><tspan x="64" >5</tspan></text><text x="120" y="874" font-family="Archivo, Noto Sans SC, sans-serif" font-size="18" font-weight="800" fill="#0B0B0B" text-anchor="start"><tspan x="120" >Decide</tspan></text><text x="120" y="898" font-family="Archivo, Noto Sans SC, sans-serif" font-size="14" font-weight="400" fill="#5E5E5A" text-anchor="start"><tspan x="120" >Fraud score, available funds, a hold</tspan><tspan x="120" dy="18.2">on the amount. Roughly 200 ms.</tspan></text><text x="448" y="904" font-family="Archivo, Noto Sans SC, sans-serif" font-size="56" font-weight="800" fill="#E3001B" text-anchor="start"><tspan x="448" >6</tspan></text><text x="504" y="874" font-family="Archivo, Noto Sans SC, sans-serif" font-size="18" font-weight="800" fill="#0B0B0B" text-anchor="start"><tspan x="504" >Respond</tspan></text><text x="504" y="898" font-family="Archivo, Noto Sans SC, sans-serif" font-size="14" font-weight="400" fill="#5E5E5A" text-anchor="start"><tspan x="504" >The approval code retraces the</tspan><tspan x="504" dy="18.2">path. The customer sees “Paid”.</tspan></text><text x="832" y="904" font-family="Archivo, Noto Sans SC, sans-serif" font-size="56" font-weight="800" fill="#E3001B" text-anchor="start"><tspan x="832" >7</tspan></text><text x="888" y="874" font-family="Archivo, Noto Sans SC, sans-serif" font-size="18" font-weight="800" fill="#0B0B0B" text-anchor="start"><tspan x="888" >Clear</tspan></text><text x="888" y="898" font-family="Archivo, Noto Sans SC, sans-serif" font-size="14" font-weight="400" fill="#5E5E5A" text-anchor="start"><tspan x="888" >At day end the acquirer submits</tspan><tspan x="888" dy="18.2">captured transactions as a batch.</tspan></text><text x="1216" y="904" font-family="Archivo, Noto Sans SC, sans-serif" font-size="56" font-weight="800" fill="#E3001B" text-anchor="start"><tspan x="1216" >8</tspan></text><text x="1272" y="874" font-family="Archivo, Noto Sans SC, sans-serif" font-size="18" font-weight="800" fill="#0B0B0B" text-anchor="start"><tspan x="1272" >Settle</tspan></text><text x="1272" y="898" font-family="Archivo, Noto Sans SC, sans-serif" font-size="14" font-weight="400" fill="#5E5E5A" text-anchor="start"><tspan x="1272" >Networks net positions; money moves</tspan><tspan x="1272" dy="18.2">bank to bank. Merchant paid in 1–2</tspan><tspan x="1272" dy="18.2">days.</tspan></text></g><g id="header"><text x="64" y="77" font-family="Space Mono, Noto Sans SC, monospace" font-size="13" font-weight="700" fill="#E3001B" text-anchor="start" letter-spacing="1"><tspan x="64" >CARD-PRESENT AND ONLINE PAYMENTS · 8 STEPS · ABOUT 1.6 SECONDS</tspan></text><text x="64" y="163.8" font-family="Archivo, Noto Sans SC, sans-serif" font-size="80" font-weight="800" fill="#0B0B0B" text-anchor="start" letter-spacing="-2.5"><tspan x="64" >How a card payment</tspan><tspan x="64" dy="76">is authorized</tspan></text><text x="64" y="284.4" font-family="Archivo, Noto Sans SC, sans-serif" font-size="19.4" font-weight="400" fill="#0B0B0B" text-anchor="start"><tspan x="64" >From tap to “Paid”, only messages travel. Funds settle between banks</tspan><tspan x="64" dy="28.13">later, in a nightly batch.</tspan></text><text x="1576" y="77" font-family="Space Mono, Noto Sans SC, monospace" font-size="13" font-weight="400" fill="#0B0B0B" text-anchor="end" letter-spacing="1"><tspan x="1576" >PAYMENTS / 01</tspan></text></g><g id="footer"><text x="1576" y="1034.8" font-family="Space Mono, Noto Sans SC, monospace" font-size="11" font-weight="400" fill="#0B0B0B" text-anchor="end"><tspan x="1576" >MuseDraw / Swiss Poster</tspan></text></g></svg>
