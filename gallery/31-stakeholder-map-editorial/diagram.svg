<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1080" width="1600" height="1080" role="img" aria-labelledby="md-title md-desc" data-theme="editorial"><title id="md-title">Stakeholder map: CRM migration</title><desc id="md-desc">Plot every stakeholder by influence and interest before the first meeting. The quadrant tells you how to engage; the arrow shows where you need someone to move.</desc><defs><filter id="tex-grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="7" stitchTiles="stitch"/><feColorMatrix type="matrix" values="0 0 0 0 0.35  0 0 0 0 0.3  0 0 0 0 0.22  0 0 0 0.5 0"/></filter></defs><g id="background"><rect id="canvas" width="1600" height="1080" fill="#F3EEE4"/><rect width="1600" height="1080" filter="url(#tex-grain)" opacity="0.22"/></g><g id="zones"><g id="b1-q1" data-md="zone"><rect x="110" y="300" width="497" height="327" rx="0" fill="none" stroke="#171614" stroke-width="1"/><text x="132" y="338" font-family="Fraunces, Noto Serif SC, serif" font-size="20" font-weight="600" fill="#171614" text-anchor="start"><tspan x="132" >Keep satisfied</tspan></text><text x="132" y="362" font-family="Inter, Noto Sans SC, sans-serif" font-size="19" font-weight="400" fill="#6E685D" text-anchor="start"><tspan x="132" >brief, no surprises</tspan></text></g><g id="b1-q2" data-md="zone"><rect x="607" y="300" width="497" height="327" rx="0" fill="none" stroke="#171614" stroke-width="1"/><text x="629" y="338" font-family="Fraunces, Noto Serif SC, serif" font-size="20" font-weight="600" fill="#171614" text-anchor="start"><tspan x="629" >Manage closely</tspan></text><text x="629" y="362" font-family="Inter, Noto Sans SC, sans-serif" font-size="19" font-weight="400" fill="#6E685D" text-anchor="start"><tspan x="629" >co-design the pilot</tspan></text></g><g id="b1-q3" data-md="zone"><rect x="110" y="627" width="497" height="327" rx="0" fill="none" stroke="#171614" stroke-width="1"/><text x="132" y="665" font-family="Fraunces, Noto Serif SC, serif" font-size="20" font-weight="600" fill="#171614" text-anchor="start"><tspan x="132" >Monitor</tspan></text><text x="132" y="689" font-family="Inter, Noto Sans SC, sans-serif" font-size="19" font-weight="400" fill="#6E685D" text-anchor="start"><tspan x="132" >light-touch updates</tspan></text></g><g id="b1-q4" data-md="zone"><rect x="607" y="627" width="497" height="327" rx="0" fill="none" stroke="#171614" stroke-width="1"/><text x="629" y="665" font-family="Fraunces, Noto Serif SC, serif" font-size="20" font-weight="600" fill="#171614" text-anchor="start"><tspan x="629" >Keep informed</tspan></text><text x="629" y="689" font-family="Inter, Noto Sans SC, sans-serif" font-size="19" font-weight="400" fill="#6E685D" text-anchor="start"><tspan x="629" >regular, honest news</tspan></text></g><path id="line-1" d="M110 968 L1104 968" fill="none" stroke="#171614" stroke-width="1.4" stroke-linecap="round"/><path id="line-2" d="M96 300 L96 954" fill="none" stroke="#171614" stroke-width="1.4" stroke-linecap="round"/></g><g id="edges"><g id="edge-b1-p2-cfo-target" data-md="edge"><path d="M424.2 417.72 C584.22 417.72 619.78 418 779.8 418" fill="none" stroke="#C93C14" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4"/><path d="M787 418 L778 422.95 L778 413.05 Z" fill="#C93C14"/></g></g><g id="nodes"><g id="cfo-target" data-md="node" data-box="790,418,0,0" data-shape="text" data-label="inside"></g><g id="b1-p1" data-md="node" data-box="911.08,351.4,28,28" data-shape="circle" data-label="right"><ellipse cx="925.08" cy="365.4" rx="14" ry="14" fill="#171614" stroke="#171614" stroke-width="1.2"/><text x="949.08" y="368.55" font-family="Inter, Noto Sans SC, sans-serif" font-size="14" font-weight="600" fill="#171614" text-anchor="start"><tspan x="949.08" >CEO</tspan></text></g><g id="b1-p2" data-md="node" data-box="395.2,404.72,26,26" data-shape="circle" data-label="left"><ellipse cx="408.2" cy="417.72" rx="13" ry="13" fill="#171614" stroke="#171614" stroke-width="1.2"/><text x="385.2" y="420.87" font-family="Inter, Noto Sans SC, sans-serif" font-size="14" font-weight="600" fill="#171614" text-anchor="end"><tspan x="385.2" >CFO</tspan></text></g><g id="b1-p3" data-md="node" data-box="812.68,483.2,26,26" data-shape="circle" data-label="right"><ellipse cx="825.68" cy="496.2" rx="13" ry="13" fill="#171614" stroke="#171614" stroke-width="1.2"/><text x="848.68" y="499.35" font-family="Inter, Noto Sans SC, sans-serif" font-size="14" font-weight="600" fill="#171614" text-anchor="start"><tspan x="848.68" >Works council</tspan></text></g><g id="b1-p4" data-md="node" data-box="476.72,550.6,22,22" data-shape="circle" data-label="right"><ellipse cx="487.72" cy="561.6" rx="11" ry="11" fill="#FBF8F1" stroke="#171614" stroke-width="1.2"/><text x="508.72" y="564.75" font-family="Inter, Noto Sans SC, sans-serif" font-size="14" font-weight="600" fill="#171614" text-anchor="start"><tspan x="508.72" >Head of Sales</tspan></text></g><g id="b1-p5" data-md="node" data-box="952.84,680.4,24,24" data-shape="circle" data-label="right"><ellipse cx="964.84" cy="692.4" rx="12" ry="12" fill="#FBF8F1" stroke="#171614" stroke-width="1.2"/><text x="986.84" y="695.55" font-family="Inter, Noto Sans SC, sans-serif" font-size="14" font-weight="600" fill="#171614" text-anchor="start"><tspan x="986.84" >Team leads</tspan></text></g><g id="b1-p6" data-md="node" data-box="1018.42,794.12,32,32" data-shape="circle" data-label="left"><ellipse cx="1034.42" cy="810.12" rx="16" ry="16" fill="#FBF8F1" stroke="#171614" stroke-width="1.2"/><text x="1008.42" y="813.27" font-family="Inter, Noto Sans SC, sans-serif" font-size="14" font-weight="600" fill="#171614" text-anchor="end"><tspan x="1008.42" >Employees</tspan></text></g><g id="b1-p7" data-md="node" data-box="297.8,746.8,22,22" data-shape="circle" data-label="right"><ellipse cx="308.8" cy="757.8" rx="11" ry="11" fill="none" stroke="#6E685D" stroke-width="1.2" stroke-dasharray="3 4"/><text x="329.8" y="760.95" font-family="Inter, Noto Sans SC, sans-serif" font-size="14" font-weight="600" fill="#171614" text-anchor="start"><tspan x="329.8" >Key customers</tspan></text></g><g id="b1-p8" data-md="node" data-box="517.48,852.44,20,20" data-shape="circle" data-label="right"><ellipse cx="527.48" cy="862.44" rx="10" ry="10" fill="none" stroke="#6E685D" stroke-width="1.2" stroke-dasharray="3 4"/><text x="547.48" y="865.59" font-family="Inter, Noto Sans SC, sans-serif" font-size="14" font-weight="600" fill="#171614" text-anchor="start"><tspan x="547.48" >IT support</tspan></text></g></g><g id="edge-labels"><g id="edge-b1-p2-cfo-target-label" data-md="edge-label"><text x="578.35" y="407.35" font-family="Fraunces, Noto Serif SC, serif" font-size="15.1" font-weight="400" fill="#3A362F" text-anchor="start" font-style="italic"><tspan x="578.35" >move right</tspan></text></g></g><g id="notes"><g id="note-1" data-md="note" data-box="1160,330,380,71.14"><g><text x="1160" y="345.03" font-family="Fraunces, Noto Serif SC, serif" font-size="18.37" font-weight="700" fill="#C93C14">1</text><text x="1186" y="345.03" font-family="Fraunces, Noto Serif SC, serif" font-size="16.7" font-weight="400" fill="#36322C" text-anchor="start" font-style="italic"><tspan x="1186" >The CFO has a veto and little interest. Move</tspan><tspan x="1186" dy="23.71">them right before the board meets: show</tspan><tspan x="1186" dy="23.71">the cost model, not the morale survey.</tspan></text></g></g><g id="note-2" data-md="note" data-box="1160,520,380,71.14"><g><text x="1160" y="535.03" font-family="Fraunces, Noto Serif SC, serif" font-size="18.37" font-weight="700" fill="#C93C14">2</text><text x="1186" y="535.03" font-family="Fraunces, Noto Serif SC, serif" font-size="16.7" font-weight="400" fill="#36322C" text-anchor="start" font-style="italic"><tspan x="1186" >Works council sits in ‘manage closely’ —</tspan><tspan x="1186" dy="23.71">invite them to write the evaluation criteria</tspan><tspan x="1186" dy="23.71">with you.</tspan></text></g></g><g id="note-3" data-md="note" data-box="1160,690,380,71.14"><g><text x="1160" y="705.03" font-family="Fraunces, Noto Serif SC, serif" font-size="18.37" font-weight="700" fill="#C93C14">3</text><text x="1186" y="705.03" font-family="Fraunces, Noto Serif SC, serif" font-size="16.7" font-weight="400" fill="#36322C" text-anchor="start" font-style="italic"><tspan x="1186" >Employees have the most interest and the</tspan><tspan x="1186" dy="23.71">least formal power. Their pilot data is the</tspan><tspan x="1186" dy="23.71">argument.</tspan></text></g></g></g><g id="legend"></g><g id="texts"><text x="110" y="990" font-family="JetBrains Mono, Noto Sans SC, monospace" font-size="12" font-weight="400" fill="#6E685D" text-anchor="start"><tspan x="110" >low interest</tspan></text><text x="1104" y="990" font-family="JetBrains Mono, Noto Sans SC, monospace" font-size="12" font-weight="400" fill="#6E685D" text-anchor="end"><tspan x="1104" >high interest</tspan></text><text x="607" y="990" font-family="JetBrains Mono, Noto Sans SC, monospace" font-size="12.5" font-weight="700" fill="#171614" text-anchor="middle" letter-spacing="1.5"><tspan x="607" >INTEREST</tspan></text><g transform="rotate(-90 88 954)"><text x="88" y="954" font-family="JetBrains Mono, Noto Sans SC, monospace" font-size="12" font-weight="400" fill="#6E685D" text-anchor="start"><tspan x="88" >low influence</tspan></text></g><g transform="rotate(-90 88 360)"><text x="88" y="360" font-family="JetBrains Mono, Noto Sans SC, monospace" font-size="12" font-weight="400" fill="#6E685D" text-anchor="start"><tspan x="88" >high influence</tspan></text></g><g transform="rotate(-90 88 677)"><text x="88" y="677" font-family="JetBrains Mono, Noto Sans SC, monospace" font-size="12.5" font-weight="700" fill="#171614" text-anchor="start" letter-spacing="1.5"><tspan x="88" >INFLUENCE</tspan></text></g></g><g id="header"><text x="64" y="76" font-family="JetBrains Mono, Noto Sans SC, monospace" font-size="12" font-weight="600" fill="#C93C14" text-anchor="start" letter-spacing="2.2"><tspan x="64" >CHANGE PROGRAMME · FOUR-DAY WEEK PILOT</tspan></text><text x="64" y="140.44" font-family="Fraunces, Noto Serif SC, serif" font-size="54" font-weight="600" fill="#171614" text-anchor="start" letter-spacing="-0.8"><tspan x="64" >Stakeholder map: CRM migration</tspan></text><text x="64" y="180.4" font-family="Inter, Noto Sans SC, sans-serif" font-size="18.4" font-weight="400" fill="#6E685D" text-anchor="start"><tspan x="64" >Plot every stakeholder by influence and interest before the first meeting. The quadrant tells you how to engage; the arrow</tspan><tspan x="64" dy="26.68">shows where you need someone to move.</tspan></text><path d="M64 237.35999999999999H1536" stroke="#171614" stroke-width="1.2"/><text x="1536" y="76" font-family="JetBrains Mono, Noto Sans SC, monospace" font-size="12" font-weight="400" fill="#6E685D" text-anchor="end" letter-spacing="2.2"><tspan x="1536" >FIG. 31</tspan></text></g><g id="footer"><text x="1536" y="1044.8" font-family="JetBrains Mono, Noto Sans SC, monospace" font-size="10.5" font-weight="400" fill="#6E685D" text-anchor="end" letter-spacing="1.5"><tspan x="1536" >MuseDraw · Editorial Ink</tspan></text></g></svg>
