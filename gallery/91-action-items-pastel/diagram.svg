<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1660 867" width="1660" height="867" role="img" aria-labelledby="md-title md-desc" data-theme="pastel"><title id="md-title">会议纪要与行动项</title><desc id="md-desc">会议只产出两样东西：决议和行动项。每个行动项都有一个负责人、一个日期和一个状态，不写“相关部门”“尽快”。</desc><defs></defs><g id="background"><rect id="canvas" width="1660" height="867" fill="#FFFFFF"/></g><g id="zones"><path id="line-1" d="M64 443 L1304 443" fill="none" stroke="#37352F" stroke-width="1.6" stroke-linecap="round"/><path id="line-2" d="M64 501 L1304 501" fill="none" stroke="#00000022" stroke-width="1" stroke-linecap="round"/><path id="line-3" d="M64 559 L1304 559" fill="none" stroke="#00000022" stroke-width="1" stroke-linecap="round"/><path id="line-4" d="M64 617 L1304 617" fill="none" stroke="#00000022" stroke-width="1" stroke-linecap="round"/><path id="line-5" d="M64 675 L1304 675" fill="none" stroke="#00000022" stroke-width="1" stroke-linecap="round"/><path id="line-6" d="M64 733 L1304 733" fill="none" stroke="#00000022" stroke-width="1" stroke-linecap="round"/><path id="line-7" d="M64 791 L1304 791" fill="none" stroke="#00000022" stroke-width="1" stroke-linecap="round"/></g><g id="edges"></g><g id="nodes"><g id="b1-c1-5" data-md="node" data-box="1187,450,84,44" data-shape="pill" data-label="inside"><rect x="1187" y="450" width="84" height="44" rx="22" fill="#E7F3F8" stroke="none" stroke-width="0"/><text class="md-label" x="1229" y="476.16" font-family="Noto Sans SC, Inter, sans-serif" font-size="13" font-weight="700" fill="#183347" text-anchor="middle"><tspan x="1229" >进行中</tspan></text></g><g id="b1-c2-5" data-md="node" data-box="1187,508,84,44" data-shape="pill" data-label="inside"><rect x="1187" y="508" width="84" height="44" rx="22" fill="#F1F1EF" stroke="none" stroke-width="0"/><text class="md-label" x="1229" y="534.16" font-family="Noto Sans SC, Inter, sans-serif" font-size="13" font-weight="700" fill="#37352F" text-anchor="middle"><tspan x="1229" >未开始</tspan></text></g><g id="b1-c3-5" data-md="node" data-box="1187,566,84,44" data-shape="pill" data-label="inside"><rect x="1187" y="566" width="84" height="44" rx="22" fill="#E7F3F8" stroke="none" stroke-width="0"/><text class="md-label" x="1229" y="592.16" font-family="Noto Sans SC, Inter, sans-serif" font-size="13" font-weight="700" fill="#183347" text-anchor="middle"><tspan x="1229" >进行中</tspan></text></g><g id="b1-c4-5" data-md="node" data-box="1187,624,84,44" data-shape="pill" data-label="inside"><rect x="1187" y="624" width="84" height="44" rx="22" fill="#EDF3EC" stroke="none" stroke-width="0"/><text class="md-label" x="1229" y="650.16" font-family="Noto Sans SC, Inter, sans-serif" font-size="13" font-weight="700" fill="#1C3829" text-anchor="middle"><tspan x="1229" >已完成</tspan></text></g><g id="b1-c5-5" data-md="node" data-box="1187,682,84,44" data-shape="pill" data-label="inside"><rect x="1187" y="682" width="84" height="44" rx="22" fill="#FDEBEC" stroke="none" stroke-width="0"/><text class="md-label" x="1229" y="708.16" font-family="Noto Sans SC, Inter, sans-serif" font-size="13" font-weight="700" fill="#5D1715" text-anchor="middle"><tspan x="1229" >延期</tspan></text></g><g id="b1-c6-5" data-md="node" data-box="1187,740,84,44" data-shape="pill" data-label="inside"><rect x="1187" y="740" width="84" height="44" rx="22" fill="#EDF3EC" stroke="none" stroke-width="0"/><text class="md-label" x="1229" y="766.16" font-family="Noto Sans SC, Inter, sans-serif" font-size="13" font-weight="700" fill="#1C3829" text-anchor="middle"><tspan x="1229" >已完成</tspan></text></g></g><g id="edge-labels"></g><g id="notes"></g><g id="legend"></g><g id="texts"><text x="64" y="267" font-family="Noto Sans SC, Inter, sans-serif" font-size="15" font-weight="700" fill="#37352F" text-anchor="start"><tspan x="64" >决议</tspan></text><text x="64" y="297" font-family="Noto Sans SC, Inter, sans-serif" font-size="14.5" font-weight="400" fill="#37352F" text-anchor="start"><tspan x="64" >1. 新版本按原范围上线，不再追加需求。</tspan></text><text x="64" y="325" font-family="Noto Sans SC, Inter, sans-serif" font-size="14.5" font-weight="400" fill="#37352F" text-anchor="start"><tspan x="64" >2. 若 10/31 压测未达标，上线日顺延一周。</tspan></text><text x="64" y="353" font-family="Noto Sans SC, Inter, sans-serif" font-size="14.5" font-weight="400" fill="#37352F" text-anchor="start"><tspan x="64" >3. 每周一 10:00 用这张表过一遍，只看红色和逾期。</tspan></text><text x="76" y="425" font-family="JetBrains Mono, Noto Sans SC, monospace" font-size="12" font-weight="700" fill="#37352F" text-anchor="start" letter-spacing="1"><tspan x="76" >编号</tspan></text><text x="166" y="425" font-family="JetBrains Mono, Noto Sans SC, monospace" font-size="12" font-weight="700" fill="#37352F" text-anchor="start" letter-spacing="1"><tspan x="166" >事项</tspan></text><text x="786" y="425" font-family="JetBrains Mono, Noto Sans SC, monospace" font-size="12" font-weight="700" fill="#37352F" text-anchor="start" letter-spacing="1"><tspan x="786" >负责人</tspan></text><text x="1006" y="425" font-family="JetBrains Mono, Noto Sans SC, monospace" font-size="12" font-weight="700" fill="#37352F" text-anchor="start" letter-spacing="1"><tspan x="1006" >截止</tspan></text><text x="1229" y="425" font-family="JetBrains Mono, Noto Sans SC, monospace" font-size="12" font-weight="700" fill="#37352F" text-anchor="middle" letter-spacing="1"><tspan x="1229" >状态</tspan></text><text x="76" y="477" font-family="Noto Sans SC, Inter, sans-serif" font-size="15" font-weight="650" fill="#37352F" text-anchor="start"><tspan x="76" >A1</tspan></text><text x="166" y="477" font-family="Noto Sans SC, Inter, sans-serif" font-size="15" font-weight="650" fill="#37352F" text-anchor="start"><tspan x="166" >上线日期定为 11 月 18 日</tspan></text><text x="786" y="477" font-family="Noto Sans SC, Inter, sans-serif" font-size="15" font-weight="400" fill="#37352F" text-anchor="start"><tspan x="786" >产品 李然</tspan></text><text x="1006" y="477" font-family="Noto Sans SC, Inter, sans-serif" font-size="15" font-weight="400" fill="#37352F" text-anchor="start"><tspan x="1006" >10/20</tspan></text><text x="76" y="535" font-family="Noto Sans SC, Inter, sans-serif" font-size="15" font-weight="650" fill="#37352F" text-anchor="start"><tspan x="76" >A2</tspan></text><text x="166" y="535" font-family="Noto Sans SC, Inter, sans-serif" font-size="15" font-weight="650" fill="#37352F" text-anchor="start"><tspan x="166" >客服话术更新，含 12 个新问题</tspan></text><text x="786" y="535" font-family="Noto Sans SC, Inter, sans-serif" font-size="15" font-weight="400" fill="#37352F" text-anchor="start"><tspan x="786" >客服 周宁</tspan></text><text x="1006" y="535" font-family="Noto Sans SC, Inter, sans-serif" font-size="15" font-weight="400" fill="#37352F" text-anchor="start"><tspan x="1006" >10/25</tspan></text><text x="76" y="593" font-family="Noto Sans SC, Inter, sans-serif" font-size="15" font-weight="650" fill="#37352F" text-anchor="start"><tspan x="76" >A3</tspan></text><text x="166" y="593" font-family="Noto Sans SC, Inter, sans-serif" font-size="15" font-weight="650" fill="#37352F" text-anchor="start"><tspan x="166" >压测到 3 倍日常峰值</tspan></text><text x="786" y="593" font-family="Noto Sans SC, Inter, sans-serif" font-size="15" font-weight="400" fill="#37352F" text-anchor="start"><tspan x="786" >研发 陈默</tspan></text><text x="1006" y="593" font-family="Noto Sans SC, Inter, sans-serif" font-size="15" font-weight="400" fill="#37352F" text-anchor="start"><tspan x="1006" >10/31</tspan></text><text x="76" y="651" font-family="Noto Sans SC, Inter, sans-serif" font-size="15" font-weight="650" fill="#37352F" text-anchor="start"><tspan x="76" >A4</tspan></text><text x="166" y="651" font-family="Noto Sans SC, Inter, sans-serif" font-size="15" font-weight="650" fill="#37352F" text-anchor="start"><tspan x="166" >合同模板法务复核</tspan></text><text x="786" y="651" font-family="Noto Sans SC, Inter, sans-serif" font-size="15" font-weight="400" fill="#37352F" text-anchor="start"><tspan x="786" >法务 何静</tspan></text><text x="1006" y="651" font-family="Noto Sans SC, Inter, sans-serif" font-size="15" font-weight="400" fill="#37352F" text-anchor="start"><tspan x="1006" >10/22</tspan></text><text x="76" y="709" font-family="Noto Sans SC, Inter, sans-serif" font-size="15" font-weight="650" fill="#37352F" text-anchor="start"><tspan x="76" >A5</tspan></text><text x="166" y="709" font-family="Noto Sans SC, Inter, sans-serif" font-size="15" font-weight="650" fill="#37352F" text-anchor="start"><tspan x="166" >发布会场地二选一并下定金</tspan></text><text x="786" y="709" font-family="Noto Sans SC, Inter, sans-serif" font-size="15" font-weight="400" fill="#37352F" text-anchor="start"><tspan x="786" >行政 王磊</tspan></text><text x="1006" y="709" font-family="Noto Sans SC, Inter, sans-serif" font-size="15" font-weight="400" fill="#37352F" text-anchor="start"><tspan x="1006" >10/18</tspan></text><text x="76" y="767" font-family="Noto Sans SC, Inter, sans-serif" font-size="15" font-weight="650" fill="#37352F" text-anchor="start"><tspan x="76" >A6</tspan></text><text x="166" y="767" font-family="Noto Sans SC, Inter, sans-serif" font-size="15" font-weight="650" fill="#37352F" text-anchor="start"><tspan x="166" >下次评审会议邀请已发</tspan></text><text x="786" y="767" font-family="Noto Sans SC, Inter, sans-serif" font-size="15" font-weight="400" fill="#37352F" text-anchor="start"><tspan x="786" >项目经理</tspan></text><text x="1006" y="767" font-family="Noto Sans SC, Inter, sans-serif" font-size="15" font-weight="400" fill="#37352F" text-anchor="start"><tspan x="1006" >10/16</tspan></text></g><g id="header"><text x="72" y="86" font-family="Noto Sans SC, Inter, sans-serif" font-size="14" font-weight="400" fill="#787774" text-anchor="start" letter-spacing="0.5"><tspan x="72" >项目周会 · 10 月 14 日 · 参会 7 人</tspan></text><text x="72" y="140.12" font-family="Noto Sans SC, Inter, sans-serif" font-size="42" font-weight="700" fill="#37352F" text-anchor="start"><tspan x="72" >会议纪要与行动项</tspan></text><text x="72" y="177.3" font-family="Noto Sans SC, Inter, sans-serif" font-size="17.3" font-weight="400" fill="#787774" text-anchor="start"><tspan x="72" >会议只产出两样东西：决议和行动项。每个行动项都有一个负责人、一个日期和一个状态，不写“相关部门”“尽快”。</tspan></text></g><g id="footer"><text x="1588" y="827.4" font-family="Noto Sans SC, Inter, sans-serif" font-size="12" font-weight="400" fill="#B4B4B0" text-anchor="end" letter-spacing="1"><tspan x="1588" >MuseDraw · 柔和笔记</tspan></text></g></svg>
