<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 1070" width="1700" height="1070" role="img" aria-labelledby="md-title md-desc" data-theme="terracotta"><title id="md-title">Business model canvas: meal-kit service</title><desc id="md-desc">Nine boxes, one page. Read it from the right: who the customer is, what we promise them, and only then what it costs to deliver.</desc><defs><filter id="tex-grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" seed="7" stitchTiles="stitch"/><feColorMatrix type="matrix" values="0 0 0 0 0.45  0 0 0 0 0.3  0 0 0 0 0.2  0 0 0 0.5 0"/></filter></defs><g id="background"><rect id="canvas" width="1700" height="1070" fill="#F3E8DA"/><rect width="1700" height="1070" filter="url(#tex-grain)" opacity="0.18"/></g><g id="zones"><g id="kp" data-md="zone"><rect x="64" y="250" width="304" height="520" rx="22" fill="#FBF5EC" stroke="#E1CDB3" stroke-width="1"/><text x="84" y="280" font-family="IBM Plex Mono, Noto Sans SC, monospace" font-size="12.5" font-weight="600" fill="#3A2A20" text-anchor="start" letter-spacing="1.8"><tspan x="84" >KEY PARTNERS</tspan></text></g><g id="ka" data-md="zone"><rect x="378" y="250" width="304" height="255" rx="22" fill="#FBF5EC" stroke="#E1CDB3" stroke-width="1"/><text x="398" y="280" font-family="IBM Plex Mono, Noto Sans SC, monospace" font-size="12.5" font-weight="600" fill="#3A2A20" text-anchor="start" letter-spacing="1.8"><tspan x="398" >KEY ACTIVITIES</tspan></text></g><g id="kr" data-md="zone"><rect x="378" y="515" width="304" height="255" rx="22" fill="#FBF5EC" stroke="#E1CDB3" stroke-width="1"/><text x="398" y="545" font-family="IBM Plex Mono, Noto Sans SC, monospace" font-size="12.5" font-weight="600" fill="#3A2A20" text-anchor="start" letter-spacing="1.8"><tspan x="398" >KEY RESOURCES</tspan></text></g><g id="vp" data-md="zone"><rect x="693" y="250" width="304" height="520" rx="22" fill="#F1DACD" stroke="none" stroke-width="1"/><text x="713" y="280" font-family="IBM Plex Mono, Noto Sans SC, monospace" font-size="12.5" font-weight="600" fill="#C0583A" text-anchor="start" letter-spacing="1.8"><tspan x="713" >VALUE PROPOSITION</tspan></text></g><g id="cr" data-md="zone"><rect x="1007" y="250" width="304" height="255" rx="22" fill="#FBF5EC" stroke="#E1CDB3" stroke-width="1"/><text x="1027" y="280" font-family="IBM Plex Mono, Noto Sans SC, monospace" font-size="12.5" font-weight="600" fill="#3A2A20" text-anchor="start" letter-spacing="1.8"><tspan x="1027" >CUSTOMER RELATIONSHIPS</tspan></text></g><g id="ch" data-md="zone"><rect x="1007" y="515" width="304" height="255" rx="22" fill="#FBF5EC" stroke="#E1CDB3" stroke-width="1"/><text x="1027" y="545" font-family="IBM Plex Mono, Noto Sans SC, monospace" font-size="12.5" font-weight="600" fill="#3A2A20" text-anchor="start" letter-spacing="1.8"><tspan x="1027" >CHANNELS</tspan></text></g><g id="cs" data-md="zone"><rect x="1322" y="250" width="304" height="520" rx="22" fill="#E5E5CB" stroke="none" stroke-width="1"/><text x="1342" y="280" font-family="IBM Plex Mono, Noto Sans SC, monospace" font-size="12.5" font-weight="600" fill="#6E7B3B" text-anchor="start" letter-spacing="1.8"><tspan x="1342" >CUSTOMER SEGMENTS</tspan></text></g><g id="cost" data-md="zone"><rect x="64" y="780" width="776" height="210" rx="22" fill="#FBF5EC" stroke="#E1CDB3" stroke-width="1"/><text x="84" y="810" font-family="IBM Plex Mono, Noto Sans SC, monospace" font-size="12.5" font-weight="600" fill="#3A2A20" text-anchor="start" letter-spacing="1.8"><tspan x="84" >COST STRUCTURE</tspan></text></g><g id="rev" data-md="zone"><rect x="850" y="780" width="776" height="210" rx="22" fill="#FBF5EC" stroke="#E1CDB3" stroke-width="1"/><text x="870" y="810" font-family="IBM Plex Mono, Noto Sans SC, monospace" font-size="12.5" font-weight="600" fill="#3A2A20" text-anchor="start" letter-spacing="1.8"><tspan x="870" >REVENUE STREAMS</tspan></text></g></g><g id="edges"></g><g id="nodes"></g><g id="edge-labels"></g><g id="notes"></g><g id="legend"></g><g id="texts"><text x="84" y="326" font-family="Inter, Noto Sans SC, sans-serif" font-size="17.5" font-weight="400" fill="#3A2A20" text-anchor="start"><tspan x="84" >Regional farms (weekly</tspan><tspan x="84" dy="22.75">harvest)</tspan></text><text x="84" y="384" font-family="Inter, Noto Sans SC, sans-serif" font-size="17.5" font-weight="400" fill="#3A2A20" text-anchor="start"><tspan x="84" >Cold-chain courier</tspan></text><text x="84" y="442" font-family="Inter, Noto Sans SC, sans-serif" font-size="17.5" font-weight="400" fill="#3A2A20" text-anchor="start"><tspan x="84" >Recipe developers on retainer</tspan></text><text x="398" y="326" font-family="Inter, Noto Sans SC, sans-serif" font-size="17.5" font-weight="400" fill="#3A2A20" text-anchor="start"><tspan x="398" >Menu planning 6 weeks out</tspan></text><text x="398" y="384" font-family="Inter, Noto Sans SC, sans-serif" font-size="17.5" font-weight="400" fill="#3A2A20" text-anchor="start"><tspan x="398" >Portioning &amp; packing</tspan></text><text x="398" y="591" font-family="Inter, Noto Sans SC, sans-serif" font-size="17.5" font-weight="400" fill="#3A2A20" text-anchor="start"><tspan x="398" >Packing kitchen</tspan></text><text x="398" y="649" font-family="Inter, Noto Sans SC, sans-serif" font-size="17.5" font-weight="400" fill="#3A2A20" text-anchor="start"><tspan x="398" >Recipe library (900+)</tspan></text><text x="713" y="334" font-family="Fraunces, Noto Serif SC, serif" font-size="21" font-weight="600" fill="#3A2A20" text-anchor="start"><tspan x="713" >Dinner for four in 25</tspan><tspan x="713" dy="27.3">minutes</tspan></text><text x="713" y="410" font-family="Fraunces, Noto Serif SC, serif" font-size="21" font-weight="600" fill="#3A2A20" text-anchor="start"><tspan x="713" >Kids actually eat it —</tspan><tspan x="713" dy="27.3">rated by kids</tspan></text><text x="713" y="486" font-family="Fraunces, Noto Serif SC, serif" font-size="21" font-weight="600" fill="#3A2A20" text-anchor="start"><tspan x="713" >No planning, no shopping,</tspan><tspan x="713" dy="27.3">no waste</tspan></text><text x="1027" y="326" font-family="Inter, Noto Sans SC, sans-serif" font-size="17.5" font-weight="400" fill="#3A2A20" text-anchor="start"><tspan x="1027" >Swap or skip any week</tspan></text><text x="1027" y="384" font-family="Inter, Noto Sans SC, sans-serif" font-size="17.5" font-weight="400" fill="#3A2A20" text-anchor="start"><tspan x="1027" >Family taste profile</tspan></text><text x="1027" y="591" font-family="Inter, Noto Sans SC, sans-serif" font-size="17.5" font-weight="400" fill="#3A2A20" text-anchor="start"><tspan x="1027" >School-gate referrals</tspan></text><text x="1027" y="649" font-family="Inter, Noto Sans SC, sans-serif" font-size="17.5" font-weight="400" fill="#3A2A20" text-anchor="start"><tspan x="1027" >Instagram cooking reels</tspan></text><text x="1342" y="326" font-family="Inter, Noto Sans SC, sans-serif" font-size="17.5" font-weight="400" fill="#3A2A20" text-anchor="start"><tspan x="1342" >Two working parents, kids 4–12</tspan></text><text x="1342" y="384" font-family="Inter, Noto Sans SC, sans-serif" font-size="17.5" font-weight="400" fill="#3A2A20" text-anchor="start"><tspan x="1342" >Suburban, cooks 4+ nights a</tspan><tspan x="1342" dy="22.75">week</tspan></text><text x="1342" y="442" font-family="Inter, Noto Sans SC, sans-serif" font-size="17.5" font-weight="400" fill="#3A2A20" text-anchor="start"><tspan x="1342" >Values time over price</tspan></text><text x="84" y="856" font-family="Inter, Noto Sans SC, sans-serif" font-size="17.5" font-weight="400" fill="#3A2A20" text-anchor="start"><tspan x="84" >Ingredients 38% · packaging 9% · delivery 14%</tspan></text><text x="84" y="914" font-family="Inter, Noto Sans SC, sans-serif" font-size="17.5" font-weight="400" fill="#3A2A20" text-anchor="start"><tspan x="84" >Kitchen &amp; staff 17% · acquisition 12%</tspan></text><text x="870" y="856" font-family="Inter, Noto Sans SC, sans-serif" font-size="17.5" font-weight="400" fill="#3A2A20" text-anchor="start"><tspan x="870" >Weekly subscription €69 (4 meals × 4)</tspan></text><text x="870" y="914" font-family="Inter, Noto Sans SC, sans-serif" font-size="17.5" font-weight="400" fill="#3A2A20" text-anchor="start"><tspan x="870" >Add-ons: breakfast, desserts — 18% attach rate</tspan></text></g><g id="header"><text x="64" y="76" font-family="IBM Plex Mono, Noto Sans SC, monospace" font-size="12" font-weight="600" fill="#C0583A" text-anchor="start" letter-spacing="2"><tspan x="64" >BUSINESS MODEL CANVAS</tspan></text><text x="64" y="138.72" font-family="Fraunces, Noto Serif SC, serif" font-size="52" font-weight="600" fill="#3A2A20" text-anchor="start" letter-spacing="-1"><tspan x="64" >Business model canvas: meal-kit service</tspan></text><text x="64" y="178.4" font-family="Inter, Noto Sans SC, sans-serif" font-size="18.4" font-weight="400" fill="#7D6A5B" text-anchor="start"><tspan x="64" >Nine boxes, one page. Read it from the right: who the customer is, what we promise them, and only then what it costs to</tspan><tspan x="64" dy="26.68">deliver.</tspan></text></g><g id="footer"><text x="1636" y="1034.8" font-family="IBM Plex Mono, Noto Sans SC, monospace" font-size="10.5" font-weight="400" fill="#7D6A5B" text-anchor="end" letter-spacing="1.5"><tspan x="1636" >MuseDraw · Terracotta</tspan></text></g></svg>
