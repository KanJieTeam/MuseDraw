<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1051" width="1600" height="1051" role="img" aria-labelledby="md-title md-desc" data-theme="editorial"><title id="md-title">区域连锁咖啡品牌 SWOT 分析</title><desc id="md-desc">内部看优势与短板，外部看机会与威胁。右下角的组合最危险：把短板暴露在威胁面前。</desc><defs><filter id="tex-grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="7" stitchTiles="stitch"/><feColorMatrix type="matrix" values="0 0 0 0 0.35  0 0 0 0 0.3  0 0 0 0 0.22  0 0 0 0.5 0"/></filter></defs><g id="background"><rect id="canvas" width="1600" height="1051" fill="#F3EEE4"/><rect width="1600" height="1051" filter="url(#tex-grain)" opacity="0.22"/></g><g id="zones"><g id="b1-q1" data-md="zone"><rect x="110" y="271" width="706" height="310" rx="0" fill="none" stroke="#171614" stroke-width="1"/><text x="132" y="313.8" font-family="Fraunces, Noto Serif SC, serif" font-size="26" font-weight="600" fill="#171614" text-anchor="start"><tspan x="132" >S　优势 Strengths</tspan></text></g><g id="b1-q2" data-md="zone"><rect x="830" y="271" width="706" height="310" rx="0" fill="none" stroke="#171614" stroke-width="1"/><text x="852" y="313.8" font-family="Fraunces, Noto Serif SC, serif" font-size="26" font-weight="600" fill="#171614" text-anchor="start"><tspan x="852" >W　劣势 Weaknesses</tspan></text></g><g id="b1-q3" data-md="zone"><rect x="110" y="595" width="706" height="310" rx="0" fill="none" stroke="#171614" stroke-width="1"/><text x="132" y="637.8" font-family="Fraunces, Noto Serif SC, serif" font-size="26" font-weight="600" fill="#171614" text-anchor="start"><tspan x="132" >O　机会 Opportunities</tspan></text></g><g id="b1-q4" data-md="zone"><rect x="830" y="595" width="706" height="310" rx="0" fill="none" stroke="#171614" stroke-width="1"/><text x="852" y="637.8" font-family="Fraunces, Noto Serif SC, serif" font-size="26" font-weight="600" fill="#171614" text-anchor="start"><tspan x="852" >T　威胁 Threats</tspan></text></g><path id="line-1" d="M110 919 L1536 919" fill="none" stroke="#171614" stroke-width="1.4" stroke-linecap="round"/><path id="line-2" d="M96 271 L96 905" fill="none" stroke="#171614" stroke-width="1.4" stroke-linecap="round"/></g><g id="edges"></g><g id="nodes"></g><g id="edge-labels"></g><g id="notes"></g><g id="legend"></g><g id="texts"><text x="798" y="563" font-family="Fraunces, Noto Serif SC, serif" font-size="64" font-weight="800" fill="#6E685D" text-anchor="end" opacity="0.18"><tspan x="798" >S</tspan></text><text x="132" y="379" font-family="Inter, Noto Sans SC, sans-serif" font-size="18" font-weight="400" fill="#171614" text-anchor="start"><tspan x="132" >— 自有烘焙厂，单杯成本低 18%</tspan></text><text x="132" y="419" font-family="Inter, Noto Sans SC, sans-serif" font-size="18" font-weight="400" fill="#171614" text-anchor="start"><tspan x="132" >— 会员 32 万，复购率 41%</tspan></text><text x="132" y="459" font-family="Inter, Noto Sans SC, sans-serif" font-size="18" font-weight="400" fill="#171614" text-anchor="start"><tspan x="132" >— 社区店模型已验证：14 个月回本</tspan></text><text x="1518" y="563" font-family="Fraunces, Noto Serif SC, serif" font-size="64" font-weight="800" fill="#6E685D" text-anchor="end" opacity="0.18"><tspan x="1518" >W</tspan></text><text x="852" y="379" font-family="Inter, Noto Sans SC, sans-serif" font-size="18" font-weight="400" fill="#171614" text-anchor="start"><tspan x="852" >— 异地供应链尚未建立</tspan></text><text x="852" y="419" font-family="Inter, Noto Sans SC, sans-serif" font-size="18" font-weight="400" fill="#171614" text-anchor="start"><tspan x="852" >— 店长培养周期长达 9 个月</tspan></text><text x="852" y="459" font-family="Inter, Noto Sans SC, sans-serif" font-size="18" font-weight="400" fill="#171614" text-anchor="start"><tspan x="852" >— 品牌在新城市几乎零认知</tspan></text><text x="798" y="887" font-family="Fraunces, Noto Serif SC, serif" font-size="64" font-weight="800" fill="#6E685D" text-anchor="end" opacity="0.18"><tspan x="798" >O</tspan></text><text x="132" y="703" font-family="Inter, Noto Sans SC, sans-serif" font-size="18" font-weight="400" fill="#171614" text-anchor="start"><tspan x="132" >— 目标城市新建社区 60+ 个</tspan></text><text x="132" y="743" font-family="Inter, Noto Sans SC, sans-serif" font-size="18" font-weight="400" fill="#171614" text-anchor="start"><tspan x="132" >— 写字楼外卖早餐需求增长</tspan></text><text x="132" y="783" font-family="Inter, Noto Sans SC, sans-serif" font-size="18" font-weight="400" fill="#171614" text-anchor="start"><tspan x="132" >— 本地连锁品牌正在收缩</tspan></text><text x="1518" y="887" font-family="Fraunces, Noto Serif SC, serif" font-size="64" font-weight="800" fill="#6E685D" text-anchor="end" opacity="0.18"><tspan x="1518" >T</tspan></text><text x="852" y="703" font-family="Inter, Noto Sans SC, sans-serif" font-size="18" font-weight="400" fill="#171614" text-anchor="start"><tspan x="852" >— 全国连锁低价扩张</tspan></text><text x="852" y="743" font-family="Inter, Noto Sans SC, sans-serif" font-size="18" font-weight="400" fill="#171614" text-anchor="start"><tspan x="852" >— 核心商圈租金上涨 12%</tspan></text><text x="852" y="783" font-family="Inter, Noto Sans SC, sans-serif" font-size="18" font-weight="400" fill="#171614" text-anchor="start"><tspan x="852" >— 咖啡豆进口价格波动</tspan></text><text x="110" y="941" font-family="JetBrains Mono, Noto Sans SC, monospace" font-size="12" font-weight="400" fill="#6E685D" text-anchor="start"><tspan x="110" >有利</tspan></text><text x="1536" y="941" font-family="JetBrains Mono, Noto Sans SC, monospace" font-size="12" font-weight="400" fill="#6E685D" text-anchor="end"><tspan x="1536" >不利</tspan></text><text x="823" y="941" font-family="JetBrains Mono, Noto Sans SC, monospace" font-size="12.5" font-weight="700" fill="#171614" text-anchor="middle" letter-spacing="1.5"><tspan x="823" >影响方向</tspan></text><g transform="rotate(-90 88 905)"><text x="88" y="905" font-family="JetBrains Mono, Noto Sans SC, monospace" font-size="12" font-weight="400" fill="#6E685D" text-anchor="start"><tspan x="88" >外部</tspan></text></g><g transform="rotate(-90 88 331)"><text x="88" y="331" font-family="JetBrains Mono, Noto Sans SC, monospace" font-size="12" font-weight="400" fill="#6E685D" text-anchor="start"><tspan x="88" >内部</tspan></text></g><g transform="rotate(-90 88 638)"><text x="88" y="638" font-family="JetBrains Mono, Noto Sans SC, monospace" font-size="12.5" font-weight="700" fill="#171614" text-anchor="start" letter-spacing="1.5"><tspan x="88" >来源</tspan></text></g></g><g id="header"><text x="64" y="76" font-family="JetBrains Mono, Noto Sans SC, monospace" font-size="12" font-weight="600" fill="#C93C14" text-anchor="start" letter-spacing="2.2"><tspan x="64" >战略分析 · 社区咖啡品牌进入第二城市</tspan></text><text x="64" y="140.44" font-family="Fraunces, Noto Serif SC, serif" font-size="54" font-weight="600" fill="#171614" text-anchor="start" letter-spacing="-0.8"><tspan x="64" >区域连锁咖啡品牌 SWOT 分析</tspan></text><text x="64" y="180.4" font-family="Inter, Noto Sans SC, sans-serif" font-size="18.4" font-weight="400" fill="#6E685D" text-anchor="start"><tspan x="64" >内部看优势与短板，外部看机会与威胁。右下角的组合最危险：把短板暴露在威胁面前。</tspan></text><path d="M64 210.68H1536" stroke="#171614" stroke-width="1.2"/><text x="1536" y="76" font-family="JetBrains Mono, Noto Sans SC, monospace" font-size="12" font-weight="400" fill="#6E685D" text-anchor="end" letter-spacing="2.2"><tspan x="1536" >FIG. 22</tspan></text></g><g id="footer"><text x="1536" y="1015.8" font-family="JetBrains Mono, Noto Sans SC, monospace" font-size="10.5" font-weight="400" fill="#6E685D" text-anchor="end" letter-spacing="1.5"><tspan x="1536" >MuseDraw · Editorial Ink</tspan></text></g></svg>
