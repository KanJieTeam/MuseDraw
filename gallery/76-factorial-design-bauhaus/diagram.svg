<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1640 920" width="1640" height="920" role="img" aria-labelledby="md-title md-desc" data-theme="bauhaus"><title id="md-title">2 × 2 factorial experimental design</title><desc id="md-desc">Crossing two factors answers both main effects and whether they interact — with the same participants a one-factor study would need.</desc><defs></defs><g id="background"><rect id="canvas" width="1640" height="920" fill="#F0E8D8"/></g><g id="zones"><g id="b1-q1" data-md="zone"><rect x="146" y="300" width="420" height="230" rx="0" fill="none" stroke="#151515" stroke-width="1"/><text x="168" y="339.6" font-family="Archivo, Noto Sans SC, sans-serif" font-size="22" font-weight="700" fill="#151515" text-anchor="start" letter-spacing="1"><tspan x="168" >A1 · B0</tspan></text><text x="168" y="365.6" font-family="Archivo, Noto Sans SC, sans-serif" font-size="21" font-weight="400" fill="#4A463F" text-anchor="start"><tspan x="168" >coached, no feedback</tspan></text></g><g id="b1-q2" data-md="zone"><rect x="580" y="300" width="420" height="230" rx="0" fill="none" stroke="#151515" stroke-width="1"/><text x="602" y="339.6" font-family="Archivo, Noto Sans SC, sans-serif" font-size="22" font-weight="700" fill="#151515" text-anchor="start" letter-spacing="1"><tspan x="602" >A1 · B1</tspan></text><text x="602" y="365.6" font-family="Archivo, Noto Sans SC, sans-serif" font-size="21" font-weight="400" fill="#4A463F" text-anchor="start"><tspan x="602" >coached + feedback</tspan></text></g><g id="b1-q3" data-md="zone"><rect x="146" y="544" width="420" height="230" rx="0" fill="none" stroke="#151515" stroke-width="1"/><text x="168" y="583.6" font-family="Archivo, Noto Sans SC, sans-serif" font-size="22" font-weight="700" fill="#151515" text-anchor="start" letter-spacing="1"><tspan x="168" >A0 · B0</tspan></text><text x="168" y="609.6" font-family="Archivo, Noto Sans SC, sans-serif" font-size="21" font-weight="400" fill="#4A463F" text-anchor="start"><tspan x="168" >control</tspan></text></g><g id="b1-q4" data-md="zone"><rect x="580" y="544" width="420" height="230" rx="0" fill="none" stroke="#151515" stroke-width="1"/><text x="602" y="583.6" font-family="Archivo, Noto Sans SC, sans-serif" font-size="22" font-weight="700" fill="#151515" text-anchor="start" letter-spacing="1"><tspan x="602" >A0 · B1</tspan></text><text x="602" y="609.6" font-family="Archivo, Noto Sans SC, sans-serif" font-size="21" font-weight="400" fill="#4A463F" text-anchor="start"><tspan x="602" >feedback only</tspan></text></g><path id="line-1" d="M146 788 L1000 788" fill="none" stroke="#151515" stroke-width="1.4" stroke-linecap="round"/><path id="line-2" d="M132 300 L132 774" fill="none" stroke="#151515" stroke-width="1.4" stroke-linecap="round"/></g><g id="edges"></g><g id="nodes"></g><g id="edge-labels"></g><g id="notes"><g id="note-1" data-md="note" data-box="1080,340,480,43.74"><g><text x="1080" y="354.58" font-family="Archivo, Noto Sans SC, sans-serif" font-size="17.82" font-weight="700" fill="#D7263D">A</text><text x="1106" y="354.58" font-family="Archivo, Noto Sans SC, sans-serif" font-size="16.2" font-weight="400" fill="#151515" text-anchor="start"><tspan x="1106" >Main effect of coaching: (71 + 84)/2 − (62 + 68)/2 = 12.5</tspan><tspan x="1106" dy="21.87">points.</tspan></text></g></g><g id="note-2" data-md="note" data-box="1080,460,480,43.74"><g><text x="1080" y="474.58" font-family="Archivo, Noto Sans SC, sans-serif" font-size="17.82" font-weight="700" fill="#D7263D">B</text><text x="1106" y="474.58" font-family="Archivo, Noto Sans SC, sans-serif" font-size="16.2" font-weight="400" fill="#151515" text-anchor="start"><tspan x="1106" >Main effect of feedback: (84 + 68)/2 − (71 + 62)/2 = 9.5</tspan><tspan x="1106" dy="21.87">points.</tspan></text></g></g><g id="note-3" data-md="note" data-box="1080,580,480,43.74"><g><text x="1080" y="594.58" font-family="Archivo, Noto Sans SC, sans-serif" font-size="17.82" font-weight="700" fill="#D7263D">×</text><text x="1106" y="594.58" font-family="Archivo, Noto Sans SC, sans-serif" font-size="16.2" font-weight="400" fill="#151515" text-anchor="start"><tspan x="1106" >Interaction: feedback adds 13 points with coaching but</tspan><tspan x="1106" dy="21.87">only 6 without. The two work better together than apart.</tspan></text></g></g></g><g id="legend"></g><g id="texts"><text x="1080" y="800" font-family="Archivo, Noto Sans SC, sans-serif" font-size="13" font-weight="400" fill="#4A463F" text-anchor="start"><tspan x="1080" >Randomise 240 participants to four cells; analyse with two-way ANOVA.</tspan><tspan x="1080" dy="16.9">Illustrative numbers.</tspan></text><text x="168" y="410" font-family="Archivo, Noto Sans SC, sans-serif" font-size="20" font-weight="400" fill="#151515" text-anchor="start"><tspan x="168" >· n = 60</tspan></text><text x="168" y="444" font-family="Archivo, Noto Sans SC, sans-serif" font-size="20" font-weight="400" fill="#151515" text-anchor="start"><tspan x="168" >· mean score 71</tspan></text><text x="602" y="410" font-family="Archivo, Noto Sans SC, sans-serif" font-size="20" font-weight="400" fill="#151515" text-anchor="start"><tspan x="602" >· n = 60</tspan></text><text x="602" y="444" font-family="Archivo, Noto Sans SC, sans-serif" font-size="20" font-weight="400" fill="#151515" text-anchor="start"><tspan x="602" >· mean score 84</tspan></text><text x="168" y="654" font-family="Archivo, Noto Sans SC, sans-serif" font-size="20" font-weight="400" fill="#151515" text-anchor="start"><tspan x="168" >· n = 60</tspan></text><text x="168" y="688" font-family="Archivo, Noto Sans SC, sans-serif" font-size="20" font-weight="400" fill="#151515" text-anchor="start"><tspan x="168" >· mean score 62</tspan></text><text x="602" y="654" font-family="Archivo, Noto Sans SC, sans-serif" font-size="20" font-weight="400" fill="#151515" text-anchor="start"><tspan x="602" >· n = 60</tspan></text><text x="602" y="688" font-family="Archivo, Noto Sans SC, sans-serif" font-size="20" font-weight="400" fill="#151515" text-anchor="start"><tspan x="602" >· mean score 68</tspan></text><text x="146" y="810" font-family="Space Mono, Noto Sans SC, monospace" font-size="12" font-weight="400" fill="#4A463F" text-anchor="start"><tspan x="146" >no feedback</tspan></text><text x="1000" y="810" font-family="Space Mono, Noto Sans SC, monospace" font-size="12" font-weight="400" fill="#4A463F" text-anchor="end"><tspan x="1000" >feedback</tspan></text><text x="573" y="810" font-family="Space Mono, Noto Sans SC, monospace" font-size="12.5" font-weight="700" fill="#151515" text-anchor="middle" letter-spacing="1.5"><tspan x="573" >FACTOR B · FEEDBACK</tspan></text><g transform="rotate(-90 124 774)"><text x="124" y="774" font-family="Space Mono, Noto Sans SC, monospace" font-size="12" font-weight="400" fill="#4A463F" text-anchor="start"><tspan x="124" >self-paced</tspan></text></g><g transform="rotate(-90 124 360)"><text x="124" y="360" font-family="Space Mono, Noto Sans SC, monospace" font-size="12" font-weight="400" fill="#4A463F" text-anchor="start"><tspan x="124" >coached</tspan></text></g><g transform="rotate(-90 124 587)"><text x="124" y="587" font-family="Space Mono, Noto Sans SC, monospace" font-size="12.5" font-weight="700" fill="#151515" text-anchor="start" letter-spacing="1.5"><tspan x="124" >FACTOR A · COACHING</tspan></text></g></g><g id="header"><text x="64" y="77" font-family="Space Mono, Noto Sans SC, monospace" font-size="13" font-weight="700" fill="#D7263D" text-anchor="start" letter-spacing="1"><tspan x="64" >EXPERIMENTAL DESIGN · 2 × 2 FACTORIAL</tspan></text><text x="64" y="153.48" font-family="Archivo, Noto Sans SC, sans-serif" font-size="68" font-weight="900" fill="#151515" text-anchor="start" letter-spacing="-1"><tspan x="64" >2 × 2 FACTORIAL EXPERIMENTAL DESIGN</tspan></text><text x="64" y="196.4" font-family="Archivo, Noto Sans SC, sans-serif" font-size="19.4" font-weight="400" fill="#151515" text-anchor="start"><tspan x="64" >Crossing two factors answers both main effects and whether they interact —</tspan><tspan x="64" dy="28.13">with the same participants a one-factor study would need.</tspan></text><text x="1576" y="77" font-family="Space Mono, Noto Sans SC, monospace" font-size="13" font-weight="400" fill="#151515" text-anchor="end" letter-spacing="1"><tspan x="1576" >NO. 76</tspan></text></g><g id="footer"><text x="1576" y="884.8" font-family="Space Mono, Noto Sans SC, monospace" font-size="11" font-weight="400" fill="#151515" text-anchor="end" letter-spacing="1"><tspan x="1576" >MUSEDRAW / BAUHAUS</tspan></text></g></svg>
