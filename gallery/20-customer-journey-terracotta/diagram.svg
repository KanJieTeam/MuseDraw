="1593.5" >invoice</tspan></text></g><g id="op5" data-md="node" data-box="1400,742,212,84" data-shape="box" data-label="inside"><rect x="1400" y="742" width="212" height="84" rx="16" fill="#C0583A" stroke="#C0583A" stroke-width="1.2"/><text class="md-label" x="1416" y="778.08" font-family="Fraunces, Noto Serif SC, serif" font-size="19.4" font-weight="600" fill="#FFF6EC" text-anchor="start"><tspan x="1416" >Usage recap</tspan><tspan x="1416" dy="24.25">before the quote</tspan></text></g><g id="f0" data-md="node" data-box="337,530,18,18" data-shape="circle" data-label="inside"><ellipse cx="346" cy="539" rx="9" ry="9" fill="#6E7B3B" stroke="#6E7B3B" stroke-width="1.2"/></g><g id="f1" data-md="node" data-box="569,549,18,18" data-shape="circle" data-label="inside"><ellipse cx="578" cy="558" rx="9" ry="9" fill="#6E7B3B" stroke="#6E7B3B" stroke-width="1.2"/></g><g id="f2" data-md="node" data-box="801,632,18,18" data-shape="circle" data-label="inside"><ellipse cx="810" cy="641" rx="9" ry="9" fill="#C0583A" stroke="#C0583A" stroke-width="1.2"/></g><g id="f3" data-md="node" data-box="1033,604,18,18" data-shape="circle" data-label="inside"><ellipse cx="1042" cy="613" rx="9" ry="9" fill="#C0583A" stroke="#C0583A" stroke-width="1.2"/></g><g id="f4" data-md="node" data-box="1265,512,18,18" data-shape="circle" data-label="inside"><ellipse cx="1274" cy="521" rx="9" ry="9" fill="#6E7B3B" stroke="#6E7B3B" stroke-width="1.2"/></g><g id="f5" data-md="node" data-box="1497,563,18,18" data-shape="circle" data-label="inside"><ellipse cx="1506" cy="572" rx="9" ry="9" fill="#6E7B3B" stroke="#6E7B3B" stroke-width="1.2"/></g></g><g id="edge-labels"></g><g id="notes"><g id="note-1" data-md="note" data-box="64,890,900,46.98"><g><text x="64" y="904.58" font-family="Fraunces, Noto Serif SC, serif" font-size="17.82" font-weight="700" fill="#C0583A">!</text><text x="90" y="904.58" font-family="Fraunces, Noto Serif SC, serif" font-size="16.2" font-weight="400" fill="#3A2A20" text-anchor="start" font-style="italic"><tspan x="90" >The two lowest points are both waiting on someone else — security and data import. Neither is a product feature;</tspan><tspan x="90" dy="23.49">both are fixable this quarter.</tspan></text></g></g></g><g id="legend"><rect x="1100" y="899.688" width="22" height="16" rx="4" fill="#6E7B3B" stroke="#6E7B3B" stroke-width="1.2"/><text x="1132" y="912.15" font-family="IBM Plex Mono, Noto Sans SC, monospace" font-size="12.4" font-weight="400" fill="#7D6A5B" text-anchor="start"><tspan x="1132" >positive moment</tspan></text><rect x="1100" y="924.4879999999999" width="22" height="16" rx="4" fill="#C0583A" stroke="#C0583A" stroke-width="1.2"/><text x="1132" y="936.95" font-family="IBM Plex Mono, Noto Sans SC, monospace" font-size="12.4" font-weight="400" fill="#7D6A5B" text-anchor="start"><tspan x="1132" >pain point</tspan></text></g><g id="texts"><text x="64" y="324" font-family="IBM Plex Mono, Noto Sans SC, monospace" font-size="11.5" font-weight="600" fill="#7D6A5B" text-anchor="start" letter-spacing="1.8"><tspan x="64" >DOING</tspan></text><text x="64" y="410" font-family="IBM Plex Mono, Noto Sans SC, monospace" font-size="11.5" font-weight="600" fill="#7D6A5B" text-anchor="start" letter-spacing="1.8"><tspan x="64" >TOUCHPOINTS</tspan></text><text x="64" y="490" font-family="IBM Plex Mono, Noto Sans SC, monospace" font-size="11.5" font-weight="600" fill="#7D6A5B" text-anchor="start" letter-spacing="1.8"><tspan x="64" >FEELING</tspan></text><text x="64" y="756" font-family="IBM Plex Mono, Noto Sans SC, monospace" font-size="11.5" font-weight="600" fill="#7D6A5B" text-anchor="start" letter-spacing="1.8"><tspan x="64" >OPPORTUNITY</tspan></text><text x="246" y="322" font-family="Inter, Noto Sans SC, sans-serif" font-size="13.5" font-weight="400" fill="#3A2A20" text-anchor="start"><tspan x="246" >Hears about us from a</tspan><tspan x="246" dy="17.55">colleague</tspan></text><text x="478" y="322" font-family="Inter, Noto Sans SC, sans-serif" font-size="13.5" font-weight="400" fill="#3A2A20" text-anchor="start"><tspan x="478" >Compares 3 tools, reads</tspan><tspan x="478" dy="17.55">reviews</tspan></text><text x="710" y="322" font-family="Inter, Noto Sans SC, sans-serif" font-size="13.5" font-weight="400" fill="#3A2A20" text-anchor="start"><tspan x="710" >Starts trial, needs IT</tspan><tspan x="710" dy="17.55">approval</tspan></text><text x="942" y="322" font-family="Inter, Noto Sans SC, sans-serif" font-size="13.5" font-weight="400" fill="#3A2A20" text-anchor="start"><tspan x="942" >Invites team, imports old</tspan><tspan x="942" dy="17.55">data</tspan></text><text x="1174" y="322" font-family="Inter, Noto Sans SC, sans-serif" font-size="13.5" font-weight="400" fill="#3A2A20" text-anchor="start"><tspan x="1174" >Weekly reports run on their</tspan><tspan x="1174" dy="17.55">own</tspan></text><text x="1406" y="322" font-family="Inter, Noto Sans SC, sans-serif" font-size="13.5" font-weight="400" fill="#3A2A20" text-anchor="start"><tspan x="1406" >Gets the renewal quote</tspan></text><text x="220" y="494" font-family="IBM Plex Mono, Noto Sans SC, monospace" font-size="11" font-weight="400" fill="#7D6A5B" text-anchor="end"><tspan x="220" >delighted</tspan></text><text x="220" y="694" font-family="IBM Plex Mono, Noto Sans SC, monospace" font-size="11" font-weight="400" fill="#7D6A5B" text-anchor="end"><tspan x="220" >frustrated</tspan></text><text x="346" y="493" font-family="Fraunces, Noto Serif SC, serif" font-size="13.5" font-weight="400" fill="#3A2A20" text-anchor="middle" font-style="italic"><tspan x="346" >“Looks like it fixes our</tspan><tspan x="346" dy="17.55">reporting mess.”</tspan></text><text x="578" y="512" font-family="Fraunces, Noto Serif SC, serif" font-size="13.5" font-weight="400" fill="#3A2A20" text-anchor="middle" font-style="italic"><tspan x="578" >“Which plan do we actually</tspan><tspan x="578" dy="17.55">need?”</tspan></text><text x="810" y="679" font-family="Fraunces, Noto Serif SC, serif" font-size="13.5" font-weight="400" fill="#3A2A20" text-anchor="middle" font-style="italic"><tspan x="810" >“Why does security need four</tspan><tspan x="810" dy="17.55">weeks?”</tspan></text><text x="1042" y="651" font-family="Fraunces, Noto Serif SC, serif" font-size="13.5" font-weight="400" fill="#3A2A20" text-anchor="middle" font-style="italic"><tspan x="1042" >“Importing was harder than</tspan><tspan x="1042" dy="17.55">promised.”</tspan></text><text x="1274" y="475" font-family="Fraunces, Noto Serif SC, serif" font-size="13.5" font-weight="400" fill="#3A2A20" text-anchor="middle" font-style="italic"><tspan x="1274" >“I got my Fridays back.”</tspan></text><text x="1506" y="526" font-family="Fraunces, Noto Serif SC, serif" font-size="13.5" font-weight="400" fill="#3A2A20" text-anchor="middle" font-style="italic"><tspan x="1506" >“Fair price — if usage stays</tspan><tspan x="1506" dy="17.55">this high.”</tspan></text></g><g id="header"><text x="64" y="76" font-family="IBM Plex Mono, Noto Sans SC, monospace" font-size="12" font-weight="600" fill="#C0583A" text-anchor="start" letter-spacing="2"><tspan x="64" >B2B ANALYTICS TOOL · MID-SIZE FINANCE TEAMS</tspan></text><text x="64" y="138.72" font-family="Fraunces, Noto Serif SC, serif" font-size="52" font-weight="600" fill="#3A2A20" text-anchor="start" letter-spacing="-1"><tspan x="64" >Customer journey map</tspan></text><text x="64" y="178.4" font-family="Inter, Noto Sans SC, sans-serif" font-size="18.4" font-weight="400" fill="#7D6A5B" text-anchor="start"><tspan x="64" >One customer type, six stages. The curve is how they feel; the clay cards are where a small fix removes a big dip.</tspan></text></g><g id="footer"><text x="1616" y="1004.8" font-family="IBM Plex Mono, Noto Sans SC, monospace" font-size="10.5" font-weight="400" fill="#7D6A5B" text-anchor="end" letter-spacing="1.5"><tspan x="1616" >MuseDraw · Terracotta</tspan></text></g></svg>
