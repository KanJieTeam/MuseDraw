an><tspan x="1136" dy="21.87">coordinating a release.</tspan></text></g></g></g><g id="legend"><path d="M100 1108.06H134" stroke="#151515" stroke-width="3" stroke-linecap="round"/><path d="M138 1108.06 L131 1111.91 L131 1104.21 Z" fill="#151515"/><text x="148" y="1112.74" font-family="Space Mono, Noto Sans SC, monospace" font-size="13" font-weight="400" fill="#151515" text-anchor="start"><tspan x="148" >request / response</tspan></text><path d="M316.4 1108.06H350.4" stroke="#D7263D" stroke-width="3" stroke-linecap="round"/><path d="M354.4 1108.06 L347.4 1111.91 L347.4 1104.21 Z" fill="#D7263D"/><text x="364.4" y="1112.74" font-family="Space Mono, Noto Sans SC, monospace" font-size="13" font-weight="400" fill="#151515" text-anchor="start"><tspan x="364.4" >event</tspan></text></g><g id="texts"></g><g id="header"><text x="64" y="77" font-family="Space Mono, Noto Sans SC, monospace" font-size="13" font-weight="700" fill="#D7263D" text-anchor="start" letter-spacing="1"><tspan x="64" >MICROSERVICES · CHOREOGRAPHY WITH EVENTS</tspan></text><text x="64" y="153.48" font-family="Archivo, Noto Sans SC, sans-serif" font-size="68" font-weight="900" fill="#151515" text-anchor="start" letter-spacing="-1"><tspan x="64" >E-COMMERCE</tspan><tspan x="64" dy="64.6">MICROSERVICES</tspan></text><text x="64" y="261" font-family="Archivo, Noto Sans SC, sans-serif" font-size="19.4" font-weight="400" fill="#151515" text-anchor="start"><tspan x="64" >Shape tells the role: squares answer requests, circles react to events, the</tspan><tspan x="64" dy="28.13">diamond routes traffic. Red lines are events on the bus.</tspan></text><text x="1536" y="77" font-family="Space Mono, Noto Sans SC, monospace" font-size="13" font-weight="400" fill="#151515" text-anchor="end" letter-spacing="1"><tspan x="1536" >NO. 09</tspan></text></g><g id="footer"><text x="1536" y="1104.8" font-family="Space Mono, Noto Sans SC, monospace" font-size="11" font-weight="400" fill="#151515" text-anchor="end" letter-spacing="