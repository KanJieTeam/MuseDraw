 Sans SC, Inter, sans-serif" font-size="12" font-weight="400" fill="#787774" text-anchor="middle"><tspan x="425.71" >第 2 周</tspan></text><text x="521.43" y="282" font-family="Noto Sans SC, Inter, sans-serif" font-size="12" font-weight="400" fill="#787774" text-anchor="middle"><tspan x="521.43" >第 4 周</tspan></text><text x="617.14" y="282" font-family="Noto Sans SC, Inter, sans-serif" font-size="12" font-weight="400" fill="#787774" text-anchor="middle"><tspan x="617.14" >第 6 周</tspan></text><text x="712.86" y="282" font-family="Noto Sans SC, Inter, sans-serif" font-size="12" font-weight="400" fill="#787774" text-anchor="middle"><tspan x="712.86" >第 8 周</tspan></text><text x="808.57" y="282" font-family="Noto Sans SC, Inter, sans-serif" font-size="12" font-weight="400" fill="#787774" text-anchor="middle"><tspan x="808.57" >第 10 周</tspan></text><text x="904.29" y="282" font-family="Noto Sans SC, Inter, sans-serif" font-size="12" font-weight="400" fill="#787774" text-anchor="middle"><tspan x="904.29" >第 12 周</tspan></text><text x="1000" y="282" font-family="Noto Sans SC, Inter, sans-serif" font-size="12" font-weight="400" fill="#787774" text-anchor="middle"><tspan x="1000" >第 14 周</tspan></text><text x="1040" y="282" font-family="Noto Sans SC, Inter, sans-serif" font-size="12" font-weight="400" fill="#787774" text-anchor="start"><tspan x="1040" >剩余文献（篇）</tspan></text><text x="1270" y="282" font-family="Noto Sans SC, Inter, sans-serif" font-size="12" font-weight="400" fill="#787774" text-anchor="start"><tspan x="1270" >这一步要留下的记录</tspan></text><text x="60" y="326" font-family="Noto Sans SC, Inter, sans-serif" font-size="22" font-weight="700" fill="#D9730D" text-anchor="start"><tspan x="60" >1</tspan></text><text x="96" y="322" font-family="Noto Sans SC, Inter, sans-serif" font-size="17" font-weight="700" fill="#37352F" text-anchor="start"><tspan x="96" >选题</tspan></text><text x="96" y="346" font-family="Noto Sans SC, Inter, sans-serif" font-size="13" font-weight="400" fill="#787774" text-anchor="start"><tspan x="96" >缩小到一个可回答的问题</tspan></text><text x="1270" y="330" font-family="Noto Sans SC, Inter, sans-serif" font-size="13.5" font-weight="400" fill="#37352F" text-anchor="start"><tspan x="1270" >PICO：老年住院患者 / 夜间巡视 / 常规护理 / 跌倒</tspan></text><text x="60" y="398" font-family="Noto Sans SC, Inter, sans-serif" font-size="22" font-weight="700" fill="#D9730D" text-anchor="start"><tspan x="60" >2</tspan></text><text x="96" y="394" font-family="Noto Sans SC, Inter, sans-serif" font-size="17" font-weight="700" fill="#37352F" text-anchor="start"><tspan x="96" >检索</tspan></text><text x="96" y="418" font-family="Noto Sans SC, Inter, sans-serif" font-size="13" font-weight="400" fill="#787774" text-anchor="start"><tspan x="96" >3 个数据库 + 1 个中文库</tspan></text><text x="1048" y="403" font-family="JetBrains Mono, Noto Sans SC, monospace" font-size="13" font-weight="700" fill="#37352F" text-anchor="start"><tspan x="1048" >1,204</tspan></text><text x="1270" y="402" font-family="Noto Sans SC, Inter, sans-serif" font-size="13.5" font-weight="400" fill="#37352F" text-anchor="start"><tspan x="1270" >PubMed、Embase、CINAHL、CNKI，保存检索式</tspan></text><text x="60" y="470" font-family="Noto Sans SC, Inter, sans-serif" font-size="22" font-weight="700" fill="#D9730D" text-anchor="start"><tspan x="60" >3</tspan></text><text x="96" y="466" font-family="Noto Sans SC, Inter, sans-serif" font-size="17" font-weight="700" fill="#37352F" text-anchor="start"><tspan x="96" >去重</tspan></text><text x="96" y="490" font-family="Noto Sans SC, Inter, sans-serif" font-size="13" font-weight="400" fill="#787774" text-anchor="start"><tspan x="96" >EndNote / Zotero 自动去重</tspan></text><text x="1182.88" y="475" font-family="JetBrains Mono, Noto Sans SC, monospace" font-size="13" font-weight="700" fill="#37352F" text-anchor="start"><tspan x="1182.88" >812</tspan></text><text x="60" y="542" font-family="Noto Sans SC, Inter, sans-serif" font-size="22" font-weight="700" fill="#D9730D" text-anchor="start"><tspan x="60" >4</tspan></text><text x="96" y="538" font-family="Noto Sans SC, Inter, sans-serif" font-size="17" font-weight="700" fill="#37352F" text-anchor="start"><tspan x="96" >初筛</tspan></text><text x="96" y="562" font-family="Noto Sans SC, Inter, sans-serif" font-size="13" font-weight="400" fill="#787774" text-anchor="start"><tspan x="96" >读题目与摘要，两人独立</tspan></text><text x="1072.25" y="547" font-family="JetBrains Mono, Noto Sans SC, monospace" font-size="13" font-weight="700" fill="#37352F" text-anchor="start"><tspan x="1072.25" >146</tspan></text><text x="1270" y="546" font-family="Noto Sans SC, Inter, sans-serif" font-size="13.5" font-weight="400" fill="#37352F" text-anchor="start"><tspan x="1270" >分歧由第三人裁决，记录 κ 值</tspan></text><text x="60" y="614" font-family="Noto Sans SC, Inter, sans-serif" font-size="22" font-weight="700" fill="#D9730D" text-anchor="start"><tspan x="60" >5</tspan></text><text x="96" y="610" font-family="Noto Sans SC, Inter, sans-serif" font-size="17" font-weight="700" fill="#37352F" text-anchor="start"><tspan x="96" >全文</tspan></text><text x="96" y="634" font-family="Noto Sans SC, Inter, sans-serif" font-size="13" font-weight="400" fill="#787774" text-anchor="start"><tspan x="96" >按纳入标准逐篇判断</tspan></text><text x="1054.31" y="619" font-family="JetBrains Mono, Noto Sans SC, monospace" font-size="13" font-weight="700" fill="#37352F" text-anchor="start"><tspan x="1054.31" >38</tspan></text><text x="1270" y="618" font-family="Noto Sans SC, Inter, sans-serif" font-size="13.5" font-weight="400" fill="#37352F" text-anchor="start"><tspan x="1270" >排除原因逐条记录，供 PRISMA 图使用</tspan></text><text x="60" y="686" font-family="Noto Sans SC, Inter, sans-serif" font-size="22" font-weight="700" fill="#D9730D" text-anchor="start"><tspan x="60" >6</tspan></text><text x="96" y="682" font-family="Noto Sans SC, Inter, sans-serif" font-size="17" font-weight="700" fill="#37352F" text-anchor="start"><tspan x="96" >提取</tspan></text><text x="96" y="706" font-family="Noto Sans SC, Inter, sans-serif" font-size="13" font-weight="400" fill="#787774" text-anchor="start"><tspan x="96" >统一表格提取研究特征</tspan></text><text x="1054.31" y="691" font-family="JetBrains Mono, Noto Sans SC, monospace" font-size="13" font-weight="700" fill="#37352F" text-anchor="start"><tspan x="1054.31" >38</tspan></text><text x="1270" y="690" font-family="Noto Sans SC, Inter, sans-serif" font-size="13.5" font-weight="400" fill="#37352F" text-anchor="start"><tspan x="1270" >作者、年份、样本、干预、结局、偏倚</tspan></text><text x="60" y="758" font-family="Noto Sans SC, Inter, sans-serif" font-size="22" font-weight="700" fill="#D9730D" text-anchor="start"><tspan x="60" >7</tspan></text><text x="96" y="754" font-family="Noto Sans SC, Inter, sans-serif" font-size="17" font-weight="700" fill="#37352F" text-anchor="start"><tspan x="96" >综合</tspan></text><text x="96" y="778" font-family="Noto Sans SC, Inter, sans-serif" font-size="13" font-weight="400" fill="#787774" text-anchor="start"><tspan x="96" >按主题归纳，标出分歧</tspan></text><text x="1054.31" y="763" font-family="JetBrains Mono, Noto Sans SC, monospace" font-size="13" font-weight="700" fill="#37352F" text-anchor="start"><tspan x="1054.31" >38</tspan></text><text x="1270" y="762" font-family="Noto Sans SC, Inter, sans-serif" font-size="13.5" font-weight="400" fill="#37352F" text-anchor="start"><tspan x="1270" >不是逐篇复述，而是“谁和谁结论不同、为什么”</tspan></text><text x="60" y="830" font-family="Noto Sans SC, Inter, sans-serif" font-size="22" font-weight="700" fill="#D9730D" text-anchor="start"><tspan x="60" >8</tspan></text><text x="96" y="826" font-family="Noto Sans SC, Inter, sans-serif" font-size="17" font-weight="700" fill="#37352F" text-anchor="start"><tspan x="96" >写作</tspan></text><text x="96" y="850" font-family="Noto Sans SC, Inter, sans-serif" font-size="13" font-weight="400" fill="#787774" text-anchor="start"><tspan x="96" >引言、方法、结果、讨论</tspan></text><text x="1270" y="834" font-family="Noto Sans SC, Inter, sans-serif" font-size="13.5" font-weight="400" fill="#37352F" text-anchor="start"><tspan x="1270" >每段先写结论句，再列证据</tspan></text></g><g id="header"><text x="72" y="86" font-family="Noto Sans SC, Inter, sans-serif" font-size="14" font-weight="400" fill="#787774" text-anchor="start" letter-spacing="0.5"><tspan x="72" >研究生必修 · 系统性文献综述</tspan></text><text x="72" y="140.12" font-family="Noto Sans SC, Inter, sans-serif" font-size="42" font-weight="700" fill="#37352F" text-anchor="start"><tspan x="72" >文献综述写作流程</tspan></text><text x="72" y="177.3" font-family="Noto Sans SC, Inter, sans-serif" font-size="17.3" font-weight="400" fill="#787774" text-anchor="start"><tspan x="72" >八步、约 14 周。左边是每一步占用的时间，中间是还剩多少篇文献，右边是这一步必须留下的记录。1,204 篇检索结果最终纳入 38 篇。数据为示例。</tspan></text></g><g id="footer"><text x="1588" y="920.4" font-family="Noto Sans SC, Inter, sans-serif" font-size="12" font-weight="400" fill="#B4B4B0" text-anchor="end" letter-spacing="1"><tspan x="1588" >MuseDraw · 柔和笔记</tspan></text></g></svg>
