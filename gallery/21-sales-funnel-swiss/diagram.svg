<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1640 1000" width="1640" height="1000" role="img" aria-labelledby="md-title md-desc" data-theme="swiss"><title id="md-title">Self-serve funnel,
last 90 days</title><desc id="md-desc">Every step loses people. The question is which loss is cheapest to fix — here it is activation, not traffic.</desc><defs></defs><g id="background"><rect id="canvas" width="1640" height="1000" fill="#F2F1EC"/></g><g id="zones"><g id="rule" data-md="zone"><path d="M64 384H1576" stroke="#0B0B0B" stroke-width="3"/><text x="64" y="411" font-family="Space Mono, Noto Sans SC, monospace" font-size="13" font-weight="700" fill="#0B0B0B" text-anchor="start" letter-spacing="1"><tspan x="64" >STAGE · COUNT · STEP CONVERSION</tspan></text></g></g><g id="edges"></g><g id="nodes"><g id="b1-f1" data-md="node" data-box="64,420,640,92" data-shape="trapezoid" data-label="inside"><path d="M64 420H704L659.2 512H108.80000000000001Z" fill="#0B0B0B" stroke="none" stroke-width="0" stroke-linejoin="round"/><text class="md-label" x="384" y="472.56" font-family="Archivo, Noto Sans SC, sans-serif" font-size="20.5" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="384" >Visitors</tspan></text></g><g id="b1-f2" data-md="node" data-box="108.8,522,550.4,92" data-shape="trapezoid" data-label="inside"><path d="M108.8 522H659.1999999999999L614.3999999999999 614H153.60000000000002Z" fill="#0B0B0B" stroke="none" stroke-width="0" stroke-linejoin="round"/><text class="md-label" x="384" y="574.56" font-family="Archivo, Noto Sans SC, sans-serif" font-size="20.5" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="384" >Sign-ups</tspan></text></g><g id="b1-f3" data-md="node" data-box="153.6,624,460.8,92" data-shape="trapezoid" data-label="inside"><path d="M153.6 624H614.4L569.6 716H198.39999999999995Z" fill="#E3001B" stroke="none" stroke-width="0" stroke-linejoin="round"/><text class="md-label" x="384" y="676.56" font-family="Archivo, Noto Sans SC, sans-serif" font-size="20.5" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="384" >Activated</tspan></text></g><g id="b1-f4" data-md="node" data-box="198.4,726,371.2,92" data-shape="trapezoid" data-label="inside"><path d="M198.4 726H569.6L524.8 818H243.20000000000002Z" fill="#0B0B0B" stroke="none" stroke-width="0" stroke-linejoin="round"/><text class="md-label" x="384" y="778.56" font-family="Archivo, Noto Sans SC, sans-serif" font-size="20.5" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="384" >Paid</tspan></text></g><g id="b1-f5" data-md="node" data-box="243.2,828,281.6,92" data-shape="trapezoid" data-label="inside"><path d="M243.2 828H524.8L479.99999999999994 920H288Z" fill="#0B0B0B" stroke="none" stroke-width="0" stroke-linejoin="round"/><text class="md-label" x="384" y="880.56" font-family="Archivo, Noto Sans SC, sans-serif" font-size="20.5" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="384" >Expanded</tspan></text></g></g><g id="edge-labels"></g><g id="notes"><g id="note-1" data-md="note" data-box="1220,600,340,83.35"><g><text x="1220" y="613.59" font-family="Archivo, Noto Sans SC, sans-serif" font-size="16.61" font-weight="700" fill="#E3001B">→</text><text x="1246" y="613.59" font-family="Archivo, Noto Sans SC, sans-serif" font-size="15.1" font-weight="400" fill="#0B0B0B" text-anchor="start"><tspan x="1246" >Activation loses 55% of sign-ups. Most</tspan><tspan x="1246" dy="20.84">never connect a data source; a sample</tspan><tspan x="1246" dy="20.84">dataset on first login is the cheapest</tspan><tspan x="1246" dy="20.84">experiment on this page.</tspan></text></g></g><g id="note-2" data-md="note" data-box="1220,760,340,62.51"><g><text x="1220" y="773.59" font-family="Archivo, Noto Sans SC, sans-serif" font-size="16.61" font-weight="700" fill="#E3001B">→</text><text x="1246" y="773.59" font-family="Archivo, Noto Sans SC, sans-serif" font-size="15.1" font-weight="400" fill="#0B0B0B" text-anchor="start"><tspan x="1246" >Paid conversion of activated users is 24%, in</tspan><tspan x="1246" dy="20.84">line with benchmarks. Don&apos;t touch pricing</tspan><tspan x="1246" dy="20.84">yet.</tspan></text></g></g></g><g id="legend"></g><g id="texts"><text x="744" y="468" font-family="Archivo, Noto Sans SC, sans-serif" font-size="30" font-weight="800" fill="#0B0B0B" text-anchor="start"><tspan x="744" >120,000</tspan></text><text x="744" y="490" font-family="Archivo, Noto Sans SC, sans-serif" font-size="13.5" font-weight="400" fill="#5E5E5A" text-anchor="start"><tspan x="744" >organic 61% · paid 22% · referral 17%</tspan></text><text x="744" y="570" font-family="Archivo, Noto Sans SC, sans-serif" font-size="30" font-weight="800" fill="#0B0B0B" text-anchor="start"><tspan x="744" >9,600</tspan></text><text x="744" y="592" font-family="Archivo, Noto Sans SC, sans-serif" font-size="13.5" font-weight="400" fill="#5E5E5A" text-anchor="start"><tspan x="744" >email or Google, no card</tspan></text><text x="974" y="521" font-family="Space Mono, Noto Sans SC, monospace" font-size="13" font-weight="700" fill="#E3001B" text-anchor="start"><tspan x="974" >8% convert</tspan></text><text x="744" y="672" font-family="Archivo, Noto Sans SC, sans-serif" font-size="30" font-weight="800" fill="#0B0B0B" text-anchor="start"><tspan x="744" >4,300</tspan></text><text x="744" y="694" font-family="Archivo, Noto Sans SC, sans-serif" font-size="13.5" font-weight="400" fill="#5E5E5A" text-anchor="start"><tspan x="744" >created a first report within 7 days</tspan></text><text x="974" y="623" font-family="Space Mono, Noto Sans SC, monospace" font-size="13" font-weight="700" fill="#E3001B" text-anchor="start"><tspan x="974" >44.8% convert</tspan></text><text x="744" y="774" font-family="Archivo, Noto Sans SC, sans-serif" font-size="30" font-weight="800" fill="#0B0B0B" text-anchor="start"><tspan x="744" >1,050</tspan></text><text x="744" y="796" font-family="Archivo, Noto Sans SC, sans-serif" font-size="13.5" font-weight="400" fill="#5E5E5A" text-anchor="start"><tspan x="744" >converted after the 14-day trial</tspan></text><text x="974" y="725" font-family="Space Mono, Noto Sans SC, monospace" font-size="13" font-weight="700" fill="#E3001B" text-anchor="start"><tspan x="974" >24.4% convert</tspan></text><text x="744" y="876" font-family="Archivo, Noto Sans SC, sans-serif" font-size="30" font-weight="800" fill="#0B0B0B" text-anchor="start"><tspan x="744" >310</tspan></text><text x="744" y="898" font-family="Archivo, Noto Sans SC, sans-serif" font-size="13.5" font-weight="400" fill="#5E5E5A" text-anchor="start"><tspan x="744" >added seats within 90 days</tspan></text><text x="974" y="827" font-family="Space Mono, Noto Sans SC, monospace" font-size="13" font-weight="700" fill="#E3001B" text-anchor="start"><tspan x="974" >29.5% convert</tspan></text></g><g id="header"><text x="64" y="77" font-family="Space Mono, Noto Sans SC, monospace" font-size="13" font-weight="700" fill="#E3001B" text-anchor="start" letter-spacing="1"><tspan x="64" >SELF-SERVE FUNNEL · LAST 90 DAYS</tspan></text><text x="64" y="163.8" font-family="Archivo, Noto Sans SC, sans-serif" font-size="80" font-weight="800" fill="#0B0B0B" text-anchor="start" letter-spacing="-2.5"><tspan x="64" >Self-serve funnel,</tspan><tspan x="64" dy="76">last 90 days</tspan></text><text x="64" y="284.4" font-family="Archivo, Noto Sans SC, sans-serif" font-size="19.4" font-weight="400" fill="#0B0B0B" text-anchor="start"><tspan x="64" >Every step loses people. The question is which loss is cheapest to fix</tspan><tspan x="64" dy="28.13">— here it is activation, not traffic.</tspan></text><text x="1576" y="77" font-family="Space Mono, Noto Sans SC, monospace" font-size="13" font-weight="400" fill="#0B0B0B" text-anchor="end" letter-spacing="1"><tspan x="1576" >GROWTH / 03</tspan></text></g><g id="footer"><text x="1576" y="964.8" font-family="Space Mono, Noto Sans SC, monospace" font-size="11" font-weight="400" fill="#0B0B0B" text-anchor="end"><tspan x="1576" >MuseDraw / Swiss Poster</tspan></text></g></svg>
