<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1110" width="1600" height="1110" role="img" aria-labelledby="md-title md-desc" data-theme="editorial"><title id="md-title">Transformer architecture</title><desc id="md-desc">Two stacks of identical blocks. The encoder turns a sentence into context-rich vectors; the decoder writes the output one token at a time while attending to them.</desc><defs><filter id="tex-grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="7" stitchTiles="stitch"/><feColorMatrix type="matrix" values="0 0 0 0 0.35  0 0 0 0 0.3  0 0 0 0 0.22  0 0 0 0.5 0"/></filter></defs><g id="background"><rect id="canvas" width="1600" height="1110" fill="#F3EEE4"/><rect width="1600" height="1110" filter="url(#tex-grain)" opacity="0.22"/></g><g id="zones"><g id="enc" data-md="zone"><rect x="140" y="556" width="320" height="314" rx="0" fill="none" stroke="#171614" stroke-width="1"/><text x="152" y="577.52" font-family="JetBrains Mono, Noto Sans SC, monospace" font-size="11.9" font-weight="600" fill="#171614" text-anchor="start" letter-spacing="2"><tspan x="152" >ENCODER  ×6</tspan></text></g><g id="dec" data-md="zone"><rect x="580" y="408" width="320" height="462" rx="0" fill="none" stroke="#171614" stroke-width="1"/><text x="592" y="429.52" font-family="JetBrains Mono, Noto Sans SC, monospace" font-size="11.9" font-weight="600" fill="#171614" text-anchor="start" letter-spacing="2"><tspan x="592" >DECODER  ×6</tspan></text></g></g><g id="edges"><g id="edge-e_in-e_pos" data-md="edge"><path d="M300 977 L300 970.2" fill="none" stroke="#171614" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M300 963 L304.95 972 L295.05 972 Z" fill="#171614"/></g><g id="edge-e_pos-e_mha" data-md="edge"><path d="M300 917 L300 862.2" fill="none" stroke="#171614" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M300 855 L304.95 864 L295.05 864 Z" fill="#171614"/></g><g id="edge-e_mha-e_an1" data-md="edge"><path d="M300 797 L300 790.2" fill="none" stroke="#171614" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M300 783 L304.95 792 L295.05 792 Z" fill="#171614"/></g><g id="edge-e_an1-e_ff" data-md="edge"><path d="M300 737 L300 722.2" fill="none" stroke="#171614" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M300 715 L304.95 724 L295.05 724 Z" fill="#171614"/></g><g id="edge-e_ff-e_an2" data-md="edge"><path d="M300 657 L300 650.2" fill="none" stroke="#171614" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M300 643 L304.95 652 L295.05 652 Z" fill="#171614"/></g><g id="edge-d_in-d_pos" data-md="edge"><path d="M740 977 L740 970.2" fill="none" stroke="#171614" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M740 963 L744.95 972 L735.05 972 Z" fill="#171614"/></g><g id="edge-d_pos-d_mmha" data-md="edge"><path d="M740 917 L740 862.2" fill="none" stroke="#171614" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M740 855 L744.95 864 L735.05 864 Z" fill="#171614"/></g><g id="edge-d_mmha-d_an1" data-md="edge"><path d="M740 797 L740 790.2" fill="none" stroke="#171614" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M740 783 L744.95 792 L735.05 792 Z" fill="#171614"/></g><g id="edge-d_an1-d_xa" data-md="edge"><path d="M740 737 L740 722.2" fill="none" stroke="#171614" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M740 715 L744.95 724 L735.05 724 Z" fill="#171614"/></g><g id="edge-d_xa-d_an2" data-md="edge"><path d="M740 645 L740 638.2" fill="none" stroke="#171614" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M740 631 L744.95 640 L735.05 640 Z" fill="#171614"/></g><g id="edge-d_an2-d_ff" data-md="edge"><path d="M740 585 L740 574.2" fill="none" stroke="#171614" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M740 567 L744.95 576 L735.05 576 Z" fill="#171614"/></g><g id="edge-d_ff-d_an3" data-md="edge"><path d="M740 509 L740 502.2" fill="none" stroke="#171614" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M740 495 L744.95 504 L735.05 504 Z" fill="#171614"/></g><g id="edge-d_an3-lin" data-md="edge"><path d="M740 449 L740 412.2" fill="none" stroke="#171614" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M740 405 L744.95 414 L735.05 414 Z" fill="#171614"/></g><g id="edge-lin-sm" data-md="edge"><path d="M740 359 L740 354.2" fill="none" stroke="#171614" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M740 347 L744.95 356 L735.05 356 Z" fill="#171614"/></g><g id="edge-e_an2-d_xa" data-md="edge"><path d="M300 597 L300 546 Q300 540 306 540 L514 540 Q520 540 520 546 L520 674 Q520 680 526 680 L608 680" fill="none" stroke="#C93C14" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M617 680 L605.75 686.19 L605.75 673.81 Z" fill="#C93C14"/></g><g id="edge-e_pos-e_an1" data-md="edge"><path d="M177 940 L166 940 Q160 940 160 934 L160 776.9 Q160 772 164.9 772 L169.8 772" fill="none" stroke="#171614" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1.5 5"/><path d="M177 772 L168 776.95 L168 767.05 Z" fill="#171614"/></g><g id="edge-e_an1-e_an2" data-md="edge"><path d="M177 748 L166 748 Q160 748 160 742 L160 624.9 Q160 620 164.9 620 L169.8 620" fill="none" stroke="#171614" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1.5 5"/><path d="M177 620 L168 624.95 L168 615.05 Z" fill="#171614"/></g><g id="edge-d_pos-d_an1" data-md="edge"><path d="M617 940 L606 940 Q600 940 600 934 L600 776.9 Q600 772 604.9 772 L609.8 772" fill="none" stroke="#171614" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1.5 5"/><path d="M617 772 L608 776.95 L608 767.05 Z" fill="#171614"/></g><g id="edge-d_an1-d_an2" data-md="edge"><path d="M617 748 L606 748 Q600 748 600 742 L600 624.9 Q600 620 604.9 620 L609.8 620" fill="none" stroke="#171614" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1.5 5"/><path d="M617 620 L608 624.95 L608 615.05 Z" fill="#171614"/></g><g id="edge-d_an2-d_an3" data-md="edge"><path d="M617 596 L606 596 Q600 596 600 590 L600 476.9 Q600 472 604.9 472 L609.8 472" fill="none" stroke="#171614" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1.5 5"/><path d="M617 472 L608 476.95 L608 467.05 Z" fill="#171614"/></g></g><g id="nodes"><g id="e_in" data-md="node" data-box="180,980,240,52" data-shape="box" data-label="inside"><rect x="180" y="980" width="240" height="52" rx="0" fill="#E7DFCF" stroke="#E7DFCF" stroke-width="1.2"/><text class="md-label" x="300" y="1010.8" font-family="Inter, Noto Sans SC, sans-serif" font-size="15" font-weight="600" fill="#171614" text-anchor="middle"><tspan x="300" >Input embedding</tspan></text></g><g id="e_pos" data-md="node" data-box="180,920,240,40" data-shape="box" data-label="inside"><rect x="180" y="920" width="240" height="40" rx="0" fill="none" stroke="#6E685D" stroke-width="1.2" stroke-dasharray="3 4"/><text class="md-label" x="300" y="944.8" font-family="Inter, Noto Sans SC, sans-serif" font-size="15" font-weight="600" fill="#6E685D" text-anchor="middle"><tspan x="300" >+ positional encoding</tspan></text></g><g id="e_mha" data-md="node" data-box="180,800,240,52" data-shape="box" data-label="inside"><rect x="180" y="800" width="240" height="52" rx="0" fill="#FBF8F1" stroke="#171614" stroke-width="1.2"/><text class="md-label" x="300" y="830.8" font-family="Inter, Noto Sans SC, sans-serif" font-size="15" font-weight="600" fill="#171614" text-anchor="middle"><tspan x="300" >Multi-head self-attention</tspan></text></g><g id="e_an1" data-md="node" data-box="180,740,240,40" data-shape="box" data-label="inside"><rect x="180" y="740" width="240" height="40" rx="0" fill="#E7DFCF" stroke="#E7DFCF" stroke-width="1.2"/><text class="md-label" x="300" y="764.8" font-family="Inter, Noto Sans SC, sans-serif" font-size="15" font-weight="600" fill="#171614" text-anchor="middle"><tspan x="300" >Add &amp; norm</tspan></text></g><g id="e_ff" data-md="node" data-box="180,660,240,52" data-shape="box" data-label="inside"><rect x="180" y="660" width="240" height="52" rx="0" fill="#FBF8F1" stroke="#171614" stroke-width="1.2"/><text class="md-label" x="300" y="690.8" font-family="Inter, Noto Sans SC, sans-serif" font-size="15" font-weight="600" fill="#171614" text-anchor="middle"><tspan x="300" >Feed-forward</tspan></text></g><g id="e_an2" data-md="node" data-box="180,600,240,40" data-shape="box" data-label="inside"><rect x="180" y="600" width="240" height="40" rx="0" fill="#E7DFCF" stroke="#E7DFCF" stroke-width="1.2"/><text class="md-label" x="300" y="624.8" font-family="Inter, Noto Sans SC, sans-serif" font-size="15" font-weight="600" fill="#171614" text-anchor="middle"><tspan x="300" >Add &amp; norm</tspan></text></g><g id="d_in" data-md="node" data-box="620,980,240,52" data-shape="box" data-label="inside"><rect x="620" y="980" width="240" height="52" rx="0" fill="#E7DFCF" stroke="#E7DFCF" stroke-width="1.2"/><text class="md-label" x="740" y="1010.8" font-family="Inter, Noto Sans SC, sans-serif" font-size="15" font-weight="600" fill="#171614" text-anchor="middle"><tspan x="740" >Output embedding</tspan></text></g><g id="d_pos" data-md="node" data-box="620,920,240,40" data-shape="box" data-label="inside"><rect x="620" y="920" width="240" height="40" rx="0" fill="none" stroke="#6E685D" stroke-width="1.2" stroke-dasharray="3 4"/><text class="md-label" x="740" y="944.8" font-family="Inter, Noto Sans SC, sans-serif" font-size="15" font-weight="600" fill="#6E685D" text-anchor="middle"><tspan x="740" >+ positional encoding</tspan></text></g><g id="d_mmha" data-md="node" data-box="620,800,240,52" data-shape="box" data-label="inside"><rect x="620" y="800" width="240" height="52" rx="0" fill="#FBF8F1" stroke="#171614" stroke-width="1.2"/><text class="md-label" x="740" y="830.8" font-family="Inter, Noto Sans SC, sans-serif" font-size="15" font-weight="600" fill="#171614" text-anchor="middle"><tspan x="740" >Masked self-attention</tspan></text></g><g id="d_an1" data-md="node" data-box="620,740,240,40" data-shape="box" data-label="inside"><rect x="620" y="740" width="240" height="40" rx="0" fill="#E7DFCF" stroke="#E7DFCF" stroke-width="1.2"/><text class="md-label" x="740" y="764.8" font-family="Inter, Noto Sans SC, sans-serif" font-size="15" font-weight="600" fill="#171614" text-anchor="middle"><tspan x="740" >Add &amp; norm</tspan></text></g><g id="d_xa" data-md="node" data-box="620,648,240,64" data-shape="box" data-label="inside"><rect x="620" y="648" width="240" height="64" rx="0" fill="#171614" stroke="#171614" stroke-width="1.2"/><text class="md-label" x="740" y="667.42" font-family="Inter, Noto Sans SC, sans-serif" font-size="15" font-weight="600" fill="#F7F1E6" text-anchor="middle"><tspan x="740" >Cross-attention</tspan></text><text class="md-sub" x="740" y="686.28" font-family="JetBrains Mono, Noto Sans SC, monospace" font-size="12.4" font-weight="400" fill="#C9C0AF" text-anchor="middle"><tspan x="740" >queries from decoder,</tspan><tspan x="740" dy="16.37">keys/values from encoder</tspan></text></g><g id="d_an2" data-md="node" data-box="620,588,240,40" data-shape="box" data-label="inside"><rect x="620" y="588" width="240" height="40" rx="0" fill="#E7DFCF" stroke="#E7DFCF" stroke-width="1.2"/><text class="md-label" x="740" y="612.8" font-family="Inter, Noto Sans SC, sans-serif" font-size="15" font-weight="600" fill="#171614" text-anchor="middle"><tspan x="740" >Add &amp; norm</tspan></text></g><g id="d_ff" data-md="node" data-box="620,512,240,52" data-shape="box" data-label="inside"><rect x="620" y="512" width="240" height="52" rx="0" fill="#FBF8F1" stroke="#171614" stroke-width="1.2"/><text class="md-label" x="740" y="542.8" font-family="Inter, Noto Sans SC, sans-serif" font-size="15" font-weight="600" fill="#171614" text-anchor="middle"><tspan x="740" >Feed-forward</tspan></text></g><g id="d_an3" data-md="node" data-box="620,452,240,40" data-shape="box" data-label="inside"><rect x="620" y="452" width="240" height="40" rx="0" fill="#E7DFCF" stroke="#E7DFCF" stroke-width="1.2"/><text class="md-label" x="740" y="476.8" font-family="Inter, Noto Sans SC, sans-serif" font-size="15" font-weight="600" fill="#171614" text-anchor="middle"><tspan x="740" >Add &amp; norm</tspan></text></g><g id="lin" data-md="node" data-box="620,362,240,40" data-shape="box" data-label="inside"><rect x="620" y="362" width="240" height="40" rx="0" fill="#E7DFCF" stroke="#E7DFCF" stroke-width="1.2"/><text class="md-label" x="740" y="386.8" font-family="Inter, Noto Sans SC, sans-serif" font-size="15" font-weight="600" fill="#171614" text-anchor="middle"><tspan x="740" >Linear</tspan></text></g><g id="sm" data-md="node" data-box="590,296,300,48" data-shape="box" data-label="inside"><rect x="590" y="296" width="300" height="48" rx="0" fill="#171614" stroke="#171614" stroke-width="1.2"/><text class="md-label" x="740" y="324.8" font-family="Inter, Noto Sans SC, sans-serif" font-size="15" font-weight="600" fill="#F7F1E6" text-anchor="middle"><tspan x="740" >Softmax → next-token probabilities</tspan></text></g></g><g id="edge-labels"><g id="edge-e_an2-d_xa-label" data-md="edge-label"><rect x="377.61" y="527.56" width="64.78" height="24.88" rx="3" fill="#F3EEE4"/><text x="381.61" y="544.91" font-family="Fraunces, Noto Serif SC, serif" font-size="15.1" font-weight="400" fill="#3A362F" text-anchor="start" font-style="italic"><tspan x="381.61" >memory</tspan></text></g></g><g id="notes"><g id="note-1" data-md="note" data-box="1040,360,480,47.43"><g><text x="1040" y="375.03" font-family="Fraunces, Noto Serif SC, serif" font-size="18.37" font-weight="700" fill="#C93C14">1</text><text x="1066" y="375.03" font-family="Fraunces, Noto Serif SC, serif" font-size="16.7" font-weight="400" fill="#36322C" text-anchor="start" font-style="italic"><tspan x="1066" >Attention(Q, K, V) = softmax(QKᵀ / √dₖ) V. Each token</tspan><tspan x="1066" dy="23.71">looks at every other token and takes a weighted average.</tspan></text></g></g><g id="note-2" data-md="note" data-box="1040,510,480,71.14"><g><text x="1040" y="525.03" font-family="Fraunces, Noto Serif SC, serif" font-size="18.37" font-weight="700" fill="#C93C14">2</text><text x="1066" y="525.03" font-family="Fraunces, Noto Serif SC, serif" font-size="16.7" font-weight="400" fill="#36322C" text-anchor="start" font-style="italic"><tspan x="1066" >Multi-head: 8 heads of 64 dimensions run in parallel, each</tspan><tspan x="1066" dy="23.71">free to learn a different relation — syntax, coreference,</tspan><tspan x="1066" dy="23.71">position.</tspan></text></g></g><g id="note-3" data-md="note" data-box="1040,660,480,47.43"><g><text x="1040" y="675.03" font-family="Fraunces, Noto Serif SC, serif" font-size="18.37" font-weight="700" fill="#C93C14">3</text><text x="1066" y="675.03" font-family="Fraunces, Noto Serif SC, serif" font-size="16.7" font-weight="400" fill="#36322C" text-anchor="start" font-style="italic"><tspan x="1066" >Masking stops the decoder from peeking at future</tspan><tspan x="1066" dy="23.71">tokens, so training and generation see the same thing.</tspan></text></g></g><g id="note-4" data-md="note" data-box="1040,800,480,47.43"><g><text x="1040" y="815.03" font-family="Fraunces, Noto Serif SC, serif" font-size="18.37" font-weight="700" fill="#C93C14">4</text><text x="1066" y="815.03" font-family="Fraunces, Noto Serif SC, serif" font-size="16.7" font-weight="400" fill="#36322C" text-anchor="start" font-style="italic"><tspan x="1066" >Dotted lines are residual connections: every sub-layer</tspan><tspan x="1066" dy="23.71">only learns a correction to its input.</tspan></text></g></g></g><g id="legend"></g><g id="texts"><text x="300" y="1072" font-family="Fraunces, Noto Serif SC, serif" font-size="14" font-weight="400" fill="#6E685D" text-anchor="middle" font-style="italic"><tspan x="300" >source tokens</tspan></text><text x="740" y="1072" font-family="Fraunces, Noto Serif SC, serif" font-size="14" font-weight="400" fill="#6E685D" text-anchor="middle" font-style="italic"><tspan x="740" >target tokens, shifted right</tspan></text></g><g id="header"><text x="64" y="76" font-family="JetBrains Mono, Noto Sans SC, monospace" font-size="12" font-weight="600" fill="#C93C14" text-anchor="start" letter-spacing="2.2"><tspan x="64" >MACHINE LEARNING · VASWANI ET AL., 2017</tspan></text><text x="64" y="140.44" font-family="Fraunces, Noto Serif SC, serif" font-size="54" font-weight="600" fill="#171614" text-anchor="start" letter-spacing="-0.8"><tspan x="64" >Transformer architecture</tspan></text><text x="64" y="180.4" font-family="Inter, Noto Sans SC, sans-serif" font-size="18.4" font-weight="400" fill="#6E685D" text-anchor="start"><tspan x="64" >Two stacks of identical blocks. The encoder turns a sentence into context-rich vectors; the decoder writes the output one</tspan><tspan x="64" dy="26.68">token at a time while attending to them.</tspan></text><path d="M64 237.35999999999999H1536" stroke="#171614" stroke-width="1.2"/><text x="1536" y="76" font-family="JetBrains Mono, Noto Sans SC, monospace" font-size="12" font-weight="400" fill="#6E685D" text-anchor="end" letter-spacing="2.2"><tspan x="1536" >FIG. 58</tspan></text></g><g id="footer"><text x="1536" y="1074.8" font-family="JetBrains Mono, Noto Sans SC, monospace" font-size="10.5" font-weight="400" fill="#6E685D" text-anchor="end" letter-spacing="1.5"><tspan x="1536" >MuseDraw · Editorial Ink</tspan></text></g></svg>
