<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 847" width="1680" height="847" role="img" aria-labelledby="md-title md-desc" data-theme="product"><title id="md-title">Tiered customer support model</title><desc id="md-desc">Each escalation costs roughly five times the tier before it. The goal isn&apos;t fewer tickets — it&apos;s tickets landing where they can be closed in one touch.</desc><defs><pattern id="tex-dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="10" cy="10" r="1.1" fill="#D0D5DD"/></pattern><filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#101828" flood-opacity="0.07"/><feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#101828" flood-opacity="0.05600000000000001"/></filter></defs><g id="background"><rect id="canvas" width="1680" height="847" fill="#F6F7F9"/><rect width="1680" height="847" fill="url(#tex-dots)" opacity="0.55"/></g><g id="zones"></g><g id="edges"><g id="edge-L0-L1" data-md="edge"><path d="M418 335 L451 335" fill="none" stroke="#4F46E5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M458 335 L449.25 339.81 L449.25 330.19 Z" fill="#4F46E5"/></g><g id="edge-L1-L2" data-md="edge"><path d="M816 335 L849 335" fill="none" stroke="#4F46E5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M856 335 L847.25 339.81 L847.25 330.19 Z" fill="#4F46E5"/></g><g id="edge-L2-L3" data-md="edge"><path d="M1214 335 L1247 335" fill="none" stroke="#4F46E5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M1254 335 L1245.25 339.81 L1245.25 330.19 Z" fill="#4F46E5"/></g></g><g id="nodes"><g id="L0" data-md="node" data-box="64,273,350,124" data-shape="box" data-label="inside"><g filter="url(#soft-shadow)"><rect x="64" y="273" width="350" height="124" rx="12" fill="#4F46E5" stroke="none"/></g><rect x="64" y="273" width="350" height="124" rx="12" fill="#4F46E5" stroke="#4F46E5" stroke-width="1"/><text class="md-tag" x="80" y="318.31" font-family="Inter, Noto Sans SC, sans-serif" font-size="11.9" font-weight="600" fill="#E0E7FF" text-anchor="start"><tspan x="80" >L0</tspan></text><text class="md-label" x="80" y="340.03" font-family="Inter, Noto Sans SC, sans-serif" font-size="19" font-weight="600" fill="#FFFFFF" text-anchor="start"><tspan x="80" >Self-serve</tspan></text><text class="md-sub" x="80" y="358.93" font-family="Inter, Noto Sans SC, sans-serif" font-size="14" font-weight="400" fill="#C7D2FE" text-anchor="start"><tspan x="80" >Help centre, in-app guides, AI answers</tspan></text></g><g id="L1" data-md="node" data-box="462,273,350,124" data-shape="box" data-label="inside"><rect x="462" y="273" width="350" height="124" rx="12" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1"/><text class="md-tag" x="478" y="318.31" font-family="Inter, Noto Sans SC, sans-serif" font-size="11.9" font-weight="600" fill="#4F46E5" text-anchor="start"><tspan x="478" >L1</tspan></text><text class="md-label" x="478" y="340.03" font-family="Inter, Noto Sans SC, sans-serif" font-size="19" font-weight="600" fill="#312E81" text-anchor="start"><tspan x="478" >Support agents</tspan></text><text class="md-sub" x="478" y="358.93" font-family="Inter, Noto Sans SC, sans-serif" font-size="14" font-weight="400" fill="#4F46E5" text-anchor="start"><tspan x="478" >Chat + email, 24/5, macros</tspan></text></g><g id="L2" data-md="node" data-box="860,273,350,124" data-shape="box" data-label="inside"><rect x="860" y="273" width="350" height="124" rx="12" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1"/><text class="md-tag" x="876" y="318.31" font-family="Inter, Noto Sans SC, sans-serif" font-size="11.9" font-weight="600" fill="#4F46E5" text-anchor="start"><tspan x="876" >L2</tspan></text><text class="md-label" x="876" y="340.03" font-family="Inter, Noto Sans SC, sans-serif" font-size="19" font-weight="600" fill="#312E81" text-anchor="start"><tspan x="876" >Product specialists</tspan></text><text class="md-sub" x="876" y="358.93" font-family="Inter, Noto Sans SC, sans-serif" font-size="14" font-weight="400" fill="#4F46E5" text-anchor="start"><tspan x="876" >Repro, workarounds, account fixes</tspan></text></g><g id="L3" data-md="node" data-box="1258,273,350,124" data-shape="box" data-label="inside"><rect x="1258" y="273" width="350" height="124" rx="12" fill="#FFFAEB" stroke="#FEDF89" stroke-width="1"/><text class="md-tag" x="1274" y="318.31" font-family="Inter, Noto Sans SC, sans-serif" font-size="11.9" font-weight="600" fill="#DC6803" text-anchor="start"><tspan x="1274" >L3</tspan></text><text class="md-label" x="1274" y="340.03" font-family="Inter, Noto Sans SC, sans-serif" font-size="19" font-weight="600" fill="#7A2E0E" text-anchor="start"><tspan x="1274" >Engineering on-call</tspan></text><text class="md-sub" x="1274" y="358.93" font-family="Inter, Noto Sans SC, sans-serif" font-size="14" font-weight="400" fill="#B54708" text-anchor="start"><tspan x="1274" >Bugs and incidents only</tspan></text></g></g><g id="edge-labels"><g id="edge-L0-L1-label" data-md="edge-label"><rect x="405.27" y="324.25" width="65.46" height="21.5" rx="10" fill="#FFFFFF" stroke="#EAECF0" stroke-width="1"/><text x="412.27" y="339.03" font-family="Inter, Noto Sans SC, sans-serif" font-size="12.4" font-weight="600" fill="#475467" text-anchor="start"><tspan x="412.27" >escalate</tspan></text></g><g id="edge-L1-L2-label" data-md="edge-label"><rect x="803.27" y="324.25" width="65.46" height="21.5" rx="10" fill="#FFFFFF" stroke="#EAECF0" stroke-width="1"/><text x="810.27" y="339.03" font-family="Inter, Noto Sans SC, sans-serif" font-size="12.4" font-weight="600" fill="#475467" text-anchor="start"><tspan x="810.27" >escalate</tspan></text></g><g id="edge-L2-L3-label" data-md="edge-label"><rect x="1201.27" y="324.25" width="65.46" height="21.5" rx="10" fill="#FFFFFF" stroke="#EAECF0" stroke-width="1"/><text x="1208.27" y="339.03" font-family="Inter, Noto Sans SC, sans-serif" font-size="12.4" font-weight="600" fill="#475467" text-anchor="start"><tspan x="1208.27" >escalate</tspan></text></g></g><g id="notes"><g id="note-1" data-md="note" data-box="64,673,760,87"><g><rect x="64" y="673" width="760" height="87" rx="10" fill="#FFFFFF" stroke="#EAECF0" stroke-width="1"/><text x="76" y="699" font-family="Inter, Noto Sans SC, sans-serif" font-size="14" font-weight="700" fill="#101828" text-anchor="start"><tspan x="76" >Feedback loop</tspan></text><text x="76" y="718.6" font-family="Inter, Noto Sans SC, sans-serif" font-size="14" font-weight="400" fill="#667085" text-anchor="start"><tspan x="76" >Every L2/L3 ticket ends with one question: could L0 have answered this? If yes, the specialist writes the</tspan><tspan x="76" dy="21">article before closing.</tspan></text></g></g><g id="note-2" data-md="note" data-box="860,673,756,66"><g><rect x="860" y="673" width="756" height="66" rx="10" fill="#FFFFFF" stroke="#EAECF0" stroke-width="1"/><text x="872" y="699" font-family="Inter, Noto Sans SC, sans-serif" font-size="14" font-weight="700" fill="#101828" text-anchor="start"><tspan x="872" >What we measure</tspan></text><text x="872" y="718.6" font-family="Inter, Noto Sans SC, sans-serif" font-size="14" font-weight="400" fill="#667085" text-anchor="start"><tspan x="872" >First-contact resolution, time to first reply, and escalation rate per tier — not ticket volume.</tspan></text></g></g></g><g id="legend"></g><g id="texts"><text x="64" y="483" font-family="Inter, Noto Sans SC, sans-serif" font-size="56" font-weight="800" fill="#101828" text-anchor="start"><tspan x="64" >62%</tspan></text><text x="64" y="515" font-family="Inter, Noto Sans SC, sans-serif" font-size="14" font-weight="400" fill="#667085" text-anchor="start"><tspan x="64" >of all tickets resolved here</tspan></text><text x="64" y="573" font-family="JetBrains Mono, Noto Sans SC, monospace" font-size="11" font-weight="700" fill="#4F46E5" text-anchor="start" letter-spacing="1.5"><tspan x="64" >SLA</tspan></text><text x="64" y="599" font-family="Inter, Noto Sans SC, sans-serif" font-size="17" font-weight="600" fill="#101828" text-anchor="start"><tspan x="64" >instant</tspan></text><text x="462" y="483" font-family="Inter, Noto Sans SC, sans-serif" font-size="56" font-weight="800" fill="#101828" text-anchor="start"><tspan x="462" >28%</tspan></text><text x="462" y="515" font-family="Inter, Noto Sans SC, sans-serif" font-size="14" font-weight="400" fill="#667085" text-anchor="start"><tspan x="462" >of all tickets resolved here</tspan></text><text x="462" y="573" font-family="JetBrains Mono, Noto Sans SC, monospace" font-size="11" font-weight="700" fill="#4F46E5" text-anchor="start" letter-spacing="1.5"><tspan x="462" >SLA</tspan></text><text x="462" y="599" font-family="Inter, Noto Sans SC, sans-serif" font-size="17" font-weight="600" fill="#101828" text-anchor="start"><tspan x="462" >&lt; 2 h first reply</tspan></text><text x="860" y="483" font-family="Inter, Noto Sans SC, sans-serif" font-size="56" font-weight="800" fill="#101828" text-anchor="start"><tspan x="860" >8%</tspan></text><text x="860" y="515" font-family="Inter, Noto Sans SC, sans-serif" font-size="14" font-weight="400" fill="#667085" text-anchor="start"><tspan x="860" >of all tickets resolved here</tspan></text><text x="860" y="573" font-family="JetBrains Mono, Noto Sans SC, monospace" font-size="11" font-weight="700" fill="#4F46E5" text-anchor="start" letter-spacing="1.5"><tspan x="860" >SLA</tspan></text><text x="860" y="599" font-family="Inter, Noto Sans SC, sans-serif" font-size="17" font-weight="600" fill="#101828" text-anchor="start"><tspan x="860" >&lt; 1 business day</tspan></text><text x="1258" y="483" font-family="Inter, Noto Sans SC, sans-serif" font-size="56" font-weight="800" fill="#101828" text-anchor="start"><tspan x="1258" >2%</tspan></text><text x="1258" y="515" font-family="Inter, Noto Sans SC, sans-serif" font-size="14" font-weight="400" fill="#667085" text-anchor="start"><tspan x="1258" >of all tickets resolved here</tspan></text><text x="1258" y="573" font-family="JetBrains Mono, Noto Sans SC, monospace" font-size="11" font-weight="700" fill="#4F46E5" text-anchor="start" letter-spacing="1.5"><tspan x="1258" >SLA</tspan></text><text x="1258" y="599" font-family="Inter, Noto Sans SC, sans-serif" font-size="17" font-weight="600" fill="#101828" text-anchor="start"><tspan x="1258" >per severity SLA</tspan></text></g><g id="header"><text x="64" y="77" font-family="Inter, Noto Sans SC, sans-serif" font-size="13" font-weight="600" fill="#4F46E5" text-anchor="start" letter-spacing="0.2"><tspan x="64" >Customer support · tiered model</tspan></text><text x="64" y="132.84" font-family="Inter, Noto Sans SC, sans-serif" font-size="44" font-weight="700" fill="#101828" text-anchor="start" letter-spacing="-1.2"><tspan x="64" >Tiered customer support model</tspan></text><text x="64" y="171.4" font-family="Inter, Noto Sans SC, sans-serif" font-size="18.4" font-weight="400" fill="#667085" text-anchor="start"><tspan x="64" >Each escalation costs roughly five times the tier before it. The goal isn&apos;t fewer tickets — it&apos;s tickets landing where they can be</tspan><tspan x="64" dy="26.68">closed in one touch.</tspan></text></g><g id="footer"><text x="1616" y="811.8" font-family="Inter, Noto Sans SC, sans-serif" font-size="11" font-weight="400" fill="#98A2B3" text-anchor="end" letter-spacing="0.3"><tspan x="1616" >MuseDraw · Product Clean</tspan></text></g></svg>
