<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 788" width="1700" height="788" role="img" aria-labelledby="md-title md-desc" data-theme="metro"><title id="md-title">员工晋升通道：专业线与管理线</title><desc id="md-desc">两条线在 P3 换乘：之后可以继续做专家，也可以转去带团队。同一高度的站点，薪酬区间相同。职级名称为示例。</desc><defs></defs><g id="background"><rect id="canvas" width="1700" height="788" fill="#F7F6F2"/></g><g id="zones"><path id="line-1" d="M680 454 L710 454 Q740 454 758 430 L836 326 Q860 294 900 294 L1400 294" fill="none" stroke="#E4002B" stroke-width="14" stroke-linecap="round"/><path id="line-2" d="M200 454 L1400 454" fill="none" stroke="#0072CE" stroke-width="14" stroke-linecap="round"/><path id="line-3" d="M64 634 L1640 634" fill="none" stroke="#C9C9C9" stroke-width="1" stroke-linecap="round"/></g><g id="edges"></g><g id="nodes"><g id="P1" data-md="node" data-box="186,440,28,28" data-shape="circle" data-label="inside"><ellipse cx="200" cy="454" rx="14" ry="14" fill="#FFFFFF" stroke="#1D1D1F" stroke-width="3.5"/></g><g id="P2" data-md="node" data-box="426,440,28,28" data-shape="circle" data-label="inside"><ellipse cx="440" cy="454" rx="14" ry="14" fill="#FFFFFF" stroke="#1D1D1F" stroke-width="3.5"/></g><g id="P3" data-md="node" data-box="666,440,28,28" data-shape="circle" data-label="inside"><ellipse cx="680" cy="454" rx="14" ry="14" fill="#FFFFFF" stroke="#1D1D1F" stroke-width="3.5"/></g><g id="P4" data-md="node" data-box="906,440,28,28" data-shape="circle" data-label="inside"><ellipse cx="920" cy="454" rx="14" ry="14" fill="#FFFFFF" stroke="#1D1D1F" stroke-width="3.5"/></g><g id="P5" data-md="node" data-box="1146,440,28,28" data-shape="circle" data-label="inside"><ellipse cx="1160" cy="454" rx="14" ry="14" fill="#FFFFFF" stroke="#1D1D1F" stroke-width="3.5"/></g><g id="P6" data-md="node" data-box="1386,440,28,28" data-shape="circle" data-label="inside"><ellipse cx="1400" cy="454" rx="14" ry="14" fill="#FFFFFF" stroke="#1D1D1F" stroke-width="3.5"/></g><g id="M1" data-md="node" data-box="906,280,28,28" data-shape="circle" data-label="inside"><ellipse cx="920" cy="294" rx="14" ry="14" fill="#FFFFFF" stroke="#1D1D1F" stroke-width="3.5"/></g><g id="M2" data-md="node" data-box="1146,280,28,28" data-shape="circle" data-label="inside"><ellipse cx="1160" cy="294" rx="14" ry="14" fill="#FFFFFF" stroke="#1D1D1F" stroke-width="3.5"/></g><g id="M3" data-md="node" data-box="1386,280,28,28" data-shape="circle" data-label="inside"><ellipse cx="1400" cy="294" rx="14" ry="14" fill="#FFFFFF" stroke="#1D1D1F" stroke-width="3.5"/></g></g><g id="edge-labels"></g><g id="notes"></g><g id="legend"></g><g id="texts"><text x="200" y="506" font-family="Inter, Noto Sans SC, sans-serif" font-size="20" font-weight="700" fill="#0072CE" text-anchor="middle"><tspan x="200" >P1</tspan></text><text x="200" y="532" font-family="Inter, Noto Sans SC, sans-serif" font-size="15" font-weight="400" fill="#1D1D1F" text-anchor="middle"><tspan x="200" >助理工程师</tspan></text><text x="440" y="506" font-family="Inter, Noto Sans SC, sans-serif" font-size="20" font-weight="700" fill="#0072CE" text-anchor="middle"><tspan x="440" >P2</tspan></text><text x="440" y="532" font-family="Inter, Noto Sans SC, sans-serif" font-size="15" font-weight="400" fill="#1D1D1F" text-anchor="middle"><tspan x="440" >工程师</tspan></text><text x="680" y="506" font-family="Inter, Noto Sans SC, sans-serif" font-size="20" font-weight="700" fill="#0072CE" text-anchor="middle"><tspan x="680" >P3</tspan></text><text x="680" y="532" font-family="Inter, Noto Sans SC, sans-serif" font-size="15" font-weight="400" fill="#1D1D1F" text-anchor="middle"><tspan x="680" >高级工程师</tspan></text><text x="920" y="506" font-family="Inter, Noto Sans SC, sans-serif" font-size="20" font-weight="700" fill="#0072CE" text-anchor="middle"><tspan x="920" >P4</tspan></text><text x="920" y="532" font-family="Inter, Noto Sans SC, sans-serif" font-size="15" font-weight="400" fill="#1D1D1F" text-anchor="middle"><tspan x="920" >资深工程师</tspan></text><text x="1160" y="506" font-family="Inter, Noto Sans SC, sans-serif" font-size="20" font-weight="700" fill="#0072CE" text-anchor="middle"><tspan x="1160" >P5</tspan></text><text x="1160" y="532" font-family="Inter, Noto Sans SC, sans-serif" font-size="15" font-weight="400" fill="#1D1D1F" text-anchor="middle"><tspan x="1160" >专家</tspan></text><text x="1400" y="506" font-family="Inter, Noto Sans SC, sans-serif" font-size="20" font-weight="700" fill="#0072CE" text-anchor="middle"><tspan x="1400" >P6</tspan></text><text x="1400" y="532" font-family="Inter, Noto Sans SC, sans-serif" font-size="15" font-weight="400" fill="#1D1D1F" text-anchor="middle"><tspan x="1400" >首席专家</tspan></text><text x="920" y="244" font-family="Inter, Noto Sans SC, sans-serif" font-size="20" font-weight="700" fill="#E4002B" text-anchor="middle"><tspan x="920" >M1</tspan></text><text x="920" y="268" font-family="Inter, Noto Sans SC, sans-serif" font-size="15" font-weight="400" fill="#1D1D1F" text-anchor="middle"><tspan x="920" >组长</tspan></text><text x="1160" y="244" font-family="Inter, Noto Sans SC, sans-serif" font-size="20" font-weight="700" fill="#E4002B" text-anchor="middle"><tspan x="1160" >M2</tspan></text><text x="1160" y="268" font-family="Inter, Noto Sans SC, sans-serif" font-size="15" font-weight="400" fill="#1D1D1F" text-anchor="middle"><tspan x="1160" >经理</tspan></text><text x="1400" y="244" font-family="Inter, Noto Sans SC, sans-serif" font-size="20" font-weight="700" fill="#E4002B" text-anchor="middle"><tspan x="1400" >M3</tspan></text><text x="1400" y="268" font-family="Inter, Noto Sans SC, sans-serif" font-size="15" font-weight="400" fill="#1D1D1F" text-anchor="middle"><tspan x="1400" >总监</tspan></text><text x="64" y="460" font-family="Inter, Noto Sans SC, sans-serif" font-size="17" font-weight="700" fill="#0072CE" text-anchor="start"><tspan x="64" >专业线</tspan></text><text x="64" y="300" font-family="Inter, Noto Sans SC, sans-serif" font-size="17" font-weight="700" fill="#E4002B" text-anchor="start"><tspan x="64" >管理线</tspan></text><text x="64" y="674" font-family="Inter, Noto Sans SC, sans-serif" font-size="15" font-weight="700" fill="#1D1D1F" text-anchor="start"><tspan x="64" >每级最短任期</tspan></text><text x="64" y="702" font-family="Inter, Noto Sans SC, sans-serif" font-size="14" font-weight="400" fill="#6E6E73" text-anchor="start"><tspan x="64" >P1–P2 1 年，P2–P3 2 年，之后 3 年</tspan></text><text x="464" y="674" font-family="Inter, Noto Sans SC, sans-serif" font-size="15" font-weight="700" fill="#1D1D1F" text-anchor="start"><tspan x="464" >晋升窗口</tspan></text><text x="464" y="702" font-family="Inter, Noto Sans SC, sans-serif" font-size="14" font-weight="400" fill="#6E6E73" text-anchor="start"><tspan x="464" >每年 3 月、9 月两次，提前一个月提交材料</tspan></text><text x="864" y="674" font-family="Inter, Noto Sans SC, sans-serif" font-size="15" font-weight="700" fill="#1D1D1F" text-anchor="start"><tspan x="864" >评审方式</tspan></text><text x="864" y="702" font-family="Inter, Noto Sans SC, sans-serif" font-size="14" font-weight="400" fill="#6E6E73" text-anchor="start"><tspan x="864" >答辩 + 同级 3 人评议 + 上级述评</tspan></text><text x="1264" y="674" font-family="Inter, Noto Sans SC, sans-serif" font-size="15" font-weight="700" fill="#1D1D1F" text-anchor="start"><tspan x="1264" >换线</tspan></text><text x="1264" y="702" font-family="Inter, Noto Sans SC, sans-serif" font-size="14" font-weight="400" fill="#6E6E73" text-anchor="start"><tspan x="1264" >P3 起可申请转管理线，两年内可转回一次</tspan></text></g><g id="header"><rect width="1700" height="104" fill="#1D1D1F"/><text x="64" y="64.24" font-family="Inter, Noto Sans SC, sans-serif" font-size="36" font-weight="800" fill="#FFFFFF" text-anchor="start" letter-spacing="-0.5"><tspan x="64" >员工晋升通道：专业线与管理线</tspan></text><text x="1636" y="56.32" font-family="JetBrains Mono, Noto Sans SC, monospace" font-size="12" font-weight="400" fill="#BDBDC2" text-anchor="end" letter-spacing="1.5"><tspan x="1636" >人力资源 · 技术序列</tspan></text><text x="64" y="138" font-family="Inter, Noto Sans SC, sans-serif" font-size="17.3" font-weight="400" fill="#6E6E73" text-anchor="start"><tspan x="64" >两条线在 P3 换乘：之后可以继续做专家，也可以转去带团队。同一高度的站点，薪酬区间相同。职级名称为示例。</tspan></text></g><g id="footer"><text x="1636" y="752.8" font-family="JetBrains Mono, Noto Sans SC, monospace" font-size="10.5" font-weight="400" fill="#6E6E73" text-anchor="end" letter-spacing="1"><tspan x="1636" >MuseDraw · Metro Map</tspan></text></g></svg>
