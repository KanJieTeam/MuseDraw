<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 829" width="1680" height="829" role="img" aria-labelledby="md-title md-desc" data-theme="journal"><title id="md-title">图 7 | 论文投稿到出版的典型时间线</title><desc id="md-desc">以一篇 SCI 临床研究为例，从选刊到见刊约 200 天，其中超过一半在等待审稿。天数为示例，不同期刊差异很大。</desc><defs></defs><g id="background"><rect id="canvas" width="1680" height="829" fill="#FFFFFF"/></g><g id="zones"><g id="bar-1" data-md="bar"><rect x="340" y="225" width="89.6" height="26" rx="3" fill="#2E6DB4"/><text x="348" y="242.32" font-family="Inter, Noto Sans SC, sans-serif" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="start"><tspan x="348" >14 天</tspan></text></g><g id="bar-2" data-md="bar"><rect x="429.6" y="287" width="89.6" height="26" rx="3" fill="#2E6DB4"/><text x="437.6" y="304.32" font-family="Inter, Noto Sans SC, sans-serif" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="start"><tspan x="437.6" >14 天</tspan></text></g><g id="bar-3" data-md="bar"><rect x="519.2" y="349" width="89.6" height="26" rx="3" fill="#B8BFC9"/><text x="527.2" y="366.32" font-family="Inter, Noto Sans SC, sans-serif" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="start"><tspan x="527.2" >14 天</tspan></text></g><g id="bar-4" data-md="bar"><rect x="608.8" y="411" width="448" height="26" rx="3" fill="#B8BFC9"/><text x="616.8" y="428.32" font-family="Inter, Noto Sans SC, sans-serif" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="start"><tspan x="616.8" >70 天</tspan></text></g><g id="bar-5" data-md="bar"><rect x="1056.8" y="473" width="192" height="26" rx="3" fill="#D9822B"/><text x="1064.8" y="490.32" font-family="Inter, Noto Sans SC, sans-serif" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="start"><tspan x="1064.8" >30 天</tspan></text></g><g id="bar-6" data-md="bar"><rect x="1248.8" y="535" width="179.2" height="26" rx="3" fill="#B8BFC9"/><text x="1256.8" y="552.32" font-family="Inter, Noto Sans SC, sans-serif" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="start"><tspan x="1256.8" >28 天</tspan></text></g><g id="bar-7" data-md="bar"><rect x="1428" y="597" width="25.6" height="26" rx="3" fill="#3A8F5C"/></g><g id="bar-8" data-md="bar"><rect x="1453.6" y="659" width="166.4" height="26" rx="3" fill="#3A8F5C"/><text x="1461.6" y="676.32" font-family="Inter, Noto Sans SC, sans-serif" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="start"><tspan x="1461.6" >26 天</tspan></text></g><path id="line-1" d="M340 205 L340 701" fill="none" stroke="#E5E7EB" stroke-width="1" stroke-linecap="round"/><path id="line-2" d="M532 205 L532 701" fill="none" stroke="#E5E7EB" stroke-width="1" stroke-linecap="round"/><path id="line-3" d="M724 205 L724 701" fill="none" stroke="#E5E7EB" stroke-width="1" stroke-linecap="round"/><path id="line-4" d="M916 205 L916 701" fill="none" stroke="#E5E7EB" stroke-width="1" stroke-linecap="round"/><path id="line-5" d="M1108 205 L1108 701" fill="none" stroke="#E5E7EB" stroke-width="1" stroke-linecap="round"/><path id="line-6" d="M1300 205 L1300 701" fill="none" stroke="#E5E7EB" stroke-width="1" stroke-linecap="round"/><path id="line-7" d="M1492 205 L1492 701" fill="none" stroke="#E5E7EB" stroke-width="1" stroke-linecap="round"/></g><g id="edges"></g><g id="nodes"></g><g id="edge-labels"></g><g id="notes"></g><g id="legend"></g><g id="texts"><text x="340" y="193" font-family="Inter, Noto Sans SC, sans-serif" font-size="12.5" font-weight="400" fill="#5F6368" text-anchor="middle"><tspan x="340" >第 0 天</tspan></text><text x="532" y="193" font-family="Inter, Noto Sans SC, sans-serif" font-size="12.5" font-weight="400" fill="#5F6368" text-anchor="middle"><tspan x="532" >第 30 天</tspan></text><text x="724" y="193" font-family="Inter, Noto Sans SC, sans-serif" font-size="12.5" font-weight="400" fill="#5F6368" text-anchor="middle"><tspan x="724" >第 60 天</tspan></text><text x="916" y="193" font-family="Inter, Noto Sans SC, sans-serif" font-size="12.5" font-weight="400" fill="#5F6368" text-anchor="middle"><tspan x="916" >第 90 天</tspan></text><text x="1108" y="193" font-family="Inter, Noto Sans SC, sans-serif" font-size="12.5" font-weight="400" fill="#5F6368" text-anchor="middle"><tspan x="1108" >第 120 天</tspan></text><text x="1300" y="193" font-family="Inter, Noto Sans SC, sans-serif" font-size="12.5" font-weight="400" fill="#5F6368" text-anchor="middle"><tspan x="1300" >第 150 天</tspan></text><text x="1492" y="193" font-family="Inter, Noto Sans SC, sans-serif" font-size="12.5" font-weight="400" fill="#5F6368" text-anchor="middle"><tspan x="1492" >第 180 天</tspan></text><text x="60" y="235" font-family="Inter, Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#1B1B1B" text-anchor="start"><tspan x="60" >选刊</tspan></text><text x="60" y="257" font-family="Inter, Noto Sans SC, sans-serif" font-size="12.5" font-weight="400" fill="#5F6368" text-anchor="start"><tspan x="60" >对照范围、影响因子、审稿周期</tspan></text><text x="60" y="297" font-family="Inter, Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#1B1B1B" text-anchor="start"><tspan x="60" >投稿准备</tspan></text><text x="60" y="319" font-family="Inter, Noto Sans SC, sans-serif" font-size="12.5" font-weight="400" fill="#5F6368" text-anchor="start"><tspan x="60" >按作者须知改格式、写 cover letter</tspan></text><text x="60" y="359" font-family="Inter, Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#1B1B1B" text-anchor="start"><tspan x="60" >编辑初审</tspan></text><text x="60" y="381" font-family="Inter, Noto Sans SC, sans-serif" font-size="12.5" font-weight="400" fill="#5F6368" text-anchor="start"><tspan x="60" >决定是否送审</tspan></text><text x="60" y="421" font-family="Inter, Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#1B1B1B" text-anchor="start"><tspan x="60" >外审</tspan></text><text x="60" y="443" font-family="Inter, Noto Sans SC, sans-serif" font-size="12.5" font-weight="400" fill="#5F6368" text-anchor="start"><tspan x="60" >通常 2–3 位审稿人</tspan></text><text x="60" y="483" font-family="Inter, Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#1B1B1B" text-anchor="start"><tspan x="60" >大修</tspan></text><text x="60" y="505" font-family="Inter, Noto Sans SC, sans-serif" font-size="12.5" font-weight="400" fill="#5F6368" text-anchor="start"><tspan x="60" >逐条回复审稿意见</tspan></text><text x="60" y="545" font-family="Inter, Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#1B1B1B" text-anchor="start"><tspan x="60" >二审</tspan></text><text x="60" y="567" font-family="Inter, Noto Sans SC, sans-serif" font-size="12.5" font-weight="400" fill="#5F6368" text-anchor="start"><tspan x="60" >审稿人确认修改</tspan></text><text x="60" y="607" font-family="Inter, Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#1B1B1B" text-anchor="start"><tspan x="60" >接收</tspan></text><text x="60" y="629" font-family="Inter, Noto Sans SC, sans-serif" font-size="12.5" font-weight="400" fill="#5F6368" text-anchor="start"><tspan x="60" >签署版权协议</tspan></text><text x="60" y="669" font-family="Inter, Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#1B1B1B" text-anchor="start"><tspan x="60" >校样与出版</tspan></text><text x="60" y="691" font-family="Inter, Noto Sans SC, sans-serif" font-size="12.5" font-weight="400" fill="#5F6368" text-anchor="start"><tspan x="60" >48 小时内返回校样</tspan></text><text x="60" y="749" font-family="Inter, Noto Sans SC, sans-serif" font-size="14" font-weight="400" fill="#1B1B1B" text-anchor="start"><tspan x="60" >灰色是等待时间，作者无法控制；蓝色和橙色是自己能缩短的部分。返修时逐条回复，每条写明“修改位置：第几页第几行”。</tspan></text></g><g id="header"><text x="56" y="74.92" font-family="Inter, Noto Sans SC, sans-serif" font-size="22" font-weight="700" fill="#1B1B1B" text-anchor="start"><tspan x="56" >图 7 | 论文投稿到出版的典型时间线</tspan></text><text x="56" y="107.1" font-family="Inter, Noto Sans SC, sans-serif" font-size="15.1" font-weight="400" fill="#5F6368" text-anchor="start"><tspan x="56" >以一篇 SCI 临床研究为例，从选刊到见刊约 200 天，其中超过一半在等待审稿。天数为示例，不同期刊差异很大。</tspan></text></g><g id="footer"><text x="1624" y="798.2" font-family="Inter, Noto Sans SC, sans-serif" font-size="10.5" font-weight="400" fill="#A0A4AA" text-anchor="end" letter-spacing="0.5"><tspan x="1624" >MuseDraw · Journal Figure</tspan></text></g></svg>
