 x="140" y="560" width="280" height="90" rx="10" fill="#10262A" stroke="#4FD1C5" stroke-width="1.2"/><g transform="translate(156 595) scale(0.8333)" fill="none" stroke="#4FD1C5" stroke-width="1.92" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6c0-1.7 3.6-3 8-3s8 1.3 8 3-3.6 3-8 3-8-1.3-8-3z"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></g><text class="md-label" x="186" y="601.84" font-family="Inter, Noto Sans SC, sans-serif" font-size="17.3" font-weight="650" fill="#DCE4EE" text-anchor="start"><tspan x="186" >Hospital B</tspan></text><text class="md-sub" x="186" y="620.12" font-family="JetBrains Mono, Noto Sans SC, monospace" font-size="12.4" font-weight="400" fill="#8FC9C2" text-anchor="start"><tspan x="186" >n = 9,400</tspan></text></g><g id="h2" data-md="node" data-box="140,820,280,90" data-shape="box" data-label="inside"><rect x="140" y="820" width="280" height="90" rx="10" fill="#10262A" stroke="#4FD1C5" stroke-width="1.2"/><g transform="translate(156 855) scale(0.8333)" fill="none" stroke="#4FD1C5" stroke-width="1.92" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6c0-1.7 3.6-3 8-3s8 1.3 8 3-3.6 3-8 3-8-1.3-8-3z"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></g><text class="md-label" x="186" y="861.84" font-family="Inter, Noto Sans SC, sans-serif" font-size="17.3" font-weight="650" fill="#DCE4EE" text-anchor="start"><tspan x="186" >Hospital C</tspan></text><text class="md-sub" x="186" y="880.12" font-family="JetBrains Mono, Noto Sans SC, monospace" font-size="12.4" font-weight="400" fill="#8FC9C2" text-anchor="start"><tspan x="186" >n = 22,700</tspan></text></g><g id="h3" data-md="node" data-box="1240,330,280,90" data-shape="box" data-label="inside"><rect x="1240" y="330" width="280" height="90" rx="10" fill="#10262A" stroke="#4FD1C5" stroke-width="1.2"/><g transform="translate(1256 365) scale(0.8333)" fill="none" stroke="#4FD1C5" stroke-width="1.92" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6c0-1.7 3.6-3 8-3s8 1.3 8 3-3.6 3-8 3-8-1.3-8-3z"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></g><text class="md-label" x="1286" y="371.84" font-family="Inter, Noto Sans SC, sans-serif" font-size="17.3" font-weight="650" fill="#DCE4EE" text-anchor="start"><tspan x="1286" >Hospital D</tspan></text><text class="md-sub" x="1286" y="390.12" font-family="JetBrains Mono, Noto Sans SC, monospace" font-size="12.4" font-weight="400" fill="#8FC9C2" text-anchor="start"><tspan x="1286" >n = 6,100</tspan></text></g><g id="h4" data-md="node" data-box="1240,760,280,90" data-shape="box" data-label="inside"><rect x="1240" y="760" width="280" height="90" rx="10" fill="#10262A" stroke="#4FD1C5" stroke-width="1.2"/><g transform="translate(1256 795) scale(0.8333)" fill="none" stroke="#4FD1C5" stroke-width="1.92" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6c0-1.7 3.6-3 8-3s8 1.3 8 3-3.6 3-8 3-8-1.3-8-3z"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></g><text class="md-label" x="1286" y="801.84" font-family="Inter, Noto Sans SC, sans-serif" font-size="17.3" font-weight="650" fill="#DCE4EE" text-anchor="start"><tspan x="1286" >Hospital E</tspan></text><text class="md-sub" x="1286" y="820.12" font-family="JetBrains Mono, Noto Sans SC, monospace" font-size="12.4" font-weight="400" fill="#8FC9C2" text-anchor="start"><tspan x="1286" >n = 12,800</tspan></text></g><g id="dp" data-md="node" data-box="680,700,300,80" data-shape="box" data-label="inside"><rect x="680" y="700" width="300" height="80" rx="10" fill="#2A2216" stroke="#F6C177" stroke-width="1.2"/><g transform="translate(696 730) scale(0.8333)" fill="none" stroke="#F6C177" stroke-width="1.92" stroke-linecap="round" stroke-linejoin="round"><path d="M5 11h14v10H5z"/><path d="M8 11V7.5a4 4 0 0 1 8 0V11"/><path d="M12 15v2.5"/></g><text class="md-label" x="726" y="736.84" font-family="Inter, Noto Sans SC, sans-serif" font-size="17.3" font-weight="650" fill="#DCE4EE" text-anchor="start"><tspan x="726" >Secure aggregation + DP</tspan></text><text class="md-sub" x="726" y="755.12" font-family="JetBrains Mono, Noto Sans SC, monospace" font-size="12.4" font-weight="400" fill="#D4B48A" text-anchor="start"><tspan x="726" >server sees only the sum; ε = 3</tspan></text></g></g><g id="edge-labels"></g><g id="notes"><g id="note-1" data-md="note" data-box="600,300,460,58.5"><g><text x="600" y="311.7" font-family="JetBrains Mono, Noto Sans SC, monospace" font-size="13" font-weight="400" fill="#7E8DA0" text-anchor="start"><tspan x="600" >// one round: send global weights → 5 local epochs at each</tspan><tspan x="600" dy="19.5">site → upload weight deltas → average. 120 rounds to</tspan><tspan x="600" dy="19.5">converge.</tspan></text></g></g><g id="note-2" data-md="note" data-box="600,860,460,39"><g><text x="600" y="871.7" font-family="JetBrains Mono, Noto Sans SC, monospace" font-size="13" font-weight="400" fill="#7E8DA0" text-anchor="start"><tspan x="600" >// pooled AUC 0.91 vs 0.86 for the best single-site model;</tspan><tspan x="600" dy="19.5">no patient image ever crossed a hospital firewall</tspan></text></g></g></g><g id="legend"><path d="M64 967.688H98" stroke="#4FD1C5" stroke-width="2" stroke-linecap="round"/><path d="M102 967.69 L95 971.54 L95 963.84 Z" fill="#4FD1C5"/><text x="112" y="972.15" font-family="JetBrains Mono, Noto Sans SC, monospace" font-size="12.4" font-weight="400" fill="#7E8DA0" text-anchor="start"><tspan x="112" >weight deltas</tspan></text><path d="M236.71999999999997 967.688H270.71999999999997" stroke="#B4A7F5" stroke-width="2" stroke-linecap="round"/><path d="M274.72 967.69 L267.72 971.54 L267.72 963.84 Z" fill="#B4A7F5"/><text x="284.72" y="972.15" font-family="JetBrains Mono, Noto Sans SC, monospace" font-size="12.4" font-weight="400" fill="#7E8DA0" text-anchor="start"><tspan x="284.72" >global model</tspan></text></g><g id="texts"></g><g id="header"><text x="64" y="76" font-family="JetBrains Mono, Noto Sans SC, monospace" font-size="12" font-weight="600" fill="#4FD1C5" text-anchor="start" letter-spacing="2"><tspan x="64" >MEDICAL IMAGING · PRIVACY-PRESERVING TRAINING</tspan></text><text x="64" y="133.56" font-family="Inter, Noto Sans SC, sans-serif" font-size="46" font-weight="700" fill="#DCE4EE" text-anchor="start" letter-spacing="-1.2"><tspan x="64" >Federated learning across five hospitals</tspan></text><text x="64" y="171.8" font-family="Inter, Noto Sans SC, sans-serif" font-size="17.8" font-weight="400" fill="#7E8DA0" text-anchor="start"><tspan x="64" >Teal arrows carry weight updates in, violet arrows carry the new global model out. Raw images stay inside each hospital. Figures are</tspan><tspan x="64" dy="25.81">illustrative.</tspan></text><text x="1596" y="76" font-family="JetBrains Mono, Noto Sans SC, monospace" font-size="12" font-weight="400" fill="#7E8DA0" text-anchor="end" letter-spacing="2"><tspan x="1596" >FIG / 90</tspan></text></g><g id="footer"><text x="1596" y="964.8" font-family="JetBrains Mono, Noto Sans SC, monospace" font-size="10.5" font-weight="400" fill="#4A5869" text-anchor="end" letter-spacing="1.5"><tspan x="1596" >MuseDraw · Observatory</tspan></text></g></svg>
