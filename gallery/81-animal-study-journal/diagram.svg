ans-serif" font-size="17" font-weight="700" fill="#1B1B1B" text-anchor="start"><tspan x="60" >高剂量组</tspan></text><text x="60" y="527" font-family="Inter, Noto Sans SC, sans-serif" font-size="13" font-weight="400" fill="#5F6368" text-anchor="start"><tspan x="60" >CCl₄ + 药物 30 mg/kg 灌胃，每日</tspan></text><text x="1620" y="509" font-family="Inter, Noto Sans SC, sans-serif" font-size="13" font-weight="400" fill="#5F6368" text-anchor="start"><tspan x="1620" >n = 10</tspan></text><text x="60" y="589" font-family="Inter, Noto Sans SC, sans-serif" font-size="17" font-weight="700" fill="#1B1B1B" text-anchor="start"><tspan x="60" >阳性对照</tspan></text><text x="60" y="613" font-family="Inter, Noto Sans SC, sans-serif" font-size="13" font-weight="400" fill="#5F6368" text-anchor="start"><tspan x="60" >CCl₄ + 秋水仙碱 0.1 mg/kg，每日</tspan></text><text x="1620" y="595" font-family="Inter, Noto Sans SC, sans-serif" font-size="13" font-weight="400" fill="#5F6368" text-anchor="start"><tspan x="1620" >n = 10</tspan></text><text x="360" y="711" font-family="Inter, Noto Sans SC, sans-serif" font-size="13.5" font-weight="400" fill="#1B1B1B" text-anchor="start"><tspan x="360" >适应 7 天后开始</tspan></text><text x="773.33" y="711" font-family="Inter, Noto Sans SC, sans-serif" font-size="13.5" font-weight="400" fill="#1B1B1B" text-anchor="middle"><tspan x="773.33" >开始给药</tspan></text><text x="1186.67" y="711" font-family="Inter, Noto Sans SC, sans-serif" font-size="13.5" font-weight="400" fill="#1B1B1B" text-anchor="middle"><tspan x="1186.67" >取血 ALT/AST</tspan></text><text x="1600" y="711" font-family="Inter, Noto Sans SC, sans-serif" font-size="13.5" font-weight="400" fill="#1B1B1B" text-anchor="end"><tspan x="1600" >处死：肝组织、血清</tspan></text></g><g id="header"><text x="56" y="74.92" font-family="Inter, Noto Sans SC, sans-serif" font-size="22" font-weight="700" fill="#1B1B1B" text-anchor="start"><tspan x="56" >肝纤维化小鼠模型分组与给药方案</tspan></text><text x="56" y="107.1" font-family="Inter, Noto Sans SC, sans-ser