 >会做 5 个居家动作</tspan></text></g></g><g id="edge-labels"></g><g id="notes"></g><g id="legend"></g><g id="texts"><text x="365" y="290" font-family="Noto Sans SC, Inter, sans-serif" font-size="15" font-weight="700" fill="#37352F" text-anchor="middle"><tspan x="365" >入院当天</tspan></text><text x="595" y="290" font-family="Noto Sans SC, Inter, sans-serif" font-size="15" font-weight="700" fill="#37352F" text-anchor="middle"><tspan x="595" >术前 1 天</tspan></text><text x="825" y="290" font-family="Noto Sans SC, Inter, sans-serif" font-size="15" font-weight="700" fill="#37352F" text-anchor="middle"><tspan x="825" >手术日</tspan></text><text x="1055" y="290" font-family="Noto Sans SC, Inter, sans-serif" font-size="15" font-weight="700" fill="#37352F" text-anchor="middle"><tspan x="1055" >术后 1 天</tspan></text><text x="1285" y="290" font-family="Noto Sans SC, Inter, sans-serif" font-size="15" font-weight="700" fill="#37352F" text-anchor="middle"><tspan x="1285" >术后 2–3 天</tspan></text><text x="1515" y="290" font-family="Noto Sans SC, Inter, sans-serif" font-size="15" font-weight="700" fill="#37352F" text-anchor="middle"><tspan x="1515" >出院日</tspan></text><text x="60" y="362" font-family="Noto Sans SC, Inter, sans-serif" font-size="17" font-weight="700" fill="#37352F" text-anchor="start"><tspan x="60" >医生</tspan></text><text x="60" y="482" font-family="Noto Sans SC, Inter, sans-serif" font-size="17" font-weight="700" fill="#37352F" text-anchor="start"><tspan x="60" >护士</tspan></text><text x="60" y="602" font-family="Noto Sans SC, Inter, sans-serif" font-size="17" font-weight="700" fill="#37352F" text-anchor="start"><tspan x="60" >康复师</tspan></text><text x="60" y="722" font-family="Noto Sans SC, Inter, sans-serif" font-size="17" font-weight="700" fill="#37352F" text-anchor="start"><tspan x="60" >患者与家属</tspan></text><text x="60" y="830" font-family="Noto Sans SC, Inter, sans-serif" font-size="14" font-weight="400" fill="#787774" text-anchor="start"><tspan x="60" >变异记录：任何一格没有按时完成，在当天写明原因（患者因素 / 医疗因素 / 系统因素），每月汇总分析。</tspan></text></g><g id="header"><text x="72" y="86" font-family="Noto Sans SC, Inter, sans-serif" font-size="14" font-weight="400" fill="#787774" text-anchor="start" letter-spacing="0.5"><tspan x="72" >骨科护理 · 临床路径</tspan></text><text x="72" y="140.12" font-family="Noto Sans SC, Inter, sans-serif" font-size="42" font-weight="700" fill="#37352F" text-anchor="start"><tspan x="72" >全膝关节置换术临床路径（标准住院日 6 天）</tspan></text><text x="72" y="177.3" font-family="Noto Sans SC, Inter, sans-serif" font-size="17.3" font-weight="400" fill="#787774" text-anchor="start"><tspan x="72" >横向是住院日，纵向是谁负责。同一列读下来，就是这一天四方各自要完成的事。内容为示例，以本院路径为准。</tspan></text></g><g id="footer"><text x="1588" y="860.4" font-family="Noto Sans SC, Inter, sans-serif" font-size="12" font-weight="400" fill="#B4B4B0" text-anchor="end" letter-spacing="1"><tspan x="1588" >MuseDraw · 柔和笔记</tspan></text></g></svg>
