<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1760 816" width="1760" height="816" role="img" aria-labelledby="md-title md-desc" data-theme="chalkboard"><title id="md-title">《沉与浮》教学流程</title><desc id="md-desc">五个环节按时长等比例排开；上排是老师做什么，下排是孩子做什么。</desc><defs><filter id="tex-grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" seed="7" stitchTiles="stitch"/><feColorMatrix type="matrix" values="0 0 0 0 0.9  0 0 0 0 0.95  0 0 0 0 0.9  0 0 0 0.25 0"/></filter><radialGradient id="tex-vignette" cx="50%" cy="45%" r="75%"><stop offset="0.6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.45"/></radialGradient></defs><g id="background"><rect id="canvas" width="1760" height="816" fill="#22382E"/><rect width="1760" height="816" filter="url(#tex-grain)" opacity="0.35"/><rect width="1760" height="816" fill="url(#tex-vignette)"/><rect x="14" y="14" width="1732" height="788" fill="none" stroke="#7A5A3A" stroke-width="10"/></g><g id="zones"><path id="line-1" d="M230 352 L1680 352" fill="none" stroke="#B9C3B5" stroke-width="1" stroke-linecap="round"/><path id="line-2" d="M80 508 L1680 508" fill="none" stroke="#5E7468" stroke-width="1" stroke-dasharray="3 5" stroke-linecap="round"/><path id="line-3" d="M80 648 L1680 648" fill="none" stroke="#5E7468" stroke-width="1" stroke-dasharray="3 5" stroke-linecap="round"/></g><g id="edges"><g id="edge-p3-p1" data-md="edge"><path d="M1313.0164688697084 261.6688096979633 C1314.3210499486513 250.328805517219, 1314.1571955701895 248.18022990245373, 1313.933530001901 241.5267217675224 M1312.1403246601112 260.91166822863744 C1312.0701372459457 253.11521185776218, 1313.3006498977468 244.06339612333105, 1312.6462516536005 240.71357094896956 M1312.5 240 C1314.9380419591441 234.99007651514063, 1310.750129020152 229.44459842350335, 1304.4665554204955 229.5967027416453 M1309.910500929691 239.89037710931152 C1310.5165502399486 237.34329922340498, 1309.683