2235672980547 M1669.9106779158114 345.9336741387844 C1629.7894249378237 337.8735454112366, 1585.8437640008517 339.45960212052614, 1497.927034765482 343.4451645791531 M1671.141485068202 343.8257271796465 C1610.863491811743 344.06206273662303, 1550.1392552691511 345.067671772115, 1499.0694013088942 344.2205816298723 M1497.1526924192906 341.16577157378197 C1501.990315923345 312.97001823447647, 1501.970705136907 283.8204501979053, 1500.4811647474767 266.253525441885 M1498.024895235896 344.06793194115164 C1497.0403790089488 319.0379204634577, 1496.5614835354686 292.9284198500216, 1497.7148689717055 267.19013319313524" fill="none" stroke="#F6B97A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text class="md-label" x="1584.38" y="301.73" font-family="LXGW WenKai, Caveat, cursive" font-size="24" font-weight="700" fill="#F6B97A" text-anchor="middle"><tspan x="1584.38" >延伸</tspan></text><text class="md-sub" x="1584.38" y="324.55" font-family="LXGW WenKai, Caveat, cursive" font-size="18.9" font-weight="400" fill="#F3F1E7" text-anchor="middle"><tspan x="1584.38" >5 分钟</tspan></text><circle cx="1498.75" cy="266" r="15" fill="#F6DD72"/><text x="1498.75" y="272.65" font-family="LXGW WenKai, Caveat, cursive" font-size="19" font-weight="700" fill="#22382E" text-anchor="middle" class="md-step">5</text></g></g><g id="edge-labels"><g id="edge-p3-p1-label" data-md="edge-label"><rect x="817.21" y="218.19" width="163.7" height="27.63" rx="3" fill="#22382E"/><text x="821.21" y="237.62" font-family="LXGW WenKai, Caveat, cursive" font-size="17.3" font-weight="400" fill="#B9C4B5" text-anchor="start"><tspan x="821.21" >想法变了？再猜一次</tspan></text></g></g><g id="notes"><g id="note-1" data-md="note" data-box="80,696,1400,25.09"><g><text x="80" y="711.57" font-family="LXGW WenKai, Caveat, cursive" font-size="19.03" font-weight="700" fill="#F6DD72">★</text><text x="106" y="711.57" font-family="LXGW WenKai, Caveat, cursive" font-size="17.3" font-weight="400" fill="#F3F1E7" text-anchor="start"><tspan x="106" >评价重点：谁改变了自己的猜想？谁能说出理由？观察记录只记这两件事。</tspan></text></g></g></g><g id="legend"></g><g id="texts"><text x="242" y="406" font-family="LXGW WenKai, Caveat, cursive" font-size="17" font-weight="400" fill="#F3F1E7" text-anchor="start"><tspan x="242" >端出一盆水和一筐</tspan><tspan x="242" dy="24.65">小物件，问：“谁会</tspan><tspan x="242" dy="24.65">沉下去？”</tspan></text><text x="242" y="546" font-family="LXGW WenKai, Caveat, cursive" font-size="17" font-weight="400" fill="#F3F1E7" text-anchor="start"><tspan x="242" >自由说出想法，有</tspan><tspan x="242" dy="24.65">的孩子已经开始争</tspan></text><text x="423.25" y="406" font-family="LXGW WenKai, Caveat, cursive" font-size="17" font-weight="400" fill="#F3F1E7" text-anchor="start"><tspan x="423.25" >发记录单，提醒“先</tspan><tspan x="423.25" dy="24.65">想好再贴”</tspan></text><text x="423.25" y="546" font-family="LXGW WenKai, Caveat, cursive" font-size="17" font-weight="400" fill="#F3F1E7" text-anchor="start"><tspan x="423.25" >给每件物品贴红点</tspan><tspan x="423.25" dy="24.65">（沉）或蓝点（浮）</tspan></text><text x="604.5" y="406" font-family="LXGW WenKai, Caveat, cursive" font-size="17" font-weight="400" fill="#F3F1E7" text-anchor="start"><tspan x="604.5" >巡回观察，只提问不讲解：“它为什么浮起来了？”</tspan></text><text x="604.5" y="546" font-family="LXGW WenKai, Caveat, cursive" font-size="17" font-weight="400" fill="#F3F1E7" text-anchor="start"><tspan x="604.5" >四人一组逐个放进水里，对照自己贴的点</tspan></text><text x="1148.25" y="406" font-family="LXGW WenKai, Caveat, cursive" font-size="17" font-weight="400" fill="#F3F1E7" text-anchor="start"><tspan x="1148.25" >先请猜错的孩子说</tspan></text><text x="1148.25" y="546" font-family="LXGW WenKai, Caveat, cursive" font-size="17" font-weight="400" fill="#F3F1E7" text-anchor="start"><tspan x="1148.25" >说出“哪个和我想的不一样”，再说“为什么”</tspan></text><text x="1510.75" y="406" font-family="LXGW WenKai, Caveat, cursive" font-size="17" font-weight="400" fill="#F3F1E7" text-anchor="start"><tspan x="1510.75" >布置亲子任务</tspan></text><text x="1510.75" y="546" font-family="LXGW WenKai, Caveat, cursive" font-size="17" font-weight="400" fill="#F3F1E7" text-anchor="start"><tspan x="1510.75" >回家找一样东西，</tspan><tspan x="1510.75" dy="24.65">想办法让它从沉变</tspan><tspan x="1510.75" dy="24.65">浮</tspan></text><text x="230" y="372" font-family="LXGW WenKai, Caveat, cursive" font-size="14" font-weight="400" fill="#B9C3B5" text-anchor="middle"><tspan x="230" >0′</tspan></text><text x="411.25" y="372" font-family="LXGW WenKai, Caveat, cursive" font-size="14" font-weight="400" fill="#B9C3B5" text-anchor="middle"><tspan x="411.25" >5′</tspan></text><text x="592.5" y="372" font-family="LXGW WenKai, Caveat, cursive" font-size="14" font-weight="400" fill="#B9C3B5" text-anchor="middle"><tspan x="592.5" >10′</tspan></text><text x="773.75" y="372" font-family="LXGW WenKai, Caveat, cursive" font-size="14" font-weight="400" fill="#B9C3B5" text-anchor="middle"><tspan x="773.75" >15′</tspan></text><text x="955" y="372" font-family="LXGW WenKai, Caveat, cursive" font-size="14" font-weight="400" fill="#B9C3B5" text-anchor="middle"><tspan x="955" >20′</tspan></text><text x="1136.25" y="372" font-family="LXGW WenKai, Caveat, cursive" font-size="14" font-weight="400" fill="#B9C3B5" text-anchor="middle"><tspan x="1136.25" >25′</tspan></text><text x="1317.5" y="372" font-family="LXGW WenKai, Caveat, cursive" font-size="14" font-weight="400" fill="#B9C3B5" text-anchor="middle"><tspan x="1317.5" >30′</tspan></text><text x="1498.75" y="372" font-family="LXGW WenKai, Caveat, cursive" font-size="14" font-weight="400" fill="#B9C3B5" text-anchor="middle"><tspan x="1498.75" >35′</tspan></text><text x="1680" y="372" font-family="LXGW WenKai, Caveat, cursive" font-size="14" font-weight="400" fill="#B9C3B5" text-anchor="middle"><tspan x="1680" >40′</tspan></text><text x="80" y="406" font-family="LXGW WenKai, Caveat, cursive" font-size="20" font-weight="700" fill="#F7E36B" text-anchor="start"><tspan x="80" >老师</tspan></text><text x="80" y="434" font-family="LXGW WenKai, Caveat, cursive" font-size="15" font-weight="400" fill="#B9C3B5" text-anchor="start"><tspan x="80" >做什么</tspan></text><text x="80" y="546" font-family="LXGW WenKai, Caveat, cursive" font-size="20" font-weight="700" fill="#F7E36B" text-anchor="start"><tspan x="80" >孩子</tspan></text><text x="80" y="574" font-family="LXGW WenKai, Caveat, cursive" font-size="15" font-weight="400" fill="#B9C3B5" text-anchor="start"><tspan x="80" >做什么</tspan></text></g><g id="header"><text x="64" y="82" font-family="LXGW WenKai, Caveat, cursive" font-size="18" font-weight="400" fill="#F6DD72" text-anchor="start" letter-spacing="1"><tspan x="64" >大班科学活动，40 分钟</tspan></text><text x="64" y="137" font-family="LXGW WenKai, Caveat, cursive" font-size="50" font-weight="700" fill="#F3F1E7" text-anchor="start"><tspan x="64" >《沉与浮》教学流程</tspan></text><text x="64" y="178.5" font-family="LXGW WenKai, Caveat, cursive" font-size="20.5" font-weight="400" fill="#B9C4B5" text-anchor="start"><tspan x="64" >五个环节按时长等比例排开；上排是老师做什么，下排是孩子做什么。</tspan></text></g><g id="footer"><text x="1696" y="780.8" font-family="LXGW WenKai, Caveat, cursive" font-size="15" font-weight="400" fill="#7F9384" text-anchor="end" letter-spacing="1"><tspan x="1696" >MuseDraw · 黑板教学</tspan></text></g></svg>
