xt-11"><text x="236" y="326" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#787774" text-anchor="end"><tspan x="236" >第 N 天</tspan></text></g><g data-md-free-text="free-text-12"><text x="64" y="376" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#37352F" text-anchor="start"><tspan x="64" >学习</tspan></text></g><g data-md-free-text="free-text-13"><text x="64" y="400" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#787774" text-anchor="start"><tspan x="64" >熟悉业务与工具</tspan></text></g><g data-md-free-text="free-text-14"><text x="64" y="496" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#37352F" text-anchor="start"><tspan x="64" >交付</tspan></text></g><g data-md-free-text="free-text-15"><text x="64" y="520" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#787774" text-anchor="start"><tspan x="64" >从小任务到负责模块</tspan></text></g><g data-md-free-text="free-text-16"><text x="64" y="616" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#37352F" text-anchor="start"><tspan x="64" >关系</tspan></text></g><g data-md-free-text="free-text-17"><text x="64" y="640" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#787774" text-anchor="start"><tspan x="64" >建立工作中的连接</tspan></text></g><g data-md-free-text="free-text-18"><text x="315.33" y="373" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13.5" font-weight="600" fill="#183347" text-anchor="start"><tspan x="315.33" >开通账号与</tspan><tspan x="315.33" dy="17.55">环境</tspan></text></g><g data-md-free-text="free-text-19"><text x="688" y="419" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13.5" font-weight="600" fill="#183347" text-anchor="start"><tspan x="688" >画一张业务流程图</tspan></text></g><g data-md-free-text="free-te