"64" >→ fire</tspan></text><text x="454" y="632" font-family="Archivo, Noto Sans SC, sans-serif" font-size="22" font-weight="800" fill="#0B0B0B" text-anchor="start"><tspan x="454" >Acids</tspan></text><text x="454" y="662" font-family="Archivo, Noto Sans SC, sans-serif" font-size="22" font-weight="800" fill="#0B0B0B" text-anchor="start"><tspan x="454" >×  Bases</tspan></text><text x="454" y="692" font-family="Archivo, Noto Sans SC, sans-serif" font-size="15" font-weight="400" fill="#5E5E5A" text-anchor="start"><tspan x="454" >→ heat</tspan></text><text x="844" y="632" font-family="Archivo, Noto Sans SC, sans-serif" font-size="22" font-weight="800" fill="#0B0B0B" text-anchor="start"><tspan x="844" >Acids</tspan></text><text x="844" y="662" font-family="Archivo, Noto Sans SC, sans-serif" font-size="22" font-weight="800" fill="#0B0B0B" text-anchor="start"><tspan x="844" >×  Cyanides</tspan></text><text x="844" y="692" font-family="Archivo, Noto Sans SC, sans-serif" font-size="15" font-weight="400" fill="#5E5E5A" text-anchor="start"><tspan x="844" >→ HCN gas</tspan></text><text x="1234" y="632" font-family="Archivo, Noto Sans SC, sans-serif" font-size="22" font-weight="800" fill="#0B0B0B" text-anchor="start"><tspan x="1234" >Water-reactive</tspan></text><text x="1234" y="662" font-family="Archivo, Noto Sans SC, sans-serif" font-size="22" font-weight="800" fill="#0B0B0B" text-anchor="start"><tspan x="1234" >×  Aqueous</tspan></text><text x="1234" y="692" font-family="Archivo, Noto Sans SC, sans-serif" font-size="15" font-weight="400" fill="#5E5E5A" text-anchor="start"><tspan x="1234" >→ H₂ / fire</tspan></text></g><g id="header"><text x="64" y="77" font-family="Space Mono, Noto Sans SC, monospace" font-size="13" font-weight="700" fill="#E3001B" text-anchor="start" letter-spacing="1"><tspan x="64" >LAB SAFETY · CHEMICAL LIFECYCLE</tspan></text><text x="64" y="163.8" font-family="Archivo, Noto Sans SC, sans-serif" font-size="80" font-weight="800" fill="#0B0B0B" text-anchor