order to disposal</title><desc id="md-desc">Six steps every reagent goes through. Storage is where most incidents start, so it is the one step in red.</desc><defs></defs><g id="background"><rect id="canvas" width="1640" height="778" fill="#F2F1EC"/></g><g id="zones"></g><g id="edges"><g id="edge-s0-s1" data-md="edge"><path d="M296 415 L296.75 415" fill="none" stroke="#E3001B" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M316 415 L291.94 428.23 L291.94 401.77 Z" fill="#E3001B"/></g><g id="edge-s1-s2" data-md="edge"><path d="M552 415 L552.75 415" fill="none" stroke="#E3001B" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M572 415 L547.94 428.23 L547.94 401.77 Z" fill="#E3001B"/></g><g id="edge-s2-s3" data-md="edge"><path d="M808 415 L808.75 415" fill="none" stroke="#E3001B" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M828 415 L803.94 428.23 L803.94 401.77 Z" fill="#E3001B"/></g><g id="edge-s3-s4" data-md="edge"><path d="M1064 415 L1064.75 415" fill="none" stroke="#E3001B" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M1084 415 L1059.94 428.23 L1059.94 401.77 Z" fill="#E3001B"/></g><g id="edge-s4-s5" data-md="edge"><path d="M1320 415 L1320.75 415" fill="none" stroke="#E3001B" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M1340 415 L1315.94 428.23 L1315.94 401.77 Z" fill="#E3001B"/></g></g><g id="nodes"><g id="s0" data-md="node" data-box="64,340,228,150" data-shape="box" data-label="inside"><rect x="64" y="340" width="228" height="150" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0"/><rect x="64" y="340" width="228" height="5" fill="#0B0B0B"/><text class="md-label" x="80" y="372.81" font-family="Archivo, Noto Sans SC, sans-serif" font-size="20.5" font-weight="800" fill="#0B0B0B" text-anchor="start"><tspan x="80" >Order</tspan></text><text class="md-sub" x="80" y="394.47" font-family="Archivo, Noto Sans SC, sans-serif" font-size="14.6" font-weight="400" fill="#5E5E5A" text-anchor="start"><tspan x="80" >Check SDS before buying;</tspan><tspan x="80" dy="19.27">smallest pack that works</tspan></text><rect x="51" y="327" width="26" height="26" fill="#0B0B0B"/><text x="64" y="345.28" font-family="Archivo, Noto Sans SC, sans-serif" font-size="15.079999999999998" font-weight="800" fill="#FFFFFF" text-anchor="middle" class="md-step">1</text></g><g id="s1" data-md="node" data-box="320,340,228,150" data-shape="box" data-label="inside"><rect x="320" y="340" width="228" height="150" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0"/><rect x="320" y="340" width="228" height="5" fill="#0B0B0B"/><text class="md-label" x="336" y="372.81" font-family="Archivo, Noto Sans SC, sans-serif" font-size="20.5" font-weight="800" fill="#0B0B0B" text-anchor="start"><tspan x="336" >Receive</tspan></text><text class="md-sub" x="336" y="394.47" font-family="Archivo, Noto Sans SC, sans-serif" font-size="14.6" font-weight="400" fill="#5E5E5A" text-anchor="start"><tspan x="336" >Log lot number and expiry in</tspan><tspan x="336" dy="19.27">the inventory</tspan></text><rect x="307" y="327" width="26" height="26" fill="#0B0B0B"/><text x="320" y="345.28" font-family="Archivo, Noto Sans SC, sans-serif" font-size="15.079999999999998" font-weight="800" fill="#FFFFFF" text-anchor="middle" class="md-step">2</text></g><g id="s2" data-md="node" data-box="576,340,228,150" data-shape="box" data-label="inside"><rect x="576" y="340" width="228" height="150" rx="0" fill="#E3001B" stroke="none" stroke-width="0"/><text class="md-label" x="592" y="372.81" font-family="Archivo, Noto Sans SC, sans-serif" font-size="20.5" font-weight="800" fill="#FFFFFF" text-anchor="start"><tspan x="592" >Store</tspan></text><text class="md-sub" x="592" y="394.47" font-family="Archivo, Noto Sans SC, sans-serif" font-size="14.6" font-weight="400" fill="#FFD9DD" text-anchor="start"><tspan x="592" >Segregate by hazard class,</tspan><tspan x="592" 