<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1640 790" width="1640" height="790" role="img" aria-labelledby="md-title md-desc" data-theme="journal"><title id="md-title">图 4 | 多阶段分层整群抽样设计</title><desc id="md-desc">示例：全国老年人数字生活调查。先分层保证代表性，再整群降低成本，最后户内随机抽取一位 60 岁以上成员。括号内为样本量。</desc><defs></defs><g id="background"><rect id="canvas" width="1640" height="790" fill="#FFFFFF"/></g><g id="zones"></g><g id="edges"><g id="edge-b1-n1-b1-n2" data-md="edge"><path d="M820 254 L820 277 Q820 280 817 280 L363 280 Q360 280 360 283 L360 306" fill="none" stroke="#4A4F57" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></g><g id="edge-b1-n2-b1-n3" data-md="edge"><path d="M360 382 L360 405 Q360 408 357 408 L253 408 Q250 408 250 411 L250 434" fill="none" stroke="#4A4F57" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></g><g id="edge-b1-n2-b1-n4" data-md="edge"><path d="M360 382 L360 405 Q360 408 363 408 L467 408 Q470 408 470 411 L470 434" fill="none" stroke="#4A4F57" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></g><g id="edge-b1-n1-b1-n5" data-md="edge"><path d="M820 254 L820 306" fill="none" stroke="#4A4F57" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></g><g id="edge-b1-n5-b1-n6" data-md="edge"><path d="M820 382 L820 405 Q820 408 817 408 L713 408 Q710 408 710 411 L710 434" fill="none" stroke="#4A4F57" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></g><g id="edge-b1-n5-b1-n7" data-md="edge"><path d="M820 382 L820 405 Q820 408 823 408 L927 408 Q930 408 930 411 L930 434" fill="none" stroke="#4A4F57" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></g><g id="edge-b1-n1-b1-n8" data-md="edge"><path d="M820 254 L820 277 Q820 280 823 280 L1277 280 Q1280 280 1280 283 L1280 306" fill="none" stroke="#4A4F57" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></g><g id="edge-b1-n8-b1-n9" data-md="edge"><path d="M1280 382 L1280 405 Q1280 408 1277 408 L117