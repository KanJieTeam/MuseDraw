width="200" height="96" rx="4" fill="#FCEFE6" stroke="#E07B39" stroke-width="1"/><text class="md-label" x="710" y="480.8" font-family="Inter, Noto Sans SC, sans-serif" font-size="15" font-weight="600" fill="#6B3410" text-anchor="middle"><tspan x="710" >城市</tspan></text><text class="md-sub" x="710" y="497.16" font-family="Inter, Noto Sans SC, sans-serif" font-size="13" font-weight="400" fill="#8E5732" text-anchor="middle"><tspan x="710" >18 社区 × 20 户</tspan></text></g><g id="b1-n7" data-md="node" data-box="830,436,200,96" data-shape="undefined" data-label="inside"><rect x="830" y="436" width="200" height="96" rx="4" fill="#FCEFE6" stroke="#E07B39" stroke-width="1"/><text class="md-label" x="930" y="480.8" font-family="Inter, Noto Sans SC, sans-serif" font-size="15" font-weight="600" fill="#6B3410" text-anchor="middle"><tspan x="930" >农村</tspan></text><text class="md-sub" x="930" y="497.16" font-family="Inter, Noto Sans SC, sans-serif" font-size="13" font-weight="400" fill="#8E5732" text-anchor="middle"><tspan x="930" >18 村 × 20 户</tspan></text></g><g id="b1-n8" data-md="node" data-box="1060,308,440,72" data-shape="undefined" data-label="inside"><rect x="1060" y="308" width="440" height="72" rx="4" fill="#E9F4EB" stroke="#3E9651" stroke-width="1"/><text class="md-tag" x="1280" y="337.81" font-family="Inter, Noto Sans SC, sans-serif" font-size="11.9" font-weight="700" fill="#3E9651" text-anchor="middle"><tspan x="1280" >第一阶段：按地区分层</tspan></text><text class="md-label" x="1280" y="356.89" font-family="Inter, Noto Sans SC, sans-serif" font-size="17" font-weight="600" fill="#1E4A28" text-anchor="middle"><tspan x="1280" >西部地区（720）</tspan></text></g><g id="b1-n9" data-md="node" data-box="1070,436,200,96" data-shape="undefined" data-label="inside"><rect x="1070" y="436" width="200" height="96" rx="4" fill="#E9F4EB" stroke="#3E9651" stroke-width="1"/><text class="md-label" x="1170" y="480.8" font-family="Inter, Noto Sans SC, sans-serif" font-size="15" font-weight="600" fill="#1E4A28" text-anchor="middle"><tspan x="1170" >城市</tspan></text><text class="md-sub" x="1170" y="497.16" font-family="Inter, Noto Sans SC, sans-serif" font-size="13" font-weight="400" fill="#3F6B49" text-anchor="middle"><tspan x="1170" >18 社区 × 20 户</tspan></text></g><g id="b1-n10" data-md="node" data-box="1290,436,200,96" data-shape="undefined" data-label="inside"><rect x="1290" y="436" width="200" height="96" rx="4" fill="#E9F4EB" stroke="#3E9651" stroke-width="1"/><text class="md-label" x="1390" y="480.8" font-family="Inter, Noto Sans SC, sans-serif" font-size="15" font-weight="600" fill="#1E4A28" text-anchor="middle"><tspan x="1390" >农村</tspan></text><text class="md-sub" x="1390" y="497.16" font-family="Inter, Noto Sans SC, sans-serif" font-size="13" font-weight="400" fill="#3F6B49" text-anchor="middle"><tspan x="1390" >18 村 × 20 户</tspan></text></g></g><g id="edge-labels"></g><g id="notes"></g><g id="legend"></g><g id="texts"><text x="56" y="682" font-family="Inter, Noto Sans SC, sans-serif" font-size="14" font-weight="400" fill="#5F6368" text-anchor="start"><tspan x="56" >第二阶段：城乡二次分层  ·  第三阶段：PPS 抽取社区 / 村（规模越大，入样概率越高）  ·  第四阶段：每户 Kish 表随机抽一人</tspan></text><text x="56" y="716" font-family="Inter, Noto Sans SC, sans-serif" font-size="14" font-weight="600" fill="#C2423F" text-anchor="start"><tspan x="56" >分析时需使用抽样权重并按整群计算标准误，否则置信区间会被低估。</tspan></text></g><g id="header"><text x="56" y="74.92" font-family="Inter, Noto Sans SC, sans-serif" font-size="22" font-weight="700" fill="#1B1B1B" text-anchor="start"><tspan x="56" >图 4 | 多阶段分层整群抽样设计</tspan></text><text x="56" y="107.1" font-family="Inter, Noto Sans SC, sans-serif" font-size="15.1" font-weight="400" fill="#5F6368" text-anchor="start"><tspan x="56" >示例：全国老年人数字生活调查。先分层保证代表性，再整群降低成本，最后户内随机抽取一位 60 岁以上成员。括号内为样本量。</tspan></text></g><g id="footer"><text x="1584" y="759.2" font-family="Inter, Noto Sans SC, sans-serif" font-size="10.5" font-weight="400" fill="#A0A4AA" text-anchor="end" letter-spacing="0.5"><tspan x="1584" >MuseDraw · Journal Figure</tspan></text></g></svg>
