<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 922" width="1600" height="922" role="img" aria-labelledby="md-title md-desc" data-theme="terracotta"><title id="md-title">Explanatory sequential mixed-methods design</title><desc id="md-desc">Capital letters mark the dominant strand. The connecting step is where most designs go wrong: the qualitative sample must be chosen from the quantitative results, not by convenience.</desc><defs><filter id="tex-grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" seed="7" stitchTiles="stitch"/><feColorMatrix type="matrix" values="0 0 0 0 0.45  0 0 0 0 0.3  0 0 0 0 0.2  0 0 0 0.5 0"/></filter></defs><g id="background"><rect id="canvas" width="1600" height="922" fill="#F3E8DA"/><rect width="1600" height="922" filter="url(#tex-grain)" opacity="0.18"/></g><g id="zones"></g><g id="edges"><g id="edge-p1-p2" data-md="edge"><path d="M318 382 L351.2 382" fill="none" stroke="#C0583A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M360 382 L349 388.05 L349 375.95 Z" fill="#C0583A"/></g><g id="edge-p2-p3" data-md="edge"><path d="M618 382 L651.2 382" fill="none" stroke="#C0583A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M660 382 L649 388.05 L649 375.95 Z" fill="#C0583A"/></g><g id="edge-p3-p4" data-md="edge"><path d="M918 382 L952 382" fill="none" stroke="#6E7B3B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M960 382 L950 387.5 L950 376.5 Z" fill="#6E7B3B"/></g><g id="edge-p4-p5" data-md="edge"><path d="M1218 382 L1252 382" fill="none" stroke="#6E7B3B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M1260 382 L1250 387.5 L1250 376.5 Z" fill="#6E7B3B"/></g><g id="edge-p2-int" data-md="edge"><path d="M489 446 L489 634.7 Q489 642 496.3 642 L503.6 642" fill="none" stroke="#8C7461" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 5"/><path d="M510 642 L502 646.4 L502 637.6 Z" fill="#8C7461"/></g><g id="edge-p5-int" data-md="edge"><path d="M1389 446 L1389 626 Q1389 642 1373 642 L1074.4 642" fill="none" stroke="#8C7461" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 5"/><path d="M1068 642 L1076 637.6 L1076 646.4 Z" fill="#8C7461"/></g></g><g id="nodes"><g id="p1" data-md="node" data-box="64,322,250,120" data-shape="box" data-label="inside"><rect x="64" y="322" width="250" height="120" rx="16" fill="#C0583A" stroke="#C0583A" stroke-width="1.2"/><text class="md-tag" x="80" y="363.92" font-family="IBM Plex Mono, Noto Sans SC, monospace" font-size="11.3" font-weight="600" fill="#FFE3D3" text-anchor="start" letter-spacing="1.3"><tspan x="80" >PHASE 1, SURVEY</tspan></text><text class="md-label" x="80" y="386.86" font-family="Fraunces, Noto Serif SC, serif" font-size="19.4" font-weight="600" fill="#FFF6EC" text-anchor="start"><tspan x="80" >QUAN data</tspan></text><text class="md-sub" x="80" y="406.83" font-family="Inter, Noto Sans SC, sans-serif" font-size="14" font-weight="400" fill="#F6D2C3" text-anchor="start"><tspan x="80" >n = 1,204 nurses, 18 hospitals</tspan></text><circle cx="64" cy="322" r="13" fill="#C0583A"/><text x="64" y="327.28" font-family="Fraunces, Noto Serif SC, serif" font-size="15.079999999999998" font-weight="700" fill="#FFF6EC" text-anchor="middle" class="md-step">1</text></g><g id="p2" data-md="node" data-box="364,322,250,120" data-shape="box" data-label="inside"><rect x="364" y="322" width="250" height="120" rx="16" fill="#C0583A" stroke="#C0583A" stroke-width="1.2"/><text class="md-tag" x="380" y="363.92" font-family="IBM Plex Mono, Noto Sans SC, monospace" font-size="11.3" font-weight="600" fill="#FFE3D3" text-anchor="start" letter-spacing="1.3"><tspan x="380" >REGRESSION</tspan></text><text class="md-label" x="380" y="386.86" font-family="Fraunces, Noto Serif SC, serif" font-size="19.4" font-weight="600" fill="#FFF6EC" text-anchor="start"><tspan x="380" >QUAN analysis</tspan></text><text class="md-sub" x="380" y="406.83" font-family="Inter, Noto Sans SC, sans-serif" font-size="14" font-weight="400" fill="#F6D2C3" text-anchor="start"><tspan x="380" >burnout predictors, odds ratios</tspan></text><circle cx="364" cy="322" r="13" fill="#C0583A"/><text x="364" y="327.28" font-family="Fraunces, Noto Serif SC, serif" font-size="15.079999999999998" font-weight="700" fill="#FFF6EC" text-anchor="middle" class="md-step">2</text></g><g id="p3" data-md="node" data-box="664,322,250,120" data-shape="box" data-label="inside"><rect x="664" y="322" width="250" height="120" rx="16" fill="#E4CDAA" stroke="#E4CDAA" stroke-width="1.2"/><text class="md-tag" x="680" y="354.68" font-family="IBM Plex Mono, Noto Sans SC, monospace" font-size="11.3" font-weight="600" fill="#C0583A" text-anchor="start" letter-spacing="1.3"><tspan x="680" >CASE SELECTION</tspan></text><text class="md-label" x="680" y="377.62" font-family="Fraunces, Noto Serif SC, serif" font-size="19.4" font-weight="600" fill="#3A2A20" text-anchor="start"><tspan x="680" >Connect</tspan></text><text class="md-sub" x="680" y="397.59" font-family="Inter, Noto Sans SC, sans-serif" font-size="14" font-weight="400" fill="#6B5644" text-anchor="start"><tspan x="680" >pick 24 outliers: high workload,</tspan><tspan x="680" dy="18.48">low burnout</tspan></text><circle cx="664" cy="322" r="13" fill="#C0583A"/><text x="664" y="327.28" font-family="Fraunces, Noto Serif SC, serif" font-size="15.079999999999998" font-weight="700" fill="#FFF6EC" text-anchor="middle" class="md-step">3</text></g><g id="p4" data-md="node" data-box="964,322,250,120" data-shape="box" data-label="inside"><rect x="964" y="322" width="250" height="120" rx="16" fill="#6E7B3B" stroke="#6E7B3B" stroke-width="1.2"/><text class="md-tag" x="980" y="363.92" font-family="IBM Plex Mono, Noto Sans SC, monospace" font-size="11.3" font-weight="600" fill="#EEF2D9" text-anchor="start" letter-spacing="1.3"><tspan x="980" >PHASE 2, INTERVIEWS</tspan></text><text class="md-label" x="980" y="386.86" font-family="Fraunces, Noto Serif SC, serif" font-size="19.4" font-weight="600" fill="#FAF6E8" text-anchor="start"><tspan x="980" >qual data</tspan></text><text class="md-sub" x="980" y="406.83" font-family="Inter, Noto Sans SC, sans-serif" font-size="14" font-weight="400" fill="#DDE3C2" text-anchor="start"><tspan x="980" >semi-structured, 45–60 min</tspan></text><circle cx="964" cy="322" r="13" fill="#C0583A"/><text x="964" y="327.28" font-family="Fraunces, Noto Serif SC, serif" font-size="15.079999999999998" font-weight="700" fill="#FFF6EC" text-anchor="middle" class="md-step">4</text></g><g id="p5" data-md="node" data-box="1264,322,250,120" data-shape="box" data-label="inside"><rect x="1264" y="322" width="250" height="120" rx="16" fill="#6E7B3B" stroke="#6E7B3B" stroke-width="1.2"/><text class="md-tag" x="1280" y="363.92" font-family="IBM Plex Mono, Noto Sans SC, monospace" font-size="11.3" font-weight="600" fill="#EEF2D9" text-anchor="start" letter-spacing="1.3"><tspan x="1280" >THEMATIC</tspan></text><text class="md-label" x="1280" y="386.86" font-family="Fraunces, Noto Serif SC, serif" font-size="19.4" font-weight="600" fill="#FAF6E8" text-anchor="start"><tspan x="1280" >qual analysis</tspan></text><text class="md-sub" x="1280" y="406.83" font-family="Inter, Noto Sans SC, sans-serif" font-size="14" font-weight="400" fill="#DDE3C2" text-anchor="start"><tspan x="1280" >reflexive thematic analysis</tspan></text><circle cx="1264" cy="322" r="13" fill="#C0583A"/><text x="1264" y="327.28" font-family="Fraunces, Noto Serif SC, serif" font-size="15.079999999999998" font-weight="700" fill="#FFF6EC" text-anchor="middle" class="md-step">5</text></g><g id="int" data-md="node" data-box="514,582,550,120" data-shape="box" data-label="inside"><rect x="514" y="582" width="550" height="120" rx="16" fill="#FBF5EC" stroke="#D8C3A8" stroke-width="1.2"/><text class="md-tag" x="530" y="623.92" font-family="IBM Plex Mono, Noto Sans SC, monospace" font-size="11.3" font-weight="600" fill="#C0583A" text-anchor="start" letter-spacing="1.3"><tspan x="530" >JOINT DISPLAY</tspan></text><text class="md-label" x="530" y="646.86" font-family="Fraunces, Noto Serif SC, serif" font-size="19.4" font-weight="600" fill="#3A2A20" text-anchor="start"><tspan x="530" >Integration</tspan></text><text class="md-sub" x="530" y="666.83" font-family="Inter, Noto Sans SC, sans-serif" font-size="14" font-weight="400" fill="#7D6A5B" text-anchor="start"><tspan x="530" >how do the stories explain the numbers?</tspan></text><circle cx="514" cy="582" r="13" fill="#C0583A"/><text x="514" y="587.28" font-family="Fraunces, Noto Serif SC, serif" font-size="15.079999999999998" font-weight="700" fill="#FFF6EC" text-anchor="middle" class="md-step">6</text></g></g><g id="edge-labels"><g id="edge-p2-int-label" data-md="edge-label"><text x="497" y="548.91" font-family="Fraunces, Noto Serif SC, serif" font-size="15.1" font-weight="400" fill="#7D6A5B" text-anchor="start" font-style="italic"><tspan x="497" >statistical results</tspan></text></g><g id="edge-p5-int-label" data-md="edge-label"><text x="1202.3" y="631.47" font-family="Fraunces, Noto Serif SC, serif" font-size="15.1" font-weight="400" fill="#7D6A5B" text-anchor="start" font-style="italic"><tspan x="1202.3" >themes</tspan></text></g></g><g id="notes"><g id="note-1" data-md="note" data-box="64,782,1000,46.98"><g><text x="64" y="796.58" font-family="Fraunces, Noto Serif SC, serif" font-size="17.82" font-weight="700" fill="#C0583A">↳</text><text x="90" y="796.58" font-family="Fraunces, Noto Serif SC, serif" font-size="16.2" font-weight="400" fill="#3A2A20" text-anchor="start" font-style="italic"><tspan x="90" >Report the joint display as a table: each row a predictor, with the matching theme and a quote that confirms, expands or</tspan><tspan x="90" dy="23.49">contradicts it.</tspan></text></g></g></g><g id="legend"></g><g id="texts"><text x="64" y="292" font-family="IBM Plex Mono, Noto Sans SC, monospace" font-size="12" font-weight="600" fill="#C0583A" text-anchor="start" letter-spacing="1.5"><tspan x="64" >Phase 1 — quantitative</tspan></text><text x="964" y="292" font-family="IBM Plex Mono, Noto Sans SC, monospace" font-size="12" font-weight="600" fill="#6E7B3B" text-anchor="start" letter-spacing="1.5"><tspan x="964" >Phase 2 — qualitative</tspan></text></g><g id="header"><text x="64" y="76" font-family="IBM Plex Mono, Noto Sans SC, monospace" font-size="12" font-weight="600" fill="#C0583A" text-anchor="start" letter-spacing="2"><tspan x="64" >RESEARCH DESIGN · EXPLANATORY SEQUENTIAL</tspan></text><text x="64" y="138.72" font-family="Fraunces, Noto Serif SC, serif" font-size="52" font-weight="600" fill="#3A2A20" text-anchor="start" letter-spacing="-1"><tspan x="64" >Explanatory sequential mixed-methods design</tspan></text><text x="64" y="178.4" font-family="Inter, Noto Sans SC, sans-serif" font-size="18.4" font-weight="400" fill="#7D6A5B" text-anchor="start"><tspan x="64" >Capital letters mark the dominant strand. The connecting step is where most designs go wrong: the qualitative sample must be</tspan><tspan x="64" dy="26.68">chosen from the quantitative results, not by convenience.</tspan></text></g><g id="footer"><text x="1536" y="886.8" font-family="IBM Plex Mono, Noto Sans SC, monospace" font-size="10.5" font-weight="400" fill="#7D6A5B" text-anchor="end" letter-spacing="1.5"><tspan x="1536" >MuseDraw · Terracotta</tspan></text></g></svg>
