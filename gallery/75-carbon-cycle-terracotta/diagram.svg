<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 970" width="1680" height="970" role="img" aria-labelledby="md-title md-desc" data-theme="terracotta"><title id="md-title">Global carbon cycle, annual fluxes</title><desc id="md-desc">Boxes are stocks in billions of tonnes of carbon (GtC); arrows are yearly flows. Of the ~11 GtC humans add each year, the land and ocean take back a little more than half.</desc><defs><filter id="tex-grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" seed="7" stitchTiles="stitch"/><feColorMatrix type="matrix" values="0 0 0 0 0.45  0 0 0 0 0.3  0 0 0 0 0.2  0 0 0 0.5 0"/></filter></defs><g id="background"><rect id="canvas" width="1680" height="970" fill="#F3E8DA"/><rect width="1680" height="970" filter="url(#tex-grain)" opacity="0.18"/></g><g id="zones"></g><g id="edges"><g id="edge-veg-atm" data-md="edge"><path d="M218 556 L218 350 Q218 334 234 334 L608 334" fill="none" stroke="#6E7B3B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M616 334 L606 339.5 L606 328.5 Z" fill="#6E7B3B"/></g><g id="edge-atm-veg" data-md="edge"><path d="M616 372.5 L346 372.5 Q330 372.5 330 388.5 L330 548" fill="none" stroke="#6E7B3B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M330 556 L324.5 546 L335.5 546 Z" fill="#6E7B3B"/></g><g id="edge-veg-soil" data-md="edge"><path d="M260 664 L260 769.6" fill="none" stroke="#8C7461" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 5"/><path d="M260 776 L255.6 768 L264.4 768 Z" fill="#8C7461"/></g><g id="edge-atm-ocean" data-md="edge"><path d="M1044 323 L1324 323 Q1340 323 1340 339 L1340 547.2" fill="none" stroke="#C0583A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M1340 556 L1333.95 545 L1346.05 545 Z" fill="#C0583A"/></g><g id="edge-ocean-atm" data-md="edge"><path d="M1500 556 L1500 383 Q1500 367 1484 367 L1050.4 367" fill="none" stroke="#8C7461" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 5"/><path d="M1044 367 L1052 362.6 L1052 371.4 Z" fill="#8C7461"/></g><g id="edge-fossil-atm" data-md="edge"><path d="M830 776 L830 420" fill="none" stroke="#C0583A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M830 404 L841 424 L819 424 Z" fill="#C0583A"/></g></g><g id="nodes"><g id="atm" data-md="node" data-box="620,290,420,110" data-shape="box" data-label="inside"><rect x="620" y="290" width="420" height="110" rx="16" fill="#C0583A" stroke="#C0583A" stroke-width="1.2"/><text class="md-tag" x="830" y="324.62" font-family="IBM Plex Mono, Noto Sans SC, monospace" font-size="11.3" font-weight="600" fill="#FFE3D3" text-anchor="middle" letter-spacing="1.3"><tspan x="830" >≈ 875 GTC</tspan></text><text class="md-label" x="830" y="351.33" font-family="Fraunces, Noto Serif SC, serif" font-size="24" font-weight="600" fill="#FFF6EC" text-anchor="middle"><tspan x="830" >Atmosphere</tspan></text><text class="md-sub" x="830" y="372.13" font-family="Inter, Noto Sans SC, sans-serif" font-size="14" font-weight="400" fill="#F6D2C3" text-anchor="middle"><tspan x="830" >+5 GtC every year</tspan></text></g><g id="veg" data-md="node" data-box="120,560,280,100" data-shape="box" data-label="inside"><rect x="120" y="560" width="280" height="100" rx="16" fill="#6E7B3B" stroke="#6E7B3B" stroke-width="1.2"/><text class="md-tag" x="136" y="601.42" font-family="IBM Plex Mono, Noto Sans SC, monospace" font-size="11.3" font-weight="600" fill="#EEF2D9" text-anchor="start" letter-spacing="1.3"><tspan x="136" >≈ 450 GTC</tspan></text><text class="md-label" x="136" y="624.36" font-family="Fraunces, Noto Serif SC, serif" font-size="19.4" font-weight="600" fill="#FAF6E8" text-anchor="start"><tspan x="136" >Vegetation</tspan></text></g><g id="soil" data-md="node" data-box="120,780,280,110" data-shape="box" data-label="inside"><rect x="120" y="780" width="280" height="110" rx="16" fill="#E4CDAA" stroke="#E4CDAA" stroke-width="1.2"/><text class="md-tag" x="136" y="816.92" font-family="IBM Plex Mono, Noto Sans SC, monospace" font-size="11.3" font-weight="600" fill="#C0583A" text-anchor="start" letter-spacing="1.3"><tspan x="136" >≈ 1,700 GTC</tspan></text><text class="md-label" x="136" y="839.86" font-family="Fraunces, Noto Serif SC, serif" font-size="19.4" font-weight="600" fill="#3A2A20" text-anchor="start"><tspan x="136" >Soils</tspan></text><text class="md-sub" x="136" y="859.83" font-family="Inter, Noto Sans SC, sans-serif" font-size="14" font-weight="400" fill="#6B5644" text-anchor="start"><tspan x="136" >+ permafrost ≈ 1,400</tspan></text></g><g id="ocean" data-md="node" data-box="1260,560,320,130" data-shape="box" data-label="inside"><rect x="1260" y="560" width="320" height="130" rx="16" fill="#DCE6EC" stroke="#B7C9D5" stroke-width="1.2"/><text class="md-tag" x="1276" y="606.92" font-family="IBM Plex Mono, Noto Sans SC, monospace" font-size="11.3" font-weight="600" fill="#6E8FA6" text-anchor="start" letter-spacing="1.3"><tspan x="1276" >≈ 38,000 GTC</tspan></text><text class="md-label" x="1276" y="629.86" font-family="Fraunces, Noto Serif SC, serif" font-size="19.4" font-weight="600" fill="#25394A" text-anchor="start"><tspan x="1276" >Ocean</tspan></text><text class="md-sub" x="1276" y="649.83" font-family="Inter, Noto Sans SC, sans-serif" font-size="14" font-weight="400" fill="#4D6577" text-anchor="start"><tspan x="1276" >mostly deep, dissolved</tspan></text></g><g id="fossil" data-md="node" data-box="690,780,280,110" data-shape="box" data-label="inside"><rect x="690" y="780" width="280" height="110" rx="16" fill="#FBF5EC" stroke="#D8C3A8" stroke-width="1.2"/><text class="md-tag" x="706" y="816.92" font-family="IBM Plex Mono, Noto Sans SC, monospace" font-size="11.3" font-weight="600" fill="#C0583A" text-anchor="start" letter-spacing="1.3"><tspan x="706" >GEOLOGICAL</tspan></text><text class="md-label" x="706" y="839.86" font-family="Fraunces, Noto Serif SC, serif" font-size="19.4" font-weight="600" fill="#3A2A20" text-anchor="start"><tspan x="706" >Fossil fuels</tspan></text><text class="md-sub" x="706" y="859.83" font-family="Inter, Noto Sans SC, sans-serif" font-size="14" font-weight="400" fill="#7D6A5B" text-anchor="start"><tspan x="706" >coal, oil, gas</tspan></text></g></g><g id="edge-labels"><g id="edge-veg-atm-label" data-md="edge-label"><text x="355.77" y="323.47" font-family="Fraunces, Noto Serif SC, serif" font-size="15.1" font-weight="400" fill="#7D6A5B" text-anchor="start" font-style="italic"><tspan x="355.77" >respiration ≈ 119</tspan></text></g><g id="edge-atm-veg-label" data-md="edge-label"><text x="397.88" y="361.97" font-family="Fraunces, Noto Serif SC, serif" font-size="15.1" font-weight="400" fill="#7D6A5B" text-anchor="start" font-style="italic"><tspan x="397.88" >photosynthesis ≈ 123</tspan></text></g><g id="edge-veg-soil-label" data-md="edge-label"><text x="268" y="724.91" font-family="Fraunces, Noto Serif SC, serif" font-size="15.1" font-weight="400" fill="#7D6A5B" text-anchor="start" font-style="italic"><tspan x="268" >litter</tspan></text></g><g id="edge-atm-ocean-label" data-md="edge-label"><rect x="1135.31" y="307.56" width="89.39" height="24.88" rx="3" fill="#F3E8DA"/><text x="1139.31" y="324.91" font-family="Fraunces, Noto Serif SC, serif" font-size="15.1" font-weight="400" fill="#7D6A5B" text-anchor="start" font-style="italic"><tspan x="1139.31" >uptake ≈ 80</tspan></text></g><g id="edge-ocean-atm-label" data-md="edge-label"><rect x="1133.19" y="367.56" width="93.62" height="24.88" rx="3" fill="#F3E8DA"/><text x="1137.19" y="384.91" font-family="Fraunces, Noto Serif SC, serif" font-size="15.1" font-weight="400" fill="#7D6A5B" text-anchor="start" font-style="italic"><tspan x="1137.19" >release ≈ 77</tspan></text></g><g id="edge-fossil-atm-label" data-md="edge-label"><text x="838" y="594.91" font-family="Fraunces, Noto Serif SC, serif" font-size="15.1" font-weight="400" fill="#7D6A5B" text-anchor="start" font-style="italic"><tspan x="838" >fossil emissions ≈ 10</tspan></text></g></g><g id="notes"><g id="note-1" data-md="note" data-box="1150,760,460,71.28"><g><text x="1150" y="776.2" font-family="Fraunces, Noto Serif SC, serif" font-size="16.2" font-weight="700" fill="#3A2A20" text-anchor="start"><tspan x="1150" >Net, per year (GCB 2023, approx.)</tspan></text><text x="1150" y="798.88" font-family="Fraunces, Noto Serif SC, serif" font-size="17.82" font-weight="700" fill="#C0583A"></text><text x="1176" y="798.88" font-family="Fraunces, Noto Serif SC, serif" font-size="16.2" font-weight="400" fill="#3A2A20" text-anchor="start" font-style="italic"><tspan x="1176" >Added: fossil ≈ 9.9 + land-use change ≈ 1.1. Removed: land</tspan><tspan x="1176" dy="23.49">sink ≈ 3.3, ocean sink ≈ 2.9. Stays in the air: ≈ 5.1 GtC.</tspan></text></g></g></g><g id="legend"></g><g id="texts"></g><g id="header"><text x="64" y="76" font-family="IBM Plex Mono, Noto Sans SC, monospace" font-size="12" font-weight="600" fill="#C0583A" text-anchor="start" letter-spacing="2"><tspan x="64" >EARTH SYSTEM · GLOBAL CARBON BUDGET</tspan></text><text x="64" y="138.72" font-family="Fraunces, Noto Serif SC, serif" font-size="52" font-weight="600" fill="#3A2A20" text-anchor="start" letter-spacing="-1"><tspan x="64" >Global carbon cycle, annual fluxes</tspan></text><text x="64" y="178.4" font-family="Inter, Noto Sans SC, sans-serif" font-size="18.4" font-weight="400" fill="#7D6A5B" text-anchor="start"><tspan x="64" >Boxes are stocks in billions of tonnes of carbon (GtC); arrows are yearly flows. Of the ~11 GtC humans add each year, the land and</tspan><tspan x="64" dy="26.68">ocean take back a little more than half.</tspan></text><text x="1616" y="76" font-family="IBM Plex Mono, Noto Sans SC, monospace" font-size="12" font-weight="400" fill="#7D6A5B" text-anchor="end" letter-spacing="2"><tspan x="1616" >FIG. 75</tspan></text></g><g id="footer"><text x="1