<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1640 830" width="1640" height="830" role="img" aria-labelledby="md-title md-desc" data-theme="swiss"><title id="md-title">Clinical trial phases and success rates</title><desc id="md-desc">Each phase answers one question with more people and more money. Most drugs stop at the second one.</desc><defs></defs><g id="background"><rect id="canvas" width="1640" height="830" fill="#F2F1EC"/></g><g id="zones"><g id="r" data-md="zone"><path d="M64 310H1576" stroke="#0B0B0B" stroke-width="3"/></g></g><g id="edges"><g id="edge-p0-p1" data-md="edge"><path d="M304 410 L305 410" fill="none" stroke="#0B0B0B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M316 410 L302.25 417.56 L302.25 402.44 Z" fill="#0B0B0B"/></g><g id="edge-p1-p2" data-md="edge"><path d="M560 410 L572 410" fill="none" stroke="#E3001B" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M572 410 L547.94 423.23 L547.94 396.77 Z" fill="#E3001B"/></g><g id="edge-p2-p3" data-md="edge"><path d="M816 410 L817 410" fill="none" stroke="#0B0B0B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M828 410 L814.25 417.56 L814.25 402.44 Z" fill="#0B0B0B"/></g><g id="edge-p3-p4" data-md="edge"><path d="M1072 410 L1073 410" fill="none" stroke="#0B0B0B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M1084 410 L1070.25 417.56 L1070.25 402.44 Z" fill="#0B0B0B"/></g><g id="edge-p4-p5" data-md="edge"><path d="M1328 410 L1329 410" fill="none" stroke="#0B0B0B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M1340 410 L1326.25 417.56 L1326.25 402.44 Z" fill="#0B0B0B"/></g></g><g id="nodes"><g id="p0" data-md="node" data-box="64,340,236,140" data-shape="box" data-label="inside"><rect x="64" y="340" width="236" height="140" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0"/><rect x="64" y="340" width="236" height="5" fill="#0B0B0B"/><text class="md-tag" x="80" y="389.51" font-family="Space Mono, Noto Sans SC, monospace" font-size="11.9" font-weight="700" fill="#E3001B" text-anchor="start"><tspan x="80" >LAB + ANIMAL</tspan></text><text class="md-label" x="80" y="415.69" font-family="Archivo, Noto Sans SC, sans-serif" font-size="22" font-weight="800" fill="#0B0B0B" text-anchor="start"><tspan x="80" >Pre-clinical</tspan></text><text class="md-sub" x="80" y="437.62" font-family="Archivo, Noto Sans SC, sans-serif" font-size="14.6" font-weight="400" fill="#5E5E5A" text-anchor="start"><tspan x="80" >3–6 yrs</tspan></text></g><g id="p1" data-md="node" data-box="320,340,236,140" data-shape="box" data-label="inside"><rect x="320" y="340" width="236" height="140" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0"/><rect x="320" y="340" width="236" height="5" fill="#0B0B0B"/><text class="md-tag" x="336" y="389.51" font-family="Space Mono, Noto Sans SC, monospace" font-size="11.9" font-weight="700" fill="#E3001B" text-anchor="start"><tspan x="336" >20–80 PEOPLE</tspan></text><text class="md-label" x="336" y="415.69" font-family="Archivo, Noto Sans SC, sans-serif" font-size="22" font-weight="800" fill="#0B0B0B" text-anchor="start"><tspan x="336" >Phase I</tspan></text><text class="md-sub" x="336" y="437.62" font-family="Archivo, Noto Sans SC, sans-serif" font-size="14.6" font-weight="400" fill="#5E5E5A" text-anchor="start"><tspan x="336" >safety, dose</tspan></text></g><g id="p2" data-md="node" data-box="576,340,236,140" data-shape="box" data-label="inside"><rect x="576" y="340" width="236" height="140" rx="0" fill="#E3001B" stroke="none" stroke-width="0"/><text class="md-tag" x="592" y="389.51" font-family="Space Mono, Noto Sans SC, monospace" font-size="11.9" font-weight="700" fill="#FFFFFF" text-anchor="start"><tspan x="592" >100–300 PATIENTS</tspan></text><text class="md-label" x="592" y="415.69" font-family="Archivo, Noto Sans SC, sans-serif" font-size="22" font-weight="800" fill="#FFFFFF" text-anchor="start"><tspan x="592" >Phase II</tspan></text><text class="md-sub" x="592" y="437.62" font-family="Archivo, Noto Sans SC, sans-serif" font-size="14.6" font-weight="400" fill="#FFD9DD" text-anchor="start"><tspan x="592" >does it work?</tspan></text></g><g id="p3" data-md="node" data-box="832,340,236,140" data-shape="box" data-label="inside"><rect x="832" y="340" width="236" height="140" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0"/><rect x="832" y="340" width="236" height="5" fill="#0B0B0B"/><text class="md-tag" x="848" y="389.51" font-family="Space Mono, Noto Sans SC, monospace" font-size="11.9" font-weight="700" fill="#E3001B" text-anchor="start"><tspan x="848" >1,000–3,000</tspan></text><text class="md-label" x="848" y="415.69" font-family="Archivo, Noto Sans SC, sans-serif" font-size="22" font-weight="800" fill="#0B0B0B" text-anchor="start"><tspan x="848" >Phase III</tspan></text><text class="md-sub" x="848" y="437.62" font-family="Archivo, Noto Sans SC, sans-serif" font-size="14.6" font-weight="400" fill="#5E5E5A" text-anchor="start"><tspan x="848" >better than standard?</tspan></text></g><g id="p4" data-md="node" data-box="1088,340,236,140" data-shape="box" data-label="inside"><rect x="1088" y="340" width="236" height="140" rx="0" fill="#0B0B0B" stroke="none" stroke-width="0"/><text class="md-tag" x="1104" y="389.51" font-family="Space Mono, Noto Sans SC, monospace" font-size="11.9" font-weight="700" fill="#E3001B" text-anchor="start"><tspan x="1104" >REGULATOR</tspan></text><text class="md-label" x="1104" y="415.69" font-family="Archivo, Noto Sans SC, sans-serif" font-size="22" font-weight="800" fill="#FFFFFF" text-anchor="start"><tspan x="1104" >Review</tspan></text><text class="md-sub" x="1104" y="437.62" font-family="Archivo, Noto Sans SC, sans-serif" font-size="14.6" font-weight="400" fill="#BDBDB8" text-anchor="start"><tspan x="1104" >approve or not</tspan></text></g><g id="p5" data-md="node" data-box="1344,340,236,140" data-shape="box" data-label="inside"><rect x="1344" y="340" width="236" height="140" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0"/><rect x="1344" y="340" width="236" height="5" fill="#0B0B0B"/><text class="md-tag" x="1360" y="389.51" font-family="Space Mono, Noto Sans SC, monospace" font-size="11.9" font-weight="700" fill="#E3001B" text-anchor="start"><tspan x="1360" >EVERYONE</tspan></text><text class="md-label" x="1360" y="415.69" font-family="Archivo, Noto Sans SC, sans-serif" font-size="22" font-weight="800" fill="#0B0B0B" text-anchor="start"><tspan x="1360" >Phase IV</tspan></text><text class="md-sub" x="1360" y="437.62" font-family="Archivo, Noto Sans SC, sans-serif" font-size="14.6" font-weight="400" fill="#5E5E5A" text-anchor="start"><tspan x="1360" >long-term safety</tspan></text></g></g><g id="edge-labels"></g><g id="notes"></g><g id="legend"></g><g id="texts"><text x="438" y="600" font-family="Archivo, Noto Sans SC, sans-serif" font-size="64" font-weight="800" fill="#0B0B0B" text-anchor="middle"><tspan x="438" >52%</tspan></text><text x="438" y="630" font-family="Archivo, Noto Sans SC, sans-serif" font-size="13" font-weight="400" fill="#5E5E5A" text-anchor="middle"><tspan x="438" >move on to the next stage</tspan></text><text x="694" y="600" font-family="Archivo, Noto Sans SC, sans-serif" font-size="64" font-weight="800" fill="#E3001B" text-anchor="middle"><tspan x="694" >29%</tspan></text><text x="694" y="630" font-family="Archivo, Noto Sans SC, sans-serif" font-size="13" font-weight="400" fill="#5E5E5A" text-anchor="middle"><tspan x="694" >move on to the next stage</tspan></text><text x="950" y="600" font-family="Archivo, Noto Sans SC, sans-serif" font-size="64" font-weight="800" fill="#0B0B0B" text-anchor="middle"><tspan x="950" >58%</tspan></text><text x="950" y="630" font-family="Archivo, Noto Sans SC, sans-serif" font-size="13" font-weight="400" fill="#5E5E5A" text-anchor="middle"><tspan x="950" >move on to the next stage</tspan></text><text x="1206" y="600" font-family="Archivo, Noto Sans SC, sans-serif" font-size="64" font-weight="800" fill="#0B0B0B" text-anchor="middle"><tspan x="1206" >91%</tspan></text><text x="1206" y="630" font-family="Archivo, Noto Sans SC, sans-serif" font-size="13" font-weight="400" fill="#5E5E5A" text-anchor="middle"><tspan x="1206" >move on to the next stage</tspan></text><text x="64" y="530" font-family="Space Mono, Noto Sans SC, monospace" font-size="12" font-weight="700" fill="#0B0B0B" text-anchor="start"><tspan x="64" >Chance of moving on</tspan></text><text x="64" y="710" font-family="Archivo, Noto Sans SC, sans-serif" font-size="16" font-weight="400" fill="#0B0B0B" text-anchor="start"><tspan x="64" >≈ 1 in 13 drugs entering Phase I reach approval. Phase II is the valley of death: most candidates are safe enough, but not effective enough.</tspan></text><text x="64" y="760" font-family="Archivo, Noto Sans SC, sans-serif" font-size="12" font-weight="400" fill="#5E5E5A" text-anchor="start"><tspan x="64" >Transition rates approximate, BIO / Informa / QLS clinical development success rates 2011–2020, all indications.</tspan></text></g><g id="header"><text x="64" y="77" font-family="Space Mono, Noto Sans SC, monospace" font-size="13" font-weight="700" fill="#E3001B" text-anchor="start" letter-spacing="1"><tspan x="64" >DRUG DEVELOPMENT · 10–15 YEARS</tspan></text><text x="64" y="163.8" font-family="Archivo, Noto Sans SC, sans-serif" font-size="80" font-weight="800" fill="#0B0B0B" text-anchor="start" letter-spacing="-2.5"><tspan x="64" >Clinical trial phases and success rates</tspan></text><text x="64" y="208.4" font-family="Archivo, Noto Sans SC, sans-serif" font-size="19.4" font-weight="400" fill="#0B0B0B" text-anchor="start"><tspan x="64" >Each phase answers one question with more people and more money. Most</tspan><tspan x="64" dy="28.13">drugs stop at the second one.</tspan></text><text x="1576" y="77" font-family="Space Mono, Noto Sans SC, monospace" font-size="13" font-weight="400" fill="#0B0B0B" text-anchor="end" letter-spacing="1"><tspan x="1576" >CLINICAL / 65</tspan></text></g><g id="footer"><text x="1576" y="794.8" font-family="Space Mono, Noto Sans SC, monospace" font-size="11" font-weight="400" fill="#0B0B0B" text-anchor="end"><tspan x="1576" >MuseDraw / Swiss Poster</tspan></text></g></svg>
