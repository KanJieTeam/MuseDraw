<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 940" width="1700" height="940" role="img" aria-labelledby="md-title md-desc" data-theme="riso"><title id="md-title">Hiring funnel: senior backend engineer</title><desc id="md-desc">Each stage has an owner and a time limit. Candidates remember the slow stage, not the hard one — so the SLA is part of the design.</desc><defs><filter id="tex-grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="1.1" numOctaves="3" seed="7" stitchTiles="stitch"/><feColorMatrix type="matrix" values="0 0 0 0 0.25  0 0 0 0 0.2  0 0 0 0 0.15  0 0 0 0.55 0"/></filter></defs><g id="background"><rect id="canvas" width="1700" height="940" fill="#F3ECDD"/><rect width="1700" height="940" filter="url(#tex-grain)" opacity="0.28"/></g><g id="zones"></g><g id="edges"></g><g id="nodes"><g id="s1" data-md="node" data-box="64,380,270,110" data-shape="chevron" data-label="inside"><path d="M68 383H316L338 438L316 493H68L68 438Z" fill="none" stroke="#FF4F93" stroke-width="2" stroke-linejoin="round"/><path d="M64 380H312L334 435L312 490H64L64 435Z" fill="#F3ECDD" stroke="#2648B8" stroke-width="2" stroke-linejoin="round"/><text class="md-label" x="199" y="440.44" font-family="Space Grotesk, Noto Sans SC, sans-serif" font-size="17" font-weight="700" fill="#2648B8" text-anchor="middle"><tspan x="199" >Applied</tspan></text></g><g id="s2" data-md="node" data-box="326,380,270,110" data-shape="chevron" data-label="inside"><path d="M330 383H578L600 438L578 493H330L352 438Z" fill="none" stroke="#FF4F93" stroke-width="2" stroke-linejoin="round"/><path d="M326 380H574L596 435L574 490H326L348 435Z" fill="#F3ECDD" stroke="#2648B8" stroke-width="2" stroke-linejoin="round"/><text class="md-label" x="461" y="440.44" font-family="Space Grotesk, Noto Sans SC, sans-serif" font-size="17" font-weight="700" fill="#2648B8" text-anchor="middle"><tspan x="461" >Recruiter screen</tspan></text></g><g id="s3" data-md="node" data-box="588,380,270,110" data-shape="chevron" data-label="inside"><path d="M592 383H840L862 438L840 493H592L614 438Z" fill="none" stroke="#FF4F93" stroke-width="2" stroke-linejoin="round"/><path d="M588 380H836L858 435L836 490H588L610 435Z" fill="#F3ECDD" stroke="#2648B8" stroke-width="2" stroke-linejoin="round"/><text class="md-label" x="723" y="440.44" font-family="Space Grotesk, Noto Sans SC, sans-serif" font-size="17" font-weight="700" fill="#2648B8" text-anchor="middle"><tspan x="723" >Hiring manager</tspan></text></g><g id="s4" data-md="node" data-box="850,380,270,110" data-shape="chevron" data-label="inside"><path d="M854 383H1102L1124 438L1102 493H854L876 438Z" fill="none" stroke="#FF4F93" stroke-width="2" stroke-linejoin="round"/><path d="M850 380H1098L1120 435L1098 490H850L872 435Z" fill="#FF4F93" stroke="#2648B8" stroke-width="2" stroke-linejoin="round"/><text class="md-label" x="985" y="440.44" font-family="Space Grotesk, Noto Sans SC, sans-serif" font-size="17" font-weight="700" fill="#2648B8" text-anchor="middle"><tspan x="985" >Take-home + review</tspan></text></g><g id="s5" data-md="node" data-box="1112,380,270,110" data-shape="chevron" data-label="inside"><path d="M1116 383H1364L1386 438L1364 493H1116L1138 438Z" fill="none" stroke="#FF4F93" stroke-width="2" stroke-linejoin="round"/><path d="M1112 380H1360L1382 435L1360 490H1112L1134 435Z" fill="#F3ECDD" stroke="#2648B8" stroke-width="2" stroke-linejoin="round"/><text class="md-label" x="1247" y="440.44" font-family="Space Grotesk, Noto Sans SC, sans-serif" font-size="17" font-weight="700" fill="#2648B8" text-anchor="middle"><tspan x="1247" >Onsite loop</tspan></text></g><g id="s6" data-md="node" data-box="1374,380,262,110" data-shape="chevron" data-label="inside"><path d="M1378 383H1618L1640 438L1618 493H1378L1400 438Z" fill="none" stroke="#FF4F93" stroke-width="2" stroke-linejoin="round"/><path d="M1374 380H1614L1636 435L1614 490H1374L1396 435Z" fill="#2648B8" stroke="#2648B8" stroke-width="2" stroke-linejoin="round"/><text class="md-label" x="1505" y="440.44" font-family="Space Grotesk, Noto Sans SC, sans-serif" font-size="17" font-weight="700" fill="#F3ECDD" text-anchor="middle"><tspan x="1505" >Offer → hired</tspan></text></g></g><g id="edge-labels"></g><g id="notes"><g id="note-1" data-md="note" data-box="64,800,470,67.07"><g><text x="64" y="814.58" font-family="Space Grotesk, Noto Sans SC, sans-serif" font-size="17.82" font-weight="700" fill="#FF4F93">!</text><text x="90" y="814.58" font-family="Space Grotesk, Noto Sans SC, sans-serif" font-size="16.2" font-weight="400" fill="#2648B8" text-anchor="start"><tspan x="90" >The take-home loses the most strong candidates. Paid,</tspan><tspan x="90" dy="22.36">capped at 3 hours, graded against a rubric shared in</tspan><tspan x="90" dy="22.36">advance.</tspan></text></g></g><g id="note-2" data-md="note" data-box="700,800,470,44.71"><g><text x="700" y="814.58" font-family="Space Grotesk, Noto Sans SC, sans-serif" font-size="17.82" font-weight="700" fill="#FF4F93">✓</text><text x="726" y="814.58" font-family="Space Grotesk, Noto Sans SC, sans-serif" font-size="16.2" font-weight="400" fill="#2648B8" text-anchor="start"><tspan x="726" >Rejections go out within 48 h of any stage, with one</tspan><tspan x="726" dy="22.36">specific line of feedback.</tspan></text></g></g></g><g id="legend"></g><g id="texts"><text x="84" y="542" font-family="Space Mono, Noto Sans SC, monospace" font-size="11" font-weight="700" fill="#FF4F93" text-anchor="start" letter-spacing="1.5"><tspan x="84" >OWNER</tspan></text><text x="84" y="568" font-family="Space Grotesk, Noto Sans SC, sans-serif" font-size="15" font-weight="400" fill="#2648B8" text-anchor="start"><tspan x="84" >ATS auto-filter + recruiter</tspan></text><text x="346" y="568" font-family="Space Grotesk, Noto Sans SC, sans-serif" font-size="15" font-weight="400" fill="#2648B8" text-anchor="start"><tspan x="346" >Recruiter · 30 min call</tspan></text><text x="608" y="568" font-family="Space Grotesk, Noto Sans SC, sans-serif" font-size="15" font-weight="400" fill="#2648B8" text-anchor="start"><tspan x="608" >Hiring manager · 45 min</tspan></text><text x="870" y="568" font-family="Space Grotesk, Noto Sans SC, sans-serif" font-size="15" font-weight="400" fill="#2648B8" text-anchor="start"><tspan x="870" >2 engineers grade blind</tspan></text><text x="1132" y="568" font-family="Space Grotesk, Noto Sans SC, sans-serif" font-size="15" font-weight="400" fill="#2648B8" text-anchor="start"><tspan x="1132" >4 interviews, one day</tspan></text><text x="1394" y="568" font-family="Space Grotesk, Noto Sans SC, sans-serif" font-size="15" font-weight="400" fill="#2648B8" text-anchor="start"><tspan x="1394" >Manager + HR</tspan></text><text x="84" y="640" font-family="Space Mono, Noto Sans SC, monospace" font-size="11" font-weight="700" fill="#FF4F93" text-anchor="start" letter-spacing="1.5"><tspan x="84" >SLA</tspan></text><text x="84" y="678" font-family="Space Grotesk, Noto Sans SC, sans-serif" font-size="34" font-weight="700" fill="#2648B8" text-anchor="start"><tspan x="84" >2 days</tspan></text><text x="346" y="678" font-family="Space Grotesk, Noto Sans SC, sans-serif" font-size="34" font-weight="700" fill="#2648B8" text-anchor="start"><tspan x="346" >3 days</tspan></text><text x="608" y="678" font-family="Space Grotesk, Noto Sans SC, sans-serif" font-size="34" font-weight="700" fill="#2648B8" text-anchor="start"><tspan x="608" >5 days</tspan></text><text x="870" y="678" font-family="Space Grotesk, Noto Sans SC, sans-serif" font-size="34" font-weight="700" fill="#FF4F93" text-anchor="start"><tspan x="870" >7 days</tspan></text><text x="1132" y="678" font-family="Space Grotesk, Noto Sans SC, sans-serif" font-size="34" font-weight="700" fill="#2648B8" text-anchor="start"><tspan x="1132" >5 days</tspan></text><text x="1394" y="678" font-family="Space Grotesk, Noto Sans SC, sans-serif" font-size="34" font-weight="700" fill="#2648B8" text-anchor="start"><tspan x="1394" >3 days</tspan></text><text x="1636" y="96" font-family="Space Mono, Noto Sans SC, monospace" font-size="12" font-weight="700" fill="#FF4F93" text-anchor="end" letter-spacing="1.5"><tspan x="1636" >Time to hire</tspan></text><text x="1636" y="170" font-family="Space Grotesk, Noto Sans SC, sans-serif" font-size="64" font-weight="700" fill="#2648B8" text-anchor="end"><tspan x="1636" >25 days</tspan></text><text x="84" y="360" font-family="Space Grotesk, Noto Sans SC, sans-serif" font-size="44" font-weight="700" fill="#2648B8" text-anchor="start"><tspan x="84" >640</tspan></text><text x="346" y="360" font-family="Space Grotesk, Noto Sans SC, sans-serif" font-size="44" font-weight="700" fill="#2648B8" text-anchor="start"><tspan x="346" >180</tspan></text><text x="608" y="360" font-family="Space Grotesk, Noto Sans SC, sans-serif" font-size="44" font-weight="700" fill="#2648B8" text-anchor="start"><tspan x="608" >64</tspan></text><text x="870" y="360" font-family="Space Grotesk, Noto Sans SC, sans-serif" font-size="44" font-weight="700" fill="#2648B8" text-anchor="start"><tspan x="870" >22</tspan></text><text x="1132" y="360" font-family="Space Grotesk, Noto Sans SC, sans-serif" font-size="44" font-weight="700" fill="#2648B8" text-anchor="start"><tspan x="1132" >9</tspan></text><text x="1394" y="360" font-family="Space Grotesk, Noto Sans SC, sans-serif" font-size="44" font-weight="700" fill="#2648B8" text-anchor="start"><tspan x="1394" >2 → 1</tspan></text></g><g id="header"><text x="64" y="77" font-family="Space Mono, Noto Sans SC, monospace" font-size="13" font-weight="700" fill="#FF4F93" text-anchor="start" letter-spacing="1.5"><tspan x="64" >RECRUITING · SENIOR BACKEND ENGINEER</tspan></text><text x="64" y="146.6" font-family="Space Grotesk, Noto Sans SC, sans-serif" font-size="60" font-weight="700" fill="#2648B8" text-anchor="start" letter-spacing="-1.5"><tspan x="64" >Hiring funnel: senior backend engineer</tspan></text><text x="64" y="188.4" font-family="Space Grotesk, Noto Sans SC, sans-serif" font-size="19.4" font-weight="400" fill="#2648B8" text-anchor="start"><tspan x="64" >Each stage has an owner and a time limit. Candidates remember the slow stage, not the hard one — so the SLA is part of</tspan><tspan x="64" dy="28.13">the design.</tspan></text></g><g id="footer"><text x="1636" y="904.8" font-family="Space Mono, Noto Sans SC, monospace" font-size="11" font-weight="400" fill="#FF4F93" text-anchor="end" letter-spacing="1"><tspan x="1636" >MuseDraw · printed in pink + blue</tspan></text></g></svg>
