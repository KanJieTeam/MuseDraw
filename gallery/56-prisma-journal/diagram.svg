4A4F57"/></g><g id="edge-assessed-exc2" data-md="edge"><path d="M692 784 L822.4 784" fill="none" stroke="#4A4F57" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M828 784 L821 787.85 L821 780.15 Z" fill="#4A4F57"/></g><g id="edge-assessed-incl" data-md="edge"><path d="M410 818 L410 924.4" fill="none" stroke="#4A4F57" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M410 930 L406.15 923 L413.85 923 Z" fill="#4A4F57"/></g></g><g id="nodes"><g id="lane0" data-md="node" data-box="56,202,40,260" data-shape="box" data-label="inside"><rect x="56" y="202" width="40" height="260" rx="4" fill="#2F6DB5" stroke="#2F6DB5" stroke-width="1"/></g><g id="lane1" data-md="node" data-box="56,482,40,410" data-shape="box" data-label="inside"><rect x="56" y="482" width="40" height="410" rx="4" fill="#2F6DB5" stroke="#2F6DB5" stroke-width="1"/></g><g id="lane2" data-md="node" data-box="56,912,40,120" data-shape="box" data-label="inside"><rect x="56" y="912" width="40" height="120" rx="4" fill="#2F6DB5" stroke="#2F6DB5" stroke-width="1"/></g><g id="ident" data-md="node" data-box="130,214,560,140" data-shape="box" data-label="inside"><rect x="130" y="214" width="560" height="140" rx="4" fill="#E8F0FA" stroke="#2F6DB5" stroke-width="1"/><text class="md-label" x="142" y="261.45" font-family="Inter, Noto Sans SC, sans-serif" font-size="14.5" font-weight="500" fill="#173A63" text-anchor="start"><tspan x="142" >Records identified from:</tspan><tspan x="142" dy="18.13">· Databases (n = 2,416)</tspan><tspan x="142" dy="18.13">· PubMed 812 · Embase 1,104 · Web of Science 500</tspan><tspan x="142" dy="18.13">· Registers (n = 38)</tspan></text></g><g id="removed" data-md="node" data-box="830,232,520,104" data-shape="box" data-label="inside"><rect x="830" y="232" width="520" height="104" rx="4" fill="#F2F3F5" stroke="#B6BBC2" stroke-width="1"/><text class="md-label" x="842" y="270.52" font-family="Inter, Noto Sans SC, sans-serif" font-size="14.5" font-weight="500" fill="#1B1B1B" text-anchor="start"><tspan x="842" >Records removed before screening:</tspan><tspan x="842" dy="18.13">· Duplicate records (n = 704)</tspan><tspan x="842" dy="18.13">· Marked ineligible by automation (n = 0)</tspan></text></g><g id="screened" data-md="node" data-box="130,512,560,64" data-shape="box" data-label="inside"><rect x="130" y="512" width="560" height="64" rx="4" fill="#FFFFFF" stroke="#8A9099" stroke-width="1"/><text class="md-label" x="142" y="548.64" font-family="Inter, Noto Sans SC, sans-serif" font-size="14.5" font-weight="500" fill="#1B1B1B" text-anchor="start"><tspan x="142" >Records screened (n = 1,750)</tspan></text></g><g id="exc1" data-md="node" data-box="830,512,520,64" data-shape="box" data-label="inside"><rect x="830" y="512" width="520" height="64" rx="4" fill="#F2F3F5" stroke="#B6BBC2" stroke-width="1"/><text class="md-label" x="842" y="548.64" font-family="Inter, Noto Sans SC, sans-serif" font-size="14.5" font-weight="500" fill="#1B1B1B" text-anchor="start"><tspan x="842" >Records excluded on title / abstract (n = 1,512)</tspan></text></g><g id="sought" data-md="node" data-box="130,632,560,64" data-shape="box" data-label="inside"><rect x="130" y="632" width="560" height="64" rx="4" fill="#FFFFFF" stroke="#8A9099" stroke-width="1"/><text class="md-label" x="142" y="668.64" font-family="Inter, Noto Sans SC, sans-serif" font-size="14.5" font-weight="500" fill="#1B1B1B" text-anchor="start"><tspan x="142" >Reports sought for retrieval (n = 238)</tspan></text></g><g id="notret" data-md="node" data-box="830,632,520,64" data-shape="box" data-label="inside"><rect x="830" y="632" width="520" height="64" rx="4" fill="#F2F3F5" stroke="#B6BBC2" stroke-width="1"/><text class="md-label" x="842" y="668.64" font-family="Inter, Noto Sans SC, sans-serif" font-size="14.5" font-weight="500" fill="#1B1B1B" text-anchor="start"><tspan x="842" >Reports not retrieved (n = 11)</tspan></text></g><g id="assessed" data-md="node" data-box="130,752,560,64" data-shape="box" data-label="inside"><rect x="130" y="752" width="560" height="64" rx="4" fill="#FFFFFF" stroke="#8A9099" stroke-width="1"/><text class="md-label" x="142" y="788.64" font-family="Inter, Noto Sans SC, sans-serif" font-size="14.5" font-weight="500" fill="#1B1B1B" text-anchor="start"><tspan x="142" >Reports assessed for eligibility (n = 227)</tspan></text></g><g id="exc2" data-md="node" data-box="830,720,520,128" data-shape="box" data-label="inside"><rect x="830" y="720" width="520" height="128" rx="4" fill="#F2F3F5" stroke="#B6BBC2" stroke-width="1"/><text class="md-label" x="842" y="761.45" font-family="Inter, Noto Sans SC, sans-serif" font-size="14.5" font-weight="500" fill="#1B1B1B" text-anchor="start"><tspan x="842" >Reports excluded (n = 191):</tspan><tspan x="842" dy="18.13">· Wrong population (n = 84)</tspan><tspan x="842" dy="18.13">· Wrong outcome (n = 57)</tspan><tspan x="842" dy="18.13">· Not randomised (n = 50)</tspan></text></g><g id="incl" data-md="node" data-box="130,932,560,82" data-shape="box" data-label="inside"><rect x="130" y="932" width="560" height="82" rx="4" fill="#E9F4EB" stroke="#3E9651" stroke-width="1"/><text class="md-label" x="142" y="968.58" font-family="Inter, Noto Sans SC, sans-serif" font-size="14.5" font-weight="500" fill="#1E4A28" text-anchor="start"><tspan x="142" >Studies included in review (n = 34)</tspan><tspan x="142" dy="18.13">Reports of included studies (n = 36)</tspan></text></g></g><g id="edge-labels"></g><g id="notes"></g><g id="legend"></g><g id="texts"><g transform="rotate(-90 82 390.8)"><text x="82" y="390.8" font-family="Inter, Noto Sans SC, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="start"><tspan x="82" >Identification</tspan></text></g><g transform="rotate(-90 82 724.8)"><text x="82" y="724.8" font-family="Inter, Noto Sans SC, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="start"><tspan x="82" >Screening</tspan></text></g><g transform="rotate(-90 82 1005.5999999999999)"><text x="82" y="1005.6" font-family="Inter, Noto Sans SC, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="start"><tspan x="82" >Included</tspan></text></g></g><g id="header"><text x="56" y="74.92" font-family="Inter, Noto Sans SC, sans-serif" font-size="22" font-weight="700" fill="#1B1B1B" text-anchor="start"><tspan x="56" >Fig. 1 | PRISMA 2020 flow diagram</tspan></text><text x="56" y="107.1" font-family="Inter, Noto Sans SC, sans-serif" font-size="15.1" font-weight="400" fill="#5F6368" text-anchor="start"><tspan x="56" >Identification of studies via databases and registers for a systematic review of exercise interventions in older adults. Counts reconcile at every step (2,454 − 704 = 1,750; 1,750 −</tspan><tspan x="56" dy="21.9">1,512 = 238; 238 − 11 = 227; 227 − 191 = 36 reports).</tspan></text></g><g id="footer"><text x="1364" y="1051.2" font-family="Inter, Noto Sans SC, sans-serif" font-size="10.5" font-weight="400" fill="#A0A4AA" text-anchor="end" letter-spacing="0.5"><tspan x="1364" >MuseDraw · Journal Figure</tspan></text></g></svg>
