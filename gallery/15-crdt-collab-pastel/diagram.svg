<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 874" width="1600" height="874" role="img" aria-labelledby="md-title md-desc" data-theme="pastel"><title id="md-title">实时协同编辑（CRDT）架构</title><desc id="md-desc">两个人同时改同一段文字，为什么不会互相覆盖？每个客户端都有完整副本，只交换“增量”，而合并结果与到达顺序无关。</desc><defs></defs><g id="background"><rect id="canvas" width="1600" height="874" fill="#FFFFFF"/></g><g id="zones"><g id="notes-rule" data-md="zone"><path d="M72 704H1532" stroke="#E9E9E7" stroke-width="2"/></g></g><g id="edges"><g id="edge-a-gw" data-md="edge"><path d="M337 320 L380 320 Q392 320 392 332 L392 378 Q392 390 404 390 L447 390" fill="none" stroke="#37352F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M438 395.4 L447 390 L438 384.6" fill="none" stroke="#37352F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M346 314.6 L337 320 L346 325.4" fill="none" stroke="#37352F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g><g id="edge-b-gw" data-md="edge"><path d="M337 530 L380 530 Q392 530 392 518 L392 474 Q392 462 404 462 L447 462" fill="none" stroke="#37352F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M438 467.4 L447 462 L438 456.6" fill="none" stroke="#37352F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M346 524.6 L337 530 L346 535.4" fill="none" stroke="#37352F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g><g id="edge-gw-collab" data-md="edge"><path d="M707 426 L807 426" fill="none" stroke="#37352F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M798 431.4 L807 426 L798 420.6" fill="none" stroke="#37352F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M716 420.6 L707 426 L716 431.4" fill="none" stroke="#37352F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g><g id="edge-collab-aware" data-md="edge"><path d="M942 491 L942 569" fill="none" st