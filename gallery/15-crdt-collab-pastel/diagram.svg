t="400" fill="#337EA9" text-anchor="start"><tspan x="118" >Y.Doc 绑定编辑器</tspan></text><circle cx="72" cy="264" r="12" fill="#37352F"/><text x="72" y="268.87" font-family="Noto Sans SC, Inter, sans-serif" font-size="13.919999999999998" font-weight="700" fill="#FFFFFF" text-anchor="middle" class="md-step">1</text></g><g id="b" data-md="node" data-box="72,474,260,112" data-shape="box" data-label="inside"><rect x="72" y="474" width="260" height="112" rx="10" fill="#F6F3F9" stroke="none" stroke-width="0"/><g transform="translate(88 520) scale(0.8333)" fill="none" stroke="#9065B0" stroke-width="1.92" stroke-linecap="round" stroke-linejoin="round"><path d="M7.5 2.5h9v19h-9z"/><path d="M11 18.5h2"/></g><text class="md-tag" x="118" y="514.26" font-family="Noto Sans SC, Inter, sans-serif" font-size="13" font-weight="500" fill="#9065B0" text-anchor="start"><tspan x="118" >App，可离线</tspan></text><text class="md-label" x="118" y="535.2" font-family="Noto Sans SC, Inter, sans-serif" font-size="17.8" font-weight="700" fill="#412454" text-anchor="start"><tspan x="118" >客户端 B</tspan></text><text class="md-sub" x="118" y="553.88" font-family="Noto Sans SC, Inter, sans-serif" font-size="14" font-weight="400" fill="#9065B0" text-anchor="start"><tspan x="118" >断网照常编辑</tspan></text><circle cx="72" cy="474" r="12" fill="#37352F"/><text x="72" y="478.87" font-family="Noto Sans SC, Inter, sans-serif" font-size="13.919999999999998" font-weight="700" fill="#FFFFFF" text-anchor="middle" class="md-step">4</text></g><g id="gw" data-md="node" data-box="452,366,250,120" data-shape="box" data-label="inside"><rect x="452" y="366" width="250" height="120" rx="10" fill="#F1F1EF" stroke="none" stroke-width="0"/><g transform="translate(468 416) scale(0.8333)" fill="none" stroke="#37352F" stroke-width="1.92" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18z"/><path d="M3 12h18"/><path d="M12 3c2.5 2.6 3.7 5.6 3.7 9s-1.2 6.4-3.7 9c-2.5-2.6-3.7-5.6-3.7-9S9.5 5.6 12 3z"/></g><text class="md-tag" x="498" y="410.26" font-family="Noto Sans SC, Inter, sans-serif" font-size="13" font-weight="500" fill="#787774" text-anchor="start"><tspan x="498" >连接层</tspan></text><text class="md-label" x="498" y="431.2" font-family="Noto Sans SC, Inter, sans-serif" font-size="17.8" font-weight="700" fill="#37352F" text-anchor="start"><tspan x="498" >WebSocket 网关</tspan></text><text class="md-sub" x="498" y="449.88" font-family="Noto Sans SC, Inter, sans-serif" font-size="14" font-weight="400" fill="#787774" text-anchor="start"><tspan x="498" >按文档 ID 分房间</tspan></text></g><g id="collab" data-md="node" data-box="812,366,260,120" data-shape="box" data-label="inside"><rect x="812" y="366" width="260" height="120" rx="10" fill="#FBECDD" stroke="none" stroke-width="0"/><g transform="translate(828 416) scale(0.8333)" fill="none" stroke="#D9730D" stroke-width="1.92" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7z"/><path d="M2.5 20c1-3.2 3.4-5 6.5-5s5.5 1.8 6.5 5"/><path d="M15.5 4.3a3.5 3.5 0 0 1 0 6.4"/><path d="M17.5 15.2c2 .6 3.4 2.2 4 4.8"/></g><text class="md-tag" x="858" y="410.26" font-family="Noto Sans SC, Inter, sans-serif" font-size="13" font-weight="500" fill="#D9730D" text-anchor="start"><tspan x="858" >房间</tspan></text><text class="md-label" x="858" y="431.2" font-family="Noto Sans SC, Inter, sans-serif" font-size="17.8" font-weight="700" fill="#49290E" text-anchor="start"><tspan x="858" >协同服务</tspan></text><text class="md-sub" x="858" y="449.88" font-family="Noto Sans SC, Inter, sans-serif" font-size="14" font-weight="400" fill="#D9730D" text-anchor="start"><tspan x="858" >转发增量，维护在线列表</tspan></text><circle cx="812" cy="366" r="12" fill="#37352F"/><text x="812" y="370.87" font-family="Noto Sans SC, Inter, sans-serif" font-size="13.919999999999998" font-weight="700" fill="#FFFFFF" text-anchor="middle" class="md-step">3</text></g><g id="aware" data-md="node" data-box="812,574,260,100" data-shape="box" data-label="inside"><rect x="812" y="574" width="260" height="100" rx="10" fill="#FBF3DB" stroke="none" stroke-width="0"/><g transform="translate(828 614) scale(0.8333)" fill="none" stroke="#CB912F" stroke-width="1.92" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/></g><text class="md-tag" x="858" y="608.26" font-family="Noto Sans SC, Inter, sans-serif" font-size="13" font-weight="500" fill="#CB912F" text-anchor="start"><tspan x="858" >Awareness，不落库</tspan></text><text class="md-label" x="858" y="629.2" font-family="Noto Sans SC, Inter, sans-serif" font-size="17.8" font-weight="700" fill="#5C4B1C" text-anchor="start"><tspan x="858" >在线感知</tspan></text><text class="md-sub" x="858" y="647.88" font-family="Noto Sans SC, Inter, sans-serif" font-size="14" font-weight="400" fill="#89632A" text-anchor="start"><tspan x="858" >光标、选区、谁在线</tspan></text></g><g id="log" data-md="node" data-box="1192,274,260,104" data-shape="box" data-label="inside"><rect x="1192" y="274" width="260" height="104" rx="10" fill="#EDF3EC" stroke="none" stroke-width="0"/><g transform="translate(1208 316) scale(0.8333)" fill="none" stroke="#448361" stroke-width="1.92" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2.5h8l4 4v15H6z"/><path d="M14 2.5v4h4"/><path d="M9 12h6"/><path d="M9 15.5h6"/><path d="M9 19h4"/></g><text class="md-tag" x="1238" y="310.26" font-family="Noto Sans SC, Inter, sans-serif" font-size="13" font-weight="500" fill="#448361" text-anchor="start"><tspan x="1238" >追加写入</tspan></text><text class="md-label" x="1238" y="331.2" font-family="Noto Sans SC, Inter, sans-serif" font-size="17.8" font-weight="700" fill="#1C3829" text-anchor="start"><tspan x="1238" >增量日志</tspan></text><text class="md-sub" x="1238" y="349.88" font-family="Noto Sans SC, Inter, sans-serif" font-size="14" font-weight="400" fill="#448361" text-anchor="start"><tspan x="1238" >每条 update 可回放</tspan></text></g><g id="snap" data-md="node" data-box="1192,474,260,104" data-shape="box" data-label="inside"><rect x="1192" y="474" width="260" height="104" rx="10" fill="#EDF3EC" stroke="none" stroke-width="0"/><g transform="translate(1208 516) scale(0.8333)" fill="none" stroke="#448361" stroke-width="1.92" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 21.5 8 12 13 2.5 8z"/><path d="M2.5 12 12 17l9.5-5"/><path d="M2.5 16 12 21l9.5-5"/></g><text class="md-tag" x="1238" y="510.26" font-family="Noto Sans SC, Inter, sans-serif" font-size="13" font-weight="500" fill="#448361" text-anchor="start"><tspan x="1238" >Postgres / S3</tspan></text><text class="md-label" x="1238" y="531.2" font-family="Noto Sans SC, Inter, sans-serif" font-size="17.8" font-weight="700" fill="#1C3829" text-anchor="start"><tspan x="1238" >定时快照</tspan></text><text class="md-sub" x="1238" y="549.88" font-family="Noto Sans SC, Inter, sans-serif" font-size="14" font-weight="400" fill="#448361" text-anchor="start"><tspan x="1238" >压缩历史，加速首屏</tspan></text><circle cx="1192" cy="474" r="12" fill="#37352F"/><text x="1192" y="478.87" font-family="Noto Sans SC, Inter, sans-serif" font-size="13.919999999999998" font-weight="700" fill="#FFFFFF" text-anchor="middle" class="md-step">5</text></g></g><g id="edge-labels"><g id="edge-a-gw-label" data-md="edge-label"><rect x="363.21" y="343.56" width="87.58" height="22.88" rx="3" fill="#FFFFFF"/><circle cx="352.21" cy="355" r="12" fill="#37352F"/><text x="352.21" y="359.87" font-family="Noto Sans SC, Inter, sans-serif" font-size="13.919999999999998" font-weight="700" fill="#FFFFFF" text-anchor="middle" class="md-step">2</text><text x="370.21" y="359.39" font-family="Noto Sans SC, Inter, sans-serif" font-size="13.5" font-weight="400" fill="#787774" text-anchor="start"><tspan x="370.21" >增量 update</tspan></text></g><g id="edge-collab-log-label" data-md="edge-label"><rect x="1104.75" y="364.56" width="54.5" height="22.88" rx="3" fill="#FFFFFF"/><text x="1111.75" y="380.39" font-family="Noto Sans SC, Inter, sans-serif" font-size="13.5" font-weight="400" fill="#787774" text-anchor="start"><tspan x="1111.75" >持久化</tspan></text></g><g id="edge-log-snap-label" data-md="edge-label"><rect x="1288" y="414.56" width="68" height="22.88" rx="3" fill="#FFFFFF"/><text x="1295" y="430.39" font-family="Noto Sans SC, Inter, sans-serif" font-size="13.5" font-weight="400" fill="#787774" text-anchor="start"><tspan x="1295" >合并压缩</tspan></text></g></g><g id="notes"><g id="note-1" data-md="note" data-box="72,744,260,48.32"><g><text x="72" y="757.59" font-family="Noto Sans SC, Inter, sans-serif" font-size="16.61" font-weight="700" fill="#D9730D">1</text><text x="98" y="757.59" font-family="Noto Sans SC, Inter, sans-serif" font-size="15.1" font-weight="400" fill="#37352F" text-anchor="start"><tspan x="98" >本地先改。界面不等服务器，零延</tspan><tspan x="98" dy="24.16">迟。</tspan></text></g></g><g id="note-2" data-md="note" data-box="372,744,260,48.32"><g><text x="372" y="757.59" font-family="Noto Sans SC, Inter, sans-serif" font-size="16.61" font-weight="700" fill="#D9730D">2</text><text x="398" y="757.59" font-family="Noto Sans SC, Inter, sans-serif" font-size="15.1" font-weight="400" fill="#37352F" text-anchor="start"><tspan x="398" >只发送增量，通常几十个字节，而</tspan><tspan x="398" dy="24.16">不是整篇文档。</tspan></text></g></g><g id="note-3" data-md="note" data-box="672,744,260,48.32"><g><text x="672" y="757.59" font-family="Noto Sans SC, Inter, sans-serif" font-size="16.61" font-weight="700" fill="#D9730D">3</text><text x="698" y="757.59" font-family="Noto Sans SC, Inter, sans-serif" font-size="15.1" font-weight="400" fill="#37352F" text-anchor="start"><tspan x="698" >服务端不做冲突判断，只把增量转</tspan><tspan x="698" dy="24.16">发给同房间的人。</tspan></text></g></g><g id="note-4" data-md="note" data-box="972,744,260,48.32"><g><text x="972" y="757.59" font-family="Noto Sans SC, Inter, sans-serif" font-size="16.61" font-weight="700" fill="#D9730D">4</text><text x="998" y="757.59" font-family="Noto Sans SC, Inter, sans-serif" font-size="15.1" font-weight="400" fill="#37352F" text-anchor="start"><tspan x="998" >各端用 CRDT 合并，先到后到结果</tspan><tspan x="998" dy="24.16">都一样。</tspan></text></g></g><g id="note-5" data-md="note" data-box="1272,744,260,48.32"><g><text x="1272" y="757.59" font-family="Noto Sans SC, Inter, sans-serif" font-size="16.61" font-weight="700" fill="#D9730D">5</text><text x="1298" y="757.59" font-family="Noto Sans SC, Inter, sans-serif" font-size="15.1" font-weight="400" fill="#37352F" text-anchor="start"><tspan x="1298" >定期把日志压成快照，新加入的人</tspan><tspan x="1298" dy="24.16">秒开。</tspan></text></g></g></g><g id="legend"></g><g id="texts"></g><g id="header"><text x="72" y="86" font-family="Noto Sans SC, Inter, sans-serif" font-size="14" font-weight="400" fill="#787774" text-anchor="start" letter-spacing="0.5"><tspan x="72" >CRDT · 以 Yjs 为例</tspan></text><text x="72" y="140.12" font-family="Noto Sans SC, Inter, sans-serif" font-size="42" font-weight="700" fill="#37352F" text-anchor="start"><tspan x="72" >实时协同编辑（CRDT）架构</tspan></text><text x="72" y="177.3" font-family="Noto Sans SC, Inter, sans-serif" font-size="17.3" font-weight="400" fill="#787774" text-anchor="start"><tspan x="72" >两个人同时改同一段文字，为什么不会互相覆盖？每个客户端都有完整副本，只交换“增量”，而合并结果与到达顺序无关。</tspan></text></g><g id="footer"><text x="1528" y="834.4" font-family="Noto Sans SC, Inter, sans-serif" font-size="12" font-weight="400" fill="#B4B4B0" text-anchor="end" letter-spacing="1"><tspan x="1528" >MuseDraw · 柔和笔记</tspan></text></g></svg>
