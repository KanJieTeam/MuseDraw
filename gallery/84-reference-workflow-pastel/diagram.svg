400" fill="#787774" text-anchor="start"><tspan x="1320" >zhang2024_fall.pdf</tspan></text><text x="1320" y="624" font-family="Noto Sans SC, Inter, sans-serif" font-size="14" font-weight="400" fill="#787774" text-anchor="start"><tspan x="1320" >引用键与文件名一致，</tspan></text><text x="1320" y="650" font-family="Noto Sans SC, Inter, sans-serif" font-size="14" font-weight="400" fill="#787774" text-anchor="start"><tspan x="1320" >笔记、PDF、正文三处能互相找到。</tspan></text></g><g id="header"><text x="72" y="86" font-family="Noto Sans SC, Inter, sans-serif" font-size="14" font-weight="400" fill="#787774" text-anchor="start" letter-spacing="0.5"><tspan x="72" >研究生工具箱 · 文献管理</tspan></text><text x="72" y="140.12" font-family="Noto Sans SC, Inter, sans-serif" font-size="42" font-weight="700" fill="#37352F" text-anchor="start"><tspan x="72" >文献管理工作流</tspan></text><text x="72" y="177.3" font-family="Noto Sans SC, Inter, sans-serif" font-size="17.3" font-weight="400" fill="#787774" text-anchor="start"><tspan x="72" >从检索到写作，每篇文献只录入一次。五个工具各管一步，靠同一个引用键串起来。</tspan></text></g><g id="footer"><text x="1588" y="754.4" font-family="Noto Sans SC, Inter, sans-serif" font-size="12" font-weight="400" fill="#B4B4B0" text-anchor="end" letter-spacing="1"><tspan x="1588" >MuseDraw · 柔和笔记</tspan></text></g></svg>
