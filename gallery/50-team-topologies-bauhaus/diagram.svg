ss="md-label" x="250" y="409.04" font-family="Archivo, Noto Sans SC, sans-serif" font-size="18.4" font-weight="800" fill="#151515" text-anchor="middle"><tspan x="250" >CHECKOUT</tspan></text></g><g id="s2" data-md="node" data-box="100,490,300,110" data-shape="box" data-label="inside"><rect x="107" y="497" width="300" height="110" rx="0" fill="#151515" stroke="none"/><rect x="100" y="490" width="300" height="110" rx="0" fill="#F2B705" stroke="#151515" stroke-width="3"/><text class="md-tag" x="250" y="536.92" font-family="Space Mono, Noto Sans SC, monospace" font-size="11.3" font-weight="700" fill="#151515" text-anchor="middle"><tspan x="250" >STREAM-ALIGNED</tspan></text><text class="md-label" x="250" y="559.04" font-family="Archivo, Noto Sans SC, sans-serif" font-size="18.4" font-weight="800" fill="#151515" text-anchor="middle"><tspan x="250" >SEARCH</tspan></text></g><g id="s3" data-md="node" data-box="100,640,300,110" data-shape="box" data-label="inside"><rect x="107" y="647" width="300" height="110" rx="0" fill="#151515" stroke="none"/><rect x="100" y="640" width="300" height="110" rx="0" fill="#F2B705" stroke="#151515" stroke-width="3"/><text class="md-tag" x="250" y="686.92" font-family="Space Mono, Noto Sans SC, monospace" font-size="11.3" font-weight="700" fill="#151515" text-anchor="middle"><tspan x="250" >STREAM-ALIGNED</tspan></text><text class="md-label" x="250" y="709.04" font-family="Archivo, Noto Sans SC, sans-serif" font-size="18.4" font-weight="800" fill="#151515" text-anchor="middle"><tspan x="250" >SELLER TOOLS</tspan></text></g><g id="en" data-md="node" data-box="560,300,180,180" data-shape="circle" data-label="inside"><ellipse cx="657" cy="397" rx="90" ry="90" fill="#151515" stroke="none"/><ellipse cx="650" cy="390" rx="90" ry="90" fill="#1D4FB8" stroke="#151515" stroke-width="3"/><text class="md-tag" x="650" y="381.92" font-family="Space Mono, Noto Sans SC, monospace" font-size="11.3" font-weight="700" fill="#F2B705" text-anchor="middle"><tspan x="650" >TESTING COACHES</tspan></text><text class="md-label" x="650" y="404.04" font-family="Archivo, Noto Sans SC, sans-serif" font-size="18.4" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="650" >ENABLING</tspan></text></g><g id="cs" data-md="node" data-box="540,540,230,180" data-shape="diamond" data-label="inside"><path d="M662 547L777 637L662 727L547 637Z" fill="#151515" stroke="none" stroke-linejoin="round"/><path d="M655 540L770 630L655 720L540 630Z" fill="#D7263D" stroke="#151515" stroke-width="3" stroke-linejoin="round"/><text class="md-tag" x="655" y="612.26" font-family="Space Mono, Noto Sans SC, monospace" font-size="11.3" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan x="655" >RANKING ML</tspan></text><text class="md-label" x="655" y="634.38" font-family="Archivo, Noto Sans SC, sans-serif" font-size="18.4" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="655" >COMPLICATED</tspan><tspan x="655" dy="19.32">SUBSYSTEM</tspan></text></g><g id="pf" data-md="node" data-box="100,820,1400,80" data-shape="box" data-label="inside"><rect x="100" y="820" width="1400" height="80" rx="0" fill="#151515" stroke="#151515" stroke-width="3"/><text class="md-tag" x="800" y="851.92" font-family="Space Mono, Noto Sans SC, monospace" font-size="11.3" font-weight="700" fill="#F2B705" text-anchor="middle"><tspan x="800" >PAYMENTS, DEPLOY, DATA</tspan></text><text class="md-label" x="800" y="874.04" font-family="Archivo, Noto Sans SC, sans-serif" font-size="18.4" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="800" >PLATFORM</tspan></text></g></g><g id="edge-labels"><g id="edge-en-s1-label" data-md="edge-label"><rect x="434.31" y="379.25" width="91.38" height="21.5" rx="3" fill="#F0E8D8"/><text x="441.31" y="394.03" font-family="Space Mono, Noto Sans SC, monospace" font-size="12.4" font-weight="700" fill="#151515" text-anchor="start"><tspan x="441.31" >FACILITATE</tspan></text></g><g id="edge-cs-s2-label" data-md="edge-label"><rect x="408.84" y="576.75" width="122.33" height="21.5" rx="3" fill="#F0E8D8"/><text x="415.84" y="591.53" font-family="Space Mono, Noto Sans SC, monospace" font-size="12.4" font-weight="700" fill="#151515" text-anchor="start"><tspan x="415.84" >X-AS-A-SERVICE</tspan></text></g><g id="edge-s3-pf-label" data-md="edge-label"><rect x="181.1" y="774.25" width="137.8" height="21.5" rx="3" fill="#F0E8D8"/><text x="188.1" y="789.03" font-family="Space Mono, Noto Sans SC, monospace" font-size="12.4" font-weight="700" fill="#151515" text-anchor="start"><tspan x="188.1" >SELF-SERVICE API</tspan></text></g></g><g id="notes"><g id="note-1" data-md="note" data-box="900,320,620,43.74"><g><text x="900" y="334.58" font-family="Archivo, Noto Sans SC, sans-serif" font-size="17.82" font-weight="700" fill="#D7263D">■</text><text x="926" y="334.58" font-family="Archivo, Noto Sans SC, sans-serif" font-size="16.2" font-weight="400" fill="#151515" text-anchor="start"><tspan x="926" >Stream-aligned: owns a slice of the customer journey end to end. Most</tspan><tspan x="926" dy="21.87">teams should be this.</tspan></text></g></g><g id="note-2" data-md="note" data-box="900,450,620,21.87"><g><text x="900" y="464.58" font-family="Archivo, Noto Sans SC, sans-serif" font-size="17.82" font-weight="700" fill="#D7263D">●</text><text x="926" y="464.58" font-family="Archivo, Noto Sans SC, sans-serif" font-size="16.2" font-weight="400" fill="#151515" text-anchor="start"><tspan x="926" >Enabling: coaches for a few months, then leaves. Success = not being needed.</tspan></text></g></g><g id="note-3" data-md="note" data-box="900,580,620,21.87"><g><text x="900" y="594.58" font-family="Archivo, Noto Sans SC, sans-serif" font-size="17.82" font-weight="700" fill="#D7263D">◆</text><text x="926" y="594.58" font-family="Archivo, Noto Sans SC, sans-serif" font-size="16.2" font-weight="400" fill="#151515" text-anchor="start"><tspan x="926" >Complicated subsystem: deep specialists behind a clean interface.</tspan></text></g></g><g id="note-4" data-md="note" data-box="900,690,620,21.87"><g><text x="900" y="704.58" font-family="Archivo, Noto Sans SC, sans-serif" font-size="17.82" font-weight="700" fill="#D7263D">▬</text><text x="926" y="704.58" font-family="Archivo, Noto Sans SC, sans-serif" font-size="16.2" font-weight="400" fill="#151515" text-anchor="start"><tspan x="926" >Platform: a product for internal teams, consumed self-service.</tspan></text></g></g></g><g id="legend"></g><g id="texts"></g><g id="header"><text x="64" y="77" font-family="Space Mono, Noto Sans SC, monospace" font-size="13" font-weight="700" fill="#D7263D" text-anchor="start" letter-spacing="1"><tspan x="64" >ORG DESIGN · TEAM TOPOLOGIES</tspan></text><text x="64" y="153.48" font-family="Archivo, Noto Sans SC, sans-serif" font-size="68" font-weight="900" fill="#151515" text-anchor="start" letter-spacing="-1"><tspan x="64" >TEAM TOPOLOGIES: FOUR TEAM TYPES</tspan></text><text x="64" y="196.4" font-family="Archivo, Noto Sans SC, sans-serif" font-size="19.4" font-weight="400" fill="#151515" text-anchor="start"><tspan x="64" >Stream-aligned teams ship to customers. Everyone else exists to make them faster —</tspan><tspan x="64" dy="28.13">and says how: collaborate, facilitate, or offer X-as-a-service.</tspan></text><text x="1576" y="77" font-family="Space Mono, Noto Sans SC, monospace" font-size="13" font-weight="400" fill="#151515" text-anchor="end" letter-spacing="1"><tspan x="1576" >NO. 50</tspan></text></g><g id="footer"><text x="1576" y="964.8" font-family="Space Mono, Noto Sans SC, monospace" font-size="11" font-weight="400" fill="#151515" text-anchor="end" letter-spacing="1"><tspan x="1576" >MUSEDRAW / BAUHAUS</tspan></text></g></svg>
