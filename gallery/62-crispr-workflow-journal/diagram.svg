<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1640 640" width="1640" height="640" role="img" aria-labelledby="md-title md-desc" data-theme="journal"><title id="md-title">Fig. 4 | Generating a validated CRISPR–Cas9 knockout cell line</title><desc id="md-desc">a, Eight steps from guide design to phenotype, with typical timing for an adherent human line. b, Gates that must pass before moving on; skipping clone-level validation is the most common source of irreproducible knockouts.</desc><defs></defs><g id="background"><rect id="canvas" width="1640" height="640" fill="#FFFFFF"/></g><g id="zones"></g><g id="edges"></g><g id="nodes"><g id="s0" data-md="node" data-box="64,260,196,96" data-shape="chevron" data-label="inside"><path d="M64 260H238L260 308L238 356H64L64 308Z" fill="#E8F0FA" stroke="#2F6DB5" stroke-width="1" stroke-linejoin="round"/><text class="md-label" x="162" y="304.64" font-family="Inter, Noto Sans SC, sans-serif" font-size="14.5" font-weight="600" fill="#173A63" text-anchor="middle"><tspan x="162" >Design</tspan></text><text class="md-sub" x="162" y="320.91" font-family="Inter, Noto Sans SC, sans-serif" font-size="13" font-weight="400" fill="#3E5F86" text-anchor="middle"><tspan x="162" >sgRNA × 3</tspan></text></g><g id="s1" data-md="node" data-box="252,260,196,96" data-shape="chevron" data-label="inside"><path d="M252 260H426L448 308L426 356H252L274 308Z" fill="#E8F0FA" stroke="#2F6DB5" stroke-width="1" stroke-linejoin="round"/><text class="md-label" x="350" y="304.64" font-family="Inter, Noto Sans SC, sans-serif" font-size="14.5" font-weight="600" fill="#173A63" text-anchor="middle"><tspan x="350" >Clone</tspan></text><text class="md-sub" x="350" y="320.91" font-family="Inter, Noto Sans SC, sans-serif" font-size="13" font-weight="400" fill="#3E5F86" text-anchor="middle"><tspan x="350" >into lentiCRISPRv2</tspan></text></g><g id="s2" data-md="node" data-box="440,260,196,96" data-shape="chevron" data-label="inside"><path d="M440 260H614L636 308L614 356H440L462 308Z" fill="#FCEFE6" stroke="#E07B39" stroke-width="1" stroke-linejoin="round"/><text class="md-label" x="538" y="304.64" font-family="Inter, Noto Sans SC, sans-serif" font-size="14.5" font-weight="600" fill="#6B3410" text-anchor="middle"><tspan x="538" >Transduce</tspan></text><text class="md-sub" x="538" y="320.91" font-family="Inter, Noto Sans SC, sans-serif" font-size="13" font-weight="400" fill="#8E5732" text-anchor="middle"><tspan x="538" >MOI 0.3</tspan></text></g><g id="s3" data-md="node" data-box="628,260,196,96" data-shape="chevron" data-label="inside"><path d="M628 260H802L824 308L802 356H628L650 308Z" fill="#FCEFE6" stroke="#E07B39" stroke-width="1" stroke-linejoin="round"/><text class="md-label" x="726" y="304.64" font-family="Inter, Noto Sans SC, sans-serif" font-size="14.5" font-weight="600" fill="#6B3410" text-anchor="middle"><tspan x="726" >Select</tspan></text><text class="md-sub" x="726" y="320.91" font-family="Inter, Noto Sans SC, sans-serif" font-size="13" font-weight="400" fill="#8E5732" text-anchor="middle"><tspan x="726" >puromycin 2 µg/mL</tspan></text></g><g id="s4" data-md="node" data-box="816,260,196,96" data-shape="chevron" data-label="inside"><path d="M816 260H990L1012 308L990 356H816L838 308Z" fill="#F0ECF6" stroke="#7A62A8" stroke-width="1" stroke-linejoin="round"/><text class="md-label" x="914" y="304.64" font-family="Inter, Noto Sans SC, sans-serif" font-size="14.5" font-weight="600" fill="#3A2B57" text-anchor="middle"><tspan x="914" >Single-cell clone</tspan></text><text class="md-sub" x="914" y="320.91" font-family="Inter, Noto Sans SC, sans-serif" font-size="13" font-weight="400" fill="#5D4C80" text-anchor="middle"><tspan x="914" >limiting dilution</tspan></text></g><g id="s5" data-md="node" data-box="1004,260,196,96" data-shape="chevron" data-label="inside"><path d="M1004 260H1178L1200 308L1178 356H1004L1026 308Z" fill="#E9F4EB" stroke="#3E9651" stroke-width="1" stroke-linejoin="round"/><text class="md-label" x="1102" y="304.64" font-family="Inter, Noto Sans SC, sans-serif" font-size="14.5" font-weight="600" fill="#1E4A28" text-anchor="middle"><tspan x="1102" >Genotype</tspan></text><text class="md-sub" x="1102" y="320.91" font-family="Inter, Noto Sans SC, sans-serif" font-size="13" font-weight="400" fill="#3F6B49" text-anchor="middle"><tspan x="1102" >Sanger + TIDE</tspan></text></g><g id="s6" data-md="node" data-box="1192,260,196,96" data-shape="chevron" data-label="inside"><path d="M1192 260H1366L1388 308L1366 356H1192L1214 308Z" fill="#E9F4EB" stroke="#3E9651" stroke-width="1" stroke-linejoin="round"/><text class="md-label" x="1290" y="304.64" font-family="Inter, Noto Sans SC, sans-serif" font-size="14.5" font-weight="600" fill="#1E4A28" text-anchor="middle"><tspan x="1290" >Validate</tspan></text><text class="md-sub" x="1290" y="320.91" font-family="Inter, Noto Sans SC, sans-serif" font-size="13" font-weight="400" fill="#3F6B49" text-anchor="middle"><tspan x="1290" >Western blot</tspan></text></g><g id="s7" data-md="node" data-box="1380,260,196,96" data-shape="chevron" data-label="inside"><path d="M1380 260H1554L1576 308L1554 356H1380L1402 308Z" fill="#F8E9E8" stroke="#C2423F" stroke-width="1" stroke-linejoin="round"/><text class="md-label" x="1478" y="304.64" font-family="Inter, Noto Sans SC, sans-serif" font-size="14.5" font-weight="600" fill="#5E1E1C" text-anchor="middle"><tspan x="1478" >Phenotype</tspan></text><text class="md-sub" x="1478" y="320.91" font-family="Inter, Noto Sans SC, sans-serif" font-size="13" font-weight="400" fill="#8A4441" text-anchor="middle"><tspan x="1478" >proliferation, migration</tspan></text></g><g id="c0" data-md="node" data-box="64,460,356,96" data-shape="box" data-label="inside"><rect x="64" y="460" width="356" height="96" rx="4" fill="#F2F3F5" stroke="#B6BBC2" stroke-width="1"/><text class="md-tag" x="76" y="486.73" font-family="Inter, Noto Sans SC, sans-serif" font-size="11.9" font-weight="700" fill="#5F6368" text-anchor="start"><tspan x="76" >after step 3</tspan></text><text class="md-label" x="76" y="503.35" font-family="Inter, Noto Sans SC, sans-serif" font-size="14" font-weight="600" fill="#1B1B1B" text-anchor="start"><tspan x="76" >QC 1</tspan></text><text class="md-sub" x="76" y="519.53" font-family="Inter, Noto Sans SC, sans-serif" font-size="13" font-weight="400" fill="#5F6368" text-anchor="start"><tspan x="76" >Guide efficiency in pool &gt; 60% indels (TIDE) before</tspan><tspan x="76" dy="17.16">cloning out</tspan></text></g><g id="c1" data-md="node" data-box="446,460,356,96" data-shape="box" data-label="inside"><rect x="446" y="460" width="356" height="96" rx="4" fill="#F2F3F5" stroke="#B6BBC2" stroke-width="1"/><text class="md-tag" x="458" y="495.31" font-family="Inter, Noto Sans SC, sans-serif" font-size="11.9" font-weight="700" fill="#5F6368" text-anchor="start"><tspan x="458" >after step 6</tspan></text><text class="md-label" x="458" y="511.93" font-family="Inter, Noto Sans SC, sans-serif" font-size="14" font-weight="600" fill="#1B1B1B" text-anchor="start"><tspan x="458" >QC 2</tspan></text><text class="md-sub" x="458" y="528.11" font-family="Inter, Noto Sans SC, sans-serif" font-size="13" font-weight="400" fill="#5F6368" text-anchor="start"><tspan x="458" >Both alleles frameshifted; no in-frame deletions</tspan></text></g><g id="c2" data-md="node" data-box="828,460,356,96" data-shape="box" data-label="inside"><rect x="828" y="460" width="356" height="96" rx="4" fill="#F2F3F5" stroke="#B6BBC2" stroke-width="1"/><text class="md-tag" x="840" y="495.31" font-family="Inter, Noto Sans SC, sans-serif" font-size="11.9" font-weight="700" fill="#5F6368" text-anchor="start"><tspan x="840" >after step 7</tspan></text><text class="md-label" x="840" y="511.93" font-family="Inter, Noto Sans SC, sans-serif" font-size="14" font-weight="600" fill="#1B1B1B" text-anchor="start"><tspan x="840" >QC 3</tspan></text><text class="md-sub" x="840" y="528.11" font-family="Inter, Noto Sans SC, sans-serif" font-size="13" font-weight="400" fill="#5F6368" text-anchor="start"><tspan x="840" >Protein absent in ≥ 2 independent clones</tspan></text></g><g id="c3" data-md="node" data-box="1210,460,356,96" data-shape="box" data-label="inside"><rect x="1210" y="460" width="356" height="96" rx="4" fill="#F2F3F5" stroke="#B6BBC2" stroke-width="1"/><text class="md-tag" x="1222" y="495.31" font-family="Inter, Noto Sans SC, sans-serif" font-size="11.9" font-weight="700" fill="#5F6368" text-anchor="start"><tspan x="1222" >step 8</tspan></text><text class="md-label" x="1222" y="511.93" font-family="Inter, Noto Sans SC, sans-serif" font-size="14" font-weight="600" fill="#1B1B1B" text-anchor="start"><tspan x="1222" >Control</tspan></text><text class="md-sub" x="1222" y="528.11" font-family="Inter, Noto Sans SC, sans-serif" font-size="13" font-weight="400" fill="#5F6368" text-anchor="start"><tspan x="1222" >Non-targeting guide + parental line in every assay</tspan></text></g></g><g id="edge-labels"></g><g id="notes"></g><g id="legend"></g><g id="texts"><text x="162" y="388" font-family="Inter, Noto Sans SC, sans-serif" font-size="12.5" font-weight="700" fill="#5F6368" text-anchor="middle"><tspan x="162" >day 0</tspan></text><text x="350" y="388" font-family="Inter, Noto Sans SC, sans-serif" font-size="12.5" font-weight="700" fill="#5F6368" text-anchor="middle"><tspan x="350" >day 1–4</tspan></text><text x="538" y="388" font-family="Inter, Noto Sans SC, sans-serif" font-size="12.5" font-weight="700" fill="#5F6368" text-anchor="middle"><tspan x="538" >day 5</tspan></text><text x="726" y="388" font-family="Inter, Noto Sans SC, sans-serif" font-size="12.5" font-weight="700" fill="#5F6368" text-anchor="middle"><tspan x="726" >day 6–10</tspan></text><text x="914" y="388" font-family="Inter, Noto Sans SC, sans-serif" font-size="12.5" font-weight="700" fill="#5F6368" text-anchor="middle"><tspan x="914" >day 11–24</tspan></text><text x="1102" y="388" font-family="Inter, Noto Sans SC, sans-serif" font-size="12.5" font-weight="700" fill="#5F6368" text-anchor="middle"><tspan x="1102" >day 25–28</tspan></text><text x="1290" y="388" font-family="Inter, Noto Sans SC, sans-serif" font-size="12.5" font-weight="700" fill="#5F6368" text-anchor="middle"><tspan x="1290" >day 29–31</tspan></text><text x="1478" y="388" font-family="Inter, Noto Sans SC, sans-serif" font-size="12.5" font-weight="700" fill="#5F6368" text-anchor="middle"><tspan x="1478" >day 32+</tspan></text><text x="64" y="440" font-family="Inter, Noto Sans SC, sans-serif" font-size="15" font-weight="800" fill="#1B1B1B" text-anchor="start"><tspan x="64" >b   Quality gates</tspan></text><text x="64" y="240" font-family="Inter, Noto Sans SC, sans-serif" font-size="15" font-weight="800" fill="#1B1B1B" text-anchor="start"><tspan x="64" >a   Workflow (≈ 5 weeks)</tspan></text></g><g id="header"><text x="56" y="74.92" font-family="Inter, Noto Sans SC, sans-serif" font-size="22" font-weight="700" fill="#1B1B1B" text-anchor="start"><tspan x="56" >Fig. 4 | Generating a validated CRISPR–Cas9 knockout cell line</tspan></text><text x="56" y="107.1" font-family="Inter, Noto Sans SC, sans-serif" font-size="15.1" font-weight="400" fill="#5F6368" text-anchor="start"><tspan x="56" >a, Eight steps from guide design to phenotype, with typical timing for an adherent human line. b, Gates that must pass before moving on; skipping clone-level validation is the most</tspan><tspan x="56" dy="21.9">common source of irreproducible knockouts.</tspan></text></g><g id="footer"><text x="1584" y="609.2" font-family="Inter, Noto Sans SC, sans-serif" font-size="10.5" font-weight="400" fill="#A0A4AA" text-anchor="end" letter-spacing="0.5"><tspan x="1584" >MuseDraw · Journal Figure</tspan></text></g></svg>
