<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1660 1000" width="1660" height="1000" role="img" aria-labelledby="md-title md-desc" data-theme="editorial"><title id="md-title">三级编码：从原话到核心范畴</title><desc id="md-desc">16 位老年住院患者半结构访谈。左列是原话片段，中列是归并后的主范畴，右侧是统领全部范畴的核心解释。示例数据。</desc><defs><filter id="tex-grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="7" stitchTiles="stitch"/><feColorMatrix type="matrix" values="0 0 0 0 0.35  0 0 0 0 0.3  0 0 0 0 0.22  0 0 0 0.5 0"/></filter></defs><g id="background"><rect id="canvas" width="1660" height="1000" fill="#F3EEE4"/><rect width="1660" height="1000" filter="url(#tex-grain)" opacity="0.22"/></g><g id="zones"><path id="path-1" d="M430 380 C 540 380, 540 415, 640 415" fill="none" stroke="#B9B0A0" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path id="path-2" d="M430 430 C 540 430, 540 415, 640 415" fill="none" stroke="#B9B0A0" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path id="path-3" d="M430 480 C 540 480, 540 415, 640 415" fill="none" stroke="#B9B0A0" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path id="path-4" d="M940 415 C 1060 415, 1060 610, 1180 610" fill="none" stroke="#171614" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path id="path-5" d="M430 530 C 540 530, 540 535, 640 535" fill="none" stroke="#B9B0A0" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path id="path-6" d="M430 580 C 540 580, 540 535, 640 535" fill="none" stroke="#B9B0A0" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path id="path-7" d="M430 830 C 540 830, 540 535, 640 535" fill="none" stroke="#B9B0A0" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path id="path-8" d="M940 535 C 1060 535, 1060 610, 1180 610" fill="none" stroke="#171614" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path id="path-9" d="M