ht="600" fill="#171614" text-anchor="start"><tspan x="116" >“没人跟我说过”</tspan></text></g><g id="o8" data-md="node" data-box="100,760,330,40" data-shape="box" data-label="inside"><rect x="100" y="760" width="330" height="40" rx="0" fill="#E7DFCF" stroke="#E7DFCF" stroke-width="1.2"/><text class="md-label" x="116" y="784.48" font-family="Inter, Noto Sans SC, sans-serif" font-size="14" font-weight="600" fill="#171614" text-anchor="start"><tspan x="116" >“床栏放下了”</tspan></text></g><g id="o9" data-md="node" data-box="100,810,330,40" data-shape="box" data-label="inside"><rect x="100" y="810" width="330" height="40" rx="0" fill="#E7DFCF" stroke="#E7DFCF" stroke-width="1.2"/><text class="md-label" x="116" y="834.48" font-family="Inter, Noto Sans SC, sans-serif" font-size="14" font-weight="600" fill="#171614" text-anchor="start"><tspan x="116" >“厕所远”</tspan></text></g><g id="a0" data-md="node" data-box="640,380,300,70" data-shape="box" data-label="inside"><rect x="640" y="380" width="300" height="70" rx="0" fill="#FBF8F1" stroke="#171614" stroke-width="1.2"/><text class="md-label" x="656" y="411.69" font-family="Inter, Noto Sans SC, sans-serif" font-size="18.4" font-weight="600" fill="#171614" text-anchor="start"><tspan x="656" >求助顾虑</tspan></text><text class="md-sub" x="656" y="431.17" font-family="JetBrains Mono, Noto Sans SC, monospace" font-size="12.4" font-weight="400" fill="#6E685D" text-anchor="start"><tspan x="656" >3 个代码示例</tspan></text></g><g id="a1" data-md="node" data-box="640,500,300,70" data-shape="box" data-label="inside"><rect x="640" y="500" width="300" height="70" rx="0" fill="#FBF8F1" stroke="#171614" stroke-width="1.2"/><text class="md-label" x="656" y="531.69" font-family="Inter, Noto Sans SC, sans-serif" font-size="18.4" font-weight="600" fill="#171614" text-anchor="start"><tspan x="656" >环境障碍</tspan></text><text class="md-sub" x="656" y="551.17" font-family="JetBrains Mono, Noto Sans SC, monospace" font-size="12.4" font-weight="400" fill="#6E685D" text-anchor="start"><tspan x="656" >3 个代码示例</tspan></text></g><g id="a2" data-md="node" data-box="640,620,300,70" data-shape="box" data-label="inside"><rect x="640" y="620" width="300" height="70" rx="0" fill="#FBF8F1" stroke="#171614" stroke-width="1.2"/><text class="md-label" x="656" y="651.69" font-family="Inter, Noto Sans SC, sans-serif" font-size="18.4" font-weight="600" fill="#171614" text-anchor="start"><tspan x="656" >身体信号忽视</tspan></text><text class="md-sub" x="656" y="671.17" font-family="JetBrains Mono, Noto Sans SC, monospace" font-size="12.4" font-weight="400" fill="#6E685D" text-anchor="start"><tspan x="656" >1 个代码示例</tspan></text></g><g id="a3" data-md="node" data-box="640,740,300,70" data-shape="box" data-label="inside"><rect x="640" y="740" width="300" height="70" rx="0" fill="#FBF8F1" stroke="#171614" stroke-width="1.2"/><text class="md-label" x="656" y="771.69" font-family="Inter, Noto Sans SC, sans-serif" font-size="18.4" font-weight="600" fill="#171614" text-anchor="start"><tspan x="656" >照护断点</tspan></text><text class="md-sub" x="656" y="791.17" font-family="JetBrains Mono, Noto Sans SC, monospace" font-size="12.4" font-weight="400" fill="#6E685D" text-anchor="start"><tspan x="656" >3 个代码示例</tspan></text></g><g id="core" data-md="node" data-box="1180,560,400,100" data-shape="box" data-label="inside"><rect x="1180" y="560" width="400" height="100" rx="0" fill="#171614" stroke="#171614" stroke-width="1.2"/><text class="md-label" x="1196" y="607.84" font-family="Inter, Noto Sans SC, sans-serif" font-size="22" font-weight="600" fill="#F7F1E6" text-anchor="start"><tspan x="1196" >“不想麻烦别人”</tspan></text><text class="md-sub" x="1196" y="627.97" font-family="JetBrains Mono, Noto Sans SC, monospace" font-size="12.4" font-weight="400" fill="#C9C0AF" text-anchor="start"><tspan x="1196" >老年患者夜间如厕不求助的核心解释</tspan></text></g></g><g id="edge-labels"></g><g id="notes"><g id="note-1" data-md="note" data-box="1180,720,400,47.43"><g><text x="1180" y="735.03" font-family="Fraunces, Noto Serif SC, serif" font-size="18.37" font-weight="700" fill="#C93C14">1</text><text x="1206" y="735.03" font-family="Fraunces, Noto Serif SC, serif" font-size="16.7" font-weight="400" fill="#36322C" text-anchor="start" font-style="italic"><tspan x="1206" >每个主范畴都能回到原话。审稿人问“依据在哪”，</tspan><tspan x="1206" dy="23.71">你能指到第几号访谈第几行。</tspan></text></g></g><g id="note-2" data-md="note" data-box="1180,820,400,47.43"><g><text x="1180" y="835.03" font-family="Fraunces, Noto Serif SC, serif" font-size="18.37" font-weight="700" fill="#C93C14">2</text><text x="1206" y="835.03" font-family="Fraunces, Noto Serif SC, serif" font-size="16.7" font-weight="400" fill="#36322C" text-anchor="start" font-style="italic"><tspan x="1206" >编码到第 14 位受访者时不再出现新代码，判定理</tspan><tspan x="1206" dy="23.71">论饱和。</tspan></text></g></g></g><g id="legend"></g><g id="texts"><text x="100" y="300" font-family="Fraunces, Noto Serif SC, serif" font-size="22" font-weight="700" fill="#171614" text-anchor="start"><tspan x="100" >开放编码</tspan></text><text x="100" y="328" font-family="Inter, Noto Sans SC, sans-serif" font-size="14" font-weight="400" fill="#6E685D" text-anchor="start"><tspan x="100" >逐句贴标签，162 个初始代码</tspan></text><text x="640" y="300" font-family="Fraunces, Noto Serif SC, serif" font-size="22" font-weight="700" fill="#171614" text-anchor="start"><tspan x="640" >主轴编码</tspan></text><text x="640" y="328" font-family="Inter, Noto Sans SC, sans-serif" font-size="14" font-weight="400" fill="#6E685D" text-anchor="start"><tspan x="640" >归并为 9 个副范畴、4 个主范畴</tspan></text><text x="1180" y="300" font-family="Fraunces, Noto Serif SC, serif" font-size="22" font-weight="700" fill="#171614" text-anchor="start"><tspan x="1180" >选择性编码</tspan></text><text x="1180" y="328" font-family="Inter, Noto Sans SC, sans-serif" font-size="14" font-weight="400" fill="#6E685D" text-anchor="start"><tspan x="1180" >提炼 1 个核心范畴</tspan></text></g><g id="header"><text x="64" y="76" font-family="JetBrains Mono, Noto Sans SC, monospace" font-size="12" font-weight="600" fill="#C93C14" text-anchor="start" letter-spacing="2.2"><tspan x="64" >质性研究 · 扎根理论</tspan></text><text x="64" y="140.44" font-family="Fraunces, Noto Serif SC, serif" font-size="54" font-weight="600" fill="#171614" text-anchor="start" letter-spacing="-0.8"><tspan x="64" >三级编码：从原话到核心范畴</tspan></text><text x="64" y="180.4" font-family="Inter, Noto Sans SC, sans-serif" font-size="18.4" font-weight="400" fill="#6E685D" text-anchor="start"><tspan x="64" >16 位老年住院患者半结构访谈。左列是原话片段，中列是归并后的主范畴，右侧是统领全部范畴的核心解释。示例数据。</tspan></text><path d="M64 210.68H1596" stroke="#171614" stroke-width="1.2"/><text x="1596" y="76" font-family="JetBrains Mono, Noto Sans SC, monospace" font-size="12" font-weight="400" fill="#6E685D" text-anchor="end" letter-spacing="2.2"><tspan x="1596" >FIG. 3</tspan></text></g><g id="footer"><text x="1596" y="964.8" font-family="JetBrains Mono, Noto Sans SC, monospace" font-size="10.5" font-weight="400" fill="#6E685D" text-anchor="end" letter-spacing="1.5"><tspan x="1596" >MuseDraw · Editorial Ink</tspan></text></g></svg>
