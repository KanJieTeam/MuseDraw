"><g><text x="64" y="702.7" font-family="JetBrains Mono, Noto Sans SC, monospace" font-size="13" font-weight="400" fill="#8B949E" text-anchor="start"><tspan x="64" ># rule 2: the IC does not debug — they coordinate</tspan></text></g></g><g id="note-3" data-md="note" data-box="64,727,520,19.5"><g><text x="64" y="738.7" font-family="JetBrains Mono, Noto Sans SC, monospace" font-size="13" font-weight="400" fill="#8B949E" text-anchor="start"><tspan x="64" ># rule 3: if in doubt, declare; downgrading is free</tspan></text></g></g></g><g id="legend"><path d="M64 830.378H98" stroke="#3FB950" stroke-width="1.8" stroke-linecap="round"/><path d="M102 830.38 L95 834.23 L95 826.53 Z" fill="#3FB950"/><text x="112" y="834.66" font-family="JetBrains Mono, Noto Sans SC, monospace" font-size="11.9" font-weight="400" fill="#8B949E" text-anchor="start"><tspan x="112" >happy path</tspan></text><path d="M211.39999999999998 830.378H245.39999999999998" stroke="#58A6FF" stroke-width="1.6" stroke-linecap="round"/><path d="M249.4 830.38 L242.4 834.23 L242.4 826.53 Z" fill="#58A6FF"/><text x="259.4" y="834.66" font-family="JetBrains Mono, Noto Sans SC, monospace" font-size="11.9" font-weight="400" fill="#8B949E" text-anchor="start"><tspan x="259.4" >response setup</tspan></text><path d="M387.35999999999996 830.378H421.35999999999996" stroke="#F85149" stroke-width="1.5" stroke-dasharray="5 4" stroke-linecap="round"/><path d="M425.36 830.38 L418.36 834.23 L418.36 826.53 Z" fill="#F85149"/><text x="435.36" y="834.66" font-family="JetBrains Mono, Noto Sans SC, monospace" font-size="11.9" font-weight="400" fill="#8B949E" text-anchor="start"><tspan x="435.36" >escalation</tspan></text></g><g id="texts"></g><g id="header"><text x="64" y="77" font-family="JetBrains Mono, Noto Sans SC, monospace" font-size="15" fill="#8B949E"><tspan fill="#3FB950">❯</tspan> cat runbooks/incident-response.md</text><text x="64" y="133.68" font-family="JetBrains Mono, Noto Sans SC, monospace" font-size="38" font-weight="