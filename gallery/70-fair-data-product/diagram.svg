<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 853" width="1700" height="853" role="img" aria-labelledby="md-title md-desc" data-theme="product"><title id="md-title">FAIR research data workflow</title><desc id="md-desc">Raw data is read-only from the moment it leaves the instrument. Everything after it is produced by versioned code, so any figure can be regenerated from scratch.</desc><defs><pattern id="tex-dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="10" cy="10" r="1.1" fill="#D0D5DD"/></pattern><filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#101828" flood-opacity="0.07"/><feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#101828" flood-opacity="0.05600000000000001"/></filter></defs><g id="background"><rect id="canvas" width="1700" height="853" fill="#F6F7F9"/><rect width="1700" height="853" fill="url(#tex-dots)" opacity="0.55"/></g><g id="zones"><g id="f" data-md="zone"><rect x="64" y="473" width="380" height="170" rx="18" fill="#F5F6FF" stroke="#E0E4FF" stroke-width="1"/><text x="84" y="510.6" font-family="Inter, Noto Sans SC, sans-serif" font-size="22" font-weight="700" fill="#3730A3" text-anchor="start"><tspan x="84" >F · Findable</tspan></text><text x="84" y="536.6" font-family="Inter, Noto Sans SC, sans-serif" font-size="15" font-weight="400" fill="#6366F1" text-anchor="start"><tspan x="84" >DOI for every dataset; rich metadata; ORCID</tspan><tspan x="84" dy="21.75">for every author</tspan></text></g><g id="a" data-md="zone"><rect x="464" y="473" width="380" height="170" rx="18" fill="#F5F6FF" stroke="#E0E4FF" stroke-width="1"/><text x="484" y="510.6" font-family="Inter, Noto Sans SC, sans-serif" font-size="22" font-weight="700" fill="#3730A3" text-anchor="start"><tspan x="484" >A · Accessible</tspan></text><text x="484" y="536.6" font-family="Inter, Noto Sans SC, sans-serif" font-size="15" font-weight="400" fill="#6366F1" text-anchor="start"><tspan x="484" >open protocol (HTTPS); metadata stays even if</tspan><tspan x="484" dy="21.75">data is restricted</tspan></text></g><g id="i" data-md="zone"><rect x="864" y="473" width="380" height="170" rx="18" fill="#F2FBF9" stroke="#CCF2EA" stroke-width="1"/><text x="884" y="510.6" font-family="Inter, Noto Sans SC, sans-serif" font-size="22" font-weight="700" fill="#115E59" text-anchor="start"><tspan x="884" >I · Interoperable</tspan></text><text x="884" y="536.6" font-family="Inter, Noto Sans SC, sans-serif" font-size="15" font-weight="400" fill="#0E9384" text-anchor="start"><tspan x="884" >open formats (CSV, HDF5, FASTQ); community</tspan><tspan x="884" dy="21.75">vocabularies</tspan></text></g><g id="r" data-md="zone"><rect x="1264" y="473" width="376" height="170" rx="18" fill="#F2FBF9" stroke="#CCF2EA" stroke-width="1"/><text x="1284" y="510.6" font-family="Inter, Noto Sans SC, sans-serif" font-size="22" font-weight="700" fill="#115E59" text-anchor="start"><tspan x="1284" >R · Reusable</tspan></text><text x="1284" y="536.6" font-family="Inter, Noto Sans SC, sans-serif" font-size="15" font-weight="400" fill="#0E9384" text-anchor="start"><tspan x="1284" >licence (CC-BY), provenance, README with</tspan><tspan x="1284" dy="21.75">units and codes</tspan></text></g></g><g id="edges"><g id="edge-inst-raw" data-md="edge"><path d="M298 323 L333 323" fill="none" stroke="#4F46E5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M340 323 L331.25 327.81 L331.25 318.19 Z" fill="#4F46E5"/></g><g id="edge-raw-code" data-md="edge"><path d="M578 323 L613 323" fill="none" stroke="#4F46E5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M620 323 L611.25 327.81 L611.25 318.19 Z" fill="#4F46E5"/></g><g id="edge-code-der" data-md="edge"><path d="M858 323 L893 323" fill="none" stroke="#4F46E5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M900 323 L891.25 327.81 L891.25 318.19 Z" fill="#4F46E5"/></g><g id="edge-der-fig" data-md="edge"><path d="M1138 323 L1173 323" fill="none" stroke="#4F46E5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M1180 323 L1171.25 327.81 L1171.25 318.19 Z" fill="#4F46E5"/></g><g id="edge-fig-repo" data-md="edge"><path d="M1418 323 L1429 323" fill="none" stroke="#4F46E5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M1436 323 L1427.25 327.81 L1427.25 318.19 Z" fill="#4F46E5"/></g></g><g id="nodes"><g id="inst" data-md="node" data-box="64,273,230,100" data-shape="box" data-label="inside"><g filter="url(#soft-shadow)"><rect x="64" y="273" width="230" height="100" rx="12" fill="#FFFFFF" stroke="none"/></g><rect x="64" y="273" width="230" height="100" rx="12" fill="#FFFFFF" stroke="#E4E7EC" stroke-width="1"/><g transform="translate(80 313) scale(0.8333)" fill="none" stroke="#475467" stroke-width="1.92" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h10v10H7z"/><path d="M10 10h4v4h-4z"/><path d="M9.5 3.5V7"/><path d="M14.5 3.5V7"/><path d="M9.5 17v3.5"/><path d="M14.5 17v3.5"/><path d="M3.5 9.5H7"/><path d="M3.5 14.5H7"/><path d="M17 9.5h3.5"/><path d="M17 14.5h3.5"/></g><text class="md-tag" x="110" y="307.71" font-family="Inter, Noto Sans SC, sans-serif" font-size="11.9" font-weight="600" fill="#667085" text-anchor="start"><tspan x="110" >capture</tspan></text><text class="md-label" x="110" y="327.54" font-family="Inter, Noto Sans SC, sans-serif" font-size="16.7" font-weight="600" fill="#101828" text-anchor="start"><tspan x="110" >Instrument</tspan></text><text class="md-sub" x="110" y="345.62" font-family="Inter, Noto Sans SC, sans-serif" font-size="13.5" font-weight="400" fill="#667085" text-anchor="start"><tspan x="110" >plate reader, sequencer</tspan></text></g><g id="raw" data-md="node" data-box="344,273,230,100" data-shape="box" data-label="inside"><rect x="344" y="273" width="230" height="100" rx="12" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1"/><g transform="translate(360 313) scale(0.8333)" fill="none" stroke="#4F46E5" stroke-width="1.92" stroke-linecap="round" stroke-linejoin="round"><path d="M5 11h14v10H5z"/><path d="M8 11V7.5a4 4 0 0 1 8 0V11"/><path d="M12 15v2.5"/></g><text class="md-tag" x="390" y="307.71" font-family="Inter, Noto Sans SC, sans-serif" font-size="11.9" font-weight="600" fill="#4F46E5" text-anchor="start"><tspan x="390" >read-only</tspan></text><text class="md-label" x="390" y="327.54" font-family="Inter, Noto Sans SC, sans-serif" font-size="16.7" font-weight="600" fill="#312E81" text-anchor="start"><tspan x="390" >Raw data</tspan></text><text class="md-sub" x="390" y="345.62" font-family="Inter, Noto Sans SC, sans-serif" font-size="13.5" font-weight="400" fill="#4F46E5" text-anchor="start"><tspan x="390" >checksummed on arrival</tspan></text></g><g id="code" data-md="node" data-box="624,273,230,100" data-shape="box" data-label="inside"><g filter="url(#soft-shadow)"><rect x="624" y="273" width="230" height="100" rx="12" fill="#FFFFFF" stroke="none"/></g><rect x="624" y="273" width="230" height="100" rx="12" fill="#FFFFFF" stroke="#E4E7EC" stroke-width="1"/><g transform="translate(640 313) scale(0.8333)" fill="none" stroke="#475467" stroke-width="1.92" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3.5v11"/><path d="M6 20.5a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5z"/><path d="M18 8.5a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5z"/><path d="M18 8.5c0 5-6 4-11 8"/></g><text class="md-tag" x="670" y="307.71" font-family="Inter, Noto Sans SC, sans-serif" font-size="11.9" font-weight="600" fill="#667085" text-anchor="start"><tspan x="670" >git, tagged</tspan></text><text class="md-label" x="670" y="327.54" font-family="Inter, Noto Sans SC, sans-serif" font-size="16.7" font-weight="600" fill="#101828" text-anchor="start"><tspan x="670" >Processing code</tspan></text><text class="md-sub" x="670" y="345.62" font-family="Inter, Noto Sans SC, sans-serif" font-size="13.5" font-weight="400" fill="#667085" text-anchor="start"><tspan x="670" >one script per step</tspan></text></g><g id="der" data-md="node" data-box="904,273,230,100" data-shape="box" data-label="inside"><rect x="904" y="273" width="230" height="100" rx="12" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1"/><g transform="translate(920 313) scale(0.8333)" fill="none" stroke="#4F46E5" stroke-width="1.92" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4.5h18v15H3z"/><path d="M3 9.5h18"/><path d="M3 14.5h18"/><path d="M9 4.5v15"/></g><text class="md-tag" x="950" y="307.71" font-family="Inter, Noto Sans SC, sans-serif" font-size="11.9" font-weight="600" fill="#4F46E5" text-anchor="start"><tspan x="950" >reproducible</tspan></text><text class="md-label" x="950" y="327.54" font-family="Inter, Noto Sans SC, sans-serif" font-size="16.7" font-weight="600" fill="#312E81" text-anchor="start"><tspan x="950" >Derived data</tspan></text><text class="md-sub" x="950" y="345.62" font-family="Inter, Noto Sans SC, sans-serif" font-size="13.5" font-weight="400" fill="#4F46E5" text-anchor="start"><tspan x="950" >never edited by hand</tspan></text></g><g id="fig" data-md="node" data-box="1184,273,230,100" data-shape="box" data-label="inside"><g filter="url(#soft-shadow)"><rect x="1184" y="273" width="230" height="100" rx="12" fill="#FFFFFF" stroke="none"/></g><rect x="1184" y="273" width="230" height="100" rx="12" fill="#FFFFFF" stroke="#E4E7EC" stroke-width="1"/><g transform="translate(1200 313) scale(0.8333)" fill="none" stroke="#475467" stroke-width="1.92" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20.5h16"/><path d="M7 17V11"/><path d="M11.5 17V6.5"/><path d="M16 17v-4"/></g><text class="md-tag" x="1230" y="307.71" font-family="Inter, Noto Sans SC, sans-serif" font-size="11.9" font-weight="600" fill="#667085" text-anchor="start"><tspan x="1230" >notebook</tspan></text><text class="md-label" x="1230" y="327.54" font-family="Inter, Noto Sans SC, sans-serif" font-size="16.7" font-weight="600" fill="#101828" text-anchor="start"><tspan x="1230" >Figures &amp; stats</tspan></text><text class="md-sub" x="1230" y="345.62" font-family="Inter, Noto Sans SC, sans-serif" font-size="13.5" font-weight="400" fill="#667085" text-anchor="start"><tspan x="1230" >knitted from code</tspan></text></g><g id="repo" data-md="node" data-box="1440,273,200,100" data-shape="box" data-label="inside"><g filter="url(#soft-shadow)"><rect x="1440" y="273" width="200" height="100" rx="12" fill="#4F46E5" stroke="none"/></g><rect x="1440" y="273" width="200" height="100" rx="12" fill="#4F46E5" stroke="#4F46E5" stroke-width="1"/><g transform="translate(1456 313) scale(0.8333)" fill="none" stroke="#FFFFFF" stroke-width="1.92" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18z"/><path d="M3 12h18"/><path d="M12 3c2.5 2.6 3.7 5.6 3.7 9s-1.2 6.4-3.7 9c-2.5-2.6-3.7-5.6-3.7-9S9.5 5.6 12 3z"/></g><text class="md-tag" x="1486" y="288.36" font-family="Inter, Noto Sans SC, sans-serif" font-size="11.9" font-weight="600" fill="#E0E7FF" text-anchor="start"><tspan x="1486" >Zenodo / Dryad</tspan></text><text class="md-label" x="1486" y="308.2" font-family="Inter, Noto Sans SC, sans-serif" font-size="16.7" font-weight="600" fill="#FFFFFF" text-anchor="start"><tspan x="1486" >Public</tspan><tspan x="1486" dy="20.88">repository</tspan></text><text class="md-sub" x="1486" y="347.15" font-family="Inter, Noto Sans SC, sans-serif" font-size="13.5" font-weight="400" fill="#C7D2FE" text-anchor="start"><tspan x="1486" >DOI, licence,</tspan><tspan x="1486" dy="17.82">README</tspan></text></g></g><g id="edge-labels"></g><g id="notes"><g id="note-1" data-md="note" data-box="64,693,760,87"><g><rect x="64" y="693" width="760" height="87" rx="10" fill="#FFFFFF" stroke="#EAECF0" stroke-width="1"/><text x="76" y="719" font-family="Inter, Noto Sans SC, sans-serif" font-size="14" font-weight="700" fill="#101828" text-anchor="start"><tspan x="76" >Folder rule</tspan></text><text x="76" y="738.6" font-family="Inter, Noto Sans SC, sans-serif" font-size="14" font-weight="400" fill="#667085" text-anchor="start"><tspan x="76" >data/raw · data/derived · code · results · docs — and a README at the top that someone else could follow</tspan><tspan x="76" dy="21">without asking you.</tspan></text></g></g><g id="note-2" data-md="note" data-box="864,693,776,87"><g><rect x="864" y="693" width="776" height="87" rx="10" fill="#FFFFFF" stroke="#EAECF0" stroke-width="1"/><text x="876" y="719" font-family="Inter, Noto Sans SC, sans-serif" font-size="14" font-weight="700" fill="#101828" text-anchor="start"><tspan x="876" >Before you submit</tspan></text><text x="876" y="738.6" font-family="Inter, Noto Sans SC, sans-serif" font-size="14" font-weight="400" fill="#667085" text-anchor="start"><tspan x="876" >Delete your local derived/ folder and regenerate it from raw/ with one command. If that fails, the paper is not</tspan><tspan x="876" dy="21">reproducible yet.</tspan></text></g></g></g><g id="legend"></g><g id="texts"></g><g id="header"><text x="64" y="77" font-family="Inter, Noto Sans SC, sans-serif" font-size="13" font-weight="600" fill="#4F46E5" text-anchor="start" letter-spacing="0.2"><tspan x="64" >Research data management</tspan></text><text x="64" y="132.84" font-family="Inter, Noto Sans SC, sans-serif" font-size="44" font-weight="700" fill="#101828" text-anchor="start" letter-spacing="-1.2"><tspan x="64" >FAIR research data workflow</tspan></text><text x="64" y="171.4" font-family="Inter, Noto Sans SC, sans-serif" font-size="18.4" font-weight="400" fill="#667085" text-anchor="start"><tspan x="64" >Raw data is read-only from the moment it leaves the instrument. Everything after it is produced by versioned code, so any figure</tspan><tspan x="64" dy="26.68">can be regenerated from scratch.</tspan></text></g><g id="footer"><text x="1636" y="817.8" font-family="Inter, Noto Sans SC, sans-serif" font-size="11" font-weight="400" fill="#98A2B3" text-anchor="end" letter-spacing="0.3"><tspan x="1636" >MuseDraw · Product Clean</tspan></text></g></svg>
